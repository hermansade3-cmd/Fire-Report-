function pats(){const t=(S.a.pat||'').toLowerCase(),R=[[/v-?pattern|umbo la v|kilele|apex/,'V-pattern: asili kwa kawaida iko chini ya kilele cha V.'],[/kina|makaa|char/,'Makaa mazito zaidi = muda mrefu wa kuungua; linganisha sehemu zote.'],[/sakafu|chini|madoa|pour/,'Uharibifu wa sakafu usio wa kawaida: angalia mabaki ya ignitable liquid (pour pattern).'],[/dari|juu|paa/,'Uharibifu wa juu: moto umepanda au flashover; usichukue kama asili moja kwa moja.'],[/kioo|glasi|crazing|kupasuka/,'Kioo kilichopasuka/crazing kinaonyesha joto la haraka; kagua mwelekeo.'],[/chuma|kuyeyuka|kupinda/,'Chuma kuyeyuka/kupinda: kadiria joto na muda; tofautisha na uharibifu wa kuzimwa.'],[/mlango|mwelekeo|ukuta/,'Mwelekeo wa kuenea kwenye kuta/milango husaidia kufuatilia njia ya moto kurudi asili.']];return R.filter(r=>r[0].test(t)).map(r=>r[1])}
function acts(){const k=chk(),c=causes()[0],r=[];if(c){if(/umeme/.test(c.n))r.push('Mkague fundi umeme na piga picha breaker, soketi na waya zilizoyeyuka.');if(/Gesi/.test(c.n))r.push('Kagua mtungi, valvu na hose; weka kipima gesi kabla ya kuingia.');if(/Kichocheo/.test(c.n))r.push('Chukua sampuli za sakafu/udongo kwenye mikebe safi na uzitume maabara.');if(/Kupika/.test(c.n))r.push('Linganisha eneo la jiko/moto wazi na kinachodhaniwa kuwa asili.')}
if(S.a.cas=='y')r.push('Ratibu na polisi na daktari kuhusu vifo/majeruhi.');k.m.slice(0,4).forEach(x=>r.push('Jaza pengo: '+x));if(!S.a.h2||no(S.a.h2))r.push('Weka angalau nadharia mbadala moja na uijaribu.');return r.slice(0,7)}
function brain(){const c=conf(),cs=causes(),k=chk(),lv=c.o>=70?'JUU':c.o>=40?'WASTANI':'CHINI';
return`<div class="card" style="text-align:center"><small>KIWANGO CHA UHAKIKA WA UCHUNGUZI</small><div style="font-size:52px;font-weight:800;color:var(--p)">${c.o}%</div><span class="tag">${lv}</span><p>Uainishaji: <b>${cls()}</b><br><small>${CD[cls()]}</small></p>${bar('Ukamilifu wa taarifa',c.c)+bar('Ubora wa ushahidi',c.e)+bar('Majaribio ya nadharia',c.h)+bar('Uthabiti (bila mgongano)',c.k)}</div>
<div class="card"><h3>🎯 Vyanzo vinavyowezekana (kulingana na ushuhuda)</h3>${cs.length?cs.map(x=>bar(x.n,x.p)+`<small>Vyanzo vya ushahidi: ${x.ev.join(', ')}</small>`).join(''):'<small>Jibu maswali zaidi kuona nafasi za vyanzo.</small>'}<div class="al"><small>Hii ni nafasi ya ishara kutoka kwa maelezo yaliyoingizwa, si uthibitisho. Chanzo kinathibitishwa kwa ushahidi wa kimwili na majaribio ya nadharia.</small></div></div>
<div class="card"><h3>⏱ Mpangilio wa matukio</h3>${tl()}</div>
${pats().length?`<div class="card"><h3>🔎 Usomaji wa fire patterns</h3>${pats().map(x=>`<div class="al">${x}</div>`).join('')}</div>`:''}
<div class="card"><h3>🚨 Hatua zinazopendekezwa</h3>${acts().map(x=>`<div class="al">${x}</div>`).join('')||'<small>Hakuna kwa sasa.</small>'}${k.al.map(x=>`<div class="al r">⚠️ ${x}</div>`).join('')}${k.c.map(x=>`<div class="al r">↯ ${x}</div>`).join('')}</div>`}
function ui(){$('#tabs').innerHTML=['💬 Mahojiano','📋 Muhtasari','📷 Picha','🧠 Akili'].map((t,i)=>`<button class="g s ${S.tab==i?'on':''}" onclick="S.tab=${i};ui()">${t}</button>`).join('');
const m=$('#m');if(S.tab==3)return m.innerHTML=brain();if(S.tab==1)return m.innerHTML=sum();if(S.tab==2)return m.innerHTML=pic();
const id=cq(),tot=Object.keys(S.a).length,rem=QS.filter(q=>!(q[0] in S.a)&&vis(q)).length,p=Math.round(tot/(tot+rem)*100),k=chk();
if(S.busy)return m.innerHTML='<div class="card">🤖 Mchunguzi msaidizi anafikiria swali linalofuata…</div>';
let h=`<div class="card"><div class="bar"><i style="width:${p}%"></i></div><small>Maendeleo: ${p}% · Majibu ${tot}</small>`;
if(!id)h+=`<h3>✅ Maswali yamekamilika</h3><p>Chanzo: <span class="tag">${cls()}</span><br>${CD[cls()]}</p><button onclick="rep()">Tengeneza Ripoti</button> <button class="g" onclick="S.tab=1;ui()">Muhtasari</button></div>`;
else{const q=QM[id],st=q?q[1]:S.n?10:0;h+=`<br><small>Hatua ${st+1}/${ST.length}: ${ST[st]}${q?'':' · 🤖 swali la ziada'}</small><h3>${esc(qt(id))}</h3>`;
if(S.msg)h+=`<div class="al">${S.msg}</div>`;if(S.err)h+=`<div class="al r">🤖 ${esc(S.err)}</div>`;
const ty=q?q[4]:'x',v=S.cur?S.a[id]||'':'';
h+=ty=='s'?`<select id="in"><option value="">—</option>${q[5].map(o=>{const j=o.indexOf(':');return`<option value="${o.slice(0,j)}" ${o.slice(0,j)==v?'selected':''}>${o.slice(j+1)}</option>`}).join('')}</select>`:ty=='x'?`<textarea id="in" rows="4">${esc(v)}</textarea>`:`<input id="in" type="${{t:'text',d:'date',tm:'time'}[ty]}" value="${esc(v)}">`;
h+=`<button onclick="ans('${id}',$('#in').value)">Jibu →</button> <button class="g" onclick="ans('${id}','Haijulikani')">Sijui</button></div>`}
if(k.al.length)h+=k.al.map(x=>`<div class="al r">⚠️ ${x}</div>`).join('');if(k.c.length)h+=k.c.map(x=>`<div class="al r">↯ Mgongano: ${x}</div>`).join('');
const last=QS.filter(q=>q[0] in S.a).slice(-3).reverse();if(last.length)h+=`<div class="card"><small>Muhtasari wa majibu ya hivi karibuni</small>${last.map(q=>`<div class="row"><div><small>${q[2]}</small><br>${esc(dsp(q[0],S.a[q[0]]))}</div></div>`).join('')}</div>`;m.innerHTML=h}
function sum(){const k=chk();let h=`<div class="card"><h3>Hali ya uchunguzi</h3>Chanzo: <span class="tag">${cls()}</span><p>${CD[cls()]}</p></div>`;
const L=(t,a)=>a.length?`<div class="card"><h3>${t}</h3>${a.map(x=>`<div class="al">${x}</div>`).join('')}</div>`:'';h+=L('⚠️ Tahadhari',k.al)+L('↯ Taarifa zinazokinzana',k.c)+L('❓ Kinachokosekana',k.m);
ST.forEach((s,i)=>{const r=QS.concat(Object.keys(S.aq).map(x=>[x,i,0])).filter(q=>q[1]==i&&q[0] in S.a);if(r.length)h+=`<div class="card"><h3>${s}</h3>${r.map(q=>`<div class="row"><div><small>${lbl(q[0])}</small><br>${esc(dsp(q[0],S.a[q[0]]))}</div><button class="g s" onclick="S.cur='${q[0]}';S.tab=0;ui()">Hariri</button></div>`).join('')}</div>`});
return h+`<button class="g" onclick="if(confirm('Futa uchunguzi wote na kuanza upya?')){S={a:{},aq:{},pq:[],f:[],n:0,cur:null,tab:0};save();ui()}">🗑 Anza upya</button>`}
function pic(){return`<div class="card"><h3>Picha, video na vielelezo</h3><input type="file" accept="image/*" multiple onchange="up(this.files)"><div>${S.f.map((f,i)=>`<span><img class="th" src="${f.u}"><button class="g s" onclick="S.f.splice(${i},1);save();ui()">✕</button></span>`).join('')}</div><small>Picha hupunguzwa ukubwa ili zihifadhiwe kwenye kifaa. AI haichambui picha.</small></div>`}
function up(fl){[...fl].forEach(f=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,700/i.width);c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);S.f.push({u:c.toDataURL('image/jpeg',.6),n:f.name});save();ui()};i.src=r.result};r.readAsDataURL(f)})}
function rep(){const a=S.a,k=chk(),v=id=>esc(dsp(id,a[id])||'—'),T=ids=>`<table>${ids.map(i=>`<tr><th>${lbl(i)}</th><td>${v(i)}</td></tr>`).join('')}</table>`,
H=n=>no(a['h'+n])?'':`<tr><td><b>${v('h'+n)}</b><br>${v('h'+n+'c')}</td><td>${v('h'+n+'s')}</td><td>${v('h'+n+'a')}</td><td>${v('h'+n+'t')}</td></tr>`,
ex=Object.keys(S.aq).filter(x=>x in a).map(x=>`<tr><th>${esc(S.aq[x])}</th><td>${esc(a[x])}</td></tr>`).join('');
$('#rp').innerHTML=`<button class="no" onclick="window.print()">⬇ Pakua PDF / Chapisha</button> <button class="g no" onclick="$('#rp').hidden=true;document.querySelector('main').hidden=false">✕ Funga</button>
<h1>JESHI LA ZIMAMOTO NA UOKOAJI TANZANIA<br>FIRE INVESTIGATION REPORT</h1>
<h2>1. Incident Information</h2>${T(['ref','inc','type','date','time','loc','owner','unit'])}
<h2>2. Executive Summary</h2><p>Tarehe ${v('date')} saa ${v('time')}, tukio la ${v('type')} lilitokea ${v('loc')}. Eneo la kuanzia lililotambuliwa: ${v('area')}. Kikosi cha kwanza kilifika saa ${v('arr')}. Majeruhi/vifo: ${v('cas')}. Uainishaji wa chanzo: <b>${cls()}</b> — ${CD[cls()]}</p>
<h2>3. Incident Background</h2>${T(['struct','use','hist','reporter','pre'])}
<h2>4. Scene Description</h2>${T(['wx','vent','prot','prot2'])}
<h2>5. Investigation Methodology</h2><p>Uchunguzi ulifanyika kwa mbinu ya kisayansi (NFPA 921): ukusanyaji wa data, uundaji wa nadharia, kuzijaribu dhidi ya ushahidi wote, na kuhitimisha. Chanzo hakikubaliwi kwa kuondoa nadharia nyingine pekee.</p>
<h2>6. Witness Statements</h2>${T(['w1','w2','w3','w4','w5'])}
<h2>7. Physical Evidence</h2>${T(['ev','evp','lab'])}
<h2>8. Scene Examination Findings</h2>${T(['pat','spread','multi','e1','e2','e3','e4','g1','g2','x1','x2','accel','crew'])}${ex?`<table>${ex}</table>`:''}
<h2>9. Fire Origin Analysis</h2>${T(['area','seen','started','firstmat','fuel'])}
<h2>10. Fire Cause Analysis</h2>${T(['ign'])}<p>Uainishaji: <b>${cls()}</b>. ${CD[cls()]}</p>
<h2>11. Evidence Assessment</h2><p><b>Ushahidi wa kimwili:</b> ${v('ev')}<br><b>Ushuhuda wa mashahidi:</b> ${v('w2')}</p><p><b>Mgongano:</b> ${k.c.join('; ')||'Hakuna'}<br><b>Kinachokosekana:</b> ${k.m.join('; ')||'Hakuna'}</p>
<p><b>Kiwango cha uhakika wa uchunguzi:</b> ${conf().o}% (taarifa ${conf().c}%, ushahidi ${conf().e}%, nadharia ${conf().h}%, uthabiti ${conf().k}%)</p><p><b>Vyanzo vilivyotathminiwa kwa ushuhuda:</b> ${causes().map(x=>x.n+' '+x.p+'%').join('; ')||'—'} <i>(kielekezi, si uthibitisho)</i></p><table>${tl().replace(/<div class="row"><div>/g,'<tr><td>').replace(/<\/div><small>/g,'</td><td>').replace(/<\/small><\/div>/g,'</td></tr>')}</table>
<h2>12. Alternative Hypotheses</h2><table><tr><th>Nadharia</th><th>Inaunga</th><th>Inapinga</th><th>Hali</th></tr>${H(1)+H(2)||'<tr><td colspan=4>—</td></tr>'}</table>
<h2>13. Findings and Conclusion</h2><p><b>${cls()}</b>: ${CD[cls()]}</p><p>${v('concl')}</p><p>Madhara: ${v('prop')} · ${v('env')}</p>
<h2>14. Recommendations</h2><p>${v('rec')}</p>
<h2>15. Investigator's Details</h2>${T(['inv','unit'])}
<h2>16. Attachments and Photographic Evidence</h2>${S.f.map(f=>`<img src="${f.u}" style="max-width:48%;margin:3px">`).join('')||'<p>Hakuna.</p>'}
<p style="margin-top:30px">Sahihi ya mchunguzi: ____________ Tarehe: ________</p>`;$('#rp').hidden=false;document.querySelector('main').hidden=true;scrollTo(0,0)}
ui();
</script></body></html>
