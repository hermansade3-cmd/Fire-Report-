<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AI Fire &amp; Incident Investigation Assistant</title>
<style>
:root{--bg:#eef0f3;--c:#fff;--t:#17202b;--m:#667085;--p:#b3202a;--n:#1b2a3a;--b:#d9dde3;--ok:#15803d;--w:#b45309;--a:#e0a100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme=dark]{--bg:#10151b;--c:#19212a;--t:#e8ecf1;--m:#98a2b3;--p:#e5484d;--n:#0b0f14;--b:#2b3541;color-scheme:dark}

h2{margin:4px 0 12px;font-size:18px}h3{margin:14px 0 6px;font-size:15px}
label{display:block;margin:10px 0;font-weight:600;font-size:13px}

.warn{color:var(--w)}.item{border:1px solid var(--b);border-radius:6px;padding:8px 12px;margin:10px 0}

#rep{background:#fff;color:#000;padding:18px;border-radius:6px}#rep table{width:100%;border-collapse:collapse;margin:6px 0}#rep th,#rep td{border:1px solid #bbb;padding:5px 8px;text-align:left;vertical-align:top}#rep th{width:34%;background:#f0f0f0}#rep h1{color:#b3202a}#rep h2{border-bottom:2px solid #b3202a;color:#1b2a3a;margin-top:22px}

@media print{header,.no,#toast{display:none!important}body,main{background:#fff;padding:0}.card{border:0;padding:0}}
</style></head><body>
<header><b id="ttl">🔥 AI FIRE &amp; INCIDENT INVESTIGATION ASSISTANT</b><button data-a="home" id="bh"></button><button data-a="lang">SW/EN</button><button data-a="theme">◐</button></header>
<main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang='sw',cur=null,si=0,view='dash',DB=null,timer,mem={},fsig='';
try{lang=localStorage.lang||'sw';if(localStorage.th)document.documentElement.dataset.theme=localStorage.th}catch(e){}
const T=s=>{const p=s.split('|');return lang=='en'&&p[1]?p[1]:p[0]};
const YN=['y:Ndiyo|Yes','n:Hapana|No','u:Haijulikani|Unknown'];
const TYPES=['fire:Moto|Fire','road:Ajali ya barabarani|Road accident','collapse:Jengo kuporomoka|Building collapse','explosion:Mlipuko|Explosion','industrial:Ajali ya kiwandani|Industrial accident','natural:Janga la asili|Natural disaster','rescue:Tukio la uokoaji|Rescue incident'];
const IGN=['elec:Umeme|Electrical','mech:Mitambo|Mechanical','human:Shughuli za binadamu|Human activity','nat:Asili|Natural','oth:Nyingine|Other','unk:Haijulikani|Unknown'];
const GQ={road:[['g1','Magari/vyombo vilivyohusika|Vehicles involved','x'],['g2','Hali ya barabara na hewa|Road and weather','x'],['g3','Mwenendo wa madereva/mwendo|Driver conduct / speed','x']],collapse:[['g1','Umri na muundo wa jengo|Building age and structure','x'],['g2','Kilichosababisha kuporomoka (kinachodhaniwa)|Suspected trigger','x'],['g3','Watu waliokwama/waliookolewa|Trapped / rescued people','x']],explosion:[['g1','Chanzo cha nishati/gesi/kemikali|Energy / gas / chemical source','x'],['g2','Kituo cha mlipuko na uharibifu|Blast centre and damage','x'],['g3','Vifaa vya usalama vilivyokuwepo|Safety systems present','x']],industrial:[['g1','Mchakato/mashine zilizohusika|Process / machinery involved','x'],['g2','Taratibu za usalama kazini|Workplace safety procedures','x'],['g3','Mafunzo ya wafanyakazi|Worker training','x']],natural:[['g1','Aina na ukubwa wa janga|Hazard type and scale','x'],['g2','Maeneo na watu walioathirika|Areas and people affected','x'],['g3','Tahadhari zilizotolewa kabla|Warnings issued','x']],rescue:[['g1','Hali ya waathirika|Victims condition','x'],['g2','Mbinu na vifaa vya uokoaji|Rescue methods and equipment','x'],['g3','Changamoto zilizojitokeza|Challenges faced','x']]};
const S=[
{id:'A',n:'A. Taarifa za Tukio|A. Incident Particulars',f:()=>[['ref','Investigation reference number|Investigation reference number','t'],['inc','Incident number|Incident number','t'],['type','Aina ya tukio|Incident type','s',TYPES],['date','Tarehe ya tukio|Incident date','d'],['time','Muda wa tukio|Incident time','tm'],['loc','Eneo lilipotokea|Location','t'],['owner','Jina la mmiliki wa eneo|Owner of premises','t'],['inv','Jina la mchunguzi|Investigator name','t'],['unit','Kikosi kilichohusika|Unit involved','t'],['inv_date','Tarehe ya uchunguzi|Investigation date','d']]},
{id:'B',n:'B. Mandhari ya Tukio|B. Incident Background',f:()=>[['reporter','Nani alitoa taarifa?|Who reported?','t'],['disc','Tukio liligundulikaje?|How was it discovered?','x'],['present','Nani alikuwa eneo la tukio?|Who was present?','x'],['started','Tukio lilianza muda gani?|Time incident started','tm'],['before','Nini kilitokea kabla ya tukio?|What happened before?','x'],['after','Nini kilitokea baada ya tukio?|What happened after?','x'],['firstArr','Kikosi cha kwanza kilifika muda gani?|First crew arrival time','tm'],['cas','Kulikuwa na majeruhi au vifo?|Injuries or deaths?','s',YN]]},
{id:'C',n:'C. Ukaguzi wa Eneo|C. Scene Examination',f:()=>[['struct','Muundo wa jengo/eneo|Building / area structure','x'],['activity','Aina ya shughuli zinazofanyika|Activities carried out','t'],['precond','Hali ya eneo kabla ya tukio|Condition before incident','x'],['damaged','Vitu vilivyoharibika|Items damaged','x'],['worst','Sehemu yenye uharibifu mkubwa|Most heavily damaged part','x'],['spread','Alama za kuenea kwa moto/uharibifu|Spread patterns observed','x'],['power','Vyanzo vya umeme|Electrical sources','x'],['equip','Vifaa vilivyokuwa vinatumika|Equipment in use','x'],['safety','Hali ya usalama wa eneo|Site safety condition','x']]},
{id:'D',n:'D. Mahojiano ya Mashahidi|D. Witness Interviews'},
{id:'E',n:'E. Vielelezo|E. Physical Evidence'},
{id:'F',n:'F. Chanzo cha Moto|F. Fire Origin & Cause',if:v=>v.type=='fire',f:()=>[['area','Area of Origin|Area of Origin','x'],['point','Point of Origin (ikiwa imethibitishwa)|Point of Origin (if verified)','x'],['firstMat','First Material Ignited|First Material Ignited','t'],['ign','Heat/Ignition Source|Heat/Ignition Source','s',IGN],['heat','Form of Heat Transfer|Form of Heat Transfer','s',['cond:Conduction|Conduction','conv:Convection|Convection','rad:Radiation|Radiation','direct:Direct flame|Direct flame contact']],['dev','Fire Development|Fire Development','x'],['elecF','Dalili za hitilafu ya umeme?|Signs of electrical fault?','s',YN],['mechF','Dalili za hitilafu ya mitambo?|Signs of mechanical failure?','s',YN],['hum','Shughuli za binadamu zilizohusika|Human activities involved','x'],['multi','Maeneo mengi ya kuanzia moto?|Multiple origins?','s',YN],['accel','Dalili za kichocheo (accelerant)?|Signs of accelerant?','s',YN],['intent','Tathmini ya awali|Preliminary view','s',['acc:Accidental|Accidental','int:Intentional|Intentional','unk:Undetermined|Undetermined']],['lab','Uchunguzi wa kitaalamu/maabara umethibitisha chanzo?|Expert/lab testing confirmed cause?','s',YN]]},
{id:'G',n:'G. Uchunguzi wa Tukio Jingine|G. Other Incident Details',if:v=>v.type!='fire',f:v=>(GQ[v.type]||[]).concat([['cause','Chanzo kinachodhaniwa|Suspected cause','x'],['ver','Chanzo kimethibitishwa kitaalamu?|Cause verified by expert examination?','s',YN]])},
{id:'R',n:'Uchambuzi wa AI na Hitimisho|AI Analysis & Conclusion'}];
const ELW=/umeme|kompyuta|soketi|nyaya|electric|computer|socket|wire|cable/i;
const R=[
{s:'B',id:'cas',t:'x',q:'Waliojeruhiwa/waliokufa walikuwa wapi tukio linaanza, na walipatikana katika hali gani?|Where were the injured/deceased when it began and in what condition were they found?',test:v=>v.cas=='y'},
{s:'C',id:'plug',t:'s',o:YN,q:'Je, vifaa vya umeme vilikuwa vimeunganishwa wakati tukio linaanza?|Was the electrical equipment connected to power when it began?',test:v=>ELW.test((v.power||'')+(v.equip||''))},
{s:'C',id:'sock',t:'s',o:YN,q:'Je, kulikuwa na soketi au nyaya zilizoharibika?|Were there damaged sockets or wiring?',test:v=>v.fu_plug},
{s:'C',id:'tech',t:'s',o:YN,q:'Je, kuna ushahidi wa kitaalamu unaothibitisha hitilafu hiyo ilianzisha moto?|Is there expert evidence that this fault started the fire?',test:v=>v.fu_sock=='y'},
{s:'F',id:'pt',t:'x',q:'Ni ushahidi gani unakosekana ili kuthibitisha Point of Origin?|What evidence is missing to verify the Point of Origin?',test:v=>v.area&&!v.point},
{s:'F',id:'alt',t:'x',q:'Ni vyanzo mbadala gani vimechunguzwa na kuondolewa, kwa ushahidi gani?|Which alternative causes were examined and excluded, and on what evidence?',test:v=>v.ign&&v.ign!='unk'},
{s:'F',id:'ie',t:'x',q:'Ni ushahidi gani wa kitaalamu unaothibitisha dalili za makusudi?|What expert evidence supports the indicators of intentional ignition?',test:v=>v.intent=='int'||v.accel=='y'}];
const FD={};S.forEach(s=>s.f&&[{type:'fire'},{type:'road'}].forEach(x=>s.f(x).forEach(f=>FD[f[0]]=f)));
Object.values(GQ).flat().forEach(f=>FD[f[0]]=f);R.forEach(r=>FD['fu_'+r.id]=['fu_'+r.id,r.q,r.t,r.o]);
const ov=(k,v)=>{const f=FD[k];if(!f||f[2]!='s')return v||'';const o=(f[3]||[]).find(x=>x.split(':')[0]==v);return o?T(o.slice(o.indexOf(':')+1)):v||''};
const stp=()=>S.filter(s=>!s.if||s.if(cur.v));
const fus=sid=>R.filter(r=>r.s==sid&&r.test(cur.v));
// storage
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('afiia',1);r.onupgradeneeded=()=>r.result.createObjectStore('inv',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}});
const tx=(m,f)=>new Promise(res=>{try{const r=f(DB.transaction('inv',m).objectStore('inv'));r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const all=()=>DB?tx('readonly',q=>q.getAll()):Promise.resolve(Object.values(mem));
const put=o=>DB?tx('readwrite',q=>q.put(o)):Promise.resolve(mem[o.id]=o);
const del=id=>DB?tx('readwrite',q=>q.delete(id)):Promise.resolve(delete mem[id]);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',1800)};
const sv=()=>{cur.upd=Date.now();put(cur);const e=$('#sv');if(e)e.textContent=T('✓ Imehifadhiwa|✓ Saved')};
const log=w=>(cur.log=cur.log||[]).push({t:new Date().toLocaleString(),w});
// analysis engine (rule-based)
function an(i){const v=i.v,W=i.w||[],E=i.e||[],fire=v.type=='fire',con=[],miss=[],hyp=[];
const mn=t=>t?+t.slice(0,2)*60+ +t.slice(3,5):null;
if(v.started&&v.firstArr&&mn(v.firstArr)<mn(v.started))con.push('Kikosi cha kwanza kimerekodiwa kufika kabla ya tukio kuanza.|First crew arrival is recorded before the incident start time.');
if(v.date&&v.inv_date&&v.inv_date<v.date)con.push('Tarehe ya uchunguzi ni kabla ya tarehe ya tukio.|Investigation date is earlier than the incident date.');
const sm=[...new Set(W.map(w=>w.first).filter(x=>x&&x!='u'))];if(sm.length>1)con.push('Mashahidi wanatofautiana kuhusu kilichoonekana kwanza (moshi au moto).|Witnesses disagree on what was seen first (smoke or fire).');
if(fire){if(v.ign=='elec'&&v.fu_plug=='n')con.push('Chanzo cha umeme kimetajwa ilhali vifaa vilikuwa havijaunganishwa; inahitaji maelezo.|An electrical source is named although equipment was not connected; needs explanation.');
if(v.intent=='acc'&&v.accel=='y')con.push('Tathmini ya "accidental" inakinzana na dalili za kichocheo.|An "accidental" view conflicts with indicators of accelerant.');
if(v.ign=='unk'&&v.lab=='y')con.push('Uchunguzi wa kitaalamu umethibitisha chanzo lakini Ignition Source imewekwa haijulikani.|Expert testing confirmed a cause but the ignition source is "unknown".');}
if(!W.length)miss.push('Hakuna shahidi aliyerekodiwa.|No witness recorded.');if(!E.length)miss.push('Hakuna kielelezo kilichorekodiwa.|No physical evidence recorded.');
if(E.some(e=>e.photo=='n'))miss.push('Baadhi ya vielelezo havikupigwa picha.|Some evidence was not photographed.');
if(E.some(e=>e.photo!='n'&&!(e.f||[]).length))miss.push('Baadhi ya vielelezo havina picha/nyaraka zilizopakiwa.|Some evidence items have no uploaded files.');
if(!v.started)miss.push('Muda tukio lilipoanza haujajazwa.|Incident start time missing.');if(!v.firstArr)miss.push('Muda wa kufika kikosi cha kwanza haujajazwa.|First crew arrival time missing.');if(!v.inv)miss.push('Jina la mchunguzi halijajazwa.|Investigator name missing.');
const ver=fire?v.lab=='y'||v.fu_tech=='y':v.ver=='y';
if(fire){if(!v.area)miss.push('Area of Origin haijajazwa.|Area of Origin missing.');else if(!v.point)miss.push('Point of Origin haijathibitishwa.|Point of Origin not verified.');
if(v.ign&&v.ign!='unk'&&!ver)miss.push('Chanzo kinachodhaniwa hakijathibitishwa kitaalamu.|Suspected cause lacks expert confirmation.');
const sc={elec:0,mech:0,human:0,int:0,nat:0,oth:0};if(sc[v.ign]!==undefined)sc[v.ign]+=3;if(v.elecF=='y')sc.elec++;if(v.mechF=='y')sc.mech++;if((v.hum||'').trim())sc.human++;
if(v.accel=='y')sc.int+=2;if(v.multi=='y')sc.int+=2;if(v.intent=='int')sc.int++;if(ver&&sc[v.ign]!==undefined)sc[v.ign]+=2;
const nm={elec:'Hitilafu ya umeme|Electrical fault',mech:'Hitilafu ya mitambo|Mechanical failure',human:'Shughuli za binadamu|Human activity',int:'Makusudi (hypothesis tu)|Intentional (hypothesis only)',nat:'Sababu za asili|Natural cause',oth:'Nyingine|Other'};
Object.entries(sc).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>hyp.push([nm[k],n>=5?'Juu|High':n>=3?'Wastani|Medium':'Chini|Low']));}
else if(v.cause&&!ver)miss.push('Chanzo kinachodhaniwa hakijathibitishwa kitaalamu.|Suspected cause lacks expert confirmation.');
const enough=E.length&&W.length&&(fire?v.area:v.cause);let cls,conf;
if(fire&&v.accel=='y'&&v.lab=='y'&&(v.multi=='y'||v.fu_ie)&&E.length&&!con.length)cls='INTENTIONAL';
else if(ver&&!con.length&&E.length&&W.length&&(fire?v.ign&&v.ign!='unk'&&v.accel!='y'&&v.multi!='y':v.cause))cls='ACCIDENTAL';
else cls=enough?'UNDETERMINED':'INCONCLUSIVE';
conf=cls=='ACCIDENTAL'||cls=='INTENTIONAL'?(W.length>1&&E.length>1?'Juu|High':'Wastani|Medium'):enough?'Wastani|Medium':'Chini|Low';
return{cls,conf,con,miss,hyp,ver}}
const CL={ACCIDENTAL:'Tukio la bahati mbaya limethibitishwa kwa ushahidi wa kutosha.|Accidental: confirmed by sufficient evidence.',INTENTIONAL:'Tukio la makusudi linaungwa mkono na ushahidi wa kutosha.|Intentional: supported by sufficient evidence.',UNDETERMINED:'Chanzo hakijaweza kubainishwa.|Cause could not be determined.',INCONCLUSIVE:'Ushahidi hautoshi kutoa hitimisho.|Evidence insufficient for a conclusion.'};
const NOTE='Injini hii ni ya kanuni (rule-based): haitumii AI API wala haichambui picha. Inaonyesha uwezekano, si ukweli uliothibitishwa wala hukumu ya kisheria; uamuzi wa mwisho ni wa mchunguzi mwenye mamlaka.|This engine is rule-based: it uses no AI API and does not analyse images. It shows possibilities, not confirmed fact or a legal verdict; the final decision rests with the authorised investigator.';
// UI
function fld(f,val,a){const[k,l,t,o]=f;let c;val=val??'';
if(t=='x')c=`<textarea ${a} data-k="${k}" rows="3">${esc(val)}</textarea>`;
else if(t=='s')c=`<select ${a} data-k="${k}"><option value="">—</option>${o.map(x=>{const j=x.indexOf(':'),v=x.slice(0,j);return`<option value="${v}" ${v==val?'selected':''}>${esc(T(x.slice(j+1)))}</option>`}).join('')}</select>`;
else c=`<input ${a} data-k="${k}" type="${{t:'text',d:'date',tm:'time',n:'number'}[t]}" value="${esc(val)}">`;
return`<label>${esc(T(l))}${c}</label>`}
const WF=[['name','Jina|Name','t'],['age','Umri (ikiwa muhimu)|Age (if relevant)','t'],['contact','Mawasiliano (kwa ridhaa)|Contact (with consent)','t'],['role','Nafasi katika tukio|Role in incident','t'],['where','Alikuwa wapi tukio linaanza?|Where when it started?','x'],['saw','Aliona/alisikia nini?|What did they see/hear?','x'],['first','Aliona kwanza|Saw first','s',['smoke:Moshi|Smoke','fire:Moto|Fire','u:Hakumbuki|Unsure']],['odd','Jambo lisilo la kawaida?|Anything unusual?','x'],['ev','Ana ushahidi wowote?|Has any evidence?','x']];
const EF=[['desc','Kielelezo|Item','t'],['loc','Kilipatikana wapi?|Found where?','t'],['cond','Hali yake|Condition','x'],['photo','Kilipigwa picha?|Photographed?','s',YN],['lab','Kimepelekwa uchunguzi wa kitaalamu?|Sent for expert analysis?','s',YN],['by','Nani alikabidhi?|Handed over by','t'],['store','Kimehifadhiwa wapi?|Stored where?','t']];
function lst(k){const A=cur[k],F=k=='w'?WF:EF,fn=k=='w'?'Shahidi|Witness':'Kielelezo|Evidence';
return A.map((x,n)=>`<div class="item"><b>${T(fn)} ${n+1}</b> <button class="btn g s" style="float:right" data-a="rm" data-l="${k}" data-i="${n}">✕</button>${F.map(f=>fld(f,x[f[0]],`data-l="${k}" data-i="${n}"`)).join('')}${k=='e'?`<label>${T('Pakia picha/video/nyaraka|Upload photos/video/documents')}<input type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx" data-up="${n}"></label>${(x.f||[]).map(f=>f.ty.startsWith('image')?`<img class="thumb" src="${f.u}">`:`<span class="tag">${esc(f.n)}</span>`).join('')}`:''}</div>`).join('')+`<button class="btn g" data-a="add" data-l="${k}">+ ${T(k=='w'?'Ongeza shahidi|Add witness':'Ongeza kielelezo|Add evidence')}</button>`}
function anHtml(r){const L=a=>a.length?'<ul>'+a.map(x=>`<li>${esc(T(x))}</li>`).join('')+'</ul>':`<p>${T('Hakuna.|None.')}</p>`;
return`<h3>${T('Uwezekano wa vyanzo (si ukweli uliothibitishwa)|Possible causes (not confirmed fact)')}</h3>${r.hyp.length?'<ul>'+r.hyp.map(h=>`<li>${esc(T(h[0]))} — ${T(h[1])}</li>`).join('')+'</ul>':`<p>${T('Hakuna viashiria vya kutosha.|Not enough indicators.')}</p>`}<h3>${T('Taarifa zinazokinzana|Contradictions')}</h3>${L(r.con)}<h3>${T('Ushahidi unaokosekana|Missing evidence')}</h3>${L(r.miss)}<h3>${T('Matokeo|Outcome')}: <span class="tag ${r.cls=='UNDETERMINED'||r.cls=='INCONCLUSIVE'?'w':'ok'}">${r.cls}</span></h3><p>${T(CL[r.cls])} (${T('Uhakika|Confidence')}: ${T(r.conf)})</p>`}
function rev(){const r=an(cur);return`<div class="ai"><small>${T(NOTE)}</small></div>${anHtml(r)}<label>${T('Hitimisho/maoni ya mchunguzi|Investigator conclusion / remarks')}<textarea data-k="concl" rows="4">${esc(cur.v.concl||'')}</textarea></label><label>${T('Mapendekezo|Recommendations')}<textarea data-k="recom" rows="3">${esc(cur.v.recom||'')}</textarea></label>`}
function wiz(){const st=stp();si=Math.min(si,st.length-1);const s=st[si];
let h=`<div class="card"><div class="bar"><i id="pb"></i></div><small id="pt"></small> <small id="sv"></small><h2>${si+1}/${st.length} · ${T(s.n)}</h2>`;
if(s.id=='D')h+=lst('w');else if(s.id=='E')h+=lst('e');else if(s.id=='R')h+=rev();else h+=s.f(cur.v).map(f=>fld(f,cur.v[f[0]],'')).join('')+'<div id="fu"></div>';
h+=`<div class="nav">${si?`<button class="btn g" data-a="prev">← ${T('Rudi|Previous')}</button>`:''}<button class="btn g" data-a="save">${T('Hifadhi|Save Progress')}</button><span class="sp"></span>${si<st.length-1?`<button class="btn" data-a="next">${T('Endelea|Next')} →</button>`:`<button class="btn" data-a="submit">${T('Wasilisha Uchunguzi|Submit Investigation')}</button>`}</div></div>`;
$('#app').innerHTML=h;fu(true);upd()}
function fu(f){const e=$('#fu');if(!e)return;const s=stp()[si],a=fus(s.id),sig=a.map(r=>r.id).join();if(!f&&sig==fsig)return;fsig=sig;
e.innerHTML=a.length?`<div class="ai"><b>🤖 ${T('Maswali ya ziada ya AI|AI follow-up questions')}</b>${a.map(r=>fld(['fu_'+r.id,r.q,r.t,r.o],cur.v['fu_'+r.id],'')).join('')}</div>`:''}
function pct(){const v=cur.v;let t=0,d=0;stp().forEach(s=>{if(s.f){s.f(v).forEach(f=>{t++;if(v[f[0]])d++});fus(s.id).forEach(r=>{t++;if(v['fu_'+r.id])d++})}else if(s.id=='D'||s.id=='E'){t++;if(cur[s.id=='D'?'w':'e'].length)d++}});return t?Math.round(d/t*100):0}
function upd(){if(view!='wiz')return;const p=pct(),b=$('#pb');if(b)b.style.width=p+'%';const t=$('#pt');if(t)t.textContent=T('Maendeleo ya uchunguzi|Investigation progress')+': '+p+'%';fu(false)}
async function dash(){view='dash';const A=await all(),q=($('#q')||{}).value||'',fl=($('#fl')||{}).value||'';A.sort((a,b)=>b.upd-a.upd);
const c=f=>A.filter(f).length,tn=x=>T(TYPES.find(y=>y.startsWith(x+':')).replace(/^[^:]+:/,''));
const L=A.filter(i=>(!fl||(fl=='draft'?i.st!='done':i.st=='done'||i.v.type==fl))&&JSON.stringify(i.v).toLowerCase().includes(q.toLowerCase()));
$('#app').innerHTML=`<div class="grid"><div class="st"><b>${A.length}</b><span>Total Investigations</span></div><div class="st"><b>${c(i=>i.st!='done')}</b><span>Pending</span></div><div class="st"><b>${c(i=>i.st=='done')}</b><span>Completed</span></div><div class="st"><b>${c(i=>i.v.type=='fire')}</b><span>Fire</span></div><div class="st"><b>${c(i=>i.v.type=='road')}</b><span>Road Accident</span></div><div class="st"><b>${c(i=>i.v.type!='fire'&&i.v.type!='road')}</b><span>Other Incidents</span></div></div>
<div class="card" style="margin-top:12px"><div class="nav" style="margin:0 0 8px"><button class="btn" data-a="new">+ ${T('Uchunguzi mpya|New investigation')}</button><button class="btn g" data-a="exp">${T('Hifadhi nakala|Export backup')}</button><label class="btn g" style="margin:0;display:inline-block">${T('Rejesha|Import')}<input type="file" accept=".json" data-imp style="display:none"></label></div>
<div class="nav" style="margin:0"><input id="q" placeholder="${T('Tafuta...|Search...')}" value="${esc(q)}" style="flex:2"><select id="fl" style="flex:1;margin:0"><option value="">${T('Yote|All')}</option><option value="draft" ${fl=='draft'?'selected':''}>${T('Zinazosubiri|Pending')}</option><option value="done" ${fl=='done'?'selected':''}>${T('Zilizokamilika|Completed')}</option>${TYPES.map(x=>`<option value="${x.split(':')[0]}" ${fl==x.split(':')[0]?'selected':''}>${T(x.replace(/^[^:]+:/,''))}</option>`).join('')}</select></div>
<h3>${T('Ripoti za hivi karibuni na uchunguzi|Recent reports and investigations')}</h3>${L.length?L.map(i=>`<div class="row"><div><b>${esc(i.v.ref||'—')}</b> <span class="tag ${i.st=='done'?'ok':'w'}">${i.st=='done'?T('Imekamilika|Completed'):T('Inasubiri|Pending')}</span><br><small>${tn(i.v.type||'fire')} · ${esc(i.v.loc||'')} · ${esc(i.v.date||'')}</small></div><div><button class="btn g s" data-a="open" data-id="${i.id}">${i.st=='done'?T('Fungua|Open'):T('Endelea|Continue Investigation')}</button> ${i.st=='done'?`<button class="btn s" data-a="rep" data-id="${i.id}">${T('Ripoti|Report')}</button> `:''}<button class="btn g s" data-a="del" data-id="${i.id}">🗑</button></div></div>`).join(''):`<p class="warn">${T('Hakuna uchunguzi bado. Bonyeza "Uchunguzi mpya" kuanza.|No investigations yet. Press "New investigation" to start.')}</p>`}</div>`;
$('#bh').textContent=T('Mwanzo|Home')}
// report
function rep(i){const v=i.v,r=an(i),tr=(a,b)=>`<tr><th>${esc(T(a))}</th><td>${esc(b)||'—'}</td></tr>`,tb=(rows)=>`<table>${rows.join('')}</table>`;
const fr=(F,x)=>tb(F.map(f=>tr(f[1],ov(f[0],x[f[0]])||x[f[0]])));
const stps=k=>stp0(i,k);
const sc=S.find(s=>s.id=='C').f().map(f=>tr(f[1],v[f[0]]));
const mid=v.type=='fire'?S.find(s=>s.id=='F').f(v):S.find(s=>s.id=='G').f(v);
const fuA=R.filter(x=>x.test(v)&&v['fu_'+x.id]).map(x=>tr(x.q,ov('fu_'+x.id,v['fu_'+x.id])));
const rec=(v.recom||'')+'\n'+r.miss.map(m=>T(m)).join('\n')+'\n'+T('Fanya uchunguzi wa kitaalamu kabla ya hitimisho la mwisho.|Obtain expert examination before any final conclusion.');
return`<h1>${T('RIPOTI YA UCHUNGUZI WA TUKIO|INCIDENT INVESTIGATION REPORT')}</h1><p><b>${T('Jeshi la Zimamoto na Uokoaji Tanzania|Tanzania Fire and Rescue Force')}</b><br>${T('Namba ya rejea|Reference')}: ${esc(v.ref)}<br>${T('Mchunguzi|Investigator')}: ${esc(v.inv)}<br>${T('Tarehe|Date')}: ${esc(v.inv_date)}</p>
<h2>1. ${T('Taarifa za Tukio|Incident Particulars')}</h2>${tb(S[0].f().map(f=>tr(f[1],ov(f[0],v[f[0]]))))}
<h2>2. ${T('Mandhari|Background')}</h2>${tb(S[1].f().map(f=>tr(f[1],ov(f[0],v[f[0]]))))}
<h2>3. ${T('Mbinu|Methodology')}</h2><p>${T('Mahojiano yaliyoongozwa hatua kwa hatua, ukaguzi wa eneo, ukusanyaji wa vielelezo na uchambuzi wa kanuni (rule-based). Hakuna uchambuzi wa picha wa kiotomatiki.|Guided step-by-step interview, scene examination, evidence collection and rule-based analysis. No automated image analysis was performed.')}</p>
<h2>4. ${T('Ukaguzi wa Eneo|Scene Examination')}</h2>${tb(sc)}
<h2>5. ${T('Maelezo ya Mashahidi|Witness Statements')}</h2>${i.w.map((w,n)=>`<h3>${n+1}. ${esc(w.name)}</h3>${fr(WF.slice(1),w)}`).join('')||'<p>—</p>'}
<h2>6. ${T('Vielelezo|Physical Evidence')}</h2>${i.e.map((e,n)=>`<h3>${n+1}. ${esc(e.desc)}</h3>${fr(EF.slice(1),e)}${(e.f||[]).filter(f=>f.ty.startsWith('image')).map(f=>`<img src="${f.u}" style="max-width:220px;margin:3px">`).join('')}`).join('')||'<p>—</p>'}
<h2>7. ${T('Matokeo|Findings')}</h2>${tb(mid.map(f=>tr(f[1],ov(f[0],v[f[0]])))).concat(fuA.length?'<h3>'+T('Majibu ya maswali ya ziada|Follow-up answers')+'</h3>'+tb(fuA):'')}
<h2>8. ${T('Uchambuzi|Analysis')}</h2>${anHtml(r)}<p><i>${T(NOTE)}</i></p>
<h2>9. ${T('Hitimisho|Conclusion')}</h2><p><b>${r.cls}</b> — ${T(CL[r.cls])}</p><p>${esc(v.concl)}</p>
<h2>10. ${T('Mapendekezo|Recommendations')}</h2><p style="white-space:pre-line">${esc(rec.trim())}</p>
<h2>11. ${T('Mchunguzi|Investigator Details')}</h2>${tb([tr('Jina|Name',v.inv),tr('Kikosi|Unit',v.unit)])}
<h2>12. ${T('Saini|Signature')}</h2><p><br>${T('Saini|Signature')}: ______________________ ${T('Tarehe|Date')}: ____________</p>
<h2>${T('Kumbukumbu ya mabadiliko|Change log')}</h2><ul>${(i.log||[]).map(l=>`<li>${esc(l.t)} — ${esc(T(l.w))}</li>`).join('')}</ul>`}
function stp0(){}
function repView(){view='rep';$('#app').innerHTML=`<div class="nav no" style="margin:0 0 10px"><button class="btn g" data-a="open" data-id="${cur.id}">← ${T('Rudi|Back')}</button><button class="btn" data-a="pdf">PDF / Print</button><button class="btn" data-a="doc">Word</button><button class="btn g" data-a="saverep">${T('Hifadhi mabadiliko|Save edits')}</button><button class="btn g" data-a="regen">${T('Zalisha upya|Regenerate')}</button></div><small class="no">${T('Ripoti inaweza kuhaririwa moja kwa moja hapa chini. Kwa PDF chagua "Save as PDF" kwenye print.|You can edit the report directly below. For PDF choose "Save as PDF" in print.')}</small><div id="rep" contenteditable="true">${cur.rhtml||rep(cur)}</div>`;$('#bh').textContent=T('Mwanzo|Home')}
// events
const A$={
async home(){if(cur&&view=='wiz')sv();cur=null;dash()},
lang(){lang=lang=='sw'?'en':'sw';try{localStorage.lang=lang}catch(e){};cur?(view=='rep'?repView():wiz()):dash()},
theme(){const d=document.documentElement,x=getComputedStyle(d).colorScheme=='dark'?'light':'dark';d.dataset.theme=x;try{localStorage.th=x}catch(e){}},
async new(){const n=(await all()).length+1;cur={id:Date.now()+'',v:{ref:'INV-'+new Date().getFullYear()+'-'+String(n).padStart(4,'0'),inv_date:new Date().toISOString().slice(0,10),type:'fire'},w:[],e:[],st:'draft',upd:Date.now(),log:[{t:new Date().toLocaleString(),w:'Uchunguzi umeanzishwa|Investigation created'}]};await put(cur);si=0;view='wiz';wiz()},
async open(b){cur=(await all()).find(x=>x.id==b.dataset.id);si=0;view='wiz';wiz();$('#bh').textContent=T('Mwanzo|Home')},
async rep(b){cur=(await all()).find(x=>x.id==b.dataset.id);repView()},
async del(b){if(confirm(T('Futa uchunguzi huu?|Delete this investigation?'))){await del(b.dataset.id);dash()}},
next(){sv();si++;wiz();scrollTo(0,0)},prev(){sv();si--;wiz();scrollTo(0,0)},save(){sv();toast(T('Imehifadhiwa|Saved'))},
add(b){cur[b.dataset.l].push({});sv();wiz()},rm(b){if(confirm(T('Ondoa?|Remove?'))){cur[b.dataset.l].splice(+b.dataset.i,1);sv();wiz()}},
submit(){const r=an(cur);if(!cur.v.inv&&!confirm(T('Jina la mchunguzi halijajazwa. Wasilisha hata hivyo?|Investigator name is empty. Submit anyway?')))return;cur.st='done';log('Uchunguzi umewasilishwa|Investigation submitted ('+r.cls+')');cur.rhtml='';sv();repView()},
pdf(){window.print()},
doc(){const h='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:4px;text-align:left}</style></head><body>'+$('#rep').innerHTML+'</body></html>',a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+h],{type:'application/msword'}));a.download=(cur.v.ref||'report')+'.doc';a.click()},
saverep(){cur.rhtml=$('#rep').innerHTML;log('Ripoti imehaririwa|Report edited');sv();toast(T('Imehifadhiwa|Saved'))},
regen(){if(confirm(T('Futa mabadiliko ya mkono?|Discard manual edits?'))){cur.rhtml='';log('Ripoti imezalishwa upya|Report regenerated');sv();repView()}},
async exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(await all())],{type:'application/json'}));a.download='investigations-backup.json';a.click()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A$[b.dataset.a]?.(b)});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q'||t.id=='fl')return dash();const k=t.dataset.k;if(!k||!cur)return;const l=t.dataset.l;if(l)cur[l][+t.dataset.i][k]=t.value;else cur.v[k]=t.value;clearTimeout(timer);timer=setTimeout(sv,500);upd();if(k=='type')fsig=''});
document.addEventListener('change',async e=>{const t=e.target;if(t.id=='fl')return dash();
if(t.dataset.up!==undefined){const x=cur.e[+t.dataset.up];x.f=x.f||[];for(const f of t.files){const o=await new Promise(r=>{if(!f.type.startsWith('image/')){if(f.size>8e6){toast(T('Faili ni kubwa (>8MB)|File too large (>8MB)'));return r(null)}const fr=new FileReader;fr.onload=()=>r({n:f.name,ty:f.type||'file',u:fr.result});fr.readAsDataURL(f);return}const u=URL.createObjectURL(f),im=new Image;im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r({n:f.name,ty:'image/jpeg',u:c.toDataURL('image/jpeg',.75)})};im.onerror=()=>r(null);im.src=u});if(o)x.f.push(o)}sv();wiz()}
if(t.dataset.imp!==undefined&&t.files[0]){try{const a=JSON.parse(await t.files[0].text());for(const o of a)if(o.id&&o.v)await put(o);toast('OK');dash()}catch(x){toast('Invalid file')}}
if(t.dataset.k=='type'&&cur){si=0+si;}});
(async()=>{try{DB=await idb()}catch(e){DB=null}$('#bh').textContent=T('Mwanzo|Home');if(!DB)toast('IndexedDB haipatikani: data ni ya kikao hiki tu|IndexedDB unavailable: data kept for this session only'.split('|')[lang=='en'?1:0]);dash()})();
