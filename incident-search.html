const LS='fiiai3';let S={a:{},aq:{},f:[],chat:[],tab:0,cur:null,n:0,msg:'',busy:0};try{Object.assign(S,JSON.parse(localStorage[LS]))}catch(e){}S.busy=0;

const txt=()=>Object.values(S.a).join(' ').toLowerCase(),lbl=id=>QM[id]?QM[id][2]:'AI: swali la ziada',qt=id=>QM[id]?QM[id][3]:S.aq[id],mn=x=>x?+x.slice(0,2)*60+ +x.slice(3,5):0;

let m=t.match(/saa\s*(\d{1,2})[:.](\d{2})/);if(m)set('time',m[1].padStart(2,'0')+':'+m[2]);

const pend=Object.keys(S.aq).find(i=>!(i in S.a)&&S.n<4&&(!q||q[1]>=10));return pend||(q?q[0]:null)}
// Mshauri (chat)
const KB=[[/v-?pattern|umbo la v/,'V-pattern huundwa na moto unaopanda na kuenea pembeni. Kilele (apex) chini kinaonyesha eneo la asili linalowezekana, lakini ventilation inaweza kupotosha, kwa hiyo linganisha na ushahidi mwingine.'],[/flashover/,'Flashover ni hatua ambapo vitu vyote chumbani vinawaka karibu wakati mmoja. Baada yake, fire patterns hupoteza uwazi, kwa hiyo tafuta ushahidi wa awali kama sehemu zilizolindwa na chini ya vitu.'],[/arcing|arc/,'Arcing ni cheche ya umeme inayoacha mabaka ya shanga (beads) kwenye waya. Si kila arcing ni chanzo: inaweza kutokea moto ukiwa tayari umeharibu insulation. Tafuta arc mapping ili kupata njia yake.'],[/chain of custody|custody|kielelezo|vielelezo/,'Chain of custody: andika nani alikusanya, lini, wapi, jinsi kilivyofungwa, na kila aliyekishika baada ya hapo. Piga picha mahali pake kabla ya kuguswa, tumia kontena safi na lebo.'],[/sampuli|kichocheo|accelerant|ignitable/,'Sampuli za ignitable liquid: chukua udongo/sakafu/zulia kutoka eneo la kuungua na pia sampuli ya kulinganisha isiyoungua (control), weka kwenye mkebe safi usiopitisha hewa, usijaze zaidi ya robo tatu.'],[/nfpa|hatua za uchunguzi|mbinu ya kisayansi|njia ya kisayansi/,'NFPA 921 inatumia mbinu ya kisayansi: 1) tambua tatizo, 2) kusanya data, 3) tengeneza nadharia, 4) jaribu nadharia dhidi ya ushahidi, 5) chagua nadharia isiyokanushwa. Ikibaki haijathibitika, andika chanzo kama Undetermined.'],[/negative corpus|kuondoa|elimination/,'Negative corpus (kuondoa vyanzo vingine bila ushahidi chanya) haikubaliki kama msingi pekee wa kuita moto wa makusudi. Chanzo lazima kiungwe mkono na ushahidi.'],[/nadharia|hypothes/,'Nadharia nzuri hujaribiwa dhidi ya data zote. Weka angalau mbili, eleza ushahidi unaounga na unaopinga kila moja, kisha ikanushe zile zisizolingana na ukweli.'],[/umeme/,'Kwa moto wa umeme: tafuta arcing, breaker iliyotrip, waya kuyeyuka, vifaa vilivyounganishwa, na hitilafu za awali. Fundi akague mfumo ukiwa umezimwa.'],[/gesi|lpg/,'Kwa gesi: kagua valvu, hose, regulator na mahali mtungi ulipowekwa. Harufu kabla ya tukio na mlipuko wa awali ni viashiria. Tumia kipima gesi kabla ya kuingia.'],[/mlipuko/,'Kwa mlipuko: tambua kama ulitangulia moto, mwelekeo wa kuta zilizotupwa, kituo cha uharibifu, na mafuta/gesi yaliyokuwepo. Linda eneo, kunaweza kuwa na hatari ya mlipuko wa pili.'],[/ripoti|andika/,'Ripoti nzuri ina: taarifa za msingi, eneo, muda, area of origin, ushahidi, nadharia zilizojaribiwa, hitimisho, na mapendekezo. Bonyeza "Ripoti" juu kuitengeneza na kuchapisha.'],[/usalama|hatari/,'Usalama kwanza: kagua uimara wa jengo, umeme, gesi na kemikali kabla ya kuingia. Vaa PPE na usifanye kazi peke yako.'],[/makusudi|arson/,'Moto wa makusudi unahitaji ushahidi wa kimwili (kichocheo, asili nyingi, trailers) au wa kitaalamu, si tuhuma tu. Linda vielelezo na ushirikishe polisi.'],[/sigara/,'Sigara: kwa kawaida husababisha moto wa taratibu (smoldering) kwenye samani/magodoro. Tafuta kitako, ashtray, na muda mrefu wa kuanza.'],[/picha/,'Piga picha kwa mpangilio: eneo kwa ujumla, kisha karibu, kisha vielelezo na kipimo pembeni. Zipakie kwenye tab ya Picha.'],[/smolder|taratibu|godoro|samani/,'Moto wa taratibu (smoldering) huanza na joto dogo kwenye samani/magodoro na unaweza kuchukua saa nyingi kabla ya mwali. Tafuta eneo lenye makaa mazito zaidi na chanzo kidogo cha joto kama sigara au kifaa cha umeme.'],[/trailer|mfululizo|njia ya moto/,'Trailers ni njia ya mafuta/kitambaa inayounganisha asili mbili au zaidi. Zikipatikana pamoja na asili nyingi, ni kiashiria kikubwa cha moto wa makusudi, lakini lazima zithibitishwe maabara.'],[/shahidi|mashahidi|mahojiano/,'Mahojiano ya mashahidi: wahoji kando, andika walichoona kwa maneno yao, muda na mahali walipokuwa. Linganisha ushuhuda na ushahidi wa kimwili kabla ya kuuamini.'],[/radi|ngurumo/,'Moto wa radi: tafuta alama za kupigwa (mti uliopasuka, kifaa cha umeme kilichoungua) na uthibitishe na hali ya hewa ya wakati huo kupitia mamlaka ya hali ya hewa.'],[/jenereta|injini/,'Jenereta/injini: angalia uvujaji wa mafuta, eneo la moshi wa kutolea nje, kujazwa mafuta likiwa moto, na ukosefu wa uingizaji hewa.']];
function reply(q){q=q.toLowerCase();const k=chk(),c=causes(),f=x=>x.join('\n• ');
if(/chanzo|sababu|nini kilisababisha/.test(q))return c.length?'Kulingana na maelezo yaliyoingizwa, nafasi za ishara ni:\n• '+f(c.slice(0,3).map(x=>x.n+' '+x.p+'%'))+'\nHii si uthibitisho. Uainishaji wa sasa: '+cls()+'. '+CD[cls()]:'Bado sina taarifa za kutosha. Jibu maswali zaidi kwenye tab ya Mahojiano.';
if(/pengo|kasoro|kinakosa|mgongano|tatizo/.test(q))return k.c.length+k.m.length?'Mapengo na migongano:\n• '+f(k.c.concat(k.m)):'Sioni mapengo makubwa kwa sasa.';
if(/hatua|nifanye|nianze|ijayo/.test(q)){const a=acts();return a.length?'Hatua zinazopendekezwa:\n• '+f(a):'Endelea na mahojiano ili nikupe hatua.'}
if(/muda|mpangilio|timeline/.test(q)){const t=tlp();return t.length?'Mpangilio wa matukio:\n• '+f(t.map(x=>x[1]+' - '+x[0])):'Hujaingiza nyakati bado.'}
if(/uhakika|asilimia|kiwango/.test(q)){const o=conf();return'Uhakika wa jumla '+o.o+'%: ukamilifu wa taarifa '+o.c+'%, ubora wa ushahidi '+o.e+'%, majaribio ya nadharia '+o.h+'%, uthabiti '+o.k+'%.'}
if(/hitimisho|uainishaji|classification/.test(q))return'Uainishaji: '+cls()+'. '+CD[cls()];
if(/kwa nini|ushahidi gani|eleza zaidi/.test(q)){const x=causes()[0];if(x)return'Chanzo cha juu ('+x.n+') kinatokana na: '+x.ev.join(', ')+'. Majibu kama eneo la asili, chanzo cha joto na ushahidi wa umeme/gesi yana uzito mkubwa kuliko maelezo ya jumla.'}
const h=KB.find(r=>r[0].test(q));if(h)return h[1];
const w=q.split(/\W+/).filter(x=>x.length>3);let b=null,bs=0;KB.forEach(r=>{const n=w.filter(x=>r[1].toLowerCase().includes(x)).length;if(n>bs){bs=n;b=r}});if(b)return b[1];
return'Naweza kujibu kuhusu: chanzo, mapengo, hatua, mpangilio wa muda, uhakika, V-pattern, flashover, arcing, chain of custody, sampuli, NFPA 921, nadharia, umeme, gesi, mlipuko, ripoti na usalama. Jaribu mojawapo.'}
// ===== MATENDO =====
function ans(id,v){v=(v||'').trim();if(!v)return;const q=QM[id];if(q&&q[4]=='x'&&v.length<4&&v!='Haijulikani'){S.msg='Jibu ni fupi sana; tafadhali fafanua kidogo.';return ui()}
S.msg='';if(!(id in S.a)&&id.startsWith('ai_'))S.n++;S.a[id]=v;if(S.auto)delete S.auto[id];if(id=='story')ext(v);S.cur=null;ui()}
function send(t){const q=(t||$('#q').value||'').trim();if(!q)return;S.chat.push({r:'u',t:q});S.busy=1;ui();setTimeout(()=>{S.chat.push({r:'a',t:reply(q)});S.chat=S.chat.slice(-40);S.busy=0;ui()},450)}
function addPics(fs){[...fs].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.f.push({d:c.toDataURL('image/jpeg',.6),c:''});ui()};im.src=r.result};r.readAsDataURL(f)})}
// ===== SKRINI =====
const bar=(l,p)=>`<div style="margin:7px 0"><small>${l} · ${p}%</small><div class="bar"><i style="width:${p}%"></i></div></div>`;
function iv(){const id=S.cur||nextQ(),A=S.a,d=Object.keys(A).length,rm=QS.filter(q=>!(q[0] in A)&&vis(q)).length,p=Math.round(d/(d+rm)*100);let h=`<div class="card">${bar('Maendeleo ya mahojiano',p)}`;
if(!id)h+='<h3>✅ Mahojiano yamekamilika</h3><p>Tazama tab ya <b>Ubongo AI</b> au bonyeza <b>Ripoti</b>.</p>';
else{const q=QM[id],ty=q?q[4]:'x',v=esc(A[id]||'');h+=`<small>${q?ST[q[1]]:'🧠 Swali la ziada kutoka kwa AI'}</small><h3>${esc(qt(id))}</h3>`;
if(ty=='s')h+=q[5].map(o=>{const i=o.indexOf(':');return`<button class="g" onclick="ans('${id}','${o.slice(0,i)}')">${o.slice(i+1)}</button>`}).join('');
else{h+=ty=='x'?`<textarea id="inp" rows="4">${v}</textarea>`:`<input id="inp" type="${ty=='d'?'date':ty=='tm'?'time':'text'}" value="${v}" onkeydown="if(event.key=='Enter')ans('${id}',this.value)">`;h+=`<button onclick="ans('${id}',$('#inp').value)">Hifadhi</button><button class="g" onclick="mic('inp')">🎤</button>`}
h+=`<button class="g" onclick="ans('${id}','Haijulikani')">Ruka</button>`;if(S.msg)h+=`<div class="al r">${S.msg}</div>`}
h+='</div>';const ks=Object.keys(A);
if(ks.length)h+=`<div class="card"><details><summary><b>Majibu yaliyohifadhiwa (${ks.length})</b></summary>${ks.map(k=>`<div class="row"><div><small>${esc(lbl(k))}${S.auto&&S.auto[k]?' 🤖 imejazwa na AI':''}</small><br>${esc(dsp(k,A[k]))}</div><button class="g s" onclick="S.cur='${k}';ui()">Hariri</button></div>`).join('')}</details></div>`;return h}
function brain(){const c=conf(),cs=causes(),k=chk(),lv=c.o>=70?'JUU':c.o>=40?'WASTANI':'CHINI',t=tlp(),pt=pats(),ac=acts();
return`<div class="card" style="text-align:center"><small>KIWANGO CHA UHAKIKA WA UCHUNGUZI</small><div style="font-size:52px;font-weight:800;color:var(--p)">${c.o}%</div><span class="tag">${lv}</span><p>Uainishaji: <b>${cls()}</b><br><small>${CD[cls()]}</small></p>${bar('Ukamilifu wa taarifa',c.c)+bar('Ubora wa ushahidi',c.e)+bar('Majaribio ya nadharia',c.h)+bar('Uthabiti (bila mgongano)',c.k)}</div>
<div class="card"><h3>🎯 Vyanzo vinavyowezekana</h3>${cs.length?cs.map(x=>bar(x.n,x.p)+`<small>Kutoka: ${x.ev.join(', ')}</small>`).join(''):'<small>Jibu maswali zaidi kuona nafasi za vyanzo.</small>'}<div class="al"><small>Hii ni nafasi ya ishara kutoka kwa maelezo yako, si uthibitisho. Chanzo kinathibitishwa kwa ushahidi wa kimwili na majaribio ya nadharia.</small></div></div>
<div class="card"><h3>⏱ Mpangilio wa matukio</h3>${t.map((x,i)=>`<div class="row"><div><b>${x[1]}</b> ${x[0]}</div><small>${i?'+'+(mn(x[1])-mn(t[i-1][1]))+' dk':'—'}</small></div>`).join('')||'<small>Jaza nyakati ili kuona mpangilio.</small>'}</div>
${pt.length?`<div class="card"><h3>🔎 Fire patterns</h3>${pt.map(x=>`<div class="al">${x}</div>`).join('')}</div>`:''}
<div class="card"><h3>🚨 Hatua zinazopendekezwa</h3>${ac.map(x=>`<div class="al">${x}</div>`).join('')||'<small>Hakuna kwa sasa.</small>'}${k.al.map(x=>`<div class="al r">⚠️ ${x}</div>`).join('')}${k.c.map(x=>`<div class="al r">↯ ${x}</div>`).join('')}</div>`}
function chat(){return`<div class="card"><h3>💬 Mshauri wa AI</h3><small>Injini ya ndani ya kifaa, bila intaneti. Inajua kesi yako na kanuni za NFPA 921.</small><div id="cl" style="max-height:50vh;overflow:auto;margin:10px 0">${S.chat.length?'':'<div class="bub a">Habari! Mimi ni mshauri wako wa uchunguzi wa moto. Naweza kuchambua kesi yako au kueleza kanuni za NFPA 921. Anza na chips hapa chini au andika swali.</div>'}${S.chat.map(m=>`<div class="bub ${m.r}">${esc(m.t).replace(/\n/g,'<br>')}</div>`).join('')}${S.busy?'<div class="bub a">…</div>':''}</div><div>${['Chanzo ni nini?','Kasoro gani zipo?','Nifanye nini sasa?','Eleza V-pattern','Chain of custody'].map(x=>`<button class="g s" onclick="send('${x}')">${x}</button>`).join('')}</div><div style="display:flex;gap:6px"><input id="q" placeholder="Uliza chochote..." onkeydown="if(event.key=='Enter')send()"><button class="g" onclick="mic('q')">🎤</button><button onclick="send()">Tuma</button></div></div>`}
function pic(){return`<div class="card"><h3>📷 Picha za eneo na vielelezo</h3><input type="file" accept="image/*" multiple onchange="addPics(this.files)">${S.f.map((f,i)=>`<div style="margin:10px 0"><img class="th" src="${f.d}"><input value="${esc(f.c)}" placeholder="Maelezo ya picha" oninput="S.f[${i}].c=this.value;save()"><button class="g s" onclick="S.f.splice(${i},1);ui()">Futa</button></div>`).join('')||'<small>Hakuna picha bado.</small>'}</div><div class="card"><h3>💾 Nakala ya kesi</h3><button onclick="exp()">Pakua nakala</button><input type="file" accept=".json" onchange="imp(this.files[0])"></div>`}
function ui(){$('#tabs').innerHTML=['📝 Mahojiano','🧠 Ubongo','💬 Mshauri','📷 Picha'].map((t,i)=>`<button class="${S.tab==i?'on':'g'}" onclick="S.tab=${i};ui()">${t}</button>`).join('');
$('#m').innerHTML=[iv,brain,chat,pic][S.tab]();save();const c=$('#cl');if(c)c.scrollTop=c.scrollHeight}
function rep(){const a=S.a,k=chk(),cs=causes();let h=`<div class="np"><button onclick="window.print()">🖨 Chapisha / PDF</button><button class="g" onclick="document.body.classList.remove('rv');$('#rp').hidden=true">Funga</button></div><h1>RIPOTI YA UCHUNGUZI WA MOTO</h1>`+sum();
ST.forEach((s,i)=>{const r=QS.filter(q=>q[1]==i&&q[0] in a);if(r.length)h+=`<h2>${s}</h2><table>${r.map(q=>`<tr><th>${esc(q[2])}</th><td>${esc(dsp(q[0],a[q[0]]))}</td></tr>`).join('')}</table>`});
const ai=Object.keys(S.aq).filter(i=>i in a);if(ai.length)h+=`<h2>Maswali ya ziada ya AI</h2><table>${ai.map(i=>`<tr><th>${esc(S.aq[i])}</th><td>${esc(a[i])}</td></tr>`).join('')}</table>`;
h+=`<h2>Uchambuzi wa AI</h2><table><tr><th>Uainishaji</th><td><b>${cls()}</b>: ${CD[cls()]}</td></tr><tr><th>Uhakika wa uchunguzi</th><td>${conf().o}%</td></tr><tr><th>Vyanzo vinavyowezekana</th><td>${cs.map(x=>x.n+' '+x.p+'%').join('; ')||'—'}</td></tr><tr><th>Mapengo</th><td>${k.m.join('<br>')||'—'}</td></tr><tr><th>Migongano</th><td>${k.c.join('<br>')||'—'}</td></tr></table>`;
if(S.f.length)h+='<h2>Picha</h2>'+S.f.map(f=>`<span style="display:inline-block;width:48%;vertical-align:top"><img src="${f.d}" style="max-width:100%"><br><small>${esc(f.c)}</small></span>`).join('');
$('#rp').innerHTML=h;$('#rp').hidden=false;document.body.classList.add('rv');scrollTo(0,0)}
function sum(){const a=S.a,c=causes()[0];return`<h2>Muhtasari wa AI</h2><p>Tukio ${a.type?'la '+dsp('type',a.type).toLowerCase()+' ':''}lilitokea ${esc(a.date||'tarehe isiyojulikana')}${a.time?' saa '+esc(a.time):''}${a.loc?', '+esc(a.loc):''}. ${a.area?'Eneo la asili linalodhaniwa: '+esc(a.area)+'. ':''}${c?'Kwa ishara za ushuhuda, chanzo kinachoongoza ni '+c.n+' ('+c.p+'%). ':''}Uainishaji wa sasa ni <b>${cls()}</b> kwa uhakika wa ${conf().o}%. Baadhi ya taarifa zimejazwa kiotomatiki na AI kutoka maelezo ya tukio na zinapaswa kuthibitishwa na mchunguzi.</p>`}
function mic(id){const Rc=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rc)return alert('Kifaa hiki hakisaidii kuandika kwa sauti.');const r=new Rc();r.lang='sw-TZ';r.onresult=e=>{const el=$('#'+id);if(el)el.value=(el.value+' '+e.results[0][0].transcript).trim()};r.start()}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='kesi-'+(S.a.ref||'moto')+'.json';u.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{Object.assign(S,JSON.parse(r.result));S.busy=0;ui()}catch(e){alert('Faili si sahihi.')}};r.readAsText(f)}
ui();
</script></body></html>
