<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Incident Search</title>
<style>
:root{--bg:#fff;--fg:#202124;--mut:#5f6368;--ln:#dfe1e5;--sf:#f1f3f4;--lk:#1a0dab;--gr:#188038;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#202124;--fg:#e8eaed;--mut:#9aa0a6;--ln:#3c4043;--sf:#303134;--lk:#8ab4f8;--gr:#81c995;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Arial,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:flex-end;gap:14px;padding:12px 16px;font-size:14px}
header a,.lnk{color:var(--fg);text-decoration:none;cursor:pointer}
header a:hover{text-decoration:underline}
#off{display:none;background:var(--sf);color:var(--mut);text-align:center;font-size:13px;padding:5px}
.w{max-width:720px;margin:0 auto;padding:0 16px 40px}
.logo{font-weight:700;letter-spacing:-1px;text-decoration:none;white-space:nowrap}
.hm{text-align:center;padding-top:9vh}
.hm .logo{font-size:clamp(40px,12vw,64px);display:block;margin-bottom:24px}
.sb{position:relative;display:flex;align-items:center;border:1px solid var(--ln);border-radius:26px;height:48px;padding:0 14px;background:var(--bg);flex:1}
.sb:hover,.sb:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.sb input{flex:1;border:0;outline:0;background:none;color:var(--fg);font:inherit;padding:0 10px;height:100%;min-width:0}
.ico{display:flex;color:var(--mut)}
.go{flex:none;border:0;background:var(--lk);color:var(--bg);border-radius:20px;padding:0 16px;height:36px;font:600 14px Arial,sans-serif;cursor:pointer}
.go:active{opacity:.8}
.dd{position:absolute;left:0;right:0;top:46px;background:var(--bg);border:1px solid var(--ln);border-top:0;border-radius:0 0 22px 22px;z-index:5;overflow:hidden;box-shadow:0 4px 6px rgba(32,33,36,.2)}
.dd:empty{display:none}
.sg{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;padding:9px 18px;cursor:pointer}
.sg:hover{background:var(--sf)}
.bt{background:var(--sf);border:1px solid var(--sf);color:var(--fg);border-radius:6px;padding:9px 16px;font:14px Arial,sans-serif;cursor:pointer;margin:22px 5px 0}
.bt:hover{border-color:var(--ln);box-shadow:0 1px 1px rgba(0,0,0,.15)}
.chips{margin-top:26px}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:16px;padding:4px 12px;margin:4px;font-size:14px;color:var(--fg);text-decoration:none}
.chip:hover{background:var(--sf)}
.top{display:flex;align-items:center;gap:14px;padding:6px 0 14px;border-bottom:1px solid var(--ln);margin-bottom:10px}
.top .logo{font-size:24px}
.meta{color:var(--mut);font-size:14px;margin:8px 0}
.r{display:flex;gap:14px;margin:0 0 22px}
.rb{flex:1;min-width:0}
.r img{width:92px;height:92px;object-fit:cover;border-radius:10px;flex:none}
.u{font-size:13px;color:var(--gr)}
.t{display:block;color:var(--lk);font-size:20px;line-height:1.3;text-decoration:none;margin:2px 0 3px}
.t:hover{text-decoration:underline}
.sn{margin:0;font-size:14px;color:var(--mut);line-height:1.55}
.more{width:100%;border:1px solid var(--ln);background:none;color:var(--lk);border-radius:20px;padding:11px;font:inherit;cursor:pointer}
.art h1{font-size:28px;line-height:1.25;margin:10px 0}
.art h2{font-size:21px;margin:24px 0 6px;border-bottom:1px solid var(--ln);padding-bottom:4px}
.art h3{font-size:17px;margin:18px 0 4px}
.art p{margin:0 0 12px}
.art img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:8px 0 14px}
.art figure{margin:14px 0}
.art figure img{margin:0}
.art figcaption{font-size:13px;color:var(--mut);margin-top:4px}
.art img{cursor:zoom-in}
.art img.big{max-height:none;cursor:zoom-out}
.pt{font-size:26px;margin:6px 0}
.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln);padding:10px 0}
.row a{flex:1;color:var(--lk);text-decoration:none;min-width:0}
.row small{color:var(--mut);display:block}
.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px}
.x:hover{background:var(--sf)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{border:1px solid var(--ln);background:none;color:var(--fg);border-radius:18px;padding:6px 14px;font:14px Arial,sans-serif;cursor:pointer}
.tab.on{background:var(--fg);color:var(--bg)}
.in{width:100%;border:1px solid var(--ln);border-radius:22px;padding:11px 16px;background:var(--bg);color:var(--fg);font:inherit}
:focus-visible{outline:2px solid var(--lk);outline-offset:2px}
</style>
</head>
<body>
<div id="off">Uko offline. Unaona maudhui kutoka Hifadhi.</div>
<header><a href="index.html" id="hr">&larr; Ripoti</a><a href="#" id="hl" style="margin-right:auto">Nyumbani</a><a href="#hifadhi" id="hs">Hifadhi</a></header>
<div class="w" id="app" aria-live="polite"></div>
<noscript>Washa JavaScript ili kutumia app hii.</noscript>
<script>
(()=>{'use strict';
/* ===== MIPANGILIO: weka funguo hapa ===== */
const CFG={api:''}; /* weka URL ya Worker hapa, mfano https://tafuta.jina.workers.dev */
const $=s=>document.querySelector(s),app=$('#app'),enc=encodeURIComponent;
const h=(t,a={},k=[])=>{const e=document.createElement(t);for(const n in a){const v=a[n];if(n==='c')e.className=v;else if(n==='t')e.textContent=v;else if(n.startsWith('on'))e[n]=v;else e.setAttribute(n,v)}[].concat(k).forEach(c=>c&&e.append(c));return e};
const sl=ms=>new Promise(r=>setTimeout(r,ms));
const okImg=u=>/^https:\/\//.test(u||'')?u:'';
const SVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>';

/* ===== HIFADHI (IndexedDB) ===== */
let dbp;
const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('incident_search',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('art'))d.createObjectStore('art',{keyPath:'id'});if(!d.objectStoreNames.contains('q'))d.createObjectStore('q',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=(st,mode,fn)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction(st,mode),r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})).catch(()=>null);
const put=(st,v)=>tx(st,'readwrite',s=>s.put(v));
const get=(st,id)=>tx(st,'readonly',s=>s.get(id));
const all=async st=>(await tx(st,'readonly',s=>s.getAll()))||[];
const del=(st,id)=>tx(st,'readwrite',s=>s.delete(id));

/* ===== MTANDAO ===== */
async function jget(u,n=0){
  if(!navigator.onLine)throw{off:1};
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),10000);
  try{const r=await fetch(u,{signal:ac.signal});clearTimeout(to);
    if(r.status===429||r.status>=500){if(n<2){await sl(1200*(n+1));return jget(u,n+1)}throw{}}
    if(!r.ok)throw{};return await r.json()}
  catch(e){clearTimeout(to);if(n<1&&!(e&&e.off)){await sl(700);return jget(u,n+1)}throw e}
}
let wl='sw';
async function searchNet(q,off){
  if(CFG.api){
    const d=await jget(CFG.api+(CFG.api.includes('?')?'&':'?')+'q='+enc(q)+'&off='+off);
    return((d&&d.items)||[]).map(p=>({title:p.title,url:p.link,dom:p.displayLink||'',ex:p.snippet||'',img:''}));
  }
  /* mbadala usio na funguo (unatumika Worker ikiwa haijawekwa) */
  const W={sw:'https://'+'sw.wiki'+'pedia.org',en:'https://'+'en.wiki'+'pedia.org'};
  const one=async l=>{
    const d=await jget(W[l]+'/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=10&gsroffset='+off+'&gsrsearch='+enc(q)+'&prop=pageimages%7Cextracts%7Cinfo&piprop=thumbnail&pithumbsize=160&exintro=1&explaintext=1&exsentences=2&exlimit=max&inprop=url');
    const ps=d&&d.query?Object.values(d.query.pages).sort((a,b)=>a.index-b.index):[];
    return ps.map(p=>({title:p.title,url:p.fullurl,dom:l==='sw'?'Kiswahili':'English',ex:p.extract||'',img:okImg(p.thumbnail&&p.thumbnail.source)}));
  };
  if(off===0){let r=await one('sw');wl='sw';if(!r.length){r=await one('en');wl='en'}return r}
  return one(wl);
}
async function local(q){
  const ws=q.toLowerCase().split(/\s+/).filter(w=>w.length>1);if(!ws.length)return[];
  const m=new Map();(await all('q')).forEach(x=>(x.res||[]).forEach(r=>m.set(r.url,r)));
  return[...m.values()].map(r=>{const tl=r.title.toLowerCase(),tx=(tl+' '+r.ex).toLowerCase();let s=0;ws.forEach(w=>{if(tl.includes(w))s+=10;s+=Math.min(tx.split(w).length-1,20)});return{r,s}})
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,15).map(x=>x.r);
}

/* ===== VIPANDE ===== */
function logo(){const a=h('a',{c:'logo',href:'#','aria-label':'Incident Search'});const C=['#4285f4','#ea4335','#fbbc05','#4285f4','#34a853','#ea4335'];let i=0;
  [...'Incident Search'].forEach(ch=>{a.append(ch===' '?' ':h('span',{t:ch,style:'color:'+C[i++%6]}))});return a}
async function sug(v,dd,go){
  const l=[...new Set((await all('q')).sort((a,b)=>b.t-a.t).filter(x=>x.q.toLowerCase().includes(v.toLowerCase())).map(x=>x.q))].slice(0,7);dd.textContent='';
  l.forEach(t=>dd.append(h('button',{c:'sg',type:'button',t,onpointerdown:e=>{e.preventDefault();go(t)}})));
}
function box(val){
  const f=h('form',{c:'sb',autocomplete:'off',role:'search'}),ic=h('span',{c:'ico'}),dd=h('div',{c:'dd'}),
    i=h('input',{type:'search',value:val||'',placeholder:'Tafuta au andika swali...','aria-label':'Tafuta',enterkeyhint:'search',autocapitalize:'off'});
  ic.innerHTML=SVG;const sb=h('button',{c:'go',type:'submit',t:'Tafuta'});f.append(ic,i,sb,dd);
  const go=q=>{q=q.trim();if(!q)return;dd.textContent='';i.blur();if(decodeURIComponent(location.hash.slice(1))==='s/'+q)route();else location.hash='s/'+enc(q)};
  f.onsubmit=e=>{e.preventDefault();go(i.value)};
  let tm;i.oninput=()=>{clearTimeout(tm);const v=i.value.trim();if(!v){dd.textContent='';return}tm=setTimeout(()=>sug(v,dd,go),250)};
  i.onblur=()=>setTimeout(()=>dd.textContent='',250);
  f._i=i;return f;
}
const sn=t=>{t=(t||'').replace(/\s+/g,' ').trim();return t.length>230?t.slice(0,230)+'...':t};
const item=r=>h('div',{c:'r'},[h('div',{c:'rb'},[
  h('div',{c:'u',t:r.dom||''}),
  h('a',{c:'t',href:r.url,t:r.title}),h('p',{c:'sn',t:sn(r.ex)})]),
  r.img&&h('img',{src:r.img,alt:'',loading:'lazy',onerror:e=>e.target.remove()})]);
const offMsg='Uko offline au muunganisho umeshindikana. Unaona matokeo kutoka Hifadhi.';

/* ===== MAONYESHO ===== */
function home(){
  app.textContent='';const f=box('');
  const w=h('div',{c:'hm'},[logo(),f,h('div',[h('button',{c:'bt',type:'button',t:'Tafuta',onclick:()=>f.requestSubmit()}),h('button',{c:'bt',type:'button',t:'Hifadhi',onclick:()=>location.hash='hifadhi'})])]);
  const ch=h('div',{c:'chips'});w.append(ch);app.append(w);
  all('q').then(q=>q.sort((a,b)=>b.t-a.t).slice(0,8).forEach(x=>ch.append(h('a',{c:'chip',href:'#s/'+enc(x.q),t:x.q}))));
}
let rt=0;
async function results(q){
  const tok=++rt;q=q.trim();app.textContent='';
  const f=box(q);app.append(h('div',{c:'top'},[logo(),f]));
  const st=h('div',{c:'meta',id:'st',t:'Inatafuta...'}),list=h('div'),mb=h('div');app.append(st,list,mb);
  const rec=await get('q',q.toLowerCase());
  if(tok!==rt)return;
  let items=[],off=0;
  if(rec&&Date.now()-rec.t<6*36e5){items=rec.res}
  else{
    try{
      items=await searchNet(q,0);
      if(tok!==rt)return;
      if(items.length)put('q',{id:q.toLowerCase(),q,res:items,t:Date.now()});
    }catch(e){
      if(tok!==rt)return;
            items=rec?rec.res:await local(q);
      st.textContent=items.length?offMsg:offMsg+' Hakuna kilichopatikana.';items.forEach(r=>list.append(item(r)));return;
    }
  }
  if(!items.length){st.textContent='Hakuna matokeo ya "'+q+'". Jaribu maneno mengine.';return}
  st.textContent='Matokeo '+items.length+'. Yamehifadhiwa kwa offline.';items.forEach(r=>list.append(item(r)));
  if(items.length===10){
    const b=h('button',{c:'more',type:'button',t:'Matokeo zaidi',onclick:async()=>{
      b.disabled=true;b.textContent='Inapakia...';off+=10;
      try{const r=await searchNet(q,off);r.forEach(x=>list.append(item(x)));if(r.length<10||off>=90)b.remove();else{b.disabled=false;b.textContent='Matokeo zaidi'}}
      catch(e){off-=10;b.disabled=false;b.textContent='Imeshindikana. Jaribu tena'}}});
    mb.append(b);
  }
}
async function library(){
  app.textContent='';
  const qs=(await all('q')).sort((a,b)=>b.t-a.t);
  const inp=h('input',{c:'in',type:'search',placeholder:'Tafuta ndani ya Hifadhi (inafanya kazi offline)','aria-label':'Tafuta ndani ya Hifadhi'});
  const box2=h('div');
  app.append(h('div',{c:'top'},[logo()]),h('h1',{c:'pt',t:'Hifadhi'}),h('p',{c:'meta',t:'Utafutaji '+qs.length+' umehifadhiwa. Unasomeka bila intaneti.'}),inp,box2);
  const draw=async()=>{
    box2.textContent='';const v=inp.value.trim();
    if(v){const r=await local(v);if(!r.length)box2.append(h('p',{c:'meta',t:'Hakuna kilichopatikana ndani ya Hifadhi.'}));r.forEach(x=>box2.append(item(x)));return}
    if(!qs.length)box2.append(h('p',{c:'meta',t:'Bado hujatafuta chochote.'}));
    qs.forEach(x=>{const row=h('div',{c:'row'},[h('a',{href:'#s/'+enc(x.q)},[h('span',{t:x.q}),h('small',{t:x.res.length+' matokeo - '+new Date(x.t).toLocaleDateString('sw-TZ')})]),
      h('button',{c:'x',type:'button','aria-label':'Ondoa',t:'✕',onclick:async()=>{await del('q',x.id);row.remove()}})]);box2.append(row)});
  };
  inp.oninput=draw;draw();
}
function route(){
  rt++;const x=decodeURIComponent(location.hash.slice(1)||'');
  if(x.startsWith('s/'))return results(x.slice(2));
  if(x==='hifadhi')return library();
  home();
}
const net=()=>{$('#off').style.display=navigator.onLine?'none':'block'};
addEventListener('online',net);addEventListener('offline',net);net();
addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
