/* ===== FX: muonekano wa kiufundi ===== */
#fxbg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#fxbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(90deg,transparent,#5b5bf0,#00e0ff,#7a5cff,transparent) no-repeat;background-size:50% 100%}
#fxbar.on{opacity:1;animation:fxscan 1s linear infinite}
@keyframes fxscan{from{background-position:-60% 0}to{background-position:160% 0}}
@keyframes fxg{to{background-position:300% 0}}
@keyframes fxrp{to{transform:scale(1);opacity:0}}
@keyframes fxp{50%{transform:scale(1.25);color:#e11d48}}
#hud{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:25;padding:6px 11px;border-radius:10px;background:#0b141acc;color:#7dffb3;font:600 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;backdrop-filter:blur(8px);opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none}
#hud.on{opacity:1;transform:none}
.fx-r{opacity:0;transform:translateY(14px);transition:opacity .45s var(--d,0ms),transform .45s var(--d,0ms)}
.fx-r.fx-v{opacity:1;transform:none}
.fx-rp{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.2;transform:scale(0);animation:fxrp .55s ease-out forwards}
.cr,nav button,.act button,.chips button,#menu button.h,.ic button,.story,.vid{position:relative;overflow:hidden}
.card{position:relative}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),#5b5bf016,transparent 60%)}
.card:hover::after{opacity:1}
body.fb .story,body.fb .mas figure{transition:transform .25s ease,opacity .45s var(--d,0ms);transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));will-change:transform}

#toast.on{opacity:1;transform:translate(-50%,0)}
#up{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:29;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--acc,#00a884);font-size:20px;font-weight:700;box-shadow:0 2px 10px #0003;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}

#f.busy::after{content:"";flex:none;width:18px;height:18px;margin:auto 14px auto 4px;border:2px solid #0003;border-top-color:var(--acc,#00a884);border-radius:50%;animation:fxspin .7s linear infinite}
.msg::before{display:block;font-size:34px;margin-bottom:6px;content:"🔎"}
.msg.err::before{content:"⚠️"}
.retry{margin-top:10px;padding:9px 18px;border-radius:20px;background:var(--acc,#00a884);color:#fff;font-weight:600}
