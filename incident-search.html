<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>R-Search</title>
<link rel="icon" href="profile.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f3;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d9e0e5;--red:#c8321e;--red-ink:#fff;--hi:#e8f04a;--bubble:#14202b;--bubble-ink:#fff;--r:14px;--f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=dark]{--bg:#0e151b;--panel:#16212a;--ink:#e8eef2;--mute:#93a3b0;--line:#26343f;--red:#ff5a40;--red-ink:#10161b;--bubble:#e8f04a;--bubble-ink:#14202b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);transition:background .2s,color .2s}
button,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#app{display:flex;height:100dvh}
#side{width:25%;min-width:260px;max-width:340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}.brand b{background:var(--red);color:var(--red-ink);padding:0 7px;border-radius:7px;margin-right:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;transition:background .15s}
.btn:hover{background:var(--bg)}.btn.pri{background:var(--red);color:var(--red-ink);border-color:var(--red);font-weight:600}
#hist{overflow:auto;flex:1}.grp{font-size:13px;color:var(--mute);margin:14px 6px 4px}
.it{display:flex;align-items:flex-start;border-radius:9px;gap:2px}.it:hover,.it.on{background:var(--bg)}
.it .t{flex:1;text-align:left;background:none;border:0;padding:9px 8px;overflow-wrap:anywhere;line-height:1.3}
.it .a{background:none;border:0;padding:6px;opacity:.55}.it .a:hover{opacity:1}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#menu{display:none}
#tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
#feed{flex:1;overflow:auto;padding:18px 14px 8px}
.wrap{max-width:780px;margin:0 auto}
.hero{text-align:center;margin-top:12vh}.hero h1{font-size:clamp(34px,7vw,56px);margin:0 0 8px;letter-spacing:-.03em;font-weight:800}
.hero p{color:var(--mute);margin:0 auto;max-width:440px}
.msg{margin:14px 0;display:flex}.msg.u{justify-content:flex-end}
.bub{background:var(--bubble);color:var(--bubble-ink);padding:10px 14px;border-radius:var(--r) var(--r) 4px var(--r);max-width:85%;white-space:pre-wrap;word-break:break-word}
.ai{width:100%}.ai .body{line-height:1.6}.ai .body h2,.ai .body h3,.ai .body h4,.ai .body h5{margin:14px 0 6px}
.ai .body p{margin:8px 0}.ai a{color:var(--red)}.ai code{background:var(--bg);padding:1px 5px;border-radius:5px}
.code{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:10px 0}.code pre{margin:0;padding:12px;overflow:auto}
.cp{position:absolute;top:6px;right:6px;font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.tw{overflow:auto}table{border-collapse:collapse}th,td{border:1px solid var(--line);padding:6px 10px}
.status{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.status summary{cursor:pointer}.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--red);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.2}}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:s 1.2s infinite;margin:10px 0}@keyframes s{to{background-position:-200% 0}}
.src{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin:6px 0 12px}
.card{display:block;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.card:hover{border-color:var(--red)}.card b{display:block;font-size:14px;line-height:1.3;overflow-wrap:anywhere}.card small{color:var(--mute)}.card p{margin:4px 0 0;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.lab{font-size:14px;color:var(--mute);margin:12px 0 4px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 12px;font-size:14px}.chip:hover{border-color:var(--red)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.m{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.m img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}.m .i{padding:8px 10px;font-size:13px;flex:1}.m .i b{display:block;overflow-wrap:anywhere}
.m a{margin:0 10px 10px;text-align:center;text-decoration:none;color:var(--red-ink);background:var(--red);border-radius:8px;padding:6px;font-size:13px;font-weight:600}
.au{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;margin:8px 0}.au .ic{font-size:26px}.au .x{flex:1;min-width:0}.au .x b{display:block;overflow-wrap:anywhere}
.au .bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px}.au .bar i{display:block;width:0;height:100%;background:var(--red);border-radius:4px}
.au a{background:var(--red);color:var(--red-ink);border-radius:99px;padding:8px 14px;text-decoration:none;font-weight:600}
.err{border:1px solid var(--red);border-radius:12px;padding:12px;background:var(--panel)}
footer{padding:8px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px 8px;box-shadow:0 2px 10px rgba(20,32,43,.08)}
.box:focus-within{border-color:var(--red)}
textarea{flex:1;border:0;background:none;resize:none;max-height:140px;padding:9px 4px;outline:none;line-height:1.4}
.ib{border:0;background:none;font-size:20px;padding:8px;border-radius:50%}.ib:hover{background:var(--bg)}.ib.rec{background:var(--red)}
#send{background:var(--red);color:var(--red-ink);border-radius:50%;width:40px;height:40px;font-size:18px}
.note{max-width:780px;margin:4px auto 0;font-size:12px;color:var(--mute);text-align:center}
.sec{font-weight:800;font-size:18px;margin:24px 0 8px;letter-spacing:-.01em}
.m video{width:100%;aspect-ratio:16/9;background:#000;display:block}.grid.v{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.m .dl{margin:0 10px 10px;border:0;color:var(--red-ink);background:var(--red);border-radius:8px;padding:6px;font-size:13px;font-weight:600}
.m.off .i::after{content:"📴 Offline";display:block;color:var(--red);font-weight:600;margin-top:2px}
.yp{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;overflow:hidden}.yp img{position:absolute;inset:0;height:100%;aspect-ratio:auto;cursor:pointer}
.yp .pb{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none}.yp .pb svg.i{width:26px;height:26px;fill:#fff;stroke:#fff}
.yp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.wrap.vw{max-width:1180px}
.vtabs{display:flex;gap:10px;position:sticky;top:-18px;z-index:4;margin:-18px -14px 16px;padding:12px 14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.vtb{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;transition:background var(--t),transform var(--t),color var(--t)}
.vtb:active{transform:scale(.97)}.vtb svg.i{width:18px;height:18px}
.vtb .n{font-size:12px;font-weight:700;background:var(--bg);color:var(--mute);border-radius:99px;padding:2px 8px}
.vtb[aria-selected=true]{background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent;color:#fff;box-shadow:var(--sh)}
.vtb[aria-selected=true] .n{background:rgba(255,255,255,.25);color:#fff}
.vgrid{display:grid;gap:26px 16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.vc{display:flex;flex-direction:column;min-width:0}
.vc .yp,.vc .vpx{border-radius:14px;overflow:hidden;box-shadow:var(--sh);background:#000}
.vc .yp img{transition:transform .3s}.vc:hover .yp img{transform:scale(1.04)}
.vpx video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;font-weight:700;padding:2px 7px;border-radius:7px;letter-spacing:.2px}
.vm{display:flex;gap:12px;padding:12px 4px 0}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.av svg.i{width:18px;height:18px}
.vt{min-width:0}.vt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;line-height:1.35;font-weight:700;overflow-wrap:anywhere}
.vt small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}
.vc.off .vt::after{content:"Imehifadhiwa kwa offline";display:block;color:var(--ok);font-size:11.5px;font-weight:700;margin-top:3px}
.vc .vdl{margin:12px 4px 0;border:0;border-radius:99px;padding:10px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.vc .vdl:active{transform:scale(.98)}
.vmore{display:flex;justify-content:center;margin:26px 0 8px}.vmore .btn{padding:11px 22px;border-radius:99px;font-weight:700}
@media(max-width:520px){.vgrid{grid-template-columns:1fr;gap:26px}.vtb{font-size:13px;padding:10px 8px}}
#scrim{display:none}
@media(max-width:800px){
#side{position:fixed;inset:0 auto 0 0;width:84%;max-width:320px;z-index:20;transform:translateX(-102%);transition:transform .2s}
#side.open{transform:none}#scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
#menu{display:block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{font-size:14px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab{padding:8px 13px;display:flex;align-items:center;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px}
.ib{display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0}.ib svg.i{width:20px;height:20px}#send svg.i{width:18px;height:18px}
.ai .body{font-size:14px;line-height:1.55}.ai .body p{margin:6px 0}.ai .body h2,.ai .body h3,.ai .body h4,.ai .body h5{font-size:15px;margin:10px 0 4px}
.bub{font-size:14px;padding:8px 12px}.hero p{font-size:14px}
.card b{font-size:13px}.card p{font-size:12px}.card small{font-size:11.5px}
.m .i{font-size:12px}.m .i b{font-size:12.5px}.m .dl{font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px}
.au .x b{font-size:13px}.au .ic svg.i{width:24px;height:24px}.au a{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.m.off .i::after{content:"Offline";font-size:11px}
.qh{font-size:12px;color:var(--mute);margin:16px 0 6px;font-weight:600;overflow-wrap:anywhere}
.it .t{font-size:13px}.it .a{display:flex}.note{min-height:0}.status{font-size:13px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}
.au .pl{width:38px;height:38px;border-radius:50%;border:0;background:var(--red);color:var(--red-ink);display:flex;align-items:center;justify-content:center;flex:none}
.au .dl{border:1px solid var(--line);background:none;color:var(--ink);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.au .bar{height:8px;margin-top:6px;background:var(--line);border-radius:4px;cursor:pointer}.au .bar i{display:block;height:100%;width:0;background:var(--red);border-radius:4px}
.au .tm{color:var(--mute);font-size:11.5px}.au.ld .pl{opacity:.5}
.hero{margin-top:6vh}.sg{margin-top:22px}.sgh{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:12px;font-weight:600;margin-bottom:8px}
.sgh button{width:32px;height:32px;border:0;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center}.sgh button:hover{background:var(--panel)}
.chip{font-size:13px;text-align:left;overflow-wrap:anywhere}
/* ===== Design system v2 ===== */
:root{--bg:#f1f3f5;--panel:#fff;--elev:#fff;--ink:#101a24;--mute:#5b6a78;--line:#dde3e8;--red:#d2381f;--red2:#ff7a45;--ok:#1f9d63;--warn:#d9a000;--glass:rgba(255,255,255,.74);--sh:0 1px 2px rgba(16,26,36,.06),0 8px 24px rgba(16,26,36,.06);--ring:0 0 0 4px rgba(210,56,31,.16);--t:.16s ease}
[data-theme=dark]{--bg:#0a1016;--panel:#111a23;--elev:#17222d;--ink:#e9eff4;--mute:#8fa1b0;--line:#223140;--red:#ff6a4d;--red2:#ffb36b;--glass:rgba(17,26,35,.74);--sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--ring:0 0 0 4px rgba(255,106,77,.22)}
body{background:radial-gradient(900px 480px at 75% -8%,rgba(255,122,69,.11),transparent 60%),var(--bg)}
main{position:relative}
header{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#side{background:var(--panel)}
.tab{min-height:40px;min-width:44px;transition:background var(--t),color var(--t),transform var(--t)}.tab:active{transform:scale(.94)}.tab:hover{border-color:var(--red)}
.btn{transition:background var(--t),transform var(--t)}.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent}
.box{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;box-shadow:var(--sh);transition:box-shadow var(--t),border-color var(--t),transform var(--t)}
.box:focus-within{box-shadow:var(--ring),var(--sh);border-color:var(--red);transform:translateY(-1px)}
#send{background:linear-gradient(135deg,var(--red),var(--red2));transition:transform var(--t)}#send:hover{transform:scale(1.07)}#send:active{transform:scale(.93)}
.msg{animation:in .22s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card,.m,.au,.chip{box-shadow:var(--sh);transition:transform var(--t),border-color var(--t),box-shadow var(--t)}
.card:hover,.m:hover{transform:translateY(-2px)}.chip:hover{transform:translateY(-1px)}.chip:active,.card:active{transform:scale(.98)}
.m img{cursor:zoom-in;transition:transform .25s}.m:hover img{transform:scale(1.02)}.m{overflow:hidden}
.hero .lg{width:72px;height:72px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px rgba(255,122,69,.16),var(--sh);margin-bottom:14px}
.hero h1{background:linear-gradient(135deg,var(--ink) 30%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.act{display:flex;gap:4px;margin-top:2px}.act button{border:0;background:none;color:var(--mute);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}.act button:hover{background:var(--panel);color:var(--ink)}
#hs{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;color:var(--ink);outline:none;font:inherit;font-size:13px}#hs:focus{border-color:var(--red);box-shadow:var(--ring)}
.kb{font-size:11px;color:var(--mute);text-align:center;padding-top:6px}
.net{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(31,157,99,.18)}.net.off{background:var(--warn);box-shadow:0 0 0 3px rgba(217,160,0,.22)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#lb{position:fixed;inset:0;background:rgba(5,10,15,.88);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}#lb.on{display:flex;animation:in .18s}
#lb img{max-width:100%;max-height:88dvh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}#lbx{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;color:#fff;background:rgba(255,255,255,.14)}
#sb{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--elev);box-shadow:var(--sh);display:none;align-items:center;justify-content:center;z-index:5}#sb.on{display:flex}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:none;animation:sp .45s .3s ease forwards}
#splash img{width:84px;height:84px;border-radius:50%;object-fit:cover;animation:pu .8s ease infinite alternate}@keyframes sp{to{opacity:0;visibility:hidden}}@keyframes pu{to{transform:scale(1.07)}}
@media(prefers-reduced-motion:reduce){#splash{display:none}.msg{animation:none}}
</style>
</head>
<body>
<div id="app">
<aside id="side" aria-label="Historia">
  <div class="brand"><img src="profile.jpg" alt="R-Search" width="34" height="34"><span>R-Search</span></div>
  <button class="btn pri" id="new" aria-label="Mazungumzo mapya" data-i="plus" data-t="New Chat"></button>
  <input id="hs" type="search" placeholder="Tafuta kwenye historia" aria-label="Tafuta kwenye historia" autocomplete="off">
  <div id="hist"></div>
  <div class="kb">Ctrl K chat mpya · / andika · Alt 1-5 maoneo</div>
</aside>
<div id="scrim"></div>
<main>
  <header>
    <button class="btn" id="menu" aria-label="Fungua menyu" data-i="menu"></button>
    <nav id="tabs" role="tablist" aria-label="Maoneo">
      <button class="tab" role="tab" data-m="chat" data-i="chat" aria-label="Jibu la AI" title="Jibu" aria-selected="true"></button>
      <button class="tab" role="tab" data-m="web" data-i="web" aria-label="Wavuti" title="Wavuti" aria-selected="false"></button>
      <button class="tab" role="tab" data-m="images" data-i="images" aria-label="Picha" title="Picha" aria-selected="false"></button>
      <button class="tab" role="tab" data-m="videos" data-i="videos" aria-label="Video" title="Video" aria-selected="false"></button>
      <button class="tab" role="tab" data-m="audio" data-i="audio" aria-label="Audio" title="Audio" aria-selected="false"></button>
    </nav>
    <span class="net" id="net" role="img" aria-label="Hali ya mtandao" title="Uko mtandaoni"></span>
    <button class="btn" id="theme" aria-label="Badilisha mwonekano"></button>
  </header>
  <section id="feed" aria-live="polite"><div class="wrap" id="msgs"></div></section>
  <footer>
    <div class="box">
      <button class="ib" id="attach" aria-label="Ambatisha faili la maandishi" data-i="attach"></button>
      <input type="file" id="file" accept=".txt,.md,.csv" hidden>
      <textarea id="q" rows="1" placeholder="Uliza chochote..." aria-label="Uliza chochote"></textarea>
      <button class="ib" id="mic" aria-label="Sauti" data-i="mic"></button>
      <button id="send" class="ib" aria-label="Tuma" data-i="send"></button>
    </div>
    <div class="note" id="note"></div>
  </footer>
<button id="sb" aria-label="Shuka chini" data-i="arrowdown"></button>
</main>

const pxCard = i => `<article class="vc"><div class="vpx"><video controls preload="none" playsinline data-k="${esc(i.file || '')}" data-p="${esc(i.thumb)}" aria-label="${esc(i.title)}"></video></div><div class="vm"><span class="av">${ic('download')}</span><div class="vt"><b>${esc(i.title)}</b><small>${esc(i.user || '')}</small><small>${dur(i.duration || 0)}</small></div></div>${i.file ? `<button class="dl vdl" data-dl="${esc(i.file)}" data-name="${nm(i.title)}" aria-label="Pakua video">${ic('download')} Pakua</button>` : ''}</article>`;
const vskel = `<div class="vgrid">` + '<div><div class="sk" style="aspect-ratio:16/9;height:auto;border-radius:14px;margin:0"></div><div class="sk" style="width:85%"></div><div class="sk" style="width:55%"></div></div>'.repeat(6) + `</div>`;
function videosView(c) {
  const bl = []; c.messages.forEach((m, idx) => { if (m.role === 'ai' && !m.error && m.type === 'web') { const all = [...(m.videos || []), ...(m.videos2 || [])]; bl.push({ q: m.q, m, idx, yt: all.filter(v => v.vid), px: all.filter(v => !v.vid) }) } });
  bl.reverse(); const nY = bl.reduce((n, b) => n + b.yt.length, 0), nP = bl.reduce((n, b) => n + b.px.length, 0);
  const tb = (k, icn, lab, n) => `<button class="vtb" role="tab" data-vsub="${k}" aria-selected="${vsub === k}">${ic(icn)} ${lab} <span class="n">${n}</span></button>`;
  const bar = `<div class="vtabs" role="tablist" aria-label="Aina ya video">${tb('watch', 'play', 'Kutazama', nY)}${tb('dl', 'download', 'Kupakua', nP)}</div>`;
  let h = bar; if (pnd()) h += `<div class="qh">${esc(pnd().q)}</div>${vskel}`;
  const key = vsub === 'watch' ? 'yt' : 'px', n = vsub === 'watch' ? nY : nP;
  bl.forEach(b => { const a = b[key]; if (!a.length) return;
    h += `<div class="qh">${esc(b.q)}</div><div class="vgrid">${a.map(vsub === 'watch' ? ytCard : pxCard).join('')}</div>` + (vsub === 'watch' && b.m.ytNext ? `<div class="vmore"><button class="btn" data-vmore="${b.idx}">Ona video zaidi</button></div>` : '') });
  if (!n && !pnd()) { const o = vsub === 'watch' ? nP : nY; h += `<div class="hero"><p>${bl.length ? (vsub === 'watch' ? 'Hakuna video za kutazama kwa utafutaji huu.' : 'Hakuna video za kupakua kwa utafutaji huu.') : 'Bado hakuna video. Uliza swali kwanza.'}</p>${o ? `<p><button class="btn" style="margin-top:12px" data-vsub="${vsub === 'watch' ? 'dl' : 'watch'}">${vsub === 'watch' ? 'Ona video za kupakua (' + o + ')' : 'Ona video za kutazama (' + o + ')'}</button></p>` : ''}</div>` }
  return h
}
async function loadMore(i, btn) {
  const c = chats.find(x => x.id === cur), m = c?.messages[i]; if (!m?.ytNext) return;
  if (!navigator.onLine) { toast('Hauna intaneti.'); return }
  btn.disabled = true; btn.textContent = 'Inapakia...';
  const r = await vidSearch(m.q, m.ytNext);
  if (!r.items.length) { toast('Hakuna video zaidi kwa sasa.'); btn.disabled = false; btn.textContent = 'Ona video zaidi'; return }
  const have = new Set((m.videos || []).map(v => v.vid)); m.videos = (m.videos || []).concat(r.items.filter(v => !have.has(v.vid))); m.ytNext = r.next;
  save(); const f = $('#feed'), y = f.scrollTop; renderMsgs(); f.scrollTop = y; cacheMsg(m)
}
function viewHTML(c) {
  if (mode === 'videos') return videosView(c);
  let h = pnd() ? `<div class="qh">${esc(pnd().q)}</div>${skel}` : '';
  [...c.messages].reverse().forEach((m, i) => {
    if (m.role !== 'ai') return;
    if (m.error) { if (i === 0 && !pnd()) h += msgHTML(m); return }
    const a = (m.type === 'web' ? (mode === 'videos' ? [...(m.videos || []), ...(m.videos2 || [])] : m[VK[mode]]) : (m.type === mode ? m.items : null))?.filter(i => mode !== 'audio' || i.id);
    if (a?.length) h += (m.q ? `<div class="qh">${esc(m.q)}</div>` : '') + DRAW[mode](a)
  });
  return h || `<div class="hero"><p>Bado hakuna matokeo. Uliza swali kwanza.</p></div>`
}
function renderMsgs() {
  const c = chats.find(x => x.id === cur) || { messages: [] }; let h;
  if (mode === 'chat') h = c.messages.length || pnd() ? c.messages.map(msgHTML).join('') + `<div id="pend">${pendHTML()}</div>` : `<div class="hero"><img class="lg" src="profile.jpg" alt="" onerror="this.remove()"><h1>R-Search</h1><p>${greet()} Uliza chochote. Tafuta, elewa na pata majibu yenye vyanzo.</p></div>` + suggHTML();
  else h = viewHTML(c);
  $('#msgs').classList.toggle('vw', mode === 'videos'); $('#msgs').innerHTML = h; if (mode === 'chat') scrollEnd(); else $('#feed').scrollTop = 0; hydrate(); players.forEach((_, id) => paint(id))
}
const scrollEnd = () => { const f = $('#feed'); f.scrollTop = f.scrollHeight };
$('#msgs').onclick = e => {
  const yp = e.target.closest('.yp'); if (yp) { playVid(yp); return }
  const im = e.target.closest('.m img'); if (im && im.getAttribute('src')) { openLB(im); return }
  const bar = e.target.closest('.au .bar');
  if (bar) { const id = bar.closest('.au').dataset.id, a = players.get(id); if (a?.duration) { const r = bar.getBoundingClientRect(); a.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * a.duration; paint(id) } return }
  const t = e.target.closest('button'); if (!t) return;
  if (t.classList.contains('pl')) togglePlay(t);
  if (t.dataset.shuf) { sugg = shuffle(QBANK).slice(0, 16); renderMsgs() }
  if (t.dataset.ask) { $('#q').value = t.dataset.ask; send() }
  if (t.dataset.retry) { const c = chats.find(x => x.id === cur); c.messages.pop(); c.messages.pop(); save(); $('#q').value = t.dataset.retry; send() }
  if (t.dataset.vsub) { vsub = t.dataset.vsub; renderMsgs() }
  if (t.dataset.vmore) loadMore(+t.dataset.vmore, t);
  if (t.dataset.dl || t.dataset.adl) dl(t);
  if (t.dataset.copy) { navigator.clipboard?.writeText(t.closest('.ai').querySelector('.body').innerText); toast('Jibu limenakiliwa') }
  if (t.classList.contains('cp')) { toast('Msimbo umenakiliwa');  navigator.clipboard?.writeText(t.nextElementSibling.textContent); t.textContent = 'Copied ✓'; setTimeout(() => t.textContent = 'Copy', 1500) }
};

/* ---------- Video: utafutaji + kucheza ---------- */
const unesc = s => { const t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value };
const isoSec = t => { const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(t || ''); return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0 };
const fdur = d => { d = Math.floor(d || 0); const h = Math.floor(d / 3600), m = Math.floor(d % 3600 / 60), x = String(d % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}` };
const cnt = n => new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
function ago(iso) {
  const t = Date.parse(iso); if (!t) return ''; const m = Math.max(1, Math.floor((Date.now() - t) / 6e4));
  if (m < 60) return `dakika ${m} zilizopita`; const h = Math.floor(m / 60); if (h < 24) return `saa ${h} zilizopita`;
  const d = Math.floor(h / 24); if (d < 7) return `siku ${d} zilizopita`; if (d < 30) return `wiki ${Math.floor(d / 7)} zilizopita`;
  if (d < 365) return `miezi ${Math.floor(d / 30)} iliyopita`; const y = Math.floor(d / 365); return y === 1 ? 'mwaka 1 uliopita' : `miaka ${y} iliyopita`
}
async function vidSearch(q, token) {
  const none = { items: [], next: '' };
  try {
    const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=50&safeSearch=moderate&videoEmbeddable=true&q=${encodeURIComponent(q.slice(0, 100))}${token ? '&pageToken=' + encodeURIComponent(token) : ''}&key=${YT_KEY}`);
    if (!r.ok) return none; const d = await r.json();
    const items = (d.items || []).filter(x => /^[\w-]{11}$/.test(x.id?.videoId || '')).map(x => {
      const t = x.snippet.thumbnails || {};
      return { title: unesc(x.snippet.title), thumb: (t.high || t.medium || t.default || {}).url || '', vid: x.id.videoId, user: unesc(x.snippet.channelTitle), at: x.snippet.publishedAt }
    });
    if (items.length) try {
      const r2 = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,statistics&id=${items.map(i => i.vid).join(',')}&key=${YT_KEY}`);
      if (r2.ok) { const mp = new Map(((await r2.json()).items || []).map(v => [v.id, v])); items.forEach(i => { const v = mp.get(i.vid); if (v) { i.duration = isoSec(v.contentDetails?.duration); i.views = +v.statistics?.viewCount || 0 } }) }
    } catch {}
    return { items, next: d.nextPageToken || '' }
  } catch { return none }
}
function playVid(el) {
  const id = el.dataset.vid; if (!/^[\w-]{11}$/.test(id || '')) return;
  if (el.querySelector('iframe')) return;
  if (!navigator.onLine) { toast('Video inahitaji mtandao. Picha na maelezo vimehifadhiwa.'); return }
  const f = document.createElement('iframe');
  f.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true; f.title = 'Video';
  el.querySelector('.pb')?.remove(); el.appendChild(f); el.style.cursor = 'default'
}

/* ---------- Download ---------- */
async function dl(btn) {
  const lab = btn.innerHTML, small = !btn.textContent.trim(); btn.innerHTML = small ? '…' : 'Inapakua...';
  try {
    const u = btn.dataset.dl || await audioUrl(btn.dataset.adl);
    let b = await mGet(u); if (!b) { const r = await fetch(u); if (!r.ok) throw 0; b = await r.blob(); mPut(u, b) }
    const a = document.createElement('a'), ext = (b.type.split('/')[1] || u.split('.').pop() || 'bin').replace('jpeg', 'jpg').replace('mpeg', 'mp3');
    a.href = URL.createObjectURL(b); a.download = 'R-Search-' + (btn.dataset.name || 'faili').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 40) + '.' + ext;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); btn.innerHTML = ic('check') + (small ? '' : ' Imepakuliwa'); toast('Imepakuliwa')
  } catch { btn.innerHTML = small ? ic('alert') : 'Imeshindikana, jaribu tena'; toast('Imeshindikana kupakua. Jaribu tena.') }
  setTimeout(() => btn.innerHTML = lab, 2500)
}

/* ---------- API ---------- */
const DOWN = { msg: 'Samahani, tumeshindwa kupata majibu kwa sasa. Jaribu tena baada ya muda mfupi.', retry: true };
async function tav(body) {
  if (!TAVILY_KEY) throw { msg: 'Huduma ya utafutaji haijasanidiwa kikamilifu.' };
  let r; try { r = await fetch('https://api.tavily.com/search', { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + TAVILY_KEY }, body: JSON.stringify(body) }) } catch { throw DOWN }
  if (r.status === 401 || r.status === 403) throw { msg: 'Huduma ya utafutaji haijasanidiwa kikamilifu.' };
  if (!r.ok) throw DOWN; return r.json()
}
async function pix(kind, q) {
  if (!PIXABAY_KEY) throw { msg: 'Huduma ya utafutaji haijasanidiwa kikamilifu.' };
  let r; try { r = await fetch(`https://pixabay.com/api/${kind === 'videos' ? 'videos/' : ''}?key=${PIXABAY_KEY}&q=${encodeURIComponent(q.slice(0, 100))}&per_page=${kind === 'videos' ? 50 : 24}&safesearch=true`) } catch { throw DOWN }
  if (!r.ok) throw DOWN; const d = await r.json();
  return (d.hits || []).map(h => kind === 'videos' ? { title: h.tags, thumb: `https://i.vimeocdn.com/video/${h.picture_id}_640x360.jpg`, file: h.videos?.tiny?.url || h.videos?.small?.url || h.videos?.medium?.url || '', url: h.pageURL, duration: h.duration, user: h.user } : { title: h.tags, thumb: h.webformatURL, url: h.pageURL, user: h.user })
}
/* Audio: maktaba ya sauti ya wazi; inachezwa papo hapo ndani ya R-Search */
const IA = 'https://archive.org', aurl = new Map(), players = new Map();
async function audioSearch(q) {
  let w = q.toLowerCase().match(/[\p{L}\p{N}]+/gu) || []; const long = w.filter(x => x.length > 3); w = (long.length ? long : w).slice(0, 6); if (!w.length) return [];
  const p = new URLSearchParams(); p.append('q', 'mediatype:audio AND (' + w.join(' OR ') + ')'); p.append('fl[]', 'identifier'); p.append('fl[]', 'title'); p.append('sort[]', 'downloads desc'); p.append('rows', '8'); p.append('output', 'json');
  try { const r = await fetch(`${IA}/advancedsearch.php?${p}`); if (!r.ok) return []; const d = await r.json();
    return (d.response?.docs || []).map(x => ({ id: x.identifier, title: String(Array.isArray(x.title) ? x.title[0] : x.title || x.identifier) })) } catch { return [] }
}
async function audioUrl(id) {
  if (aurl.has(id)) return aurl.get(id);
  const r = await fetch(`${IA}/metadata/${encodeURIComponent(id)}`); if (!r.ok) throw 0; const d = await r.json(), fl = d.files || [];
  const f = fl.filter(x => /\.mp3$/i.test(x.name)).sort((a, b) => (+a.size || 1e12) - (+b.size || 1e12))[0] || fl.find(x => /\.(ogg|m4a|wav)$/i.test(x.name));
  if (!f) throw 0; const u = `${IA}/download/${encodeURIComponent(id)}/${f.name.split('/').map(encodeURIComponent).join('/')}`; aurl.set(id, u); return u
}
const card = id => document.querySelector(`.au[data-id="${CSS.escape(id)}"]`);
function paint(id) {
  const c = card(id), a = players.get(id); if (!c || !a) return;
  c.querySelector('.pl').innerHTML = ic(a.paused ? 'play' : 'pause');
  c.querySelector('.bar i').style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + '%';
  c.querySelector('.tm').textContent = dur(Math.floor(a.currentTime || 0)) + (a.duration ? ' / ' + dur(Math.floor(a.duration)) : '')
}
async function togglePlay(btn) {
  const c = btn.closest('.au'), id = c.dataset.id; let a = players.get(id);
  if (a && !a.paused) { a.pause(); return }
  players.forEach((p, k) => { if (k !== id) p.pause() });
  if (!a) {
    c.classList.add('ld'); c.querySelector('.tm').textContent = 'Inapakia...';
    try {
      a = new Audio(await audioUrl(id)); a.preload = 'auto'; players.set(id, a);
      ['timeupdate', 'play', 'pause', 'ended', 'loadedmetadata'].forEach(ev => a.addEventListener(ev, () => paint(id)));
      a.addEventListener('error', () => { players.delete(id); aurl.delete(id); const x = card(id); if (x) { x.querySelector('.tm').textContent = 'Haipatikani'; x.querySelector('.pl').innerHTML = ic('play') } })
    } catch { c.classList.remove('ld'); c.querySelector('.tm').textContent = 'Haipatikani'; return }
    c.classList.remove('ld')
  }
  try { await a.play() } catch { const x = card(id); if (x) x.querySelector('.tm').textContent = 'Haipatikani' }
}

/* ---------- Send ---------- */
async function send() {
  const q = $('#q').value.trim(); if (busy) return;
  if (!q) { $('.box').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 220 }); return }
  busy = true; $('#q').value = ''; autosize();
  let c = chats.find(x => x.id === cur);
  if (!c) { c = { id: uid(), title: makeTitle(q), mode: 'chat', messages: [], createdAt: Date.now() }; chats.push(c); cur = c.id }
  c.messages.push({ role: 'user', text: q }); pend = { q, text: '', chat: c.id }; save(); renderMsgs(); renderHist();
  let reply, mp = null; const none = { msg: 'Hakuna taarifa zinazolingana zilizopatikana.' };
  try {
    if (!navigator.onLine) throw { msg: 'Hauna intaneti. Unaweza kusoma historia yako (pamoja na picha na video zilizohifadhiwa), lakini utafutaji mpya unahitaji mtandao.', retry: true };
    mp = Promise.allSettled([pix('images', q), vidSearch(q), audioSearch(q), pix('videos', q)]);
    const d = await tav({ query: q, search_depth: 'advanced', include_answer: 'advanced', max_results: 10 });
    const srcs = (d.results || []).map(r => ({ title: r.title, url: r.url, content: r.content || '' }));
    if (!srcs.length && !d.answer) throw none;
    reply = { role: 'ai', type: 'web', q, text: essay(d.answer) || 'Hakuna muhtasari uliopatikana.', sources: srcs, images: [], videos: [], videos2: [], audio: [] };
    const full = reply.text;
    for (let n = 0; n < full.length; n += 8) { pend.text = full.slice(0, n + 8); const el = $('#pend'); if (el) { el.innerHTML = pendHTML(); if (mode === 'chat' && nearBottom()) scrollEnd() } await new Promise(r => setTimeout(r, 12)) }
    pend.media = true; { const el = $('#pend'); if (el) el.innerHTML = pendHTML() }
    const [im, vi, au, pv] = await mp;
    reply.images = (im.value || []).slice(0, 12); { const yv = vi.value || {}; reply.videos = yv.items || []; reply.ytNext = yv.next || '' } reply.audio = (au.value || []).slice(0, 6); reply.videos2 = (pv.value || []).slice(0, 50);
  } catch (e) { reply = { role: 'ai', error: e.msg || 'Hitilafu imetokea.', retry: e.retry ? q : null } }
  pend = null; c.messages.push(reply); save(); renderMsgs(); busy = false;
  if (reply.type === 'web') cacheMsg(reply)
}

/* ---------- Input ---------- */
const autosize = () => { const t = $('#q'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px' };
$('#q').addEventListener('input', autosize);

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  const rec = new SR(); rec.lang = 'sw-TZ'; let on = false;
  rec.onresult = e => { $('#q').value = e.results[0][0].transcript; autosize() };
  rec.onend = () => { on = false; $('#mic').classList.remove('rec') };
  $('#mic').onclick = () => { if (on) rec.stop(); else { try { rec.start(); on = true; $('#mic').classList.add('rec') } catch {} } }
}
var tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400) }
const net = () => { $('#net').classList.toggle('off', !navigator.onLine); $('#net').title = navigator.onLine ? 'Uko mtandaoni' : 'Hauko mtandaoni' };
addEventListener('offline', () => { net(); toast('Hauko mtandaoni. Historia na vilivyohifadhiwa vinasomeka.') });
addEventListener('online', () => { net(); toast('Mtandao umerudi') }); net();
const fd = $('#feed'), nearBottom = () => fd.scrollHeight - fd.scrollTop - fd.clientHeight < 140;
fd.addEventListener('scroll', () => $('#sb').classList.toggle('on', mode === 'chat' && !nearBottom()), { passive: true });
$('#sb').onclick = () => fd.scrollTo({ top: fd.scrollHeight, behavior: 'smooth' });

function openLB(im) { const l = $('#lb'), x = l.querySelector('img'); x.src = im.src; x.alt = im.alt; l.classList.add('on'); $('#lbx').focus() }
$('#lb').onclick = e => { if (e.target.id === 'lb' || e.target.closest('#lbx')) $('#lb').classList.remove('on') };
addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.classList.contains('yp')) { e.preventDefault(); playVid(document.activeElement) }
  if (e.key === 'Escape') { $('#lb').classList.remove('on'); drawer(false) }
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); newChat() }
  else if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus() }
  else if (e.altKey && /^[1-5]$/.test(e.key)) { e.preventDefault(); setMode(['chat', 'web', 'images', 'videos', 'audio'][e.key - 1]) }
});
addEventListener('load', () => setTimeout(() => $('#splash')?.remove(), 900));
(async () => {
  chats = (await kvGet('chats')) || LS.get('rsa_chats', []);
  renderMsgs(); renderHist(); navigator.storage?.persist?.()
})();
</script>
