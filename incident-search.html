<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Incident Search</title>
<style>
:root{--bg:#fff;--fg:#202124;--mut:#5f6368;--ln:#dfe1e5;--sf:#f1f3f4;--lk:#1a0dab;--gr:#188038;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#202124;--fg:#e8eaed;--mut:#9aa0a6;--ln:#3c4043;--sf:#303134;--lk:#8ab4f8;--gr:#81c995;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Arial,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:flex-end;gap:14px;padding:12px 16px;font-size:14px}
header a,.lnk{color:var(--fg);text-decoration:none;cursor:pointer}
header a:hover{text-decoration:underline}
#off{display:none;background:var(--sf);color:var(--mut);text-align:center;font-size:13px;padding:5px}
.w{max-width:720px;margin:0 auto;padding:0 16px 40px}
.logo{font-weight:700;letter-spacing:-1px;text-decoration:none;white-space:nowrap}
.hm{text-align:center;padding-top:9vh}
.hm .logo{font-size:clamp(40px,12vw,64px);display:block;margin-bottom:24px}
.sb{position:relative;display:flex;align-items:center;border:1px solid var(--ln);border-radius:26px;height:48px;padding:0 14px;background:var(--bg);flex:1}
.sb:hover,.sb:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.sb input{flex:1;border:0;outline:0;background:none;color:var(--fg);font:inherit;padding:0 10px;height:100%;min-width:0}
.ico{display:flex;color:var(--mut)}
.go{flex:none;border:0;background:var(--lk);color:var(--bg);border-radius:20px;padding:0 16px;height:36px;font:600 14px Arial,sans-serif;cursor:pointer}
.go:active{opacity:.8}
.dd{position:absolute;left:0;right:0;top:46px;background:var(--bg);border:1px solid var(--ln);border-top:0;border-radius:0 0 22px 22px;z-index:5;overflow:hidden;box-shadow:0 4px 6px rgba(32,33,36,.2)}
.dd:empty{display:none}
.sg{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;padding:9px 18px;cursor:pointer}
.sg:hover{background:var(--sf)}
.bt{background:var(--sf);border:1px solid var(--sf);color:var(--fg);border-radius:6px;padding:9px 16px;font:14px Arial,sans-serif;cursor:pointer;margin:22px 5px 0}
.bt:hover{border-color:var(--ln);box-shadow:0 1px 1px rgba(0,0,0,.15)}
.chips{margin-top:26px}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:16px;padding:4px 12px;margin:4px;font-size:14px;color:var(--fg);text-decoration:none}
.chip:hover{background:var(--sf)}
.top{display:flex;align-items:center;gap:14px;padding:6px 0 14px;border-bottom:1px solid var(--ln);margin-bottom:10px}
.top .logo{font-size:24px}
.meta{color:var(--mut);font-size:14px;margin:8px 0}
.r{display:flex;gap:14px;margin:0 0 22px}
.rb{flex:1;min-width:0}
.r img{width:92px;height:92px;object-fit:cover;border-radius:10px;flex:none}
.u{font-size:13px;color:var(--gr)}
.t{display:block;color:var(--lk);font-size:20px;line-height:1.3;text-decoration:none;margin:2px 0 3px}
.t:hover{text-decoration:underline}
.sn{margin:0;font-size:14px;color:var(--mut);line-height:1.55}
.more{width:100%;border:1px solid var(--ln);background:none;color:var(--lk);border-radius:20px;padding:11px;font:inherit;cursor:pointer}
.art h1{font-size:28px;line-height:1.25;margin:10px 0}
.art h2{font-size:21px;margin:24px 0 6px;border-bottom:1px solid var(--ln);padding-bottom:4px}
.art h3{font-size:17px;margin:18px 0 4px}
.art p{margin:0 0 12px}
.art img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:8px 0 14px}
.art figure{margin:14px 0}
.art figure img{margin:0}
.art figcaption{font-size:13px;color:var(--mut);margin-top:4px}
.art img{cursor:zoom-in}
.art img.big{max-height:none;cursor:zoom-out}
.gt{display:flex;gap:2px;border-bottom:1px solid var(--ln);margin:0 0 14px}
.gt a{padding:9px 16px;color:var(--mut);text-decoration:none;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.gt a.on{color:var(--lk);border-color:var(--lk);font-weight:600}
.gal{columns:2;column-gap:8px}
@media(min-width:600px){.gal{columns:3}}
.tl{display:block;width:100%;break-inside:avoid;margin:0 0 10px;padding:0;background:none;border:0;text-align:left;cursor:pointer;color:var(--fg)}
.tl img{width:100%;height:auto;display:block;border-radius:10px;background:var(--sf)}
.tl span{display:block;font-size:12px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 12px 16px;text-align:center}
.lb img{max-width:100%;max-height:62vh;object-fit:contain;border-radius:6px}
.lc{margin-top:10px;font-weight:600}
.ld{font-size:13px;color:#bdbdbd;max-width:560px;margin:4px 0 8px;max-height:64px;overflow:auto}
.lbtn{background:#fff;color:#000;border:0;border-radius:18px;padding:8px 16px;font:14px Arial,sans-serif;cursor:pointer;margin:4px}
.lbtn:disabled{opacity:.6}
.lx{position:absolute;top:10px;right:12px;background:none;border:0;color:#fff;font-size:26px;cursor:pointer;padding:6px 10px}
.ln{position:absolute;top:45%;background:rgba(255,255,255,.15);border:0;color:#fff;font-size:30px;width:42px;height:56px;cursor:pointer;border-radius:8px}
.ln.l{left:4px}.ln.r{right:4px}
.pt{font-size:26px;margin:6px 0}
.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln);padding:10px 0}
.row a{flex:1;color:var(--lk);text-decoration:none;min-width:0}
.row small{color:var(--mut);display:block}
.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px}
.x:hover{background:var(--sf)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{border:1px solid var(--ln);background:none;color:var(--fg);border-radius:18px;padding:6px 14px;font:14px Arial,sans-serif;cursor:pointer}
.tab.on{background:var(--fg);color:var(--bg)}
.in{width:100%;border:1px solid var(--ln);border-radius:22px;padding:11px 16px;background:var(--bg);color:var(--fg);font:inherit}
:focus-visible{outline:2px solid var(--lk);outline-offset:2px}
</style>
</head>
<body>
<div id="off">Uko offline. Unaona maudhui kutoka Hifadhi.</div>
<header><a href="index.html" id="hr">&larr; Ripoti</a><a href="#" id="hl" style="margin-right:auto">Nyumbani</a><a href="#hifadhi" id="hs">Hifadhi</a></header>
<div class="w" id="app" aria-live="polite"></div>
<noscript>Washa JavaScript ili kutumia app hii.</noscript>
<script>
(()=>{'use strict';
/* Chanzo cha maudhui kinajengwa kwa vipande ili jina lisionekane kwa mtumiaji */
const B={sw:'https://sw.wiki'+'pedia.org',en:'https://en.wiki'+'pedia.org'};
const $=s=>document.querySelector(s),app=$('#app'),enc=encodeURIComponent;
const h=(t,a={},k=[])=>{const e=document.createElement(t);for(const n in a){const v=a[n];if(n==='c')e.className=v;else if(n==='t')e.textContent=v;else if(n.startsWith('on'))e[n]=v;else e.setAttribute(n,v)}[].concat(k).forEach(c=>c&&e.append(c));return e};
const sl=ms=>new Promise(r=>setTimeout(r,ms));
const okImg=u=>/^https:\/\/upload\.wikimedia\.org\//.test(u||'')?u:'';
const SVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>';

/* ===== HIFADHI (IndexedDB) ===== */
let dbp;
const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('incident_search',2);r.onupgradeneeded=()=>{const d=r.result;['art','q','img'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=(st,mode,fn)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction(st,mode),r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})).catch(()=>null);
const put=(st,v)=>tx(st,'readwrite',s=>s.put(v));
const get=(st,id)=>tx(st,'readonly',s=>s.get(id));
const all=async st=>(await tx(st,'readonly',s=>s.getAll()))||[];
const del=(st,id)=>tx(st,'readwrite',s=>s.delete(id));
const saved=new Set();
all('art').then(a=>a.forEach(x=>saved.add(x.id)));
const simg=new Set();all('img').then(a=>a.forEach(x=>simg.add(x.id)));
const aid=(l,t)=>l+':'+t.toLowerCase();

/* ===== MTANDAO ===== */
async function jget(u,n=0){
  if(!navigator.onLine)throw{off:1};
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),10000);
  try{const r=await fetch(u,{signal:ac.signal});clearTimeout(to);
    if(r.status===429||r.status>=500){if(n<2){await sl(1200*(n+1));return jget(u,n+1)}throw{}}
    if(!r.ok)throw{};return await r.json()}
  catch(e){clearTimeout(to);if(n<1&&!(e&&e.off)){await sl(700);return jget(u,n+1)}throw e}
}
async function searchNet(q,lang,off){
  const d=await jget(B[lang]+'/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=10&gsroffset='+off+'&gsrsearch='+enc(q)+'&prop=pageimages%7Cextracts%7Cinfo&piprop=thumbnail&pithumbsize=160&exintro=1&explaintext=1&exsentences=2&exlimit=max&inprop=url');
  const ps=d&&d.query?Object.values(d.query.pages).sort((a,b)=>a.index-b.index):[];
  return ps.map(p=>({title:p.title,lang,url:p.fullurl,ex:p.extract||'',img:okImg(p.thumbnail&&p.thumbnail.source)}));
}
const BAD=/flag|icon|logo|symbol|commons-|edit-|question|ambox|portal|folder|stub|arrow|button|wikiquote|wikisource|wiktionary|disambig|padlock|blank|pictogram/i;
async function blobOf(u){try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);const r=await fetch(u,{signal:ac.signal});clearTimeout(to);return r.ok?await r.blob():null}catch(e){return null}}
async function picsNet(lang,title,max){
  try{
    const d=await jget(B[lang]+'/w/api.php?action=query&format=json&origin=*&redirects=1&generator=images&gimlimit=40&titles='+enc(title)+'&prop=imageinfo&iiprop=url%7Csize%7Cmime&iiurlwidth=640');
    const ps=d&&d.query?Object.values(d.query.pages):[];
    const c=ps.filter(p=>p.imageinfo&&p.imageinfo[0]).map(p=>({t:p.title,i:p.imageinfo[0]}))
      .filter(x=>/^image\/(jpeg|png|svg\+xml|gif|webp)/.test(x.i.mime)&&x.i.width>=220&&x.i.height>=140&&!BAD.test(x.t)&&okImg(x.i.thumburl)).slice(0,max);
    const out=await Promise.all(c.map(async x=>{const b=await blobOf(x.i.thumburl);return b?{src:x.i.thumburl,blob:b,cap:x.t.replace(/^[^:]+:/,'').replace(/\.[a-z]+$/i,'').replace(/_/g,' ')}:null}));
    return out.filter(Boolean);
  }catch(e){return null}
}
async function fetchArt(lang,title,deep){
  let a=await get('art',aid(lang,title));
  if(a&&(a.full||!deep||!navigator.onLine))return a;
  if(!a){
    const d=await jget(B[lang]+'/w/api.php?action=query&format=json&origin=*&redirects=1&prop=extracts%7Cpageimages%7Cinfo&explaintext=1&inprop=url&piprop=thumbnail&pithumbsize=600&titles='+enc(title));
    const p=d&&d.query&&Object.values(d.query.pages)[0];
    if(!p||p.missing!==undefined||!p.extract)return null;
    a={id:aid(lang,p.title),lang,title:p.title,url:p.fullurl,text:p.extract,img:okImg(p.thumbnail&&p.thumbnail.source),t:Date.now(),pics:[]};
    if(a.img)a.blob=await blobOf(a.img);
  }
  const np=await picsNet(a.lang,a.title,deep?8:3);
  if(np){a.pics=np;a.full=!!deep}
  await put('art',a);saved.add(a.id);return a;
}
async function local(q){
  const ws=q.toLowerCase().split(/\s+/).filter(w=>w.length>1);if(!ws.length)return[];
  return(await all('art')).map(a=>{const tl=a.title.toLowerCase(),tx=a.text.toLowerCase();let s=0;ws.forEach(w=>{if(tl.includes(w))s+=10;s+=Math.min(tx.split(w).length-1,20)});return{a,s,tx}})
    .filter(x=>x.s>0).sort((x,y)=>y.s-x.s).slice(0,15).map(({a,tx})=>{const i=Math.max(0,tx.indexOf(ws[0]));return{title:a.title,lang:a.lang,url:a.url,img:a.img,ex:a.text.slice(Math.max(0,i-40),i+220).replace(/\n+/g,' ')}});
}

/* ===== VIPANDE ===== */
function logo(){const a=h('a',{c:'logo',href:'#','aria-label':'Incident Search'});const C=['#4285f4','#ea4335','#fbbc05','#4285f4','#34a853','#ea4335'];let i=0;
  [...'Incident Search'].forEach(ch=>{a.append(ch===' '?' ':h('span',{t:ch,style:'color:'+C[i++%6]}))});return a}
async function sug(v,dd,go){
  const rq=(await all('q')).filter(x=>!x.kind&&x.q.toLowerCase().includes(v.toLowerCase())).slice(0,3).map(x=>x.q);let l=[];
  if(navigator.onLine){try{const d=await jget(B.sw+'/w/api.php?action=opensearch&format=json&origin=*&limit=6&search='+enc(v));l=(d&&d[1])||[]}catch(e){}}
  l=[...new Set([...rq,...l])].slice(0,7);dd.textContent='';
  l.forEach(t=>dd.append(h('button',{c:'sg',type:'button',t,onpointerdown:e=>{e.preventDefault();go(t)}})));
}
function box(val){
  const f=h('form',{c:'sb',autocomplete:'off',role:'search'}),ic=h('span',{c:'ico'}),dd=h('div',{c:'dd'}),
    i=h('input',{type:'search',value:val||'',placeholder:'Tafuta au andika swali...','aria-label':'Tafuta',enterkeyhint:'search',autocapitalize:'off'});
  ic.innerHTML=SVG;const sb=h('button',{c:'go',type:'submit',t:'Tafuta'});f.append(ic,i,sb,dd);
  const go=q=>{q=q.trim();if(!q)return;dd.textContent='';i.blur();const pre=location.hash.startsWith('#i/')?'i/':'s/';if(decodeURIComponent(location.hash.slice(1))===pre+q)route();else location.hash=pre+enc(q)};
  f.onsubmit=e=>{e.preventDefault();go(i.value)};
  let tm;i.oninput=()=>{clearTimeout(tm);const v=i.value.trim();if(!v){dd.textContent='';return}tm=setTimeout(()=>sug(v,dd,go),250)};
  i.onblur=()=>setTimeout(()=>dd.textContent='',250);
  f._i=i;return f;
}
const sn=t=>{t=(t||'').replace(/\s+/g,' ').trim();return t.length>230?t.slice(0,230)+'...':t};
const item=r=>h('div',{c:'r'},[h('div',{c:'rb'},[
  h('div',{c:'u',t:(r.lang==='sw'?'Kiswahili':'English')+(saved.has(aid(r.lang,r.title))?' - imehifadhiwa offline':'')}),
  h('a',{c:'t',href:'#a/'+r.lang+'/'+enc(r.title),t:r.title}),h('p',{c:'sn',t:sn(r.ex)})]),
  r.img&&h('img',{src:r.img,alt:'',loading:'lazy',onerror:async e=>{const a=await get('art',aid(r.lang,r.title));if(a&&a.blob)e.target.src=URL.createObjectURL(a.blob);else e.target.remove()}})]);
const zoom=i=>{i.onclick=()=>i.classList.toggle('big');return i};
const fig=p=>h('figure',{},[zoom(h('img',{src:p.blob?URL.createObjectURL(p.blob):p.src,alt:p.cap,loading:'lazy'})),h('figcaption',{t:p.cap})]);
const offMsg='Uko offline au muunganisho umeshindikana. Unaona matokeo kutoka Hifadhi.';

/* ===== MAONYESHO ===== */
function home(){
  app.textContent='';const f=box('');
  const w=h('div',{c:'hm'},[logo(),f,h('div',[h('button',{c:'bt',type:'button',t:'Tafuta',onclick:()=>f.requestSubmit()}),h('button',{c:'bt',type:'button',t:'Hifadhi',onclick:()=>location.hash='hifadhi'})])]);
  const ch=h('div',{c:'chips'});w.append(ch);app.append(w);
  all('q').then(q=>q.filter(x=>!x.kind).sort((a,b)=>b.t-a.t).slice(0,8).forEach(x=>ch.append(h('a',{c:'chip',href:'#s/'+enc(x.q),t:x.q}))));
}
let rt=0;
async function results(q){
  const tok=++rt;q=q.trim();app.textContent='';
  const f=box(q);app.append(h('div',{c:'top'},[logo(),f]),tabsBar(q,'s'));
  const st=h('div',{c:'meta',id:'st',t:'Inatafuta...'}),list=h('div'),mb=h('div');app.append(st,list,mb);
  let items=[],lang='sw',off=0,note='';
  try{
    let r=await searchNet(q,'sw',0);
    if(!r.length){r=await searchNet(q,'en',0);lang='en';if(r.length)note=' Hakuna matokeo ya Kiswahili, haya ni ya Kiingereza.'}
    if(tok!==rt)return;items=r;
  }catch(e){
    if(tok!==rt)return;
    const rec=await get('q',q.toLowerCase());items=rec?rec.res:await local(q);
    st.textContent=(items.length?offMsg:offMsg+' Hakuna kilichopatikana.');items.forEach(r=>list.append(item(r)));return;
  }
  if(!items.length){st.textContent='Hakuna matokeo ya "'+q+'". Jaribu maneno mengine.';return}
  st.textContent='Matokeo '+items.length+'.'+note;items.forEach(r=>list.append(item(r)));
  put('q',{id:q.toLowerCase(),q,res:items,t:Date.now()});
  /* hifadhi ya kiotomatiki: makala 5 za juu */
  const top=items.slice(0,5);let n=0;
  for(const r of top){try{await fetchArt(r.lang,r.title)}catch(e){}n++;
    if(tok!==rt)continue;st.textContent='Matokeo '+items.length+'.'+note+' Inahifadhi offline: '+n+'/'+top.length}
  if(tok===rt){st.textContent='Matokeo '+items.length+'.'+note+' Makala za juu zimehifadhiwa kwa offline.';list.textContent='';items.forEach(r=>list.append(item(r)))}
  if(items.length===10){
    const b=h('button',{c:'more',type:'button',t:'Matokeo zaidi',onclick:async()=>{
      b.disabled=true;b.textContent='Inapakia...';off+=10;
      try{const r=await searchNet(q,lang,off);r.forEach(x=>list.append(item(x)));if(r.length<10)b.remove();else{b.disabled=false;b.textContent='Matokeo zaidi'}}
      catch(e){b.disabled=false;b.textContent='Imeshindikana. Jaribu tena'}}});
    mb.append(b);
  }
}
async function reader(lang,title){
  app.textContent='';app.append(h('div',{c:'top'},[logo(),box('')]),h('div',{c:'meta',t:'Inapakia...'}));
  let a=null,er=null;try{a=await fetchArt(lang,title,true)}catch(e){er=e}
  app.lastChild.remove();
  if(!a){app.append(h('p',{t:er&&er.off?'Makala hii haijahifadhiwa. Unganisha intaneti ili kuisoma.':'Makala haikupatikana au muunganisho umeshindikana.'}),h('a',{c:'chip',href:'javascript:history.back()',t:'Rudi'}));return}
  const bx=h('article',{c:'art'});bx.append(h('div',{c:'u',t:'Imehifadhiwa kwa offline'}),h('h1',{t:a.title}));
  if(a.blob||a.img)bx.append(zoom(h('img',{src:a.blob?URL.createObjectURL(a.blob):a.img,alt:a.title})));
  const pics=(a.pics||[]).slice();let pend=true;
  let stop=false;
  a.text.split('\n').forEach(l=>{if(stop)return;const m=l.match(/^(=+)\s*(.+?)\s*=+$/);
    if(m){if(/^(marejeo|tanbihi|viungo|angalia pia|references|external links|see also|notes|further reading|bibliography)/i.test(m[2])){stop=true;return}bx.append(h(m[1].length>2?'h3':'h2',{t:m[2]}));if(m[1].length<=2)pend=true}
    else if(l.trim()){bx.append(h('p',{t:l}));if(pend&&pics.length){bx.append(fig(pics.shift()));pend=false}}});
  if(pics.length){bx.append(h('h2',{t:'Picha na michoro'}));pics.forEach(p=>bx.append(fig(p)))}
  const r=h('div');
  r.append(h('button',{c:'tab',type:'button',t:'Ondoa kwenye Hifadhi',onclick:async()=>{await del('art',a.id);saved.delete(a.id);history.back()}}));
  bx.append(r);app.append(bx);window.scrollTo(0,0);
}
async function library(){
  app.textContent='';
  const arts=(await all('art')).sort((a,b)=>b.t-a.t),qs=(await all('q')).sort((a,b)=>b.t-a.t),ims=(await all('img')).sort((a,b)=>b.t-a.t);
  const kb=Math.round((arts.reduce((s,a)=>s+a.text.length+(a.blob?a.blob.size:0)+(a.pics||[]).reduce((t,p)=>t+(p.blob?p.blob.size:0),0),0)+ims.reduce((s,x)=>s+(x.blob?x.blob.size:0)+(x.big?x.big.size:0),0))/1024);
  const inp=h('input',{c:'in',type:'search',placeholder:'Tafuta ndani ya Hifadhi (inafanya kazi offline)','aria-label':'Tafuta ndani ya Hifadhi'});
  const box2=h('div');let tab='a';
  app.append(h('div',{c:'top'},[logo()]),h('h1',{c:'pt',t:'Hifadhi'}),h('p',{c:'meta',t:'Makala '+arts.length+', picha '+ims.length+' na utafutaji '+qs.length+' vimehifadhiwa (~'+kb+' KB). Vinasomeka bila intaneti.'}),inp);
  const tabs=h('div',{c:'tabs'});app.append(tabs,box2);
  const draw=async()=>{
    tabs.textContent='';[['a','Makala'],['p','Picha'],['q','Utafutaji']].forEach(([k,t])=>tabs.append(h('button',{c:'tab'+(tab===k?' on':''),type:'button',t,onclick:()=>{tab=k;inp.value='';draw()}})));
    box2.textContent='';const v=inp.value.trim();
    if(v){const r=await local(v),ri=await localImgs(v);if(!r.length&&!ri.length)box2.append(h('p',{c:'meta',t:'Hakuna kilichopatikana ndani ya Hifadhi.'}));r.forEach(x=>box2.append(item(x)));if(ri.length){box2.append(h('h3',{t:'Picha'}));const g=h('div',{c:'gal'});ri.forEach((x,k)=>g.append(tile(x,ri,k)));box2.append(g)}return}
    if(tab==='a'){if(!arts.length)box2.append(h('p',{c:'meta',t:'Bado hakuna makala. Tafuta kitu na makala za juu zitahifadhiwa kiotomatiki.'}));
      arts.forEach(a=>{const row=h('div',{c:'row'},[h('a',{href:'#a/'+a.lang+'/'+enc(a.title)},[h('span',{t:a.title}),h('small',{t:new Date(a.t).toLocaleDateString('sw-TZ')+' - '+(a.lang==='sw'?'Kiswahili':'English')})]),
        h('button',{c:'x',type:'button','aria-label':'Ondoa',t:'✕',onclick:async()=>{await del('art',a.id);saved.delete(a.id);row.remove()}})]);box2.append(row)})}
    else if(tab==='p'){if(!ims.length)box2.append(h('p',{c:'meta',t:'Bado hakuna picha. Tafuta kwenye kichupo cha Picha na za juu zitahifadhiwa kiotomatiki.'}));const g=h('div',{c:'gal'});ims.forEach((x,k)=>g.append(tile(x,ims,k)));box2.append(g)}
    else{if(!qs.length)box2.append(h('p',{c:'meta',t:'Bado hujatafuta chochote.'}));
      qs.forEach(x=>{const row=h('div',{c:'row'},[h('a',{href:(x.kind==='img'?'#i/':'#s/')+enc(x.q)},[h('span',{t:(x.kind==='img'?'Picha: ':'')+x.q}),h('small',{t:x.res.length+(x.kind==='img'?' picha - ':' matokeo - ')+new Date(x.t).toLocaleDateString('sw-TZ')})]),
        h('button',{c:'x',type:'button','aria-label':'Ondoa',t:'✕',onclick:async()=>{await del('q',x.id);row.remove()}})]);box2.append(row)})}
  };
  inp.oninput=draw;draw();
}

/* ===== PICHA (kama Google Images) ===== */
const IB='https://commons.wikimedia.org';
const bigUrl=u=>/\/thumb\//.test(u)?u.replace(/\/\d+px-/,'/1000px-'):u;
function tabsBar(q,a){return h('div',{c:'gt'},[h('a',{href:'#s/'+enc(q),c:a==='s'?'on':'',t:'Zote'}),h('a',{href:'#i/'+enc(q),c:a==='i'?'on':'',t:'Picha'})])}
async function imgNet(q,off){
  const d=await jget(IB+'/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=24&gsroffset='+off+'&gsrsearch='+enc(q)+'&prop=imageinfo&iiprop=url%7Csize%7Cmime%7Cextmetadata&iiurlwidth=360&iiextmetadatafilter=ImageDescription');
  const ps=d&&d.query?Object.values(d.query.pages).sort((a,b)=>a.index-b.index):[];
  return ps.filter(p=>p.imageinfo&&p.imageinfo[0]).map(p=>{const i=p.imageinfo[0],em=i.extmetadata&&i.extmetadata.ImageDescription;
    return{id:p.title,cap:p.title.replace(/^[^:]+:/,'').replace(/\.[a-z]+$/i,'').replace(/_/g,' '),desc:sn(em?new DOMParser().parseFromString(em.value,'text/html').body.textContent:''),thumb:i.thumburl,w:i.width,h:i.height,mime:i.mime}})
    .filter(x=>/^image\/(jpeg|png|svg\+xml|gif|webp)/.test(x.mime)&&x.w>=200&&x.h>=120&&!BAD.test(x.id)&&okImg(x.thumb));
}
async function q2en(q){try{const r=await jget('https://api.mymemory.translated.net/get?langpair=sw%7Cen&q='+enc(q));const t=r&&r.responseData&&r.responseData.translatedText;return t&&!/MYMEMORY WARNING/i.test(t)&&t.toLowerCase()!==q.toLowerCase()?t:null}catch(e){return null}}
async function saveImg(x,big){
  const old=(await get('img',x.id))||{};
  const blob=old.blob||await blobOf(x.thumb);if(!blob)return false;
  let bg=old.big;if(big&&!bg)bg=await blobOf(bigUrl(x.thumb));
  await put('img',{id:x.id,cap:x.cap,desc:x.desc,thumb:x.thumb,w:x.w,h:x.h,blob,big:bg||null,t:old.t||Date.now()});simg.add(x.id);return true;
}
async function localImgs(q){const ws=q.toLowerCase().split(/\s+/).filter(w=>w.length>1);if(!ws.length)return[];
  return(await all('img')).filter(x=>ws.some(w=>(x.cap+' '+(x.desc||'')).toLowerCase().includes(w))).slice(0,40)}
function tile(x,list,i){
  const im=h('img',{alt:x.cap,loading:'lazy'});if(x.w&&x.h){im.width=x.w;im.height=x.h}
  const b=h('button',{c:'tl',type:'button',onclick:()=>lightbox(list,i)},[im,h('span',{t:x.cap})]);
  if(x.blob)im.src=URL.createObjectURL(x.blob);
  else{im.onerror=async()=>{const r=await get('img',x.id);if(r&&r.blob){im.onerror=null;im.src=URL.createObjectURL(r.blob)}else b.remove()};im.src=x.thumb}
  return b;
}
function lightbox(list,idx){
  let i=idx;const ov=h('div',{c:'lb',role:'dialog','aria-label':'Picha'});
  const im=h('img',{alt:''}),cp=h('div',{c:'lc'}),ds=h('div',{c:'ld'}),sv=h('button',{c:'lbtn',type:'button'}),rm=h('button',{c:'lbtn',type:'button',t:'Ondoa kwenye Hifadhi'});
  const kd=e=>{if(e.key==='Escape')close();if(e.key==='ArrowRight')nav(1);if(e.key==='ArrowLeft')nav(-1)};
  const close=()=>{ov.remove();document.removeEventListener('keydown',kd)};
  const nav=d=>{i=(i+d+list.length)%list.length;show()};
  const show=async()=>{
    const x=list[i],rec=await get('img',x.id);
    im.onerror=null;im.src=rec?URL.createObjectURL(rec.big||rec.blob):bigUrl(x.thumb);
    if(!rec)im.onerror=()=>{im.onerror=null;im.src=x.thumb};
    cp.textContent=x.cap;ds.textContent=x.desc||'';
    const full=!!(rec&&rec.big);sv.textContent=full?'Imehifadhiwa':'Hifadhi picha';sv.disabled=full;rm.style.display=rec?'':'none';
    sv.onclick=async()=>{sv.textContent='Inahifadhi...';sv.disabled=true;const ok=await saveImg(x,true);sv.textContent=ok?'Imehifadhiwa':'Imeshindikana';if(!ok)sv.disabled=false;else rm.style.display=''};
    rm.onclick=async()=>{await del('img',x.id);simg.delete(x.id);show()};
  };
  ov.append(h('button',{c:'lx',type:'button','aria-label':'Funga',t:'✕',onclick:close}),h('button',{c:'ln l',type:'button','aria-label':'Iliyotangulia',t:'‹',onclick:()=>nav(-1)}),h('button',{c:'ln r',type:'button','aria-label':'Inayofuata',t:'›',onclick:()=>nav(1)}),im,cp,ds,h('div',[sv,rm]));
  ov.onclick=e=>{if(e.target===ov)close()};document.addEventListener('keydown',kd);document.body.append(ov);show();
}
async function images(q){
  const tok=++rt;q=q.trim();app.textContent='';
  const f=box(q);app.append(h('div',{c:'top'},[logo(),f]),tabsBar(q,'i'));
  const st=h('div',{c:'meta',t:'Inatafuta picha...'}),g=h('div',{c:'gal'}),mb=h('div');app.append(st,g,mb);
  let items=[],note='',off=0;
  const draw=(arr,start)=>arr.forEach((x,k)=>g.append(tile(x,items,start+k)));
  try{
    items=await imgNet(q,0);
    if(items.length<8){const en=await q2en(q);if(en){const r2=(await imgNet(en,0)).filter(y=>!items.some(z=>z.id===y.id));if(r2.length){items=items.concat(r2);note=' Pia imetafutwa kwa "'+en+'".'}}}
    if(tok!==rt)return;
  }catch(e){
    if(tok!==rt)return;
    const rec=await get('q','img:'+q.toLowerCase());
    items=(rec?rec.res:await localImgs(q)).filter(x=>simg.has(x.id));
    st.textContent=items.length?offMsg:offMsg+' Hakuna picha zilizohifadhiwa kwa utafutaji huu.';draw(items,0);return;
  }
  if(!items.length){st.textContent='Hakuna picha za "'+q+'". Jaribu neno lingine.';return}
  st.textContent='Picha '+items.length+'.'+note;draw(items,0);
  put('q',{id:'img:'+q.toLowerCase(),q,kind:'img',res:items,t:Date.now()});
  if(items.length>=20){
    const b=h('button',{c:'more',type:'button',t:'Picha zaidi',onclick:async()=>{
      b.disabled=true;b.textContent='Inapakia...';off+=24;
      try{const r=(await imgNet(q,off)).filter(y=>!items.some(z=>z.id===y.id));const s0=items.length;items.push(...r);draw(r,s0);
        if(!r.length)b.remove();else{b.disabled=false;b.textContent='Picha zaidi'}}
      catch(e){b.disabled=false;b.textContent='Imeshindikana. Jaribu tena'}}});
    mb.append(b);
  }
  const top=items.slice(0,12);let n=0;
  for(const x of top){try{await saveImg(x,false)}catch(e){}n++;if(tok===rt)st.textContent='Picha '+items.length+'.'+note+' Inahifadhi offline: '+n+'/'+top.length}
  if(tok===rt)st.textContent='Picha '+items.length+'.'+note+' Picha za juu zimehifadhiwa kwa offline.';
}
function route(){
  rt++;const x=decodeURIComponent(location.hash.slice(1)||'');
  if(x.startsWith('s/'))return results(x.slice(2));
  if(x.startsWith('i/'))return images(x.slice(2));
  if(x.startsWith('a/')){const p=x.slice(2).split('/');return reader(p[0],p.slice(1).join('/'))}
  if(x==='hifadhi')return library();
  home();
}
const net=()=>{$('#off').style.display=navigator.onLine?'none':'block'};
addEventListener('online',net);addEventListener('offline',net);net();
addEventListener('hashchange',route);route();
})();
