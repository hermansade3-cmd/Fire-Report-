<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Fire &amp; Incident Investigation</title>
<style>
:root{--bg:#f1f2f4;--c:#fff;--t:#161c24;--m:#667085;--p:#b3202a;--n:#1b2a3a;--b:#d8dce2;--ok:#15803d;--w:#b45309;--a:#e0a100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141a;--c:#18202a;--t:#e8ecf1;--m:#98a2b3;--p:#e5484d;--n:#0a0e13;--b:#2a3440;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--n);color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;border-bottom:4px solid var(--p)}
header b{flex:1;font-size:15px}header button{background:#ffffff22;color:#fff;border:0;border-radius:6px;padding:7px 11px;font:inherit}
main{max-width:820px;margin:0 auto;padding:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:14px;margin-bottom:12px}
h2{margin:6px 0 10px;font-size:18px}h3{margin:16px 0 6px;font-size:15px}
label{display:block;margin:10px 0;font-weight:600;font-size:13px}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);font:inherit;font-weight:400}
.btn{background:var(--p);color:#fff;border:0;border-radius:6px;padding:10px 15px;font:inherit;font-weight:600;cursor:pointer}.btn.g{background:var(--c);color:var(--t);border:1px solid var(--b)}.btn.s{padding:5px 10px;font-size:13px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.sp{flex:1}
.bar{height:6px;background:var(--b);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p);width:0;transition:width .3s}
.chips{display:flex;gap:4px;margin:8px 0;overflow-x:auto}.chips span{flex:1;min-width:26px;text-align:center;font-size:12px;padding:3px 0;border-radius:4px;background:var(--b);color:var(--m)}.chips .on{background:var(--p);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.st{background:var(--c);border:1px solid var(--b);border-left:4px solid var(--p);border-radius:6px;padding:8px 10px}.st b{font-size:24px;display:block}.st span{color:var(--m);font-size:12px}
.ai{border-left:4px solid var(--a);background:var(--bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:14px}.ai small{color:var(--m)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--b);padding:9px 0;flex-wrap:wrap}.row small{color:var(--m)}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;color:#fff;background:var(--m)}.tag.ok{background:var(--ok)}.tag.w{background:var(--w)}
.item{border:1px solid var(--b);border-radius:6px;padding:8px 12px;margin:10px 0}.thumb{max-width:100px;max-height:80px;margin:3px;border-radius:4px}
#rep{background:#fff;color:#000;padding:18px;border-radius:6px}#rep table{width:100%;border-collapse:collapse;margin:6px 0}#rep th,#rep td{border:1px solid #bbb;padding:5px 8px;text-align:left;vertical-align:top}#rep th{width:34%;background:#f0f0f0}#rep h1{color:#b3202a}#rep h2{border-bottom:2px solid #b3202a;color:#1b2a3a;margin-top:20px}
#toast{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:8px 14px;border-radius:20px;display:none;z-index:9}
@media print{header,.no,#toast{display:none!important}body,main{background:#fff;padding:0}}
</style></head><body>
<header><b>🔥 FIRE &amp; INCIDENT INVESTIGATION</b><button data-a="home" id="bh"></button><button data-a="lang">SW/EN</button></header>
<main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang='sw',cur=null,si=0,view='dash',DB=null,timer,mem={},fsig='';
try{lang=localStorage.lang||'sw'}catch(e){}
const T=s=>{const p=s.split('|');return lang=='en'&&p[1]?p[1]:p[0]};
const YN=['y:Ndiyo|Yes','n:Hapana|No','u:Haijulikani|Unknown'];
const TYPES=['fire:Moto|Fire','road:Ajali ya barabarani|Road accident','collapse:Jengo kuporomoka|Structural collapse','explosion:Mlipuko|Explosion','industrial:Ajali ya kiwandani|Industrial accident','natural:Janga la asili|Natural disaster','rescue:Uokoaji|Rescue'];
const IGN=['elec:Umeme|Electrical','mech:Mitambo/joto la kifaa|Mechanical / equipment heat','open:Moto wazi/kupika/sigara|Open flame / cooking / smoking','nat:Asili (radi n.k.)|Natural (lightning etc.)','oth:Nyingine|Other','unk:Haijulikani|Unknown'];
const S=[
{id:'A',n:'Tukio|Incident',f:()=>[['ref','Namba ya uchunguzi|Investigation no.','t'],['inc','Namba ya tukio|Incident no.','t'],['type','Aina ya tukio|Incident type','s',TYPES],['date','Tarehe ya tukio|Incident date','d'],['time','Muda wa tukio|Incident time','tm'],['loc','Eneo|Location','t'],['owner','Mmiliki/mkazi wa eneo|Owner / occupant','t'],['inv','Mchunguzi|Investigator','t'],['unit','Kikosi|Unit','t'],['inv_date','Tarehe ya uchunguzi|Investigation date','d'],['reporter','Nani alitoa taarifa, na liligundulikaje?|Who reported and how was it discovered?','x'],['started','Muda lilipoanza (inavyokadiriwa)|Estimated start time','tm'],['firstArr','Muda kikosi cha kwanza kilifika|First crew arrival','tm'],['cas','Kulikuwa na majeruhi au vifo?|Injuries or deaths?','s',YN]]},
{id:'B',n:'Eneo|Scene',f:()=>[['struct','Muundo wa jengo/eneo na matumizi yake|Structure and occupancy','x'],['wx','Hali ya hewa na upepo|Weather and wind','t'],['vent','Hali ya milango/madirisha ulipofika|Doors/windows state on arrival','t'],['prot','Alarm/sprinkler zilikuwepo na zilifanya kazi?|Alarms/sprinklers present and working?','s',YN],['power','Vyanzo vya umeme/gesi/mafuta|Electrical, gas, fuel sources','x'],['equip','Vifaa vilivyokuwa vinatumika|Equipment in use','x'],['worst','Sehemu yenye uharibifu mkubwa na alama za kuenea (V-pattern, kina cha makaa)|Heaviest damage and fire patterns (V-patterns, char depth)','x'],['safety','Hali ya usalama wa eneo|Scene safety','t']]},
{id:'C',n:'Mashahidi|Witnesses'},{id:'D',n:'Vielelezo|Evidence'},
{id:'E',n:'Asili ya moto|Origin',if:v=>v.type=='fire',f:()=>[['area','Area of Origin|Area of Origin','x'],['point','Point of Origin (ikiwa imethibitishwa)|Point of Origin (if verified)','x'],['firstMat','Item First Ignited|Item First Ignited','t'],['ign','Heat/Ignition Source|Heat/Ignition Source','s',IGN],['factor','Hali iliyowezesha kuwaka|Ignition factor','t'],['path','Jinsi moto ulivyoenea|Fire development and spread','x'],['multi','Maeneo mengi tofauti ya kuanzia?|Multiple separate origins?','s',YN],['accel','Dalili za kichocheo (accelerant)?|Signs of ignitable liquid?','s',YN],['lab','Maabara/mtaalamu amethibitisha?|Lab/expert confirmed?','s',YN]]},
{id:'F',n:'Hypotheses|Hypotheses'},{id:'G',n:'Hitimisho|Conclusion'}];
const WF=[['name','Jina|Name','t'],['contact','Mawasiliano (kwa ridhaa)|Contact (with consent)','t'],['role','Nafasi katika tukio|Role','t'],['where','Alikuwa wapi tukio linaanza?|Where at the start?','t'],['saw','Aliona/alisikia nini?|Saw / heard','x'],['first','Aliona kwanza|Saw first','s',['smoke:Moshi|Smoke','fire:Moto|Fire','u:Hakumbuki|Unsure']],['odd','Jambo lisilo la kawaida?|Anything unusual?','x']];
const EF=[['desc','Kielelezo|Item','t'],['loc','Kilipatikana wapi?|Found where?','t'],['cond','Hali yake|Condition','x'],['photo','Kilipigwa picha mahali pake?|Photographed in place?','s',YN],['by','Aliyekusanya|Collected by','t'],['dt','Tarehe/muda|Date/time collected','t'],['store','Mahali pa kuhifadhi (chain of custody)|Storage (chain of custody)','t'],['lab','Kimepelekwa kwa uchunguzi wa kitaalamu?|Sent for expert analysis?','s',YN]];
const HF=[['name','Hypothesis (chanzo kinachodhaniwa)|Hypothesis (suspected cause)','t'],['cat','Aina|Category','s',['acc:Accidental|Accidental','nat:Natural|Natural','inc:Incendiary (makusudi)|Incendiary (deliberate)']],['sup','Ushahidi unaounga mkono|Supporting evidence','x'],['ag','Ushahidi unaopinga|Contradicting evidence','x'],['test','Imejaribiwa dhidi ya ushahidi wote?|Tested against all evidence?','s',YN],['st','Hali|Status','s',['sup:Inaungwa mkono|Supported','unk:Haijathibitika|Unresolved','ref:Imekanushwa|Refuted']]];
const ELW=/umeme|kompyuta|soketi|nyaya|electric|computer|socket|wire|cable/i;
const R=[
{s:'A',id:'cas',t:'x',q:'Waliojeruhiwa/waliokufa walikuwa wapi tukio linaanza na walipatikana katika hali gani?|Where were the injured/deceased when it began and how were they found?',test:v=>v.cas=='y'},
{s:'B',id:'plug',t:'s',o:YN,q:'Je, vifaa vya umeme vilikuwa vimeunganishwa wakati tukio linaanza?|Was the electrical equipment connected when it began?',test:v=>ELW.test((v.power||'')+(v.equip||''))},
{s:'B',id:'sock',t:'s',o:YN,q:'Je, kulikuwa na soketi au nyaya zilizoharibika?|Were sockets or wiring damaged?',test:v=>v.fu_plug},
{s:'B',id:'tech',t:'s',o:YN,q:'Je, kuna ushahidi wa kitaalamu kuwa hitilafu hiyo ilianzisha moto?|Is there expert evidence the fault started the fire?',test:v=>v.fu_sock=='y'},
{s:'E',id:'pt',t:'x',q:'Ni ushahidi gani unakosekana ili kuthibitisha Point of Origin?|What evidence is missing to verify the Point of Origin?',test:v=>v.area&&!v.point},
{s:'E',id:'alt',t:'x',q:'Vyanzo mbadala gani vilichunguzwa na kuondolewa, kwa ushahidi gani?|Which alternative sources were examined and excluded, and how?',test:v=>v.ign&&v.ign!='unk'},
{s:'E',id:'ie',t:'x',q:'Ni ushahidi gani wa kimwili unaothibitisha kichocheo?|What physical evidence supports the ignitable liquid indication?',test:v=>v.accel=='y'}];
const FD={};S.forEach(s=>s.f&&s.f({type:'fire'}).forEach(f=>FD[f[0]]=f));[WF,EF,HF].forEach(a=>a.forEach(f=>FD[f[0]]=f));R.forEach(r=>FD['fu_'+r.id]=['fu_'+r.id,r.q,r.t,r.o]);
const ov=(k,v)=>{const f=FD[k];if(!f||f[2]!='s')return v||'';const o=(f[3]||[]).find(x=>x.split(':')[0]==v);return o?T(o.slice(o.indexOf(':')+1)):v||''};
const stp=()=>S.filter(s=>!s.if||s.if(cur.v)),fus=sid=>R.filter(r=>r.s==sid&&r.test(cur.v));
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('fii',1);r.onupgradeneeded=()=>r.result.createObjectStore('inv',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}});
const tx=(m,f)=>new Promise(res=>{try{const r=f(DB.transaction('inv',m).objectStore('inv'));r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const all=()=>DB?tx('readonly',q=>q.getAll()):Promise.resolve(Object.values(mem)),put=o=>DB?tx('readwrite',q=>q.put(o)):Promise.resolve(mem[o.id]=o),del=id=>DB?tx('readwrite',q=>q.delete(id)):Promise.resolve(delete mem[id]);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',1800)};
const sv=()=>{cur.upd=Date.now();put(cur);const e=$('#sv');if(e)e.textContent=T('✓ Imehifadhiwa|✓ Saved')};
const log=w=>(cur.log=cur.log||[]).push({t:new Date().toLocaleString(),w});
// ---- engine: scientific-method (NFPA 921 style) ----
const CL={ACCIDENTAL:'Accidental: chanzo kimethibitishwa, hypotheses nyingine zimekanushwa.|Accidental: cause supported; all other hypotheses refuted.',NATURAL:'Natural: chanzo cha asili kimethibitishwa.|Natural: natural cause supported.',INCENDIARY:'Incendiary: moto wa makusudi unaungwa mkono na ushahidi wa kimwili/kitaalamu.|Incendiary: deliberate ignition supported by physical/expert evidence.',UNDETERMINED:'Undetermined: hypotheses zaidi ya moja zinabaki, au hakuna iliyothibitishwa.|Undetermined: more than one hypothesis remains, or none is proven.',INCONCLUSIVE:'Inconclusive: taarifa/ushahidi hautoshi kufikia hitimisho.|Inconclusive: data/evidence insufficient for any conclusion.'};
const NOTE='Mfumo unafuata mbinu ya kisayansi (data → hypotheses → majaribio). Haitumii AI API wala haichambui picha. Cause haichaguliwi kwa kuondoa tu (negative corpus): kila hypothesis inayokubaliwa inahitaji ushahidi chanya. Si hukumu ya kisheria; uamuzi ni wa mchunguzi mwenye mamlaka.|Uses the scientific method (data → hypotheses → testing). No AI API; images are not analysed. A cause is never accepted by elimination alone (negative corpus): an accepted hypothesis needs positive evidence. Not a legal verdict; the authorised investigator decides.';
function an(i){const v=i.v,W=i.w||[],E=i.e||[],H=(i.h||[]).filter(h=>h.name),fire=v.type=='fire',con=[],miss=[],mn=t=>t?+t.slice(0,2)*60+ +t.slice(3,5):null;
if(v.started&&v.firstArr&&mn(v.firstArr)<mn(v.started))con.push('Kikosi cha kwanza kimerekodiwa kufika kabla tukio kuanza.|First crew arrival is before the recorded start time.');
if(v.date&&v.inv_date&&v.inv_date<v.date)con.push('Tarehe ya uchunguzi ni kabla ya tukio.|Investigation date precedes the incident.');
if([...new Set(W.map(w=>w.first).filter(x=>x&&x!='u'))].length>1)con.push('Mashahidi wanatofautiana kuhusu kilichoonekana kwanza.|Witnesses disagree on what was seen first.');
if(fire&&v.ign=='elec'&&v.fu_plug=='n')con.push('Chanzo cha umeme kimetajwa ilhali kifaa hakikuunganishwa.|Electrical source named but equipment was not connected.');
if(fire&&H.some(h=>h.cat=='acc'&&h.st=='sup')&&v.accel=='y'&&!v.fu_ie)con.push('Accidental inaungwa mkono ilhali kuna dalili za kichocheo zisizoelezwa.|Accidental supported while ignitable-liquid indicators are unexplained.');
if(!W.length)miss.push('Hakuna shahidi.|No witness recorded.');if(!E.length)miss.push('Hakuna kielelezo.|No physical evidence.');
if(E.some(e=>!e.by||!e.dt||!e.store))miss.push('Chain of custody haijakamilika kwa baadhi ya vielelezo.|Chain of custody incomplete for some evidence.');
if(E.some(e=>e.photo=='n'))miss.push('Baadhi ya vielelezo havikupigwa picha mahali pake.|Some evidence not photographed in place.');
if(!v.started||!v.firstArr)miss.push('Muda wa kuanza/kufika kikosi haujakamilika.|Start/arrival times incomplete.');
if(fire&&!v.area)miss.push('Area of Origin haijajazwa.|Area of Origin missing.');if(fire&&v.area&&!v.point)miss.push('Point of Origin haijathibitishwa.|Point of Origin not verified.');
if(!H.length)miss.push('Hakuna hypothesis iliyowekwa.|No hypothesis entered.');if(H.some(h=>h.test!='y'&&h.st!='ref'))miss.push('Baadhi ya hypotheses hazijajaribiwa dhidi ya ushahidi wote.|Some hypotheses not tested against all evidence.');
const viable=H.filter(h=>h.st!='ref'),conf=H.filter(h=>h.st=='sup'&&h.test=='y'&&(h.sup||'').trim()&&!(h.ag||'').trim());
let cls='UNDETERMINED';
if(!H.length||!E.length||!W.length&&!(v.cause))cls='INCONCLUSIVE';
else if(conf.length==1&&viable.length==1){const h=conf[0];
if(h.cat=='acc')cls='ACCIDENTAL';else if(h.cat=='nat')cls='NATURAL';
else if(h.cat=='inc'&&fire&&(v.lab=='y'||v.multi=='y')&&E.length&&!con.length)cls='INCENDIARY'}
if(conf.length==1&&viable.length>1)miss.push('Hypothesis iliyothibitishwa ina washindani ambao hawajakanushwa.|The supported hypothesis has rivals not yet refuted.');
return{cls,con,miss,H,rate:H.length?Math.round(H.filter(h=>h.test=='y').length/H.length*100):0}}
// ---- UI ----
function fld(f,val,a){const[k,l,t,o]=f;let c;val=val??'';
if(t=='x')c=`<textarea ${a} data-k="${k}" rows="3">${esc(val)}</textarea>`;
else if(t=='s')c=`<select ${a} data-k="${k}"><option value="">—</option>${o.map(x=>{const j=x.indexOf(':'),v=x.slice(0,j);return`<option value="${v}" ${v==val?'selected':''}>${esc(T(x.slice(j+1)))}</option>`}).join('')}</select>`;
else c=`<input ${a} data-k="${k}" type="${{t:'text',d:'date',tm:'time'}[t]}" value="${esc(val)}">`;
return`<label>${esc(T(l))}${c}</label>`}
const LI={C:['w',WF,'Shahidi|Witness'],D:['e',EF,'Kielelezo|Evidence'],F:['h',HF,'Hypothesis|Hypothesis']};
function lst(id){const[k,F,fn]=LI[id];return(id=='F'?`<div class="ai"><small>${T('Weka kila chanzo kinachowezekana. Kila moja ijaribiwe dhidi ya ushahidi; kanusha zisizo sahihi.|List every plausible cause. Test each against the evidence and refute those that fail.')}</small></div>`:'')+cur[k].map((x,n)=>`<div class="item"><b>${T(fn)} ${n+1}</b><button class="btn g s" style="float:right" data-a="rm" data-l="${k}" data-i="${n}">✕</button>${F.map(f=>fld(f,x[f[0]],`data-l="${k}" data-i="${n}"`)).join('')}${k=='e'?`<label>${T('Pakia picha/video/nyaraka|Upload photos/video/documents')}<input type="file" multiple accept="image/*,video/*,.pdf" data-up="${n}"></label>${(x.f||[]).map(f=>f.ty.startsWith('image')?`<img class="thumb" src="${f.u}">`:`<span class="tag">${esc(f.n)}</span>`).join('')}`:''}</div>`).join('')+`<button class="btn g" data-a="add" data-l="${k}">+ ${T(fn)}</button>`}
function anHtml(r){const L=a=>a.length?'<ul>'+a.map(x=>`<li>${esc(T(x))}</li>`).join('')+'</ul>':`<p>${T('Hakuna.|None.')}</p>`;
return`<h3>${T('Matrix ya hypotheses|Hypothesis matrix')}</h3>${r.H.length?`<table style="width:100%;border-collapse:collapse;font-size:13px">${r.H.map(h=>`<tr><td style="border:1px solid #9994;padding:4px"><b>${esc(h.name)}</b> (${ov('cat',h.cat)})</td><td style="border:1px solid #9994;padding:4px">${ov('st',h.st)||'—'} · ${T('Jaribio|Tested')}: ${ov('test',h.test)||'—'}</td></tr>`).join('')}</table>`:'<p>—</p>'}<h3>${T('Taarifa zinazokinzana|Contradictions')}</h3>${L(r.con)}<h3>${T('Kinachokosekana|Gaps')}</h3>${L(r.miss)}<h3>${T('Uainishaji wa chanzo|Cause classification')}: <span class="tag ${r.cls=='UNDETERMINED'||r.cls=='INCONCLUSIVE'?'w':'ok'}">${r.cls}</span></h3><p>${T(CL[r.cls])}</p>`}
function pct(){const v=cur.v;let t=0,d=0;stp().forEach(s=>{if(s.f){s.f(v).forEach(f=>{t++;if(v[f[0]])d++});fus(s.id).forEach(r=>{t++;if(v['fu_'+r.id])d++})}else if(LI[s.id]){t++;if(cur[LI[s.id][0]].length)d++}});return t?Math.round(d/t*100):0}
function wiz(){const st=stp();si=Math.min(si,st.length-1);const s=st[si];
let h=`<div class="card"><div class="bar"><i id="pb"></i></div><div class="chips">${st.map((x,n)=>`<span class="${n==si?'on':''}">${x.id}</span>`).join('')}</div><small id="pt"></small> <small id="sv"></small><h2>${T(s.n)}</h2>`;
if(LI[s.id])h+=lst(s.id);else if(s.id=='G'){const r=an(cur);h+=`<div class="ai"><small>${T(NOTE)}</small></div>${anHtml(r)}<label>${T('Hitimisho la mchunguzi|Investigator conclusion')}<textarea data-k="concl" rows="4">${esc(cur.v.concl||'')}</textarea></label><label>${T('Mapendekezo (kuzuia, usalama)|Recommendations (prevention, safety)')}<textarea data-k="recom" rows="3">${esc(cur.v.recom||'')}</textarea></label>`}
else h+=s.f(cur.v).map(f=>fld(f,cur.v[f[0]],'')).join('')+'<div id="fu"></div>';
h+=`<div class="nav">${si?`<button class="btn g" data-a="prev">← ${T('Rudi|Previous')}</button>`:''}<button class="btn g" data-a="save">${T('Hifadhi|Save')}</button><span class="sp"></span>${si<st.length-1?`<button class="btn" data-a="next">${T('Endelea|Next')} →</button>`:`<button class="btn" data-a="submit">${T('Wasilisha|Submit')}</button>`}</div></div>`;
$('#app').innerHTML=h;fu(true);upd()}
function fu(f){const e=$('#fu');if(!e)return;const a=fus(stp()[si].id),sig=a.map(r=>r.id).join();if(!f&&sig==fsig)return;fsig=sig;
e.innerHTML=a.length?`<div class="ai"><b>🤖 ${T('Maswali ya ziada|Follow-up questions')}</b>${a.map(r=>fld(['fu_'+r.id,r.q,r.t,r.o],cur.v['fu_'+r.id],'')).join('')}</div>`:''}
function upd(){if(view!='wiz')return;const p=pct();$('#pb').style.width=p+'%';$('#pt').textContent=T('Maendeleo|Progress')+': '+p+'%';fu(false)}
async function dash(){view='dash';const A=await all(),q=($('#q')||{}).value||'';A.sort((a,b)=>b.upd-a.upd);const c=f=>A.filter(f).length;
const L=A.filter(i=>JSON.stringify(i.v).toLowerCase().includes(q.toLowerCase()));
$('#app').innerHTML=`<div class="grid"><div class="st"><b>${A.length}</b><span>${T('Jumla|Total')}</span></div><div class="st"><b>${c(i=>i.st!='done')}</b><span>${T('Zinasubiri|Pending')}</span></div><div class="st"><b>${c(i=>i.st=='done')}</b><span>${T('Zimekamilika|Completed')}</span></div><div class="st"><b>${c(i=>i.v.type=='fire')}</b><span>${T('Moto|Fire')}</span></div></div>
<div class="card" style="margin-top:12px"><div class="nav" style="margin:0 0 8px"><button class="btn" data-a="new">+ ${T('Uchunguzi mpya|New investigation')}</button><button class="btn g" data-a="exp">${T('Nakala ya akiba|Backup')}</button></div><input id="q" placeholder="${T('Tafuta...|Search...')}" value="${esc(q)}">
${L.length?L.map(i=>`<div class="row"><div><b>${esc(i.v.ref||'—')}</b> <span class="tag ${i.st=='done'?'ok':'w'}">${i.st=='done'?T('Imekamilika|Completed'):T('Inasubiri|Pending')}</span><br><small>${ov('type',i.v.type)} · ${esc(i.v.loc||'')} · ${esc(i.v.date||'')}</small></div><div><button class="btn g s" data-a="open" data-id="${i.id}">${i.st=='done'?T('Fungua|Open'):T('Endelea|Continue')}</button> ${i.st=='done'?`<button class="btn s" data-a="rep" data-id="${i.id}">${T('Ripoti|Report')}</button> `:''}<button class="btn g s" data-a="del" data-id="${i.id}">🗑</button></div></div>`).join(''):`<p>${T('Bado hakuna uchunguzi. Anza mpya.|No investigations yet. Start a new one.')}</p>`}</div>`;
$('#bh').textContent=T('Mwanzo|Home')}
function rep(i){const v=i.v,r=an(i),tr=(a,b)=>`<tr><th>${esc(T(a))}</th><td>${esc(b)||'—'}</td></tr>`,tb=a=>`<table>${a.join('')}</table>`,fr=(F,x)=>tb(F.map(f=>tr(f[1],ov(f[0],x[f[0]]))));
const fa=R.filter(x=>x.test(v)&&v['fu_'+x.id]).map(x=>tr(x.q,ov('fu_'+x.id,v['fu_'+x.id])));
const rec=[v.recom||'',...r.miss.map(m=>T(m)),T('Pata uchunguzi wa kitaalamu kabla ya hitimisho la mwisho.|Obtain expert examination before any final conclusion.')].filter(Boolean).join('\n');
return`<h1>${T('RIPOTI YA UCHUNGUZI WA TUKIO|INCIDENT INVESTIGATION REPORT')}</h1><p><b>${T('Jeshi la Zimamoto na Uokoaji Tanzania|Tanzania Fire and Rescue Force')}</b><br>${T('Rejea|Ref')}: ${esc(v.ref)} · ${T('Mchunguzi|Investigator')}: ${esc(v.inv)} · ${esc(v.inv_date)}</p>
<h2>1. ${T('Taarifa za Tukio|Incident Particulars')}</h2>${fr(S[0].f(),v)}<h2>2. ${T('Mbinu|Methodology')}</h2><p>${T(NOTE)}</p>
<h2>3. ${T('Ukaguzi wa Eneo|Scene Examination')}</h2>${fr(S[1].f(),v)}${fa.length?tb(fa):''}
${v.type=='fire'?`<h2>4. ${T('Asili ya Moto|Origin Analysis')}</h2>${fr(S[4].f(),v)}`:''}
<h2>5. ${T('Mashahidi|Witness Statements')}</h2>${i.w.map((w,n)=>`<h3>${n+1}. ${esc(w.name)}</h3>${fr(WF.slice(1),w)}`).join('')||'<p>—</p>'}
<h2>6. ${T('Vielelezo na Chain of Custody|Evidence and Chain of Custody')}</h2>${i.e.map((e,n)=>`<h3>${n+1}. ${esc(e.desc)}</h3>${fr(EF.slice(1),e)}${(e.f||[]).filter(f=>f.ty.startsWith('image')).map(f=>`<img src="${f.u}" style="max-width:220px;margin:3px">`).join('')}`).join('')||'<p>—</p>'}
<h2>7. ${T('Uchambuzi wa Hypotheses|Hypothesis Analysis')}</h2>${i.h.map((h,n)=>`<h3>${n+1}. ${esc(h.name)}</h3>${fr(HF.slice(1),h)}`).join('')}${anHtml(r)}
<h2>8. ${T('Hitimisho|Conclusion')}</h2><p><b>${r.cls}</b> — ${T(CL[r.cls])}</p><p>${esc(v.concl)}</p><h2>9. ${T('Mapendekezo|Recommendations')}</h2><p style="white-space:pre-line">${esc(rec)}</p>
<h2>10. ${T('Mchunguzi na Saini|Investigator and Signature')}</h2>${tb([tr('Jina|Name',v.inv),tr('Kikosi|Unit',v.unit)])}<p><br>${T('Saini|Signature')}: ____________________ ${T('Tarehe|Date')}: __________</p>
<h2>${T('Kumbukumbu ya mabadiliko|Change log')}</h2><ul>${(i.log||[]).map(l=>`<li>${esc(l.t)} — ${esc(T(l.w))}</li>`).join('')}</ul>`}
function repView(){view='rep';$('#app').innerHTML=`<div class="nav no" style="margin:0 0 10px"><button class="btn g" data-a="open" data-id="${cur.id}">← ${T('Rudi|Back')}</button><button class="btn" data-a="pdf">PDF / Print</button><button class="btn" data-a="doc">Word</button><button class="btn g" data-a="saverep">${T('Hifadhi mabadiliko|Save edits')}</button><button class="btn g" data-a="regen">${T('Zalisha upya|Regenerate')}</button></div><small class="no">${T('Unaweza kuhariri ripoti hapa chini. PDF: chagua "Save as PDF".|You can edit the report below. PDF: choose "Save as PDF".')}</small><div id="rep" contenteditable="true">${cur.rhtml||rep(cur)}</div>`;$('#bh').textContent=T('Mwanzo|Home')}
const A$={
home(){if(cur&&view=='wiz')sv();cur=null;dash()},
lang(){lang=lang=='sw'?'en':'sw';try{localStorage.lang=lang}catch(e){};cur?(view=='rep'?repView():wiz()):dash()},
async new(){const n=(await all()).length+1;cur={id:Date.now()+'',v:{ref:'INV-'+new Date().getFullYear()+'-'+String(n).padStart(4,'0'),inv_date:new Date().toISOString().slice(0,10),type:'fire'},w:[],e:[],h:[],st:'draft',upd:Date.now(),log:[{t:new Date().toLocaleString(),w:'Uchunguzi umeanzishwa|Investigation created'}]};await put(cur);si=0;view='wiz';wiz()},
async open(b){cur=(await all()).find(x=>x.id==b.dataset.id);cur.h=cur.h||[];si=0;view='wiz';wiz()},
async rep(b){cur=(await all()).find(x=>x.id==b.dataset.id);cur.h=cur.h||[];repView()},
async del(b){if(confirm(T('Futa uchunguzi huu?|Delete this investigation?'))){await del(b.dataset.id);dash()}},
next(){sv();si++;wiz();scrollTo(0,0)},prev(){sv();si--;wiz();scrollTo(0,0)},save(){sv();toast(T('Imehifadhiwa|Saved'))},
add(b){cur[b.dataset.l].push({});sv();wiz()},rm(b){if(confirm(T('Ondoa?|Remove?'))){cur[b.dataset.l].splice(+b.dataset.i,1);sv();wiz()}},
submit(){const r=an(cur);if(!cur.v.inv&&!confirm(T('Jina la mchunguzi halijajazwa. Wasilisha?|Investigator name is empty. Submit?')))return;cur.st='done';cur.rhtml='';log('Imewasilishwa|Submitted ('+r.cls+')');sv();repView()},
pdf(){window.print()},
doc(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff<html><head><meta charset="utf-8"><style>table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:4px;text-align:left}</style></head><body>'+$('#rep').innerHTML+'</body></html>'],{type:'application/msword'}));a.download=(cur.v.ref||'report')+'.doc';a.click()},
saverep(){cur.rhtml=$('#rep').innerHTML;log('Ripoti imehaririwa|Report edited');sv();toast(T('Imehifadhiwa|Saved'))},
regen(){if(confirm(T('Futa mabadiliko ya mkono?|Discard manual edits?'))){cur.rhtml='';log('Ripoti imezalishwa upya|Report regenerated');sv();repView()}},
async exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(await all())],{type:'application/json'}));a.download='investigations-backup.json';a.click()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A$[b.dataset.a]?.(b)});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q')return dash();const k=t.dataset.k;if(!k||!cur)return;const l=t.dataset.l;if(l)cur[l][+t.dataset.i][k]=t.value;else cur.v[k]=t.value;clearTimeout(timer);timer=setTimeout(sv,500);upd()});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.up===undefined)return;const x=cur.e[+t.dataset.up];x.f=x.f||[];
for(const f of t.files){const o=await new Promise(r=>{if(!f.type.startsWith('image/')){if(f.size>8e6){toast(T('Faili >8MB|File >8MB'));return r(null)}const fr=new FileReader;fr.onload=()=>r({n:f.name,ty:f.type||'file',u:fr.result});fr.readAsDataURL(f);return}const im=new Image;im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r({n:f.name,ty:'image/jpeg',u:c.toDataURL('image/jpeg',.75)})};im.onerror=()=>r(null);im.src=URL.createObjectURL(f)});if(o)x.f.push(o)}sv();wiz()});
(async()=>{try{DB=await idb()}catch(e){DB=null}if(!DB)toast(T('IndexedDB haipatikani: data ya kikao hiki tu|IndexedDB unavailable: session-only data'));dash()})();
</script></body></html>
