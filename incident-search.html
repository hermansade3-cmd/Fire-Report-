/* Hifadhi ya offline (IndexedDB) */
const DB=new Promise(res=>{try{const r=indexedDB.open("rsearch",1);r.onupgradeneeded=()=>r.result.createObjectStore("c",{keyPath:"k"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
async function dbop(w,f){const d=await DB;if(!d)return null;return new Promise(r=>{try{const t=d.transaction("c",w?"readwrite":"readonly"),q=f(t.objectStore("c"));t.oncomplete=()=>r(q&&q.result!==undefined?q.result:null);t.onerror=t.onabort=()=>r(null)}catch(e){r(null)}})}
const dbput=o=>dbop(1,s=>s.put(o)),dbget=k=>dbop(0,s=>s.get(k)),dbdel=k=>dbop(1,s=>s.delete(k)),dball=()=>dbop(0,s=>s.getAll()).then(x=>x||[]);

 await dbput(rec);
 await Promise.all(rec.imgs.slice(0,12).map(async x=>{try{const r=await fetch(x.u);if(r.ok)x.b=await r.blob()}catch(e){}}));
 await dbput(rec)}
