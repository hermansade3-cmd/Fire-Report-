// ZIP (bila ukandamizaji) kwa kuhifadhi picha nyingi
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return(~c)>>>0};
function zip(files){const E=new TextEncoder(),parts=[],cd=[];let off=0;
files.forEach(f=>{const nm=E.encode(f.n),cr=crc(f.d),sz=f.d.length,h=new DataView(new ArrayBuffer(30));
h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,cr,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
parts.push(new Uint8Array(h.buffer),nm,f.d);
const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,cr,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+sz});
const cl=cd.reduce((s,x)=>s+x.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/zip'})}

ua mapema kisha kutafuta ushahidi wa kuunga tu.'],['Sampuli za ILR (vimiminika vinavyowaka) zihifadhiwe wapi?',['Mfuko wa kawaida wa plastiki','Kontena safi lisilopitisha hewa (mfano kopo la chuma)','Karatasi'],1,'Kontena safi lililofungwa huzuia mvuke kupotea na uchafuzi.'],['Kabla ya kusogeza kielelezo unafanya nini?',['Kukipiga picha mahali kilipo','Kukisafisha','Kumpa mmiliki'],0,'Piga picha mahali pake na andika kipimo na eneo kabla ya kukigusa.']];
function qzA(i,j,el){const ok=QZ[i][2]==j;el.classList.add(ok?'ok':'bad');const d=el.parentNode;[...d.querySelectorAll('button')].forEach((b,k)=>{b.disabled=true;if(k==QZ[i][2])b.classList.add('ok')});d.dataset.r=ok?1:0;const x=document.createElement('div');x.className='qx';x.textContent=(ok?'✔ Sahihi. ':'✘ Si sahihi. ')+QZ[i][3];d.appendChild(x);const all=[...document.querySelectorAll('.qz')],dn=all.filter(z=>z.dataset.r!==undefined);const sc=document.getElementById('qsc');if(sc)sc.textContent='Alama: '+dn.filter(z=>z.dataset.r==1).length+'/'+QZ.length+' ('+dn.length+' zimejibiwa)';if(dn.length==all.length)toast('Alama zako: '+dn.filter(z=>z.dataset.r==1).length+'/'+QZ.length)}

['A','Misingi ya uchunguzi','🧭',[

['🎯','Kubaini area of origin','<p>Changanya vyanzo vya data, usitegemee kimoja:</p>'+O(['Patterns za kimwili (V, char, clean burn)','Ushuhuda wa mashahidi na muda','Mienendo ya moto na uingizaji hewa','Rekodi: kamera, alarm, simu 114/112','Uchambuzi wa umeme (arc mapping) pale inapofaa'])+K('Eneo la asili lisipobainika, chanzo hakiwezi kuthibitishwa kwa uhakika.'),4],

['🔋','Kuchunguza betri, vifaa na magari',U(['Tambua kifaa kilichokuwa kinachaji au kikitumika karibu na asili','Piga picha kabla ya kuhamisha; kifungashe tofauti na vielelezo vingine','Gari: kagua eneo la injini, mfumo wa umeme na mafuta; uliza historia ya matengenezo','Peleka kifaa chenye shaka kwa mtaalamu wa maabara'])+W('Betri za lithiamu zinaweza kuwaka tena baada ya kuzimwa; zishughulikie kwa tahadhari.'),3],
