<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mazungumzo — Rescue Report</title>
<meta name="theme-color" content="#075e54">
<style>
:root{--bg:#f0f2f5;--card:#fff;--text:#111b21;--muted:#667781;--line:#e9edef;--head:#075e54;--accent:#25d366;--send:#00a884;--field:#fff;--me:#d9fdd3;--them:#fff;--wall:#efeae2;--err:#c53030;--sh:0 1px 1px rgba(11,20,26,.13)}
:root[data-theme=dark]{--bg:#0b141a;--card:#111b21;--text:#e9edef;--muted:#8696a0;--line:#222d34;--head:#202c33;--accent:#00a884;--send:#00a884;--field:#2a3942;--me:#005c4b;--them:#202c33;--wall:#0b141a;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font:16px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header.top{flex:none;background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;display:flex;align-items:center;gap:6px;z-index:5}
header .ib{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:20px;cursor:pointer;flex:none}
header .ib:active{background:rgba(255,255,255,.16)}
#top-av{width:38px;height:38px;border-radius:50%;background:#6b7c85;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
#top-av img{width:100%;height:100%;object-fit:cover}
.hd{flex:1;min-width:0}.hd h1{margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .sub{font-size:12px;opacity:.8;min-height:14px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:600px;margin:0 auto;padding:8px 0 24px}
.search-bar{display:flex;gap:8px;margin:6px 12px 10px}
.search-bar input{flex:1;padding:11px 16px;border-radius:24px;border:0;background:var(--field);color:var(--text);font:inherit;outline:none;box-shadow:var(--sh);min-width:0}
.search-bar button{border:0;border-radius:24px;padding:0 14px;background:var(--send);color:#fff;font-weight:700;cursor:pointer}
.sec{font-size:13px;font-weight:600;color:var(--send);margin:12px 16px 4px}
.chat-item{display:flex;align-items:center;gap:13px;padding:10px 16px;cursor:pointer;background:var(--card);border-bottom:1px solid var(--line)}
.chat-item:active{background:var(--bg)}
.av{width:49px;height:49px;border-radius:50%;background:#6b7c85;color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.cm{flex:1;min-width:0}.cm .n{font-weight:600}.cm .m{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{text-align:right;font-size:12px;color:var(--muted)}.ct.u{color:var(--accent)}
.badge{background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:11px;min-width:21px;height:21px;padding:0 6px;display:inline-grid;place-items:center;margin-top:4px}
.kebab{border:0;background:transparent;color:var(--muted);font-size:20px;width:32px;height:36px;cursor:pointer;flex:none}
.note{color:var(--muted);font-size:14px;text-align:center;padding:30px 14px}
/* dashboard */
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 12px 10px}
.tile{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:var(--sh);cursor:pointer;border:0;color:var(--text);font:inherit}
.tile b{display:block;font-size:20px;color:var(--send)}.tile span{font-size:11.5px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:18px;padding:7px 13px;background:var(--card);color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.chip.on{background:var(--send);color:#fff}
/* bottom nav */
nav.bottom{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.bottom button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px 0 6px;font:inherit;font-size:11.5px;cursor:pointer;position:relative}
nav.bottom button i{display:block;font-style:normal;font-size:21px;line-height:1.2}
nav.bottom button.on{color:var(--send);font-weight:700}
nav.bottom .nb{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}
/* chat */
#chat-view{display:flex;flex-direction:column;height:100%}
.messages{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:2px;background-color:var(--wall);background-image:radial-gradient(rgba(128,128,128,.10) 1.2px,transparent 1.2px);background-size:22px 22px}
.day{align-self:center;background:var(--card);color:var(--muted);font-size:12px;padding:4px 11px;border-radius:8px;margin:8px 0;box-shadow:var(--sh)}
.bubble{max-width:82%;padding:6px 8px 5px 9px;border-radius:9px;font-size:15px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;box-shadow:var(--sh);position:relative;margin-top:2px}
.bubble.me{align-self:flex-end;background:var(--me);border-top-right-radius:2px}
.bubble.them{align-self:flex-start;background:var(--them);border-top-left-radius:2px}
.bubble.hl{outline:2px solid var(--accent)}
.meta{display:block;text-align:right;font-size:11px;color:var(--muted);margin:1px 0 0 14px;float:right;line-height:1.6;white-space:nowrap}
.bubble.me .meta{color:rgba(17,27,33,.55)}:root[data-theme=dark] .bubble.me .meta{color:rgba(233,237,239,.65)}
.tk.rd{color:#34b7f1}
.dd{position:absolute;top:1px;right:4px;font-size:12px;color:var(--muted);cursor:pointer;opacity:.7;padding:0 3px}
.bubble.pending{opacity:.75}.bubble.fail{outline:1.5px solid var(--err)}
.rep{white-space:normal;border-left:3px solid var(--send);background:rgba(128,128,128,.15);border-radius:6px;padding:3px 7px;margin-bottom:4px;font-size:13px;color:var(--muted);cursor:pointer}
.rep b{display:block;color:var(--send);font-size:12px}
.fwd{font-size:11.5px;color:var(--muted);font-style:italic;white-space:normal}
.rx{white-space:normal;display:inline-flex;gap:3px;background:var(--card);border-radius:12px;padding:1px 6px;font-size:13px;box-shadow:var(--sh);margin-top:3px;cursor:pointer}
.bubble img.pic,.bubble video{max-width:100%;border-radius:7px;display:block;max-height:300px}
.bubble audio{max-width:100%;height:38px}
.doc{white-space:normal;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}.doc i{font-style:normal;font-size:26px}
.loc{white-space:normal;color:var(--text);text-decoration:none;display:block}.loc b{color:var(--send)}
.edited{font-size:10.5px;color:var(--muted);margin-right:4px}
.card{white-space:normal;min-width:220px}.card .k{font-size:11px;font-weight:700;color:var(--send);text-transform:uppercase;letter-spacing:.04em}
.card .t{font-weight:700;margin:2px 0 4px}.card .r{font-size:13.5px;display:flex;gap:6px}.card .r b{color:var(--muted);font-weight:500;flex:none}
.card .more{display:block;margin-top:6px;padding-top:6px;border-top:1px solid rgba(128,128,128,.25);color:var(--send);font-weight:600;font-size:14px;text-align:center;cursor:pointer}
.composer{flex:none;background:var(--wall);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
.cin{display:flex;gap:6px;align-items:flex-end}
.replybar{display:flex;align-items:center;gap:8px;background:var(--field);border-left:4px solid var(--send);border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.replybar div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.replybar button{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
.box{flex:1;display:flex;align-items:flex-end;background:var(--field);border-radius:24px;padding:2px 4px 2px 6px;box-shadow:var(--sh)}
.box textarea{flex:1;resize:none;border:0;background:transparent;color:var(--text);font:inherit;padding:10px 6px;max-height:120px;min-height:42px;outline:none}
.ico{width:40px;height:42px;border:0;background:transparent;font-size:21px;cursor:pointer;color:var(--muted);flex:none}
.sendb{width:46px;height:46px;border-radius:50%;border:0;background:var(--send);color:#fff;font-size:19px;cursor:pointer;flex:none;display:grid;place-items:center}
.sendb.rec{background:var(--err);animation:pl 1s infinite}@keyframes pl{50%{opacity:.6}}
.blockbar{text-align:center;padding:12px;color:var(--muted);font-size:14px}
.blockbar button{border:0;background:var(--send);color:#fff;border-radius:16px;padding:7px 16px;font-weight:700;margin-left:6px;cursor:pointer}
/* sheets */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.bd.mid{align-items:center}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);max-height:86vh;overflow-y:auto}
.sheet h3{margin:0 0 10px;font-size:17px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:0;border-radius:18px;padding:9px;background:var(--bg);color:var(--muted);font:inherit;font-weight:600;cursor:pointer}.tabs button.on{background:var(--send);color:#fff}
.sheet input.f,.sheet select.f,.sheet textarea.f{width:100%;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--field);color:var(--text);font:inherit;margin-bottom:10px;outline:none}
.sheet textarea.f{border-radius:14px;resize:vertical}
.si{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin-bottom:7px;cursor:pointer;width:100%;font:inherit;color:var(--text);text-align:left}
.si .ic{width:38px;height:38px;border-radius:50%;background:var(--send);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.si .tt{flex:1;min-width:0}.si .a{font-weight:600;font-size:15px}.si .b{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si.danger .a{color:var(--err)}
.dr{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}.dr b{width:38%;color:var(--muted);font-weight:500;flex:none}.dr span{flex:1;word-break:break-word}
.row2{display:flex;gap:8px;margin-top:12px}.row2 button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer;background:var(--bg);color:var(--text)}.row2 .p{background:var(--send);color:#fff}
.emo{display:flex;justify-content:space-around;background:var(--bg);border-radius:24px;padding:6px;margin-bottom:10px}.emo button{border:0;background:transparent;font-size:26px;cursor:pointer;padding:2px 6px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
.sw input{width:22px;height:22px;accent-color:var(--send)}
.pin{font-size:28px;letter-spacing:10px;text-align:center}
.chk{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}.chk input{width:20px;height:20px;accent-color:var(--send)}
#lock{position:fixed;inset:0;background:var(--head);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;padding:20px}
#lock input{width:200px;padding:12px;border-radius:14px;border:0;font-size:28px;text-align:center;letter-spacing:10px}
#lock button{border:0;border-radius:20px;padding:11px 30px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}
.pf{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px}.pf .av{width:84px;height:84px;font-size:34px}
.story{width:62px;text-align:center;font-size:12px;flex:none;cursor:pointer}.story .av{width:58px;height:58px;border:3px solid var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:#233138;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
#toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <button id="back" class="ib" type="button" aria-label="Rudi" hidden>&#8592;</button>
  <div id="top-av" hidden></div>
  <div class="hd"><h1 id="top-title">Mazungumzo</h1><div class="sub" id="top-sub"></div></div>
  <button id="search-btn" class="ib" type="button" aria-label="Tafuta">🔍</button>
  <button id="new-btn" class="ib" type="button" aria-label="Mpya">✏️</button>
  <button id="chat-menu" class="ib" type="button" aria-label="Menyu" hidden>⋮</button>
</header>
<main id="main-area">
  <div class="wrap" id="list-view">
    <div id="tab-body"></div>
  </div>
  <div id="chat-view" hidden>
    <div class="messages" id="messages"></div>
    <div class="composer" id="composer">
      <div id="replybar" class="replybar" hidden><div id="rb-t"></div><button id="rb-x" type="button">✕</button></div>
      <div class="cin">
        <div class="box">
          <textarea id="msg-input" rows="1" placeholder="Andika ujumbe"></textarea>
          <button class="ico" id="share-btn" type="button" title="Ambatisha">📎</button>
        </div>
        <button class="sendb" id="send-btn" type="button" aria-label="Tuma">🎤</button>
      </div>
    </div>
    <div class="blockbar" id="blockbar" hidden>Umemzuia mtumiaji huyu. <button id="unblock-btn" type="button">Mruhusu</button></div>
  </div>
</main>
<nav class="bottom" id="bnav">
  <button data-tab="chats" class="on"><i>💬</i><span data-i="chats">Chats</span><em class="nb" id="nb-chats" hidden></em></button>
  <button data-tab="contacts"><i>👥</i><span data-i="contacts">Contacts</span></button>
  <button data-tab="calls"><i>📞</i><span data-i="calls">Calls</span></button>
  <button data-tab="status"><i>⭕</i><span data-i="status">Status</span></button>
  <button data-tab="settings"><i>⚙️</i><span data-i="settings">Settings</span></button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-in" hidden>

<script src="core.js?v=5"></script>
<script src="cloud-sync.js?v=2"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var peerUid = new URLSearchParams(location.search).get("uid");
  var peerUser = null, me = null, lastDay = "", seen = {}, pending = [];
  var tab = "chats", filter = "all", chatsCache = [], replyTo = null, fileKind = "", rec = null, curChatKey = "";
  var LIMIT = 700 * 1024; // kikomo cha ukubwa wa media (database ya ujumbe)

  /* ===== LOCAL STORE ===== */
  var KEY = "rr_chat_v2";
  var S = (function () {
    var d = {}; try { d = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { }
    d.pins = d.pins || {}; d.arch = d.arch || {}; d.mute = d.mute || {}; d.locked = d.locked || {}; d.blocked = d.blocked || {};
    d.drafts = d.drafts || {}; d.trash = d.trash || []; d.meta = d.meta || {}; d.log = d.log || []; d.groups = d.groups || [];
    d.stories = d.stories || []; d.reports = d.reports || []; d.e2e = d.e2e || {}; d.names = d.names || {};
    d.profile = d.profile || { about: "Nipo kwenye Rescue Report", photo: "" };
    d.settings = Object.assign({ lang: "sw", theme: "", readRcpt: true, lastSeen: true, notif: false, pin: "", salt: "" }, d.settings || {});
    return d;
  })();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Hifadhi imejaa — futa data kwenye Storage"); } }
  function cs(fn) { var a = [].slice.call(arguments, 1); if (window.CloudSync && typeof CloudSync[fn] === "function") { try { return CloudSync[fn].apply(CloudSync, a); } catch (e) { } } }

  /* ===== LUGHA ===== */
  var L = {
    sw: { chats: "Chats", contacts: "Contacts", calls: "Calls", status: "Status", settings: "Settings", title: "Mazungumzo", type: "Andika ujumbe", online: "mtandaoni", typing: "anaandika…", you: "Wewe" },
    en: { chats: "Chats", contacts: "Contacts", calls: "Calls", status: "Status", settings: "Settings", title: "Messages", type: "Type a message", online: "online", typing: "typing…", you: "You" }
  };
  function T(k) { return (L[S.settings.lang] || L.sw)[k] || L.sw[k] || k; }
  function applyLang() {
    document.documentElement.lang = S.settings.lang;
    document.querySelectorAll("[data-i]").forEach(function (e) { e.textContent = T(e.getAttribute("data-i")); });
    $("msg-input").placeholder = T("type");
  }

  /* ===== THEME ===== */
  (async function () {
    var th = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    try { var s = await RescueDB.getAllSettings(); if (s && s.theme) th = s.theme === "light" ? "light" : "dark"; } catch (e) { }
    if (S.settings.theme) th = S.settings.theme;
    document.documentElement.setAttribute("data-theme", th);
  })();

  /* ===== UTIL ===== */
  var tt;
  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove("show"); }, 2600); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function hm(ts) { return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function dayLabel(ts) {
    var d = new Date(ts), n = new Date(), y = new Date(Date.now() - 864e5);
    if (d.toDateString() === n.toDateString()) return S.settings.lang === "en" ? "Today" : "Leo";
    if (d.toDateString() === y.toDateString()) return S.settings.lang === "en" ? "Yesterday" : "Jana";
    return d.toLocaleDateString([], { day: "numeric", month: "long", year: "numeric" });
  }
  function ago(ts) {
    var d = new Date(ts), df = (Date.now() - d) / 1000;
    if (df < 60) return "sasa"; if (df < 3600) return Math.floor(df / 60) + "m";
    if (df < 86400) return hm(ts); return d.toLocaleDateString([], { day: "2-digit", month: "short" });
  }
  function go(uid) { location.href = "chat.html?uid=" + encodeURIComponent(uid); }
  function myUid() { return me && (me.uid || me.id); }
  function avatar(name, photo) { return photo ? '<img src="' + esc(photo) + '" alt="">' : esc((name || "?").charAt(0).toUpperCase()); }
  function openSheet(html, mid) { var b = document.createElement("div"); b.className = "bd" + (mid ? " mid" : ""); b.innerHTML = '<div class="sheet"' + (mid ? ' style="border-radius:18px;margin:16px"' : '') + '>' + html + '</div>'; b.addEventListener("click", function (e) { if (e.target === b) b.remove(); }); document.body.appendChild(b); return b; }
  function menuSheet(title, items) {
    var b = openSheet((title ? '<h3>' + esc(title) + '</h3>' : '') + items.map(function (it, i) { return '<button class="si' + (it.danger ? ' danger' : '') + '" data-i="' + i + '"><div class="ic">' + it.ic + '</div><div class="tt"><div class="a">' + esc(it.t) + '</div>' + (it.s ? '<div class="b">' + esc(it.s) + '</div>' : '') + '</div></button>'; }).join(""));
    b.querySelectorAll(".si").forEach(function (x) { x.onclick = function () { b.remove(); items[+x.getAttribute("data-i")].fn(); }; });
    return b;
  }
  async function sha(t) { var h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return Array.from(new Uint8Array(h)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join(""); }
  function askPin(title, cb) {
    var b = openSheet('<h3>' + esc(title) + '</h3><input class="f pin" id="pn" type="password" inputmode="numeric" maxlength="6" placeholder="••••"><div class="row2"><button id="pc">Ghairi</button><button class="p" id="po">Sawa</button></div>', true);
    var i = b.querySelector("#pn"); i.focus();
    function ok() { var v = i.value.trim(); if (v.length < 4) return toast("PIN iwe tarakimu 4–6"); b.remove(); cb(v); }
    b.querySelector("#pc").onclick = function () { b.remove(); }; b.querySelector("#po").onclick = ok;
    i.addEventListener("keydown", function (e) { if (e.key === "Enter") ok(); });
  }
  async function checkPin(pin) { return S.settings.pin && (await sha(S.settings.salt + pin)) === S.settings.pin; }
  function needPin(cb, title) {
    if (!S.settings.pin) { toast("Weka PIN kwanza: Settings › Security"); return; }
    askPin(title || "Weka PIN", async function (p) { if (await checkPin(p)) cb(); else toast("PIN si sahihi"); });
  }
  function metaOf(k) { return S.meta[k] || (S.meta[k] = {}); }

  /* ===== E2E (AES-GCM, passphrase ya pamoja) ===== */
  async function e2eKey(uid) {
    var pass = S.e2e[uid]; if (!pass) return null;
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);

  function pretty(k) { return k.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/[_-]+/g, " ").replace(/^./, function (c) { return c.toUpperCase(); }); }

    Object.keys(r || {}).forEach(function (k) {
      if (skip.test(k)) return;
      var v = r[k]; if (v == null || v === "") return;
      if (v instanceof Date) v = v.toLocaleString();
      else if (typeof v === "object") { if (Array.isArray(v) && v.every(function (x) { return x == null || typeof x !== "object"; })) v = v.join(", "); else return; }
      else if (typeof v === "number" && v > 1e11 && /(date|time|at|tarehe|muda)/i.test(k)) v = new Date(v).toLocaleString();
      v = String(v); if (/^data:/.test(v)) return;

    });

  /* ===== FILES / MEDIA ===== */
  function readData(file) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(file); }); }
  function compressImage(file, maxW) {
    return readData(file).then(function (url) { return new Promise(function (res) { var im = new Image(); im.onload = function () { var s = Math.min(1, (maxW || 1024) / im.width), c = document.createElement("canvas"); c.width = im.width * s; c.height = im.height * s; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .7)); }; im.onerror = function () { res(url); }; im.src = url; }); });
  }
  function pickFile(kind, cb, maxW) {
    var inp = $("file-in"); inp.value = "";
    inp.accept = kind === "image" ? "image/*" : kind === "video" ? "video/*" : kind === "backup" ? "application/json,.json" : "*/*";
    inp.onchange = async function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      try {
        var data = kind === "image" ? await compressImage(f, maxW) : await readData(f);
        if (data.length > LIMIT * 1.37 && kind !== "backup") return toast("Faili ni kubwa mno (kikomo ~700KB)");
        cb({ data: data, name: f.name, size: f.size, mime: f.type });
      } catch (e) { toast("Imeshindwa kusoma faili"); }
    };
    inp.click();
  }
  function attachMenu() {
    menuSheet("Ambatisha", [
      { ic: "🖼️", t: "Picha", fn: function () { pickFile("image", function (d) { dispatch({ type: "image", data: d.data, name: d.name }); }); } },
      { ic: "🎥", t: "Video", s: "Kikomo ~700KB", fn: function () { pickFile("video", function (d) { dispatch({ type: "video", data: d.data, name: d.name }); }); } },
      { ic: "📄", t: "Hati (Document)", s: "Kikomo ~700KB", fn: function () { pickFile("doc", function (d) { dispatch({ type: "doc", data: d.data, name: d.name, size: d.size }); }); } },
      { ic: "📍", t: "Mahali (Location)", fn: shareLocation },
      { ic: "📋", t: "Taarifa / Ripoti za app", fn: openShare }
    ]);

  function shareLocation() {
    if (!navigator.geolocation) return toast("Kifaa hakina GPS");
    toast("Inatafuta mahali…");
    navigator.geolocation.getCurrentPosition(function (p) { dispatch({ type: "location", lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6) }); }, function () { toast("Ruhusa ya mahali imekataliwa"); }, { enableHighAccuracy: true, timeout: 12000 });
  }
  async function toggleRecord() {
    if (rec) { rec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) return toast("Kurekodi sauti hakuungwi mkono");
    try {
      var st = await navigator.mediaDevices.getUserMedia({ audio: true }), mr = new MediaRecorder(st), ch = [], t0 = Date.now();
      mr.ondataavailable = function (e) { ch.push(e.data); };
      mr.onstop = async function () {
        st.getTracks().forEach(function (t) { t.stop(); }); clearTimeout(rec && rec.timer); rec = null; setSendIcon();
        var blob = new Blob(ch, { type: mr.mimeType || "audio/webm" });
        if (Date.now() - t0 < 700 || rec === "cancel") return;
        var d = await readData(blob); if (d.length > LIMIT * 1.37) return toast("Sauti ni ndefu mno (kikomo ~dakika 1)");
        dispatch({ type: "voice", data: d, dur: Math.round((Date.now() - t0) / 1000) });
      };
      mr.start(); rec = { stop: function () { mr.stop(); }, timer: setTimeout(function () { mr.stop(); }, 60000) }; setSendIcon();
      toast("Inarekodi… gusa ■ kutuma");
    } catch (e) { toast("Ruhusa ya maikrofoni imekataliwa"); }
  }
  function setSendIcon() {
    var b = $("send-btn"), has = $("msg-input").value.trim().length > 0;
    b.classList.toggle("rec", !!rec); b.textContent = rec ? "■" : has ? "➤" : "🎤";

  /* ===== CHAT ===== */
  function mkey(m) { return peerUid + ":" + (m.id || m.at); }
  function keyOf(m) { return m.type === "share" ? "s:" + ((m.share || {}).title || "") : m.type === "text" ? "t:" + (m.text || "") : m.type + ":" + (m.at || ""); }
  function tickHtml(m, status) {
    if (m.from !== myUid()) return "";
    if (status === "pending") return " 🕓"; if (status === "fail") return " ⚠";
    if (m.read || m.readAt) return ' <span class="tk rd">✓✓</span>';
    if (m.delivered || m.deliveredAt) return ' <span class="tk">✓✓</span>';
    return ' <span class="tk">✓</span>';
  }
  function cardHtml(p) {
    var rows = (p.fields || []).slice(0, 4).map(function (f) { return '<div class="r"><b>' + esc(f[0]) + ':</b><span>' + esc(f[1]) + '</span></div>'; }).join("");
    return '<div class="card"><div class="k">📋 ' + esc(p.kind || "Taarifa") + '</div><div class="t">' + esc(p.title || "Taarifa") + '</div>'
      + (p.summary ? '<div class="r"><span>' + esc(p.summary) + '</span></div>' : '') + rows
      + ((p.fields || []).length > 4 ? '<span class="more">Angalia taarifa kamili ›</span>' : ((p.fields || []).length ? '<span class="more">Fungua ›</span>' : '')) + '</div>';
  }
  function bodyHtml(m) {
    switch (m.type) {
      case "share": return cardHtml(m.share || {});
      case "image": return '<img class="pic" src="' + esc(m.data) + '" alt="picha">';
      case "video": return '<video controls preload="metadata" src="' + esc(m.data) + '"></video>';
      case "voice": return '🎤 <audio controls preload="none" src="' + esc(m.data) + '"></audio>';
      case "doc": return '<a class="doc" href="' + esc(m.data) + '" download="' + esc(m.name || "hati") + '"><i>📄</i><span>' + esc(m.name || "Hati") + (m.size ? '<br><small>' + Math.round(m.size / 1024) + ' KB · gusa kupakua</small>' : '') + '</span></a>';
      case "location": return '<a class="loc" target="_blank" rel="noopener" href="https://maps.google.com/?q=' + m.lat + ',' + m.lng + '"><b>📍 Mahali</b><br>' + m.lat + ', ' + m.lng + '<br><small>Gusa kufungua ramani</small></a>';
      default: return '<span class="tx">' + esc(m.text || "") + '</span>';
    }
  }
  function render(div, m, status) {
    var isMe = m.from === myUid(), mk = S.meta[mkey(m)] || {};
    div.className = "bubble " + (isMe ? "me" : "them") + (status === "pending" ? " pending" : status === "fail" ? " fail" : "");
    var txt = mk.edit != null ? Object.assign({}, m, { text: mk.edit }) : m;
    var rep = m.replyTo ? '<div class="rep" data-rk="' + esc(m.replyTo.at || "") + '"><b>' + esc(m.replyTo.who || "") + '</b>' + esc(m.replyTo.text || "") + '</div>' : "";
    var fw = m.fwd ? '<div class="fwd">↪ Imesambazwa</div>' : "";
    var rx = mk.react && Object.keys(mk.react).length ? '<div><span class="rx" data-rx="1">' + Object.keys(mk.react).map(function (k) { return mk.react[k]; }).join("") + '</span></div>' : "";
    div.innerHTML = '<span class="dd" title="Chaguzi">▾</span>' + fw + rep + bodyHtml(txt) + '<span class="meta">' + (mk.edit != null ? '<span class="edited">imehaririwa</span>' : '') + hm(m.at || Date.now()) + tickHtml(m, status) + '</span>' + rx;
    div.__m = m;
    var mo = div.querySelector(".more"); if (mo) mo.onclick = function () { openDetail(m.share || {}); };
    div.querySelector(".dd").onclick = function (e) { e.stopPropagation(); msgMenu(div, m); };
    var rr = div.querySelector(".rep"); if (rr) rr.onclick = function () { var t = rr.getAttribute("data-rk"); Array.from($("messages").children).forEach(function (c) { if (c.__m && String(c.__m.at) === t) { c.scrollIntoView({ block: "center" }); c.classList.add("hl"); setTimeout(function () { c.classList.remove("hl"); }, 1500); } }); };
    var t0; div.addEventListener("touchstart", function () { t0 = setTimeout(function () { msgMenu(div, m); }, 550); }, { passive: true });
    ["touchend", "touchmove", "touchcancel"].forEach(function (ev) { div.addEventListener(ev, function () { clearTimeout(t0); }, { passive: true }); });
    div.addEventListener("contextmenu", function (e) { e.preventDefault(); msgMenu(div, m); });
    if (m.type === "text" && String(m.text).indexOf("🔒e1:") === 0 && mk.edit == null) { decText(peerUid, m.text).then(function (d) { var s = div.querySelector(".tx"); if (s) s.textContent = d; div.__plain = d; }); }
  }
  function plainOf(div, m) { var mk = S.meta[mkey(m)] || {}; if (mk.edit != null) return mk.edit; if (div && div.__plain) return div.__plain; return m.type === "text" ? (m.text || "") : previewOf(m); }

  function msgMenu(div, m) {
    var isMe = m.from === myUid(), k = mkey(m), mk = metaOf(k);
    var b = openSheet('<div class="emo">' + ["👍", "❤️", "😂", "😮", "😢", "🙏"].map(function (e) { return '<button data-e="' + e + '">' + e + '</button>'; }).join("") + '</div><div id="mm"></div>');
    b.querySelectorAll(".emo button").forEach(function (x) {
      x.onclick = function () { var e = x.getAttribute("data-e"); mk.react = mk.react || {}; if (mk.react[myUid()] === e) delete mk.react[myUid()]; else mk.react[myUid()] = e; save(); cs("reactMessage", peerUid, m.id, e); b.remove(); render(div, m, ""); };
    });
    var items = [
      { ic: "↩️", t: "Jibu", fn: function () { setReply(div, m); } },
      { ic: "📋", t: "Nakili", fn: function () { copyText(plainOf(div, m)); } },
      { ic: "↪️", t: "Sambaza (Forward)", fn: function () { forwardMsg(m); } }
    ];
    if (isMe && m.type === "text") items.push({ ic: "✏️", t: "Hariri", fn: function () { editMsg(div, m); } });
    if (m.id) items.push({ ic: "ℹ️", t: "Maelezo ya ujumbe", fn: function () { var st = m.read || m.readAt ? "Imesomwa" : m.delivered || m.deliveredAt ? "Imefika" : isMe ? "Imetumwa" : "Imepokelewa"; openSheet('<h3>Maelezo</h3><div class="dr"><b>Muda</b><span>' + new Date(m.at).toLocaleString() + '</span></div><div class="dr"><b>Hali</b><span>' + st + '</span></div>'); } });
    items.push({ ic: "🗑️", t: "Futa", danger: true, fn: function () { deleteMsg(div, m); } });
    var mm = b.querySelector("#mm"); mm.innerHTML = items.map(function (it, i) { return '<button class="si' + (it.danger ? ' danger' : '') + '" data-i="' + i + '"><div class="ic">' + it.ic + '</div><div class="tt"><div class="a">' + it.t + '</div></div></button>'; }).join("");
    mm.querySelectorAll(".si").forEach(function (x) { x.onclick = function () { b.remove(); items[+x.getAttribute("data-i")].fn(); }; });
  }
  function setReply(div, m) {
    replyTo = { at: m.at, who: m.from === myUid() ? T("you") : ((peerUser && (peerUser.displayName || peerUser.email)) || ""), text: plainOf(div, m).slice(0, 80) };
    $("rb-t").textContent = replyTo.who + ": " + replyTo.text; $("replybar").hidden = false; $("msg-input").focus();
  }
  function clearReply() { replyTo = null; $("replybar").hidden = true; }
  function editMsg(div, m) {
    var b = openSheet('<h3>Hariri ujumbe</h3><textarea class="f" id="et" rows="3">' + esc(plainOf(div, m)) + '</textarea><p class="note" style="padding:0 0 8px;text-align:left">Mabadiliko yanaonekana kwako; mpokeaji ataona ikiwa seva inaunga mkono kuhariri.</p><div class="row2"><button id="ec">Ghairi</button><button class="p" id="eo">Hifadhi</button></div>', true);
    b.querySelector("#ec").onclick = function () { b.remove(); };
    b.querySelector("#eo").onclick = async function () { var t = b.querySelector("#et").value.trim(); if (!t) return; metaOf(mkey(m)).edit = t; save(); cs("editMessage", peerUid, m.id, await encText(peerUid, t)); b.remove(); render(div, m, ""); };
  }
  function deleteMsg(div, m) {
    var b = openSheet('<h3>Futa ujumbe?</h3><p class="note" style="padding:6px 0">Utahamishiwa Tupio na unaweza kurejeshwa.</p><div class="row2"><button id="dc1">Ghairi</button><button class="p" id="do1" style="background:var(--err)">Futa</button></div>', true);
    b.querySelector("#dc1").onclick = function () { b.remove(); };
    b.querySelector("#do1").onclick = function () { var k = mkey(m); metaOf(k).del = 1; S.trash.push({ k: k, uid: peerUid, m: m, at: Date.now() }); save(); cs("deleteMessage", peerUid, m.id); b.remove(); div.remove(); toast("Imehamishiwa Tupio"); };
  }
  function forwardMsg(m) {
    var cands = chatsCache.filter(function (c) { return !S.blocked[c.uid]; });
    var b = openSheet('<h3>Sambaza kwa…</h3>' + (cands.map(function (c) { return '<button class="si" data-u="' + esc(c.uid) + '"><div class="ic">' + avatar(nameOf(c)) + '</div><div class="tt"><div class="a">' + esc(nameOf(c)) + '</div></div></button>'; }).join("") || '<p class="note">Hakuna mazungumzo.</p>'));
    b.querySelectorAll(".si").forEach(function (x) { x.onclick = async function () { var u = x.getAttribute("data-u"); b.remove(); var p = Object.assign({}, m, { fwd: true }); delete p.id; delete p.from; delete p.at; delete p.replyTo; delete p.read; delete p.delivered; if (p.type === "text") p.text = await encText(u, await decText(peerUid, p.text)); try { await CloudSync.sendMessage(u, p); toast("Imesambazwa"); } catch (e) { toast("Imeshindikana: " + e.message); } }; });
  }

  function appendMessage(m, scroll) {
    var box = $("messages"), n = box.querySelector(".note"); if (n) n.remove();
    var meUid = myUid();
    if (m.id) { if (seen[m.id]) return; seen[m.id] = 1; }
    if (S.meta[mkey(m)] && S.meta[mkey(m)].del) return;
    if (m.from !== meUid && S.blocked[peerUid]) return;
    if (m.from === meUid) {
      for (var i = 0; i < pending.length; i++) if (pending[i].key === keyOf(m)) { render(pending[i].el, m, ""); pending.splice(i, 1); logMsg(m, peerUid); return; }
    }
    logMsg(m, peerUid);
    var dl = dayLabel(m.at || Date.now());
    if (dl !== lastDay) { lastDay = dl; var d = document.createElement("div"); d.className = "day"; d.textContent = dl; box.appendChild(d); }
    var div = document.createElement("div"); render(div, m, ""); box.appendChild(div);
    if (scroll) box.scrollTop = box.scrollHeight;
  }
  async function dispatch(payload) {
    if (S.blocked[peerUid]) return toast("Umemzuia mtumiaji huyu");
    var meUid = myUid(), m = Object.assign({ from: meUid, at: Date.now() }, payload), wire = Object.assign({}, payload);
    if (replyTo && (payload.type === "text" || !payload.type)) { m.replyTo = replyTo; wire.replyTo = replyTo; }
    if (wire.type === "text") wire.text = await encText(peerUid, wire.text);
    if (m.replyTo) clearReply();
    appendMessage(Object.assign({}, m, { id: null }), false);
    var box = $("messages"), el = box.lastChild; render(el, m, "pending");
    var p = { el: el, key: keyOf(m) }; pending.push(p); box.scrollTop = box.scrollHeight;
    try { await CloudSync.sendMessage(peerUid, wire); setTimeout(function () { var k = pending.indexOf(p); if (k > -1) { pending.splice(k, 1); render(el, m, ""); logMsg(m, peerUid); } }, 2500); }
    catch (e) { var k = pending.indexOf(p); if (k > -1) pending.splice(k, 1); render(el, m, "fail"); toast("Imeshindikana kutuma: " + e.message); }
  }
  function sendText() {
    var i = $("msg-input"), t = i.value.trim(); if (!t) return;
    i.value = ""; i.style.height = "auto"; i.focus(); delete S.drafts[peerUid]; save(); setSendIcon();
    cs("setTyping", peerUid, false);
    dispatch({ type: "text", text: t });
  }
  function applyBlock() { var bl = !!S.blocked[peerUid]; $("composer").hidden = bl; $("blockbar").hidden = !bl; }

  function chatHeaderMenu() {
    var nm = (peerUser && (peerUser.displayName || peerUser.email)) || "";
    menuSheet(nm, [
      { ic: "🔎", t: "Tafuta kwenye chat", fn: function () { var b = openSheet('<h3>Tafuta kwenye chat</h3><input class="f" id="cs1" placeholder="Neno…"><div class="row2"><button id="cs2">Ondoa kichujio</button><button class="p" id="cs3">Tafuta</button></div>', true); var i = b.querySelector("#cs1"); i.focus(); function run(q) { q = q.toLowerCase(); Array.from($("messages").children).forEach(function (c) { if (!c.__m) return; c.style.display = !q || (plainOf(c, c.__m) + "").toLowerCase().indexOf(q) > -1 ? "" : "none"; }); } b.querySelector("#cs3").onclick = function () { run(i.value.trim()); b.remove(); }; b.querySelector("#cs2").onclick = function () { run(""); b.remove(); }; } },
      { ic: "🔐", t: S.e2e[peerUid] ? "Usimbaji: umewashwa (badili)" : "Usimbaji (E2E passphrase)", s: "Wewe na mpokeaji mnahitaji passphrase moja", fn: function () { var b = openSheet('<h3>Usimbaji wa mwisho-hadi-mwisho</h3><input class="f" id="ep" type="password" placeholder="Passphrase ya siri (ya pamoja)" value="' + esc(S.e2e[peerUid] || "") + '"><p class="note" style="padding:0 0 8px;text-align:left">Ujumbe wa maandishi utasimbwa kwa AES-256 kabla ya kutumwa. Mpe mwenzako passphrase kwa njia salama (si kwenye chat hii).</p><div class="row2"><button id="e0">Zima</button><button class="p" id="e1">Washa</button></div>', true); b.querySelector("#e0").onclick = function () { delete S.e2e[peerUid]; save(); b.remove(); toast("Usimbaji umezimwa"); }; b.querySelector("#e1").onclick = function () { var v = b.querySelector("#ep").value; if (v.length < 6) return toast("Passphrase angalau herufi 6"); S.e2e[peerUid] = v; save(); b.remove(); toast("Usimbaji umewashwa 🔒"); }; } },
      { ic: "📌", t: S.pins[peerUid] ? "Ondoa pin" : "Bandika chat", fn: function () { S.pins[peerUid] = !S.pins[peerUid]; if (!S.pins[peerUid]) delete S.pins[peerUid]; save(); toast("Imefanyika"); } },
      { ic: "🗄️", t: "Hifadhi (Archive)", fn: function () { S.arch[peerUid] = 1; save(); location.href = "chat.html"; } },
      { ic: "🔕", t: S.mute[peerUid] ? "Washa arifa" : "Zima arifa", fn: function () { S.mute[peerUid] = !S.mute[peerUid]; if (!S.mute[peerUid]) delete S.mute[peerUid]; save(); toast("Imefanyika"); } },
      { ic: "🔒", t: S.locked[peerUid] ? "Ondoa Chat Lock" : "Funga chat kwa PIN", fn: function () { needPin(function () { S.locked[peerUid] = !S.locked[peerUid]; if (!S.locked[peerUid]) delete S.locked[peerUid]; save(); toast(S.locked[peerUid] ? "Chat imefungwa" : "Chat Lock imeondolewa"); }); } },
      { ic: "🚫", t: "Mzuie", danger: true, fn: function () { toggleBlock(peerUid); } },
      { ic: "⚠️", t: "Ripoti mtumiaji", danger: true, fn: function () { reportUser(peerUid); } }
    ]);
  }

  async function openChat() {
    $("list-view").hidden = true; $("chat-view").hidden = false; $("main-area").style.overflow = "hidden";
    $("search-btn").hidden = true; $("new-btn").hidden = true; $("chat-menu").hidden = false; $("back").hidden = false; $("bnav").hidden = true;
    try { peerUser = await CloudSync.getUser(peerUid); } catch (e) { }
    if (!peerUser) { toast("Mtumiaji hakupatikana"); location.href = "chat.html"; return; }
    var nm = peerUser.displayName || peerUser.email || "Mtumiaji"; S.names[peerUid] = nm; save();
    $("top-title").textContent = nm;
    $("top-sub").textContent = peerUser.online && S.settings.lastSeen ? T("online") : (S.settings.lastSeen && peerUser.lastSeen ? "ilionekana " + ago(peerUser.lastSeen) : "");
    var av = $("top-av"); av.hidden = false; av.innerHTML = avatar(nm, peerUser.photo || peerUser.photoURL);
    document.title = nm + " — Rescue Report";
    applyBlock();
    var box = $("messages");
    try {
      var msgs = await CloudSync.getMessages(peerUid, 100);
      if (!msgs || !msgs.length) box.innerHTML = '<p class="note">Anza mazungumzo kwa kutuma ujumbe.' + (S.e2e[peerUid] ? '<br>🔒 Usimbaji umewashwa' : '') + '</p>';
      else { msgs.forEach(function (m) { appendMessage(m, false); }); box.scrollTop = box.scrollHeight; }
    } catch (e) { box.innerHTML = '<p class="note">Hitilafu kupakia ujumbe.</p>'; }
    if (S.settings.readRcpt) { try { await CloudSync.markChatRead(peerUid); } catch (e) { } }
    CloudSync.watchMessages(peerUid, function (m) {
      appendMessage(m, true);
      if (S.settings.readRcpt) CloudSync.markChatRead(peerUid).catch(function () { });
      if (m.from !== myUid() && !S.mute[peerUid] && !S.blocked[peerUid] && S.settings.notif && document.hidden && window.Notification && Notification.permission === "granted") { try { new Notification(nm, { body: S.settings.pin ? "Ujumbe mpya" : previewOf(m).slice(0, 100) }); } catch (e) { } }
    });
    // Typing indicator (inafanya kazi ikiwa CloudSync ina watchTyping/setTyping)
    var tto; cs("watchTyping", peerUid, function (on) { var s = $("top-sub"); if (on) { s.textContent = T("typing"); clearTimeout(tto); tto = setTimeout(function () { s.textContent = peerUser.online ? T("online") : ""; }, 4000); } else s.textContent = peerUser.online ? T("online") : ""; });
    var inp = $("msg-input"), lastTy = 0;
    inp.value = S.drafts[peerUid] || ""; setSendIcon();
    inp.addEventListener("input", function () {
      inp.style.height = "auto"; inp.style.height = Math.min(120, inp.scrollHeight) + "px";
      var v = inp.value; if (v.trim()) S.drafts[peerUid] = v; else delete S.drafts[peerUid]; save(); setSendIcon();
      if (Date.now() - lastTy > 2500 && v.trim()) { lastTy = Date.now(); cs("setTyping", peerUid, true); }
    });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) { e.preventDefault(); sendText(); } });
    $("send-btn").addEventListener("click", function () { if (rec) return rec.stop(); if (inp.value.trim()) sendText(); else toggleRecord(); });
    $("share-btn").addEventListener("click", attachMenu);
    $("rb-x").addEventListener("click", clearReply);
    $("chat-menu").addEventListener("click", chatHeaderMenu);
    $("unblock-btn").addEventListener("click", function () { toggleBlock(peerUid); });
  }

  /* ===== NAV ===== */
  var TITLES = { chats: "title", contacts: "contacts", calls: "calls", status: "status", settings: "settings" };
  function renderTab() {
    if (peerUid) return;
    if (tab === "chats") renderChatsTab(); else if (tab === "contacts") renderContacts(); else if (tab === "calls") renderCalls(); else if (tab === "status") renderStatus(); else renderSettings();
    updateBadge();
  }
  function setTab() {
    document.querySelectorAll("#bnav button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === tab); });
    $("top-title").textContent = T(TITLES[tab]);
    $("search-btn").hidden = tab !== "chats"; $("new-btn").hidden = tab === "settings" || tab === "calls";
    renderTab();
  }
  document.querySelectorAll("#bnav button").forEach(function (b) { b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); setTab(); }); });
  $("back").addEventListener("click", function () { location.href = "chat.html"; });
  $("search-btn").addEventListener("click", function () { var i = $("search-input"); if (i) { i.focus(); i.scrollIntoView(); } });
  $("new-btn").addEventListener("click", newMenu);
  window.addEventListener("beforeunload", function () { cs("setTyping", peerUid, false); });

  /* ===== APP LOCK + START ===== */
  function lockScreen() {
    return new Promise(function (resolve) {
      var d = document.createElement("div"); d.id = "lock";
      d.innerHTML = '<div style="font-size:48px">🔒</div><h2 style="margin:0">Rescue Chat</h2><div>Weka PIN kufungua</div><input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><button id="lb" type="button">Fungua</button>';
      document.body.appendChild(d);
      async function tryIt() { if (await checkPin($("lp").value.trim())) { d.remove(); resolve(); } else { toast("PIN si sahihi"); $("lp").value = ""; } }
      $("lb").onclick = tryIt; $("lp").addEventListener("keydown", function (e) { if (e.key === "Enter") tryIt(); }); $("lp").focus();
    });
  }
  async function start() {
    applyLang();
    if (!window.CloudSync || !window.RescueDB) { toast("Faili za app hazikupatikana"); return; }
    if (S.settings.pin) await lockScreen();
    try { me = await CloudSync.currentUser(); if (!me) { location.href = "login.html"; return; } }
    catch (e) { location.href = "login.html"; return; }
    await loadChats();
    if (peerUid) {
      if (S.locked[peerUid]) { askPin("Chat imefungwa — weka PIN", async function (p) { if (await checkPin(p)) openChat(); else { toast("PIN si sahihi"); location.href = "chat.html"; } }); }
      else openChat();
    } else { $("back").hidden = true; setTab(); }
  }
  start();
})();
</script>
