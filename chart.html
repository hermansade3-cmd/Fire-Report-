.hd{flex:1;min-width:0;padding-left:4px}.hd h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .sub{font-size:12.5px;color:var(--muted);min-height:15px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto;padding:10px 0 28px}

.av{width:50px;height:50px;border-radius:18px;background:var(--tint);color:var(--send);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

.kebab{border:0;background:transparent;color:var(--muted);font-size:20px;width:32px;height:36px;cursor:pointer;flex:none}
.note{color:var(--muted);font-size:14px;text-align:center;padding:34px 18px;line-height:1.5}

.tile{background:transparent;border:1px solid var(--line);border-radius:16px;padding:11px 6px;text-align:center;cursor:pointer;color:var(--text);font:inherit;transition:background .15s}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:18px;padding:7px 14px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s}
.chip.on{background:var(--me);border-color:var(--me);color:#fff}
nav.bottom{flex:none;display:flex;background:var(--head);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 8px calc(env(safe-area-inset-bottom,0px) + 4px);z-index:5}
nav.bottom button{flex:1;border:0;background:transparent;color:var(--muted);padding:4px 0;font-size:11.5px;font-weight:600;cursor:pointer;position:relative}
nav.bottom button i{display:grid;place-items:center;width:58px;height:30px;border-radius:15px;margin:0 auto 2px;transition:background .2s,color .2s}

.row2{display:flex;gap:8px;margin-top:14px}.row2 button{flex:1;border:0;border-radius:14px;padding:13px;font-weight:700;cursor:pointer;background:var(--tint);color:var(--text)}.row2 .p{background:var(--me);color:#fff}
.emo{display:flex;justify-content:space-around;background:var(--bg);border-radius:26px;padding:6px;margin-bottom:10px}.emo button{border:0;background:transparent;font-size:27px;cursor:pointer;padding:2px 7px;transition:transform .12s}.emo button:active{transform:scale(1.3)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line)}
.sw input{width:22px;height:22px;accent-color:var(--me)}
.pin{font-size:28px;letter-spacing:10px;text-align:center}
.chk{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}.chk input{width:20px;height:20px;accent-color:var(--me)}
#lock{position:fixed;inset:0;background:#141a2e;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;padding:20px}
#lock input{width:200px;padding:12px;border-radius:16px;border:0;font-size:28px;text-align:center;letter-spacing:10px}
#lock button{border:0;border-radius:20px;padding:11px 30px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}
.pf{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px}.pf .av{width:84px;height:84px;font-size:34px;border-radius:28px}
.story{width:62px;text-align:center;font-size:12px;flex:none;cursor:pointer}.story .av{width:58px;height:58px;border:3px solid var(--accent)}
.skel{display:flex;gap:13px;padding:12px 18px;align-items:center}.skel i,.skel b{background:linear-gradient(90deg,var(--line) 25%,var(--tint) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.3s infinite}.skel i{width:50px;height:50px;border-radius:18px}.skel b{flex:1;height:34px;border-radius:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;font-weight:600;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
#toast.show{opacity:1}

@keyframes su{from{transform:translateY(40px);opacity:.4}}

<script>
"use strict";
/* ================================================================
 * 1) db.js
 * ================================================================ */
/* db.js
 * IndexedDB persistence layer for the Offline Incident & Rescue Report app.
 * Stores: reports, photos, trash, settings, auditLogs
 * Casualties / witnesses / vehicles / crew / actions / etc. are kept as
 * arrays embedded inside each report document (they are always read/written
 * together with the report, so embedding avoids extra transactions and keeps
 * auto-save atomic). Photos are kept in their own store (binary blobs) keyed
 * by incidentId so large binary data never blocks report auto-save.
 */
const DB_NAME = "rescueReportDB";
const DB_VERSION = 2;
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("reports")) {
        const store = db.createObjectStore("reports", { keyPath: "incidentId" });
        store.createIndex("status", "status", { unique: false });
        store.createIndex("createdAt", "createdAt", { unique: false });
        store.createIndex("incidentDate", "incident.date", { unique: false });
        store.createIndex("reportNumber", "reportNumber", { unique: false });
      }
      if (!db.objectStoreNames.contains("trash")) {
        db.createObjectStore("trash", { keyPath: "incidentId" });
      }
      if (!db.objectStoreNames.contains("photos")) {
        const p = db.createObjectStore("photos", { keyPath: "photoId" });
        p.createIndex("incidentId", "incidentId", { unique: false });
      }
      if (!db.objectStoreNames.contains("settings")) {
        db.createObjectStore("settings", { keyPath: "key" });
      }
      if (!db.objectStoreNames.contains("auditLogs")) {
        const a = db.createObjectStore("auditLogs", { keyPath: "id", autoIncrement: true });
        a.createIndex("incidentId", "incidentId", { unique: false });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return dbPromise;
}
function tx(storeNames, mode = "readonly") {
  return openDB().then((db) => db.transaction(storeNames, mode));
}
function promisifyRequest(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const RescueDB = {
  async putReport(report) {
    const t = await tx(["reports"], "readwrite");
    const store = t.objectStore("reports");
    await promisifyRequest(store.put(report));
    return new Promise((res, rej) => {
      t.oncomplete = () => res(report);
      t.onerror = () => rej(t.error);
    });
  },
  async getReport(incidentId) {
    const t = await tx(["reports"]);
    return promisifyRequest(t.objectStore("reports").get(incidentId));
  },
  async getAllReports() {
    const t = await tx(["reports"]);
    return promisifyRequest(t.objectStore("reports").getAll());
  },
  async deleteReportHard(incidentId) {
    const t = await tx(["reports"], "readwrite");
    t.objectStore("reports").delete(incidentId);
    return new Promise((res, rej) => {
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  },
  async moveToTrash(report) {
    const t = await tx(["reports", "trash"], "readwrite");
    t.objectStore("reports").delete(report.incidentId);

    blank();
    if ((r.fuel || []).length) {
      r.fuel.forEach((fl) => P(`Mafuta: ${V(fl.fuelType)} lita ${V(fl.litres)}, yaliyotumika kwenye gari ${V(v0.type)} ${V(fl.regNo || v0.regNo)}.`));
    } else {
      P("Mafuta: -");
    }
    blank();

    P("MAJERUHI NA VIFO");
    blank();
    P(`Majeruhi: ${(r.casualties || []).length ? r.casualties.length : "Hakuna."}`);
    P(`Vifo: ${f.occurred && (f.deceased || []).length ? f.deceased.length : "Hakuna."}`);
    blank();

    P("MALI ZILIZOOKOLEWA");
    blank();
    P(V(r.propertySaved));
    blank();

    P("HASARA ILIYOPATIKANA");
    blank();
    P(V(d.description || [d.propertyDamaged, d.vehicleDamage, d.equipmentDamage, d.otherLosses].filter(Boolean).join("; ")));
    blank();

    P("TAASISI NYINGINE ZILIZOSHIRIKI");
    blank();
    const teamChecks = (r.otherTeams && r.otherTeams.checks) || [];
    if (teamChecks.length && !(teamChecks.length === 1 && teamChecks[0] === "None")) {
      P(teamChecks.join(", "));
    } else {
      P("Hakuna kikosi kingine kilichoshiriki.");
    }
    blank();

    P("CHANGAMOTO");
    blank();
    const chOpts = (ch.options || []).filter((o) => o !== "None");
    if (chOpts.length || ch.text) {
      if (chOpts.length) P(chOpts.join(", "));
      if (ch.text) P(V(ch.text));
    } else {
      P("Hakuna.");
    }
    blank();

    P("MAONI");
    blank();
    P(V(r.comments) !== "-" ? V(r.comments) : DEFAULT_MAONI);
    blank();

    P("Naomba kuwasilisha, Afande.");

    return lines.join("\n");
  }

  function buildSummaryText(r) {
    const i = r.incident || {}, l = r.location || {};
    const worstCondition = (r.casualties || []).reduce((worst, c) => {
      const order = ["Unknown", "Stable", "Serious", "Critical", "Unconscious"];
      if (!c.condition) return worst;
      return order.indexOf(c.condition) > order.indexOf(worst) ? c.condition : worst;
    }, "");
    const actions = (r.actionsTaken && r.actionsTaken.text) || "";
    const lines = [
      "INCIDENT & RESCUE REPORT",
      "",
      `Report ID: ${V(r.reportNumber || r.incidentId)}`,
      `Date: ${V(i.date)}`,
      `Time: ${V(i.timeReceived)}`,
      `Location: ${placeLabel(l)}, ${V(l.district)}, ${V(l.region)}`,
      `Incident Type: ${incidentTypeLabel(i)}`,
      `Severity: ${V(worstCondition)}`,
      `Persons Involved: ${(r.casualties || []).length + (r.witnesses || []).length}`,
      `Casualties: ${(r.casualties || []).length}`,
      `Rescue Actions: ${V(actions).slice(0, 160)}`,
      `Resources Used: ${(r.fuel || []).map((f) => `${V(f.fuelType)} ${V(f.litres)}L`).join(", ") || "-"}`,
      `Current Status: ${V(r.status)}`,
      `Additional Notes: ${V(r.challenges && r.challenges.text)}`,
      "",
      "Created by: Herman Sade",
      "App: Incident & Rescue Reporting",
    ];
    return lines.join("\n");
  }
  function buildNarrativeHtml(r, photos) {
    const text = buildNarrativeText(r);
    let html = `<div class="narrative-body">${escapeHtml(text)}</div>`;
    if (photos && photos.length) {
      html += `<h3>Picha za Tukio (Attachments)</h3><div class="photo-grid">`;
      photos.forEach((p, idx) => {
        const url = URL.createObjectURL(p.blob);
        html += `<div><img src="${url}"><div style="font-size:10px;color:#555;">Picha ${idx + 1}${p.caption ? ": " + escapeHtml(p.caption) : ""}</div></div>`;
      });
      html += `</div>`;
    }
    return html;
  }
  function generateReportPdfBlob(r) {
    const header = `OFFLINE INCIDENT & RESCUE REPORT - ${r.reportNumber || r.incidentId}`;
    const body = buildNarrativeText(r);
    return window.PdfLite.generateBlob({ headerText: header, bodyText: body, footerLeftPrefix: "Created by Herman Sade" });
  }
  function downloadReportPdf(r) {
    const blob = generateReportPdfBlob(r);
    downloadBlob(blob, `${r.reportNumber || r.incidentId}.pdf`);
    return blob;
  }
  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
      throw new Error("no-clipboard-api");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (e2) {
        ok = false;
      }
      ta.remove();
      return ok;
    }
  }
  function canNativeShare() {
    return typeof navigator.share === "function";
  }
  function canNativeShareFiles(files) {
    return typeof navigator.canShare === "function" && navigator.canShare({ files });
  }
  async function shareText(title, text) {
    if (canNativeShare()) {
      try {
        await navigator.share({ title, text });
        return { ok: true, method: "native" };
      } catch (e) {
        if (e && e.name === "AbortError") return { ok: false, method: "native", cancelled: true };
      }
    }
    const copied = await copyText(text);
    return { ok: copied, method: "copy-fallback" };
  }
  async function sharePdfFile(r) {
    const blob = generateReportPdfBlob(r);
    const filename = `${r.reportNumber || r.incidentId}.pdf`;
    const file = new File([blob], filename, { type: "application/pdf" });
    if (canNativeShare() && canNativeShareFiles([file])) {
      try {
        await navigator.share({ title: "Incident & Rescue Report", text: `Ripoti: ${r.reportNumber || r.incidentId}`, files: [file] });
        return { ok: true, method: "native-file" };
      } catch (e) {
        if (e && e.name === "AbortError") return { ok: false, method: "native-file", cancelled: true };
      }
    }
    downloadBlob(blob, filename);
    return { ok: true, method: "download-fallback" };
  }
  function whatsappShare(text) {
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
  }
  function mailtoShare(subject, text) {
    window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
  }
  window.RescueExport = {
    downloadJSON, downloadHTML, downloadTextFile, downloadReportsCSV,
    buildNarrativeText, buildSummaryText, buildNarrativeHtml,
    generateReportPdfBlob, downloadReportPdf,
    copyText, shareText, sharePdfFile, whatsappShare, mailtoShare,
    canNativeShare, canNativeShareFiles,
  };
})();

  function loadScript(src) {

  function remember(u) {
    try { localStorage.setItem(LS_USER, JSON.stringify({ uid: u.uid, email: u.email, displayName: u.displayName })); } catch (e) { }
  }
  function getUser() {
    try { return JSON.parse(localStorage.getItem(LS_USER) || "null"); } catch (e) { return null; }
  }

  function hash(str) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36) + "." + str.length.toString(36);
  }

  function safe(s) {
    s = String(s).replace(/[^A-Za-z0-9_.-]/g, "_");
    return s.length > 150 ? s.slice(0, 150) : s;
  }

  function split(s) {
    var out = [], i = 0;
    while (i < s.length) {
      var end = Math.min(i + CHUNK, s.length);
      if (end < s.length) {
        var c = s.charCodeAt(end - 1);
        if (c >= 0xd800 && c <= 0xdbff) end--;
      }
      out.push(s.slice(i, end));
      i = end;
    }
    return out.length ? out : [""];
  }

  function stripSecrets(data) {
    var copy = Object.assign({}, data);
    var s = copy.settings;
    if (Array.isArray(s)) {
      copy.settings = s.filter(function (x) { return !(x && SECRET_KEYS.indexOf(x.key || x.name) >= 0); });
    } else if (s && typeof s === "object") {
      s = Object.assign({}, s);
      SECRET_KEYS.forEach(function (k) { delete s[k]; });

    return copy;

  function stableScalars(scalars) {
    var o = {};

  }

  function readLocal(uid) {
    try { return JSON.parse(localStorage.getItem(LS_LOCAL + uid) || "{}"); } catch (e) { return {}; }
  }
  function writeLocal(uid, items) {
    var m = {};
    Object.keys(items).forEach(function (b) { m[b] = items[b].h; });
    try { localStorage.setItem(LS_LOCAL + uid, JSON.stringify(m)); } catch (e) { }
  }

  function userDoc(uid) { return db.collection("users").doc(uid); }
  function itemsCol(uid) { return userDoc(uid).collection("items"); }
  function manifestRef(uid) { return userDoc(uid).collection("meta").doc("manifest"); }

  function requireDb() {
    if (!global.RescueDB || typeof global.RescueDB.exportFullBackup !== "function") {

    }
  }

  /* ---------------- status ---------------- */
  function setStatus(s, err) {
    status = s; statusErr = err || null;
    statusCbs.forEach(function (cb) { try { cb(s, err); } catch (e) { } });
  }
  function onStatus(cb) { statusCbs.push(cb); try { cb(status, statusErr); } catch (e) { } }
  function getStatus() { return status; }

  /* ---------------- auth ---------------- */
  async function signUp(email, password, displayName) {
    await init();
    var cred = await auth.createUserWithEmailAndPassword(email, password);
    var user = cred.user;
    var finalName = displayName || email.split("@")[0];
    if (displayName) await user.updateProfile({ displayName: finalName });
    
    await userDoc(user.uid).set({
      uid: user.uid,
      email: user.email || "",
      displayName: finalName,
      displayNameLower: finalName.toLowerCase(),
      createdAt: global.firebase.firestore.FieldValue.serverTimestamp(),
      lastSeen: global.firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    
    remember(user);
    return user;
  }
  
  async function signIn(email, password) {
    await init();
    var cred = await auth.signInWithEmailAndPassword(email, password);
    var user = cred.user;
    
    var finalName = user.displayName || email.split("@")[0];
    await userDoc(user.uid).set({
      uid: user.uid,
      email: user.email || "",
      displayName: finalName,
      displayNameLower: finalName.toLowerCase(),
      lastSeen: global.firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    
    remember(user);
    return user;
  }
  
  async function signOut() {
    await init();
    clearTimeout(timer);
    await auth.signOut();
    localStorage.removeItem(LS_USER);
    setStatus("signedout");
  }
  
  async function resetPassword(email) {
    await init();
    await auth.sendPasswordResetEmail(email);
  }
  
  async function currentUser() {
    await init();

    });
  }

  function errorMessage(e) {

  /* ---------------- backup ---------------- */
  async function collect() {
    requireDb();
    var raw = await global.RescueDB.exportFullBackup();
    var data = stripSecrets(raw || {});
    var items = {}, scalars = {};
    Object.keys(data).forEach(function (k) {
      var v = data[k];
      if (Array.isArray(v)) {
        v.forEach(function (it) {
          var s = JSON.stringify(it);
          var h = hash(s);
          var rawId = null;
          if (it && typeof it === "object") {
            rawId = it.id != null ? it.id : it.incidentId != null ? it.incidentId :
              it.photoId != null ? it.photoId : it.key != null ? it.key : it.name != null ? it.name : null;
          }
          var base = safe(k) + "__" + safe(rawId == null ? "i" + h : rawId);
          if (items[base]) base = base + "~" + safe(h);
          if (items[base]) return;
          items[base] = { k: k, s: s, h: h };
        });
      } else {
        scalars[k] = v;
      }
    });
    return { items: items, scalars: scalars };
  }

  async function commit(ops) {
    var batch = db.batch(), count = 0, size = 0;
    for (var i = 0; i < ops.length; i++) {
      var op = ops[i];
      if (count >= 400 || (count > 0 && size + op.size > 3000000)) {
        await batch.commit();
        batch = db.batch(); count = 0; size = 0;
      }
      if (op.type === "set") batch.set(op.ref, op.data); else batch.delete(op.ref);
      count++; size += op.size;
    }
    if (count) await batch.commit();
  }

  async function backup() {
    requireDb();
    var u = auth.currentUser;
    if (!u) throw new Error("not-signed-in");
    var c = await collect();
    var mref = manifestRef(u.uid);
    var msnap = await mref.get();
    var M = msnap.exists ? (msnap.data() || {}) : {};
    var R = M.items || {};
    var L = readLocal(u.uid);
    var ops = [], newR = Object.assign({}, R), up = 0, del = 0;

    Object.keys(c.items).forEach(function (b) {
      var it = c.items[b], r = R[b];
      if (r && r.h === it.h) return;
      var parts = split(it.s);
      parts.forEach(function (p, i) {
        ops.push({ type: "set", ref: itemsCol(u.uid).doc(b + "__" + i), data: { b: b, i: i, d: p }, size: p.length });
      });
      if (r && r.n > parts.length) {
        for (var j = parts.length; j < r.n; j++) ops.push({ type: "del", ref: itemsCol(u.uid).doc(b + "__" + j), size: 0 });
      }
      newR[b] = { k: it.k, h: it.h, n: parts.length };
      up++;
    });

    Object.keys(R).forEach(function (b) {
      if (c.items[b] || !L[b]) return;
      for (var j = 0; j < (R[b].n || 1); j++) ops.push({ type: "del", ref: itemsCol(u.uid).doc(b + "__" + j), size: 0 });
      delete newR[b];
      del++;
    });

    var keepCloudScalars = msnap.exists && localStorage.getItem(LS_LOCAL + u.uid) === null;
    var scalarsStr = keepCloudScalars ? (M.scalars || "{}") : JSON.stringify(c.scalars);
    var sh = keepCloudScalars ? (M.sh || "") : hash(JSON.stringify(stableScalars(c.scalars)));
    if (up || del || M.sh !== sh || !msnap.exists) {
      await commit(ops);
      await mref.set({
        items: newR,
        scalars: scalarsStr,
        sh: sh,
        count: Object.keys(newR).length,
        updatedAt: global.firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    writeLocal(u.uid, c.items);
    try { localStorage.setItem(LS_LAST + u.uid, String(Date.now())); } catch (e) { }
    return { uploaded: up, deleted: del, total: Object.keys(c.items).length };
  }

  function enqueue(fn) {
    var p = chain.then(fn);
    chain = p.catch(function () { });
    return p;
  }

  function backupNow() {
    return enqueue(async function () {
      await init();
      var u = await currentUser();
      if (!u) throw new Error("not-signed-in");
      setStatus("syncing");
      try {
        var r = await backup();
        setStatus("ok");
        return r;
      } catch (e) {
        setStatus("error", e);
        throw e;
      }
    });
  }

  function scheduleBackup(delay) {
    if (!getUser()) return;
    clearTimeout(timer);
    setStatus("pending");
    timer = setTimeout(function () {
      if (!navigator.onLine) { setStatus("offline"); return; }
      backupNow().catch(function (e) { console.warn("Cloud backup:", e); });
    }, delay == null ? 20000 : delay);
  }

  /* ---------------- restore ---------------- */
  async function cloudInfo() {
    await init();
    var u = await currentUser();
    if (!u) return null;
    var snap = await manifestRef(u.uid).get();
    if (!snap.exists) return { exists: false, count: 0, reports: 0, updatedAt: null };
    var M = snap.data() || {}, items = M.items || {}, reports = 0;
    Object.keys(items).forEach(function (b) { if (items[b].k === "reports") reports++; });
    var t = M.updatedAt && M.updatedAt.toDate ? M.updatedAt.toDate() : null;
    return { exists: true, count: Object.keys(items).length, reports: reports, updatedAt: t };
  }

  function restore(mode) {
    return enqueue(async function () {
      await init();
      requireDb();
      var u = await currentUser();
      if (!u) throw new Error("not-signed-in");
      var msnap = await manifestRef(u.uid).get();
      if (!msnap.exists) return { restored: false, count: 0, bad: 0 };
      var M = msnap.data() || {}, mItems = M.items || {};
      var snap = await itemsCol(u.uid).get();
      var parts = {};
      snap.forEach(function (d) { var x = d.data(); (parts[x.b] = parts[x.b] || [])[x.i] = x.d; });
      var data = {};
      try { data = JSON.parse(M.scalars || "{}"); } catch (e) { data = {}; }
      var bad = 0, ok = 0;
      Object.keys(mItems).forEach(function (b) {
        var m = mItems[b], arr = parts[b], good = !!arr && arr.length >= m.n;
        for (var i = 0; good && i < m.n; i++) { if (arr[i] == null) good = false; }
        if (!good) { bad++; return; }
        try {
          (data[m.k] = data[m.k] || []).push(JSON.parse(arr.slice(0, m.n).join("")));
          ok++;
        } catch (e) { bad++; }
      });
      await global.RescueDB.importFullBackup(data, mode || "keep");
      var c = await collect();
      writeLocal(u.uid, c.items);
      return { restored: true, count: ok, bad: bad };
    });
  }

  function lastSync() {
    var u = getUser();
    var t = u ? Number(localStorage.getItem(LS_LAST + u.uid) || 0) : 0;
    return t ? new Date(t) : null;
  }

  /* ================= CHAT & SEARCH ================= */
  
  function chatId(a, b) { return [a, b].sort().join("_"); }

  async function searchUsers(query) {
    await init();
    if (!query || query.trim().length < 2) return [];
    var q = query.trim().toLowerCase();
    var me = auth.currentUser;
    var results = {};
    
    try {
      var snapEmail = await db.collection("users").where("email", "==", q).limit(10).get();
      snapEmail.forEach(function (doc) {
        if (doc.id !== me.uid) results[doc.id] = doc.data();
      });
    } catch (e) { }

    try {
      var snapName = await db.collection("users")
        .where("displayNameLower", ">=", q)
        .where("displayNameLower", "<=", q + "\uf8ff")

      lastAt: global.firebase.firestore.FieldValue.serverTimestamp(),

      lastMessage: lastPreview,

  }

  };

      return;

    if (!list.length) { box.innerHTML = '<p class="note">' + (filter === "all" ? "Hakuna mazungumzo bado.<br>Tafuta mtumiaji juu au bonyeza ✏️ kuanza." : "Hakuna matokeo.") + '</p>'; return; }

  function applyBlock() { var bl = !!S.blocked[peerUid]; $("composer").hidden = bl; $("blockbar").hidden = !bl; }

  function chatHeaderMenu() {
    var nm = (peerUser && (peerUser.displayName || peerUser.email)) || "";
    menuSheet(nm, [
      { ic: "🔎", t: "Tafuta kwenye chat", fn: function () { var b = openSheet('<h3>Tafuta kwenye chat</h3><input class="f" id="cs1" placeholder="Neno…"><div class="row2"><button id="cs2">Ondoa kichujio</button><button class="p" id="cs3">Tafuta</button></div>', true); var i = b.querySelector("#cs1"); i.focus(); function run(q) { q = q.toLowerCase(); Array.from($("messages").children).forEach(function (c) { if (!c.__m) return; c.style.display = !q || (plainOf(c, c.__m) + "").toLowerCase().indexOf(q) > -1 ? "" : "none"; }); } b.querySelector("#cs3").onclick = function () { run(i.value.trim()); b.remove(); }; b.querySelector("#cs2").onclick = function () { run(""); b.remove(); }; } },
      { ic: "🔐", t: S.e2e[peerUid] ? "Usimbaji: umewashwa (badili)" : "Usimbaji (E2E passphrase)", s: "Wewe na mpokeaji mnahitaji passphrase moja", fn: function () { var b = openSheet('<h3>Usimbaji wa mwisho-hadi-mwisho</h3><input class="f" id="ep" type="password" placeholder="Passphrase ya siri (ya pamoja)" value="' + esc(S.e2e[peerUid] || "") + '"><p class="note" style="padding:0 0 8px;text-align:left">Ujumbe wa maandishi utasimbwa kwa AES-256 kabla ya kutumwa. Mpe mwenzako passphrase kwa njia salama (si kwenye chat hii).</p><div class="row2"><button id="e0">Zima</button><button class="p" id="e1">Washa</button></div>', true); b.querySelector("#e0").onclick = function () { delete S.e2e[peerUid]; save(); b.remove(); toast("Usimbaji umezimwa"); }; b.querySelector("#e1").onclick = function () { var v = b.querySelector("#ep").value; if (v.length < 6) return toast("Passphrase angalau herufi 6"); S.e2e[peerUid] = v; save(); b.remove(); toast("Usimbaji umewashwa 🔒"); }; } },
      { ic: "📌", t: S.pins[peerUid] ? "Ondoa pin" : "Bandika chat", fn: function () { S.pins[peerUid] = !S.pins[peerUid]; if (!S.pins[peerUid]) delete S.pins[peerUid]; save(); toast("Imefanyika"); } },
      { ic: "🗄️", t: "Hifadhi (Archive)", fn: function () { S.arch[peerUid] = 1; save(); location.href = "chart.html"; } },
      { ic: "🔕", t: S.mute[peerUid] ? "Washa arifa" : "Zima arifa", fn: function () { S.mute[peerUid] = !S.mute[peerUid]; if (!S.mute[peerUid]) delete S.mute[peerUid]; save(); toast("Imefanyika"); } },
      { ic: "🔒", t: S.locked[peerUid] ? "Ondoa Chat Lock" : "Funga chat kwa PIN", fn: function () { needPin(function () { S.locked[peerUid] = !S.locked[peerUid]; if (!S.locked[peerUid]) delete S.locked[peerUid]; save(); toast(S.locked[peerUid] ? "Chat imefungwa" : "Chat Lock imeondolewa"); }); } },
      { ic: "🚫", t: "Mzuie", danger: true, fn: function () { toggleBlock(peerUid); } },
      { ic: "⚠️", t: "Ripoti mtumiaji", danger: true, fn: function () { reportUser(peerUid); } }
    ]);
  }

  async function openChat() {
    $("list-view").hidden = true; $("chat-view").hidden = false; $("main-area").style.overflow = "hidden";
    $("search-btn").hidden = true; $("new-btn").hidden = true; $("chat-menu").hidden = false; $("back").hidden = false; $("bnav").hidden = true;
    try { peerUser = await CloudSync.getUser(peerUid); } catch (e) { }
    if (!peerUser) { toast("Mtumiaji hakupatikana"); location.href = "chart.html"; return; }
    var nm = peerUser.displayName || peerUser.email || "Mtumiaji"; S.names[peerUid] = nm; save();
    $("top-title").textContent = nm;
    $("top-sub").textContent = peerUser.online && S.settings.lastSeen ? T("online") : (S.settings.lastSeen && peerUser.lastSeen ? "ilionekana " + ago(peerUser.lastSeen) : "");
    var av = $("top-av"); av.hidden = false; av.innerHTML = avatar(nm, peerUser.photo || peerUser.photoURL);
    document.title = nm + " — Rescue Report";
    applyBlock();
    var box = $("messages");
    try {
      var msgs = await CloudSync.getMessages(peerUid, 100);
      if (!msgs || !msgs.length) box.innerHTML = '<p class="note">Anza mazungumzo kwa kutuma ujumbe.' + (S.e2e[peerUid] ? '<br>🔒 Usimbaji umewashwa' : '') + '</p>';
      else { msgs.forEach(function (m) { appendMessage(m, false); }); box.scrollTop = box.scrollHeight; }
    } catch (e) { box.innerHTML = '<p class="note">Hitilafu kupakia ujumbe.</p>'; }
    if (S.settings.readRcpt) { try { await CloudSync.markChatRead(peerUid); } catch (e) { } }
    CloudSync.watchMessages(peerUid, function (m) {
      appendMessage(m, true);
      if (S.settings.readRcpt) CloudSync.markChatRead(peerUid).catch(function () { });
      if (m.from !== myUid() && !S.mute[peerUid] && !S.blocked[peerUid] && S.settings.notif && document.hidden && window.Notification && Notification.permission === "granted") { try { new Notification(nm, { body: S.settings.pin ? "Ujumbe mpya" : previewOf(m).slice(0, 100) }); } catch (e) { } }
    });
    // Typing indicator (inafanya kazi ikiwa CloudSync ina watchTyping/setTyping)
    var tto; cs("watchTyping", peerUid, function (on) { var s = $("top-sub"); if (on) { s.textContent = T("typing"); clearTimeout(tto); tto = setTimeout(function () { s.textContent = peerUser.online ? T("online") : ""; }, 4000); } else s.textContent = peerUser.online ? T("online") : ""; });
    var inp = $("msg-input"), lastTy = 0;
    inp.value = S.drafts[peerUid] || ""; setSendIcon();
    inp.addEventListener("input", function () {
      inp.style.height = "auto"; inp.style.height = Math.min(120, inp.scrollHeight) + "px";
      var v = inp.value; if (v.trim()) S.drafts[peerUid] = v; else delete S.drafts[peerUid]; save(); setSendIcon();
      if (Date.now() - lastTy > 2500 && v.trim()) { lastTy = Date.now(); cs("setTyping", peerUid, true); }
    });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) { e.preventDefault(); sendText(); } });
    $("send-btn").addEventListener("click", function () { if (rec) return rec.stop(); if (inp.value.trim()) sendText(); else toggleRecord(); });
    $("share-btn").addEventListener("click", attachMenu);
    $("rb-x").addEventListener("click", clearReply);
    $("chat-menu").addEventListener("click", chatHeaderMenu);
    $("unblock-btn").addEventListener("click", function () { toggleBlock(peerUid); });
  }

  /* ===== NAV ===== */
  var TITLES = { chats: "title", status: "status", settings: "settings" };
  function renderTab() {
    if (peerUid) return;
    if (tab === "chats") renderChatsTab(); else if (tab === "status") renderStatus(); else renderSettings();
    updateBadge();
  }
  function setTab() {
    document.querySelectorAll("#bnav button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === tab); });
    $("top-title").textContent = T(TITLES[tab]);
    $("search-btn").hidden = tab !== "chats"; $("new-btn").hidden = tab === "settings";
    renderTab();
  }
  document.querySelectorAll("#bnav button").forEach(function (b) { b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); setTab(); }); });
  $("back").addEventListener("click", function () { location.href = "chart.html"; });
  $("search-btn").addEventListener("click", function () { var i = $("search-input"); if (i) { i.focus(); i.scrollIntoView(); } });
  $("new-btn").addEventListener("click", newMenu);
  window.addEventListener("beforeunload", function () { cs("setTyping", peerUid, false); });

  /* ===== MWINGILIANO MPYA: makundi ya ujumbe, kitufe cha kushuka, swipe-to-reply, bonyeza-mara-mbili ===== */
  var mb = $("messages"), tbBtn = $("to-bottom"), newCnt = 0;
  function nearBottom() { return mb.scrollHeight - mb.scrollTop - mb.clientHeight < 160; }
  function groupCont(div) {
    var p = div.previousElementSibling;
    if (p && p.__m && div.__m && p.__m.from === div.__m.from && Math.abs((div.__m.at || 0) - (p.__m.at || 0)) < 12e4) { div.__cont = true; div.classList.add("cont"); }
  }
  function syncDown() {
    var far = !nearBottom(); tbBtn.hidden = false; tbBtn.classList.toggle("on", far);
    if (!far) { newCnt = 0; var e = tbBtn.querySelector("em"); if (e) e.remove(); }
  }
  function bumpNew() {
    newCnt++; var e = tbBtn.querySelector("em"); if (!e) { e = document.createElement("em"); tbBtn.appendChild(e); }
    e.textContent = newCnt; tbBtn.classList.add("on");
  }
  mb.addEventListener("scroll", syncDown, { passive: true });
  tbBtn.addEventListener("click", function () { mb.scrollTo({ top: mb.scrollHeight, behavior: "smooth" }); });
  var sx = 0, sy = 0, sb = null, sd = 0;
  mb.addEventListener("touchstart", function (e) { var b = e.target.closest(".bubble"); if (!b || !b.__m) return; sb = b; sx = e.touches[0].clientX; sy = e.touches[0].clientY; sd = 0; }, { passive: true });
  mb.addEventListener("touchmove", function (e) {
    if (!sb) return; var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (Math.abs(dy) > 24 && Math.abs(dy) > Math.abs(dx)) { sb.style.transform = ""; sb = null; return; }
    if (dx > 0) { sd = Math.min(dx, 80); sb.style.transform = "translateX(" + sd + "px)"; }
  }, { passive: true });
  mb.addEventListener("touchend", function () {
    if (!sb) return; var b = sb; sb = null; b.style.transition = "transform .18s"; b.style.transform = "";
    setTimeout(function () { b.style.transition = ""; }, 200);
    if (sd > 56) { if (navigator.vibrate) navigator.vibrate(8); setReply(b, b.__m); }
  });
  mb.addEventListener("dblclick", function (e) {
    var b = e.target.closest(".bubble"); if (!b || !b.__m || e.target.closest("a,audio,video,.more")) return;
    var m = b.__m, mk = metaOf(mkey(m)); mk.react = mk.react || {};
    if (mk.react[myUid()]) delete mk.react[myUid()]; else mk.react[myUid()] = "❤️";
    save(); cs("reactMessage", peerUid, m.id, "❤️"); render(b, m, "");
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { var l = document.querySelectorAll(".bd"); if (l.length) l[l.length - 1].remove(); } });

  /* ===== APP LOCK + START ===== */
  function lockScreen() {
    return new Promise(function (resolve) {
      var d = document.createElement("div"); d.id = "lock";
      d.innerHTML = '<div style="font-size:48px">🔒</div><h2 style="margin:0">Rescue Chat</h2><div>Weka PIN kufungua</div><input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><button id="lb" type="button">Fungua</button>';
      document.body.appendChild(d);
      async function tryIt() { if (await checkPin($("lp").value.trim())) { d.remove(); resolve(); } else { toast("PIN si sahihi"); $("lp").value = ""; } }
      $("lb").onclick = tryIt; $("lp").addEventListener("keydown", function (e) { if (e.key === "Enter") tryIt(); }); $("lp").focus();
    });
  }
  async function start() {
    applyLang(); paintIcons();
    if (!window.CloudSync || !window.RescueDB) { toast("Faili za app hazikupatikana"); return; }
    if (S.settings.pin) await lockScreen();
    try { me = await CloudSync.currentUser(); if (!me) { location.href = "login.html?next=chart.html"; return; } }
    catch (e) { location.href = "login.html?next=chart.html"; return; }
    await loadChats();
    if (peerUid) {
      if (S.locked[peerUid]) { askPin("Chat imefungwa — weka PIN", async function (p) { if (await checkPin(p)) openChat(); else { toast("PIN si sahihi"); location.href = "chart.html"; } }); }
      else openChat();
    } else { $("back").hidden = true; setTab(); }
  }
  start();
})();
</script>
