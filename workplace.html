<title>WORLD SATELLITE EXPLORER</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0b1220;--fg:#e8eefc;--mu:#8ea0c0;--card:rgba(15,23,42,.88);--bd:rgba(148,163,184,.22);--ac:#22d3ee;--ac2:#3b82f6;--in:rgba(148,163,184,.12)}
:root.light{--bg:#f1f5f9;--fg:#0f172a;--mu:#52617d;--card:rgba(255,255,255,.92);--bd:rgba(15,23,42,.14);--ac:#0891b2;--ac2:#2563eb;--in:rgba(15,23,42,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fl{position:absolute;z-index:1000;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
button{font:inherit;color:inherit;cursor:pointer}
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--in);font-weight:500}
.b:active{transform:scale(.97)}.b.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04121f;border:0;font-weight:700}
.b.on{border-color:var(--ac);color:var(--ac)}.b.d{color:#f87171}
.ib{width:42px;height:42px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px}
.ib:active{background:var(--in)}
input,select{font:inherit;color:var(--fg);background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--ac)}
#top{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;border-radius:18px;max-width:560px;padding:4px 6px;display:flex;align-items:center;gap:6px}
#top input{border:0;background:transparent;padding:10px 4px}
#sug{position:absolute;left:0;right:0;top:100%;margin-top:6px;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--bd);max-height:40vh;overflow-y:auto;display:none}
#sug div{display:flex;gap:9px;padding:11px 13px;border-top:1px solid var(--bd);cursor:pointer;font-size:13px}#sug div:first-child{border:0}
#av{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04121f;font-weight:800;display:grid;place-items:center;flex:none}
#rc{right:10px;top:calc(env(safe-area-inset-top,0px) + 74px);border-radius:16px;display:flex;flex-direction:column;padding:3px}
#rc hr{border:0;border-top:1px solid var(--bd);margin:2px 8px;width:auto}
#cp{left:10px;top:calc(env(safe-area-inset-top,0px) + 74px);width:48px;height:48px;border-radius:50%;padding:0;display:grid;place-items:center}
#co{left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);padding:7px 11px;border-radius:12px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--mu);max-width:70vw}
#off{position:fixed;z-index:1100;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);background:#f59e0b;color:#1a1200;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:600;display:none;white-space:nowrap}
#nav{left:0;right:0;bottom:0;display:flex;padding:4px 4px calc(env(safe-area-inset-bottom,0px) + 4px);border-radius:20px 20px 0 0}
#nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:7px 0;border-radius:14px;color:var(--mu)}
#nav button.on{color:var(--ac);background:var(--in)}
#pn{left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);max-height:52vh;overflow:auto;border-radius:22px 22px 0 0;padding:6px 14px 16px;display:none}
#pn .h{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card);padding:8px 0;z-index:2}
#pn .h b{flex:1;font-size:16px}#pn .h:before{content:"";position:absolute;top:0;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1 1 auto}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}.chips .b{justify-content:flex-start}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.it>div{flex:1;min-width:0}.it small,small{color:var(--mu)}
.bd{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c,#3b82f6);color:#fff;flex:none}
.card{padding:12px;border-radius:14px;background:var(--in);border:1px solid var(--bd);margin:8px 0}
#toast{position:fixed;z-index:3000;top:calc(env(safe-area-inset-top,0px) + 118px);left:50%;transform:translateX(-50%);background:rgba(2,6,23,.92);color:#fff;padding:9px 16px;border-radius:20px;display:none;max-width:90%;font-size:13px}
.ov{position:fixed;inset:0;z-index:4000;background:rgba(2,6,23,.7);display:grid;place-items:center;padding:16px}
.ov .box{width:min(380px,100%);background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.mk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.45);color:#fff}
.mk .ic{transform:rotate(45deg);width:15px;height:15px;stroke-width:2.2}
.leaflet-bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 62px)}
.leaflet-control-attribution{font-size:9px;border-radius:8px 0 0 0}
.leaflet-control-scale-line{background:var(--card);color:var(--fg);border-color:var(--mu);font-size:10px;border-radius:0 0 6px 6px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px}
.br{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#04121f;flex:none}
.ib.on{color:var(--ac)}
#pn{animation:up .22s ease}@keyframes up{from{transform:translateY(16px);opacity:0}}
#nav button.on{position:relative}#nav button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:3px;background:var(--ac)}
#lc{left:66px;right:66px;max-width:430px;top:calc(env(safe-area-inset-top,0px) + 74px);padding:8px 12px;border-radius:14px;display:none;font-size:13px;line-height:1.35}
#lc small{color:var(--mu);font-size:11px}
.lb{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:11px;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000;cursor:pointer}
.lb .d{width:18px;height:18px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:1.5px solid #fff;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.55);text-shadow:none}
.lb .d .ic{width:10px;height:10px;stroke-width:2.4}
.lb.fire .d,.lb.hosp .d{width:26px;height:26px}.lb.fire .d .ic,.lb.hosp .d .ic{width:14px;height:14px}
.lb.fire b{font-size:12px;color:#fecaca}.lb.hosp b{font-size:12px;color:#a7f3d0}
.lb.place.city b{font-size:16px;letter-spacing:.6px;text-transform:uppercase}.lb.place.town b{font-size:14px}.lb.place.village b{font-size:12.5px}
.lb.place.suburb b,.lb.place.hamlet b{font-size:11px;font-style:italic;opacity:.95}
.lb.road b{font-weight:500;font-style:italic;font-size:10px;opacity:.9}
.lt .lb{color:#0f172a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}.lt .lb.fire b{color:#b91c1c}.lt .lb.hosp b{color:#047857}
.tt{background:rgba(2,6,23,.82);color:#fff;border:0;font-size:11px;font-weight:600;padding:2px 7px;border-radius:8px;box-shadow:none}.tt:before{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--mu)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
@media(min-width:900px){.leaflet-bottom{bottom:0}}
.leaflet-popup-content-wrapper{border-radius:14px}
@media(min-width:900px){
#pn{left:14px;right:auto;width:380px;bottom:84px;max-height:calc(100vh - 190px);border-radius:20px}
#nav{left:50%;right:auto;transform:translateX(-50%);width:min(700px,96vw);bottom:12px;border-radius:22px}
#co{bottom:14px}}
#nav{overflow-x:auto;scrollbar-width:none}#nav button{flex:1 0 58px}#m3{position:absolute;inset:0;display:none}#map.h{visibility:hidden}input[type=range]{padding:0}

/* ===== Muonekano wa kisasa ===== */
:root{--bg:#070b16;--card:rgba(13,20,38,.78);--bd:rgba(148,163,184,.16);--in:rgba(148,163,184,.10);--ac:#38e1ff;--ac2:#6366f1;--sh:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);--r:20px}
:root.light{--bg:#eef2f9;--card:rgba(255,255,255,.80);--bd:rgba(15,23,42,.10);--in:rgba(15,23,42,.05);--ac:#0ea5c6;--ac2:#4f46e5;--sh:0 10px 36px rgba(30,41,90,.16),inset 0 1px 0 #fff}
html,body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.005em}
.fl{backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--sh);border-color:var(--bd)}
.b{border-radius:14px;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;font-weight:600;min-height:42px}
.b:hover{background:var(--in);border-color:var(--ac)}.b:active{transform:scale(.96)}
.b.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.45)}
.b.on{background:linear-gradient(135deg,rgba(56,225,255,.16),rgba(99,102,241,.16));box-shadow:0 0 0 1px var(--ac) inset}
.ib{transition:background .15s,transform .15s}.ib:active{transform:scale(.9)}
#top{border-radius:22px;padding:5px 7px;transition:box-shadow .25s}#top:focus-within{box-shadow:0 0 0 2px var(--ac),var(--sh)}
#av,.br{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.5)}
#rc,#cp,#lc,#co{border-radius:18px}
@media(max-width:899px){#nav{left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:24px;padding:5px}
#pn{bottom:calc(env(safe-area-inset-bottom,0px) + 78px);left:8px;right:8px;border-radius:26px;max-height:52vh;transition:max-height .3s cubic-bezier(.2,.8,.2,1),transform .2s}#pn.tall{max-height:78vh}
.leaflet-bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 78px)}}
#nav button{border-radius:18px;font-weight:600;transition:background .2s,color .2s}#nav button.on{background:linear-gradient(135deg,rgba(56,225,255,.18),rgba(99,102,241,.2))}
#nav button.on:before{left:34%;right:34%;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 10px var(--ac)}
#nav button .ic{transition:transform .2s}#nav button.on .ic{transform:translateY(-2px) scale(1.1)}
#pn{padding:4px 16px 18px;animation:up .32s cubic-bezier(.2,.8,.2,1)}#pn .h{touch-action:none;cursor:grab;padding:16px 0 8px}#pn .h b{font-size:18px;font-weight:700;letter-spacing:.01em}
#pn .h:before{width:44px;height:5px;margin-left:-22px;top:5px;background:var(--mu);opacity:.45}
.it{padding:11px 8px;border-radius:14px;border-top:0;margin:2px 0;transition:background .15s;cursor:pointer}.it:hover,.it:active{background:var(--in)}
.card{border-radius:18px;padding:14px}.bd{border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.wxc{color:#fff;border:0;background:linear-gradient(135deg,#0ea5e9,#6366f1)}.wxc small{color:rgba(255,255,255,.85)}.wxc.cl{background:linear-gradient(135deg,#64748b,#334155)}.wxc.rn{background:linear-gradient(135deg,#2563eb,#1e293b)}.wxc.st{background:linear-gradient(135deg,#7c3aed,#0f172a)}
.sk{height:64px;border-radius:16px;margin:8px 0;background:linear-gradient(90deg,var(--in) 25%,var(--bd) 50%,var(--in) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
#toast{border-radius:16px;background:rgba(10,15,30,.9);backdrop-filter:blur(14px);border:1px solid var(--bd);box-shadow:var(--sh);animation:up .25s}
.mk{transition:transform .2s}.mk:hover{transform:rotate(-45deg) scale(1.15)}
.leaflet-popup-content-wrapper{border-radius:18px;box-shadow:var(--sh)}
input,select{border-radius:14px}input[type=range]{accent-color:var(--ac)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(56,225,255,.6)}100%{box-shadow:0 0 0 18px rgba(56,225,255,0)}}.leaflet-interactive.me{animation:pulse 1.8s infinite}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
if(typeof L==='undefined'){document.body.insertAdjacentHTML('afterbegin','<div class="ov"><div class="box" style="color:var(--fg)">Leaflet haijapakia. Washa mtandao kisha fungua upya faili hili kwenye Chrome (si ndani ya preview ya Claude).</div></div>');throw new Error('no leaflet')}
const $=s=>document.querySelector(s);
const I=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const toast=(t,ms=3200)=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)};
const j=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error(r.status);return r.json()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== IndexedDB: kv (mipangilio), tiles (ramani offline), marks (alama za mtumiaji) ===== */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('wse',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('tiles');d.createObjectStore('marks',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=(s,m,f)=>DB.then(d=>new Promise((ok,no)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=no}));
const get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v,k)=>tx(s,'readwrite',o=>o.put(v,k)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),all=s=>tx(s,'readonly',o=>o.getAll()),clr=s=>tx(s,'readwrite',o=>o.clear());
let P={theme:'dark',base:'sat',tt:'',ov:{}};const savePrefs=()=>{put('kv',P,'prefs').catch(()=>{});sched()};
const applyTheme=()=>{document.documentElement.classList.toggle('light',P.theme==='light')};

/* ===== Ramani ===== */
L.TileLayer.Cached=L.TileLayer.extend({async par(c){for(let k=1;k<=4;k++){const z=c.z-k;if(z<0)break;const p={x:c.x>>k,y:c.y>>k,z},b=await get('tiles',this.getTileUrl(p)).catch(()=>null);if(b){try{const bm=await createImageBitmap(b),sz=256>>k,cv=document.createElement('canvas');cv.width=cv.height=256;cv.getContext('2d').drawImage(bm,(c.x-(p.x<<k))*sz,(c.y-(p.y<<k))*sz,sz,sz,0,0,256,256);return cv.toDataURL('image/jpeg',.85)}catch{}}}return null},createTile(c,done){const img=document.createElement('img');img.alt='';const u=this.getTileUrl(c);
const fin=()=>{img.onload=img.onerror=()=>done(null,img)},show=b=>{fin();img.src=URL.createObjectURL(b)};
get('tiles',u).then(b=>b?show(b):fetch(u).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>{put('tiles',b,u).catch(()=>{});show(b)})).catch(()=>this.par(c).then(d=>{fin();img.src=d||u})).catch(()=>{fin();img.src=u});return img}});
const map=L.map('map',{zoomControl:false,center:[0,20],zoom:3,worldCopyJump:true});map.attributionControl.setPrefix(false);
const esri=p=>`https://server.arcgisonline.com/ArcGIS/rest/services/${p}/MapServer/tile/{z}/{y}/{x}`;
const T=(u,o)=>new L.TileLayer.Cached(u,Object.assign({maxZoom:19},o));
const bases={sat:T(esri('World_Imagery'),{maxNativeZoom:17,attribution:'Esri World Imagery (picha hazisasishwi moja kwa moja)'}),
street:T('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}),
terrain:T('https://tile.opentopomap.org/{z}/{x}/{y}.png',{maxNativeZoom:17,maxZoom:19,attribution:'&copy; OpenTopoMap'}),
topo:T(esri('World_Topo_Map'),{maxNativeZoom:17,attribution:'Esri Topo'})};
const BN={sat:['sat','Satellite'],street:['road','Street'],terrain:['mount','Terrain'],topo:['layers','Topo']};
const KEYS={tomtom:''}; /* Weka TomTom key yako HAPA mara moja (si kwa watumiaji). Acha tupu kuficha Trafiki. */
const OV={labels:['text','Majina na mipaka (Hybrid)',()=>T(esri('Reference/World_Boundaries_and_Places'))],
roads:['road','Barabara',()=>T(esri('Reference/World_Transportation'))],
rain:['rain','Mvua (RainViewer)',async()=>{const d=await j('https://api.rainviewer.com/public/weather-maps.json');return L.tileLayer(d.host+d.radar.past.slice(-1)[0].path+'/256/{z}/{x}/{y}/2/1_1.png',{opacity:.6,attribution:'RainViewer'})}],
cloud:['cloud','Mawingu (satellite)',async()=>{const d=await j('https://api.rainviewer.com/public/weather-maps.json');return L.tileLayer(d.host+d.satellite.infrared.slice(-1)[0].path+'/256/{z}/{x}/{y}/0/0_0.png',{opacity:.55,attribution:'RainViewer'})}],
traffic:['traffic','Trafiki (TomTom)',()=>{if(!KEYS.tomtom)throw new Error('Trafiki haijawashwa');return L.tileLayer(`https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key=${KEYS.tomtom}`,{opacity:.8,attribution:'TomTom'})}]};
const ovL={};
function setNz(n){P.nz=n;[bases.sat,bases.topo].forEach(l=>{l.options.maxNativeZoom=n;l.redraw()});savePrefs();show('sat');toast('Picha halisi hadi zoom '+n+'; zaidi ya hapo hukuzwa')}
function setBase(k){Object.values(bases).forEach(l=>map.removeLayer(l));bases[k].addTo(map).bringToBack();$('#map').classList.toggle('lt',k!=='sat');P.base=k;savePrefs();show.cur==='sat'&&show('sat')}
async function toggleOv(k){try{if(ovL[k]){map.removeLayer(ovL[k]);delete ovL[k];P.ov[k]=0}else{ovL[k]=await OV[k][2]();ovL[k].addTo(map);P.ov[k]=1}savePrefs()}catch(e){toast('Imeshindwa: '+e.message)}['sat','wx'].includes(show.cur)&&show(show.cur)}
$('#rc').innerHTML=`<button class="ib" onclick="show('sat',1)" title="Tabaka">${I('layers')}</button><hr><button class="ib" onclick="zi()">${I('plus')}</button><button class="ib" onclick="zo()">${I('minus')}</button><hr><button class="ib" id="nb" onclick="togNames()" title="Majina">${I('tag')}</button><button class="ib" onclick="locate()" title="Eneo langu">${I('locate')}</button><button class="ib" onclick="fs()" title="Skrini nzima">${I('full')}</button>`;

/* ===== GPS, dira, kushiriki ===== */
let me,mc,watch,lastPos;
function upd(p){lastPos=p;const c=p.coords,ll=[c.latitude,c.longitude];me?me.setLatLng(ll):me=L.circleMarker(ll,{className:'me',radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(map);
mc?mc.setLatLng(ll).setRadius(c.accuracy):mc=L.circle(ll,{radius:c.accuracy,weight:1}).addTo(map);
$('#co').innerHTML=`${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)}<br>Usahihi &plusmn;${Math.round(c.accuracy)} m${c.altitude!=null?' &bull; Mwinuko '+Math.round(c.altitude)+' m':''}`}
function locate(){if(!navigator.geolocation)return toast('GPS haipatikani');navigator.geolocation.getCurrentPosition(p=>{upd(p);goTo(p.coords.latitude,p.coords.longitude,Math.max(map.getZoom(),16))},e=>toast('GPS: '+e.message),{enableHighAccuracy:true,timeout:15000})}
function track(){if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null;toast('Ufuatiliaji umezimwa')}else{watch=navigator.geolocation.watchPosition(upd,e=>toast('GPS: '+e.message),{enableHighAccuracy:true});toast('Ufuatiliaji umewashwa')}show('exp')}
const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast('Skrini nzima haipatikani'));
$('#cp').onclick=async()=>{try{if(DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch{}
const h=e=>{const a=e.webkitCompassHeading??(e.alpha!=null?360-e.alpha:null);if(a!=null)$('#cps').style.transform=`rotate(${-a}deg)`};addEventListener('deviceorientationabsolute',h,true);addEventListener('deviceorientation',h,true)};
const share=(lat,lng,n='Eneo')=>{const t=`${n}: ${lat.toFixed(6)}, ${lng.toFixed(6)}`,u=`https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=17/${lat}/${lng}`;
navigator.share?navigator.share({title:n,text:t,url:u}).catch(()=>{}):navigator.clipboard.writeText(t+' '+u).then(()=>toast('Imenakiliwa'))};

/* ===== Utafutaji (Nominatim) ===== */
const nom=q=>j('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=sw,en&q='+encodeURIComponent(q));
let st;$('#q').oninput=e=>{clearTimeout(st);const v=e.target.value.trim(),s=$('#sug');if(v.length<3){s.style.display='none';return}
st=setTimeout(async()=>{try{const r=await nom(v);s.innerHTML='';s.style.display=r.length?'block':'none';r.forEach(x=>{const d=document.createElement('div');d.innerHTML=I('pin')+`<span>${esc(x.display_name)}</span>`;d.onclick=()=>{s.style.display='none';$('#q').value=x.name||v;
if(x.boundingbox){const b=x.boundingbox.map(Number);map.flyToBounds([[b[0],b[2]],[b[1],b[3]]],{maxZoom:17})}else map.flyTo([+x.lat,+x.lon],15);
L.marker([+x.lat,+x.lon],{icon:mkIcon('pin')}).addTo(map).bindPopup(esc(x.display_name)).openPopup()};s.append(d)})}catch{toast('Utafutaji umeshindwa (mtandao?)')}},600)};

/* ===== Alama (IndexedDB + wingu) ===== */
const TY={pin:['pin','Alama','#3b82f6'],fire:['flame','Kituo cha zimamoto','#ef4444'],hosp:['cross','Hospitali','#10b981'],hydrant:['drop','Hydrant','#06b6d4'],water:['drop','Chanzo cha maji','#0ea5e9'],assembly:['users','Eneo la mkusanyiko','#22c55e'],incident:['flame','Tukio','#f97316'],hazard:['alert','Eneo hatari','#eab308'],evac:['arrow','Njia ya kuhama','#8b5cf6'],rescue:['buoy','Njia ya uokoaji','#ec4899']};
const mkIcon=t=>{const y=TY[t]||TY.pin;return L.divIcon({className:'',html:`<div class="mk" style="--c:${y[2]}">${I(y[0])}</div>`,iconSize:[30,30],iconAnchor:[15,36],popupAnchor:[0,-34]})};
const mk=L.layerGroup().addTo(map),emL=L.layerGroup().addTo(map);let marks=[];
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function loadMarks(){marks=(await all('marks')).filter(m=>!m.del).sort((a,b)=>b.t-a.t);mk.clearLayers();setTimeout(()=>m3on&&sync3());marks.forEach(m=>L.marker([m.lat,m.lng],{icon:mkIcon(m.type)}).addTo(mk).bindPopup(`<b>${esc(m.name)}</b><br>${TY[m.type]?.[1]||''}<br>${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}`))}
async function saveM(m){m.t=Date.now();await put('marks',m);await loadMarks();sched();['loc'].includes(show.cur)&&show('loc')}
async function addMark(ll,type='pin',name){name=name||prompt('Jina la alama:',TY[type][1]);if(name===null)return;await saveM({id:nid(),lat:ll.lat,lng:ll.lng,type,name});toast('Imehifadhiwa')}
const editM=async id=>{const m=marks.find(x=>x.id==id),n=prompt('Jina jipya:',m.name);if(n){m.name=n;await saveM(m)}};
const delM=async id=>{if(confirm('Futa alama hii?')){await saveM({id:marks.find(x=>x.id==id).id,del:1,lat:0,lng:0});show.cur&&show(show.cur)}};
const goM=id=>{const m=marks.find(x=>x.id==id);map.flyTo([m.lat,m.lng],16)};
const shM=id=>{const m=marks.find(x=>x.id==id);share(m.lat,m.lng,m.name)};

/* ===== Vipimo ===== */
let mode=null,addType='pin',mp=[],mType='line';const mg=L.layerGroup().addTo(map);
const fmtL=m=>m>=1000?(m/1000).toFixed(3)+' km':m.toFixed(1)+' m';
const areaOf=p=>{const R=6378137;let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=(b.lng-a.lng)*Math.PI/180*(2+Math.sin(a.lat*Math.PI/180)+Math.sin(b.lat*Math.PI/180))}return Math.abs(s*R*R/2)};
function mDraw(){mg.clearLayers();mp.forEach(p=>L.circleMarker(p,{radius:5,color:'#f59e0b',fillOpacity:1}).addTo(mg));
if(mp.length>1)(mType==='area'&&mp.length>2?L.polygon:L.polyline)(mp,{color:'#f59e0b'}).addTo(mg);
let d=0;for(let i=1;i<mp.length;i++)d+=mp[i-1].distanceTo(mp[i]);const per=d+(mp.length>2?mp[mp.length-1].distanceTo(mp[0]):0);let h=`Umbali: <b>${fmtL(d)}</b>`;
if(mType==='area'&&mp.length>2){const a=areaOf(mp);h=`Mzunguko: <b>${fmtL(per)}</b><br>Eneo: <b>${a.toFixed(1)} m&sup2;</b> &bull; <b>${(a/1e4).toFixed(3)} ha</b> &bull; ${(a/1e6).toFixed(4)} km&sup2;`}
$('#mres')&&($('#mres').innerHTML=h+`<br><small>Pointi: ${mp.length}</small>`)}
const mSet=t=>{mType=t;mp=[];mDraw()};

/* ===== Uelekezaji (OSRM ya OSM) ===== */
const rg=L.layerGroup().addTo(map),MV={foot:'routed-foot',car:'routed-car',bike:'routed-bike'};
const sw=s=>s.replace('left','kushoto').replace('right','kulia').replace('straight','moja kwa moja').replace('slight','kidogo').replace('sharp','kali');
async function geo(v){const m=v.match(/^\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*$/);if(m)return[+m[1],+m[2]];if(/mahali pangu/i.test(v)&&lastPos)return[lastPos.coords.latitude,lastPos.coords.longitude];const r=await nom(v);if(!r[0])throw new Error('Hajapatikana: '+v);return[+r[0].lat,+r[0].lon]}
async function route(){try{$('#rr').innerHTML='<small>Inahesabu...</small>';const a=await geo($('#ra').value),b=await geo($('#rb').value),m=window.rmode||'car';
const d=await j(`https://routing.openstreetmap.de/${MV[m]}/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?alternatives=true&steps=true&overview=full&geometries=geojson`);
rg.clearLayers();let bd;d.routes.forEach((r,i)=>{const l=L.geoJSON(r.geometry,{style:{color:i?'#94a3b8':'#3b82f6',weight:i?4:6,opacity:i?.7:.95}}).addTo(rg);if(!i)bd=l.getBounds()});map.fitBounds(bd,{padding:[40,40]});
$('#rr').innerHTML=d.routes.map((r,i)=>`<div class="card"><b>${i?'Njia mbadala '+i:'Njia kuu'}</b><br>${fmtL(r.distance)} &bull; ${Math.round(r.duration/60)} dakika</div>`).join('')+d.routes[0].legs[0].steps.map(s=>`<div class="it">${I('arrow')}<div>${({depart:'Anza',arrive:'Umefika'})[s.maneuver.type]||'Geuka'} ${sw(s.maneuver.modifier||'')}${s.name?' - '+esc(s.name):''}<br><small>${fmtL(s.distance)}</small></div></div>`).join('')
}catch(e){$('#rr').innerHTML='Imeshindwa: '+esc(e.message)}}
const setRm=m=>{window.rmode=m;document.querySelectorAll('.rm').forEach(b=>b.classList.toggle('on',b.dataset.m===m))};

/* ===== Dharura (Overpass + alama zako) ===== */
async function loadEm(){if(map.getZoom()<11)return toast('Sogea zaidi (zoom 11 au zaidi)');const b=map.getBounds(),bb=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].join(),
q=`[out:json][timeout:25];(nwr[amenity=fire_station](${bb});nwr[amenity=hospital](${bb});node[emergency=fire_hydrant](${bb});node[emergency=assembly_point](${bb});nwr[emergency=water_tank](${bb});node[amenity=drinking_water](${bb}););out center 300;`;
let d;toast('Inapakia vituo...');try{d=await j('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)});put('kv',d,'lastem').catch(()=>{})}catch{d=await get('kv','lastem');if(!d)return toast('Imeshindwa, hakuna data iliyohifadhiwa');toast('Mtandao umeshindwa: data ya mwisho iliyohifadhiwa')}
emL.clearLayers();d.elements.forEach(e=>{const t=e.tags,ll=[e.lat??e.center?.lat,e.lon??e.center?.lon];if(!ll[0])return;
const k=t.amenity==='fire_station'?'fire':t.amenity==='hospital'?'hosp':t.emergency==='fire_hydrant'?'hydrant':t.emergency==='assembly_point'?'assembly':'water';
const mm=L.marker(ll,{icon:mkIcon(k)}).addTo(emL).bindPopup(`<b>${esc(t.name||TY[k][1])}</b><br>${TY[k][1]}${t.phone?'<br>Simu: '+esc(t.phone):''}`);if(t.name&&(k==='fire'||k==='hosp'))mm.bindTooltip(esc(t.name),{permanent:true,direction:'bottom',offset:[0,2],className:'tt'})});toast('Vimepatikana: '+d.elements.length)}
const startAdd=t=>{mode='add';addType=t;toast('Gusa ramani kuweka: '+TY[t][1])};

/* ===== Majina: vituo, kijiji, kata, mitaa, barabara, maduka (OSM Overpass + cache ya IndexedDB) ===== */
const nl=L.layerGroup().addTo(map),NC={};L.control.scale({imperial:false,position:'bottomright'}).addTo(map);
const KD={fire:['flame','#ef4444','Kituo cha zimamoto',2],hosp:['cross','#10b981','Hospitali / zahanati',3],stay:['bed','#ec4899','Guest / hoteli',5],police:['shield','#3b82f6','Polisi',6],school:['school','#8b5cf6','Shule',7],bank:['bank','#eab308','Benki',8],market:['bag','#f97316','Soko',9],worship:['temple','#a78bfa','Ibada',12],shop:['bag','#06b6d4','Duka',13],food:['cup','#f43f5e','Mgahawa',14]};
const PL={city:0,town:1,village:4,suburb:10,hamlet:11,neighbourhood:15,quarter:15,locality:16},PLN={city:'Jiji',town:'Mji',village:'Kijiji',suburb:'Mtaa / Kata',hamlet:'Kitongoji',neighbourhood:'Mtaa',quarter:'Mtaa',locality:'Eneo'};
function kindOf(t){if(t.place)return['place',t.place];const m={fire_station:'fire',hospital:'hosp',clinic:'hosp',pharmacy:'hosp',school:'school',college:'school',police:'police',bank:'bank',marketplace:'market',place_of_worship:'worship',restaurant:'food',cafe:'food'}[t.amenity];
if(m)return[m];if(t.shop)return['shop'];if(t.tourism)return['stay'];if(t.highway)return['road'];return null}
function slim(e){const t=e.tags||{},k=kindOf(t);if(!k)return null;const n=t.name||t['name:sw']||(k[0]==='fire'?'Kituo cha Zimamoto':'');if(!n)return null;const la=e.lat??e.center?.lat,lo=e.lon??e.center?.lon;if(la==null)return null;
return{k:k[0],s:k[1]||'',n,la,lo,p:t.phone||t['contact:phone']||'',h:t.opening_hours||'',a:[t['addr:street'],t['addr:city']].filter(Boolean).join(', ')}}
async function fetchCell(key,bb,tier){const x=tier>1,q=`[out:json][timeout:25];(node[place~"^(city|town|village|hamlet|suburb${x?'|neighbourhood|quarter|locality':''})$"][name](${bb});nwr[amenity=fire_station](${bb});nwr[amenity~"^(hospital${x?'|clinic|pharmacy|school|college|police|bank|marketplace|place_of_worship|restaurant|cafe':''})$"][name](${bb});${x?`nwr[shop][name](${bb});nwr[tourism~"^(hotel|guest_house|hostel|motel)$"][name](${bb});`:''}${tier>2?`way[highway~"^(motorway|trunk|primary|secondary|tertiary|residential|unclassified|service|track)$"][name](${bb});`:''});out center tags 700;`;
const d=await j('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)}),out=d.elements.map(slim).filter(Boolean);put('kv',out,key).catch(()=>{});return out}
const popH=e=>`<b>${esc(e.n)}</b><br>${e.k==='place'?PLN[e.s]||'Eneo':e.k==='road'?'Barabara':KD[e.k][2]}${e.a?'<br>'+esc(e.a):''}${e.p?'<br>Simu: '+esc(e.p):''}${e.h?'<br>Saa: '+esc(e.h):''}<br><small>${e.la.toFixed(5)}, ${e.lo.toFixed(5)}</small>`;
function drawNames(els){nl.clearLayers();const seen=new Set(),used=new Set(),sz=map.getSize(),pr=e=>e.k==='place'?(PL[e.s]??16):e.k==='road'?30:KD[e.k][3];let cnt=0;
els=els.slice().sort((a,b)=>pr(a)-pr(b));
for(const e of els){const key=e.n+e.la.toFixed(4)+e.lo.toFixed(4);if(seen.has(key))continue;seen.add(key);const pt=map.latLngToContainerPoint([e.la,e.lo]);if(pt.x<-40||pt.y<-20||pt.x>sz.x+40||pt.y>sz.y+20)continue;
const big=e.k==='fire'||e.k==='hosp'||(e.k==='place'&&PL[e.s]<=1);
if(!big){const c=e.k==='road'?'r'+Math.floor(pt.x/150)+','+Math.floor(pt.y/22):Math.floor(pt.x/115)+','+Math.floor(pt.y/26);if(used.has(c))continue;used.add(c)}
if(++cnt>350)break;const d=(e.k==='place'||e.k==='road')?'':`<span class="d" style="--c:${KD[e.k][1]}">${I(KD[e.k][0])}</span>`;
L.marker([e.la,e.lo],{icon:L.divIcon({className:'',iconSize:null,iconAnchor:[9,9],html:`<div class="lb ${e.k} ${e.k==='place'?e.s:''}">${d}<b>${esc(e.n)}</b></div>`}),zIndexOffset:big?500:0}).addTo(nl).bindPopup(popH(e))}}
let nTok=0;

const tier=z>=16?3:z>=14?2:1,cs=z>=14?0.04:0.2,b=map.getBounds(),x0=Math.floor(b.getWest()/cs),x1=Math.floor(b.getEast()/cs),y0=Math.floor(b.getSouth()/cs),y1=Math.floor(b.getNorth()/cs);
if((x1-x0+1)*(y1-y0+1)>12)return;let els=[],miss=0;
for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){if(tok!==nTok)return;const key=`nm${tier}:${cs}:${x}:${y}`;let d=NC[key]||await get('kv',key).catch(()=>null);

const gp=(x,y,n)=>({type:'Feature',properties:{name:n},geometry:{type:'Point',coordinates:[x,y]}});
function parse(t,n){let f=[];if(/\.(geo)?json$/i.test(n)){const g=JSON.parse(t);return g.features||[g]}
const x=new DOMParser().parseFromString(t,'text/xml');
if(/\.gpx$/i.test(n)){x.querySelectorAll('wpt').forEach(w=>f.push(gp(+w.getAttribute('lon'),+w.getAttribute('lat'),w.querySelector('name')?.textContent)));
x.querySelectorAll('trkseg').forEach(s=>f.push({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:[...s.querySelectorAll('trkpt')].map(p=>[+p.getAttribute('lon'),+p.getAttribute('lat')])}}))}
else x.querySelectorAll('Placemark').forEach(p=>{const c=p.querySelector('coordinates')?.textContent.trim().split(/\s+/).map(s=>s.split(',').map(Number));if(!c)return;const n=p.querySelector('name')?.textContent;f.push(c.length>1?{type:'Feature',properties:{name:n},geometry:{type:'LineString',coordinates:c}}:gp(c[0][0],c[0][1],n))});return f}
const imp=document.createElement('input');imp.type='file';imp.accept='.geojson,.json,.kml,.gpx';
imp.onchange=async()=>{const f=imp.files[0];if(!f)return;try{const fe=parse(await f.text(),f.name),rest=[];
for(const e of fe){if(e.geometry?.type==='Point'){const[x,y]=e.geometry.coordinates;await put('marks',{id:nid(),lat:y,lng:x,type:'pin',name:e.properties?.name||'Alama',t:Date.now()})}else rest.push(e)}
await loadMarks();sched();if(rest.length){const l=L.geoJSON({type:'FeatureCollection',features:rest},{style:{color:'#a855f7'}}).addTo(map);map.fitBounds(l.getBounds())}toast('Imeingizwa: '+fe.length)}catch(e){toast('Faili si sahihi')}imp.value=''};

async function dl(){const lay=bases[P.base],b=map.getBounds(),z0=map.getZoom(),mx=lay.options.maxNativeZoom||lay.options.maxZoom,urls=[];
for(let z=z0;z<=Math.min(z0+2,mx);z++){const a=map.project(b.getNorthWest(),z),c=map.project(b.getSouthEast(),z),n=1<<z;
for(let x=Math.floor(a.x/256);x<=Math.floor(c.x/256);x++)for(let y=Math.floor(a.y/256);y<=Math.floor(c.y/256);y++)urls.push(L.Util.template(lay._url,{x:((x%n)+n)%n,y,z}))}
if(urls.length>600)return toast(`Tiles ${urls.length} ni nyingi (kiwango 600). Sogea zaidi kisha jaribu tena.`,5000);
let i=0,ok=0;const w=async()=>{while(i<urls.length){const u=urls[i++];try{if(!await get('tiles',u)){const r=await fetch(u);if(r.ok)await put('tiles',await r.blob(),u)}ok++}catch{}if(i%25===0)toast(`Inapakua ${i}/${urls.length}`)}};
await Promise.all([w(),w(),w(),w()]);toast(`Imehifadhiwa tiles ${ok}/${urls.length}`,4000)}
