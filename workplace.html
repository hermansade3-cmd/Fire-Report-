<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fire Report – Workplace</title>
<meta name="description" content="Fire Report Workplace: mtandao wa kitaalamu, timu, majukumu, ujumbe na ripoti za pamoja kwa maafisa wa Zimamoto na Uokoaji.">
<meta name="theme-color" content="#0e1420">
<style>
/* ===== Tokens (zinafanana na style.css ya Fire Report) ===== */
:root{
  --bg:#0e1420;--bg-raised:#161f30;--bg-raised-2:#1c283d;--line:#2a3650;--text:#eef2f8;--text-dim:#9fb0c9;--text-faint:#6b7a94;
  --accent:#e05a2f;--accent-dim:#a9431f;--accent-text:#fff3ec;--ok:#3fb27f;--warn:#e0a930;--danger:#e0492f;--danger-bg:#3a1a16;
  --info:#6fa8dc;--radius:10px;--radius-sm:6px;--nav-h:64px;--topbar-h:56px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;
}
[data-theme="light"]{
  --bg:#f4f5f7;--bg-raised:#ffffff;--bg-raised-2:#eceff3;--line:#d7dce4;--text:#171b24;--text-dim:#4b5568;--text-faint:#808ea3;
  --accent:#cf4a24;--accent-dim:#a9431f;--accent-text:#ffffff;--danger-bg:#fbe3df;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--text);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
  background:radial-gradient(circle at 10% 0%,rgba(224,90,47,.12),transparent 28%),radial-gradient(circle at 90% 12%,rgba(63,178,127,.09),transparent 25%),var(--bg);}
h1,h2,h3,h4{margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 8px}
button,input,select,textarea{font-family:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
.muted{color:var(--text-faint);font-size:12px}
.dim{color:var(--text-dim)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Shell ===== */
#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;height:var(--topbar-h);display:flex;align-items:center;gap:8px;padding:0 12px;
  background:color-mix(in srgb,var(--bg-raised) 82%,transparent);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);
  border-bottom:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.10)}
.topbar h1{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{background:none;border:none;color:var(--text);font-size:18px;padding:7px 9px;cursor:pointer;border-radius:var(--radius-sm);line-height:1;position:relative}
.icon-btn:active{background:var(--bg-raised-2)}
.sync-pill{font-size:11px;border:1px solid var(--line);background:var(--bg-raised-2);color:var(--text-dim);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.sync-pill.ok{color:var(--ok);border-color:var(--ok)}
.sync-pill.off{color:var(--warn);border-color:var(--warn)}
.sync-pill.bad{color:var(--danger);border-color:var(--danger)}
.banner{background:var(--bg-raised-2);color:var(--warn);font-size:12px;text-align:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.content-col{flex:1;min-width:0;display:flex;flex-direction:column}
main{flex:1;padding:14px 14px calc(var(--nav-h) + 24px);max-width:820px;width:100%;margin:0 auto}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);display:flex;z-index:30;
  background:color-mix(in srgb,var(--bg-raised) 85%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;cursor:pointer;position:relative}
.bottom-nav .ic{font-size:20px;line-height:1}
.bottom-nav button.active{color:var(--accent);font-weight:800}
.sidebar{display:none}
.nbadge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-text);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
@media (min-width:760px){
  .bottom-nav{display:none}
  main{padding-bottom:40px}
  #app{flex-direction:row}
  .sidebar{width:210px;background:color-mix(in srgb,var(--bg-raised) 85%,transparent);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 8px;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar button{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--text-dim);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;text-align:left;position:relative}
  .sidebar button.active{background:var(--bg-raised-2);color:var(--accent);font-weight:600}
  .sidebar .nbadge{position:static;margin-left:auto}
  .sidebar .brand{font-weight:800;padding:6px 12px 14px;font-size:15px}
  .sidebar .brand span{color:var(--accent)}
}

/* ===== Buttons / cards / forms ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:15px;border:1px solid var(--line);background:var(--bg-raised-2);color:var(--text);
  padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;box-shadow:0 5px 16px rgba(0,0,0,.07);transition:transform .16s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn-primary:active{background:var(--accent-dim)}
.btn-danger{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.btn-ghost{background:transparent;box-shadow:none}
.btn-sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:12px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.card{background:linear-gradient(145deg,color-mix(in srgb,var(--bg-raised) 92%,transparent),color-mix(in srgb,var(--bg-raised-2) 68%,transparent));
  border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.card-title{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-bottom:10px;font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:var(--bg-raised);margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden}
.item:active{transform:scale(.99)}
.item.unread{border-color:var(--accent)}
.item .t{font-weight:700;font-size:14px}
.item .s{font-size:12px;color:var(--text-dim)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat-box{background:var(--bg-raised);border:1px solid var(--line);border-radius:17px;padding:12px 8px;text-align:center;cursor:pointer}
.stat-box .num{font-size:22px;font-weight:800;color:var(--accent)}
.stat-box .label{font-size:11px;color:var(--text-dim);margin-top:2px}
.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--bg-raised);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;font-weight:600;font-size:13px;position:relative}
.tile .ic{display:block;font-size:24px;margin-bottom:4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:5px}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=search],.field input[type=number],.field input[type=date],.field input[type=datetime-local],.field select,.field textarea,.input{
  width:100%;background:var(--bg-raised-2);border:1px solid var(--line);color:var(--text);border-radius:var(--radius-sm);padding:11px 12px;font-size:15px;min-height:44px}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.field-row{display:flex;gap:10px}.field-row .field{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--bg-raised-2);color:var(--text-dim);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.tag{display:inline-block;font-size:11px;background:var(--bg-raised-2);border:1px solid var(--line);color:var(--text-dim);border-radius:999px;padding:3px 9px;margin:2px 4px 2px 0}
.badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--bg-raised-2);color:var(--text-dim)}
.b-ok{background:#163a2c;color:var(--ok)}.b-warn{background:#3a3320;color:var(--warn)}.b-info{background:#1e2f45;color:var(--info)}.b-bad{background:var(--danger-bg);color:var(--danger)}
[data-theme="light"] .b-ok{background:#d9f2e6}[data-theme="light"] .b-warn{background:#fbefcf}[data-theme="light"] .b-info{background:#dcebf8}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--accent),#ff8a3d);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:78px;height:78px;font-size:26px}
.avatar.sm{width:30px;height:30px;font-size:12px}
.empty{text-align:center;padding:30px 16px;color:var(--text-faint);font-size:14px}
.empty .ic{font-size:36px;margin-bottom:8px}
.bar{height:6px;background:var(--bg-raised-2);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.tile .nbadge{left:auto;right:8px;top:8px}
.kv{display:grid;grid-template-columns:38% 1fr;gap:4px 8px;font-size:13px}
.kv .k{color:var(--text-faint)}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.switch-row:last-child{border-bottom:none}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:none;color:var(--text-faint);padding:10px 14px;font-size:14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.sel{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.sk{height:62px;border-radius:16px;margin-bottom:8px;background:linear-gradient(90deg,var(--bg-raised) 25%,var(--bg-raised-2) 50%,var(--bg-raised) 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px);z-index:25;width:54px;height:54px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-text);font-size:26px;box-shadow:0 8px 24px rgba(224,90,47,.4);cursor:pointer}
@media (min-width:760px){.fab{bottom:24px}}

/* ===== Modal / toast ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(7,10,16,.58);backdrop-filter:blur(7px);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal{background:var(--bg-raised);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
@media (min-width:600px){.modal-backdrop{align-items:center}.modal{border-radius:22px}}
.modal h3{margin-bottom:12px}
.modal .btn-row{margin-top:14px}
#toast-host{position:fixed;bottom:calc(var(--nav-h) + 12px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:300;pointer-events:none}
.toast{background:var(--bg-raised-2);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:999px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:92vw}
.toast.err{border-color:var(--danger);color:var(--danger)}.toast.ok{border-color:var(--ok);color:var(--ok)}

/* ===== Messaging ===== */
.thread{display:flex;flex-direction:column;gap:6px;padding-bottom:10px}
.bubble{max-width:82%;padding:8px 22px 8px 11px;border-radius:16px;font-size:14px;line-height:1.4;background:var(--bg-raised-2);border:1px solid var(--line);align-self:flex-start;word-break:break-word;position:relative}
.bubble.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 22%,var(--bg-raised));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.bubble .who{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.bubble .meta{font-size:10px;color:var(--text-faint);margin-top:3px;text-align:right;display:flex;gap:6px;justify-content:flex-end;align-items:center}
.bubble .quote{border-left:3px solid var(--accent);background:rgba(127,127,127,.12);padding:4px 8px;border-radius:6px;margin-bottom:5px;font-size:12px;color:var(--text-dim)}
.bubble.pending{opacity:.65}.bubble.failed{border-color:var(--danger)}
.bubble.deleted{font-style:italic;color:var(--text-faint)}
.bubble img.att{max-width:100%;border-radius:10px;display:block;margin-bottom:4px;min-height:60px;background:var(--bg)}
.bubble .more{position:absolute;top:2px;right:4px;background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14px;padding:2px 4px}
.filechip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg-raised);font-size:13px;cursor:pointer;margin-bottom:4px}
.composer{position:sticky;bottom:calc(var(--nav-h) + 6px);background:var(--bg);padding:8px 0 4px;border-top:1px solid var(--line)}
@media (min-width:760px){.composer{bottom:0}}
.composer .box{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;background:var(--bg-raised-2);border:1px solid var(--line);color:var(--text);border-radius:22px;padding:11px 14px;font-size:15px}
.composer .round{width:44px;height:44px;border-radius:50%;flex:none;border:1px solid var(--line);background:var(--bg-raised-2);color:var(--text);font-size:18px;cursor:pointer}
.composer .round.send{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.composer .round.rec{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.replybar{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--bg-raised-2);border-left:3px solid var(--accent);padding:6px 10px;border-radius:8px;margin-bottom:6px}
.ubadge{background:var(--accent);color:var(--accent-text);font-size:11px;font-weight:800;border-radius:10px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}

/* ===== Auth screen ===== */
.auth{max-width:430px;margin:0 auto;padding:30px 16px}
.auth .logo{font-size:42px;text-align:center}
.auth h2{text-align:center;margin-bottom:4px}
.auth .sub{text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:18px}
.form-error{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.diff pre{white-space:pre-wrap;word-break:break-word;margin:0;background:var(--bg-raised-2);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:140px;overflow:auto;font-family:inherit}
.report-text{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55;background:#fff;color:#111;border-radius:12px;padding:14px;max-height:420px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div id="boot" style="padding:40px;text-align:center;color:var(--text-dim)">Inapakia Workplace…</div></div>
<div id="toast-host"></div>
<div id="modal-host"></div>
<script>
"use strict";
(function(){
/* =====================================================================
 * FIRE REPORT – WORKPLACE (faili la kujitegemea)
 * Hakuna maktaba ya nje. Inatumia Supabase REST/Auth/Storage/Realtime moja kwa moja.
 * Haiandiki kwenye IndexedDB ya Fire Report (rescueReportDB) – inasoma tu
 * ripoti kwa ajili ya kuzishiriki. Hifadhi yake yenyewe: fireWorkplaceDB.
 * ===================================================================== */
const SB_URL = "https://lovqecgjzispwdtooyph.supabase.co";
const SB_KEY = "sb_publishable_TAEeEIAPg6y7GMs8_rRnKg_oiszo1N9"; // publishable (anon) key – si siri
const FILE_BUCKET = "workplace-files";
const MAX_FILE = 10 * 1024 * 1024;
const PAGE = 20;

/* ---------- utils ---------- */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === "x" ? r : (r & 3) | 8).toString(16); }));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const safeName = (n) => String(n || "faili").replace(/[^\w.\-]+/g, "_").slice(-80);
const initials = (n) => String(n || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0] || "").join("").toUpperCase() || "?";
const pad = (n) => String(n).padStart(2, "0");
function fmtDate(d) { if (!d) return "-"; const x = new Date(d); return isNaN(x) ? "-" : `${pad(x.getDate())}/${pad(x.getMonth() + 1)}/${x.getFullYear()}`; }
function fmtDT(d) { if (!d) return "-"; const x = new Date(d); return isNaN(x) ? "-" : `${fmtDate(x)} ${pad(x.getHours())}:${pad(x.getMinutes())}`; }
function fmtTime(d) { const x = new Date(d); return `${pad(x.getHours())}:${pad(x.getMinutes())}`; }
function ago(d) {
  const s = (Date.now() - new Date(d).getTime()) / 1000;
  if (s < 45) return "sasa hivi"; if (s < 3600) return `dak ${Math.round(s / 60)}`;
  if (s < 86400) return `saa ${Math.round(s / 3600)}`; if (s < 86400 * 7) return `siku ${Math.round(s / 86400)}`;
  return fmtDate(d);
}
const sameJson = (a, b) => JSON.stringify(a == null ? null : a) === JSON.stringify(b == null ? null : b);

const TASK_STATUS = { pending: ["Inasubiri", "b-warn"], accepted: ["Imekubaliwa", "b-info"], in_progress: ["Inaendelea", "b-info"], under_review: ["Inakaguliwa", "b-warn"], completed: ["Imekamilika", "b-ok"], rejected: ["Imekataliwa", "b-bad"] };
const PRIORITY = { low: "Chini", medium: "Wastani", high: "Juu", critical: "Dharura" };
const APPROVAL = { draft: ["Rasimu", ""], submitted: ["Imetumwa", "b-info"], under_review: ["Inakaguliwa", "b-warn"], changes_requested: ["Marekebisho", "b-warn"], approved: ["Imeidhinishwa", "b-ok"], rejected: ["Imekataliwa", "b-bad"] };
const PERMS = { viewer: "Viewer – kuangalia", contributor: "Contributor – kuchangia", editor: "Editor – kuhariri", reviewer: "Reviewer – kukagua", supervisor: "Supervisor – kuidhinisha" };
const VIS = { public: "Public (wazi)", private: "Private (ombi la kujiunga)", invite: "Invitation Only (mwaliko)" };
const NAV = [
  ["overview", "🏠", "Overview"], ["network", "🌐", "Network"], ["profile", "👤", "My Profile"], ["workspaces", "🧩", "Workspaces"],
  ["reports", "📄", "Shared Reports"], ["messages", "💬", "Messages"], ["tasks", "✅", "My Tasks"], ["groups", "👥", "Groups"],
  ["feed", "📰", "Activity Feed"], ["notifications", "🔔", "Notifications"],
];

/* ---------- global state ---------- */
const S = {
  session: null, me: null, myPrivate: null, route: {}, rid: 0, stale: false,
  following: new Set(), followers: new Set(), pcache: new Map(), badges: { messages: 0, tasks: 0, notifications: 0 },
  rt: "off", lastSync: null, fileUrls: new Map(), roles: [], convUnread: {}, openConv: null,
};

/* ---------- toast / modal ---------- */
function toast(msg, kind) {
  const host = $("#toast-host"); const t = document.createElement("div");
  t.className = "toast " + (kind || ""); t.textContent = msg; host.appendChild(t);
  setTimeout(() => t.remove(), kind === "err" ? 4800 : 2800);
}
function openModal(html, mount) {
  const host = $("#modal-host");

/* ---------- own IndexedDB (cache, outbox, kv) ---------- */
const WDB = (function () {
  let p = null; const mem = {};
  function open() {
    if (p) return p;
    p = new Promise((res, rej) => {
      const r = indexedDB.open("fireWorkplaceDB", 1);
      r.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains("cache")) d.createObjectStore("cache", { keyPath: "k" });
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv", { keyPath: "k" });
        if (!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox", { keyPath: "id" });
      };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return p;
  }
  async function run(store, mode, fn) {
    try {
      const d = await open();
      return await new Promise((res, rej) => {
        const t = d.transaction(store, mode); const o = t.objectStore(store); let out; const rq = fn(o);
        if (rq) rq.onsuccess = () => (out = rq.result);
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      });
    } catch (e) { // IndexedDB haipatikani: tumia kumbukumbu ya muda
      mem[store] = mem[store] || {};
      const o = { get: (k) => ({ set onsuccess(f) { this.result = mem[store][k]; f(); } }) };
      if (fn.toString().includes("getAll")) return Object.values(mem[store]);
      return undefined;
    }
  }
  return {
    get: (s, k) => run(s, "readonly", (o) => o.get(k)),
    put: (s, v) => run(s, "readwrite", (o) => o.put(v)),
    del: (s, k) => run(s, "readwrite", (o) => o.delete(k)),
    all: (s) => run(s, "readonly", (o) => o.getAll()),
  };
})();
const kvGet = async (k) => { const r = await WDB.get("kv", k); return r ? r.v : null; };
const kvSet = (k, v) => WDB.put("kv", { k, v });
async function cachePut(key, v) { try { await WDB.put("cache", { k: key, v, t: Date.now() }); } catch (e) {} }
async function cacheGet(key) { try { return await WDB.get("cache", key); } catch (e) { return null; } }

/* ---------- read-only access to Fire Report's own DB (for sharing / settings) ---------- */
function openRescueDB() {
  return new Promise((res) => {
    try {
      const r = indexedDB.open("rescueReportDB"); // bila version: haibadilishi schema
      r.onupgradeneeded = (e) => { try { e.target.transaction.abort(); } catch (_) {} }; // DB haipo: usiiunde
      r.onsuccess = () => { const db = r.result; if (!db.objectStoreNames.contains("reports")) { db.close(); res(null); } else res(db); };
      r.onerror = () => res(null); r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
}
async function localReports() {
  const db = await openRescueDB(); if (!db) return [];
  return new Promise((res) => {
    try {
      const rq = db.transaction("reports", "readonly").objectStore("reports").getAll();
      rq.onsuccess = () => { db.close(); res((rq.result || []).sort((a, b) => String(b.updatedAt || b.createdAt || "").localeCompare(String(a.updatedAt || a.createdAt || "")))); };
      rq.onerror = () => { db.close(); res([]); };
    } catch (e) { db.close(); res([]); }
  });
}
async function localSetting(key) {
  const db = await openRescueDB(); if (!db || !db.objectStoreNames.contains("settings")) return null;
  return new Promise((res) => {
    try {
      const rq = db.transaction("settings", "readonly").objectStore("settings").get(key);
      rq.onsuccess = () => { db.close(); res(rq.result ? rq.result.value : null); };
      rq.onerror = () => { db.close(); res(null); };
    } catch (e) { db.close(); res(null); }
  });
}

/* ---------- HTTP / API ---------- */
class ApiError extends Error { constructor(m, status, code, raw) { super(m); this.status = status; this.code = code; this.raw = raw; } }
const isNetErr = (e) => !(e instanceof ApiError);
function cleanMsg(msg) {
  if (!msg) return "Hitilafu isiyojulikana";
  const m = String(msg).match(/^([A-Z_]{4,})(?::(.*))?$/s);
  if (m) { if (m[1] === "CONFLICT") return "Ripoti imebadilishwa na mtu mwingine"; if (m[2] && m[2].trim()) return m[2].trim(); }
  const m2 = String(msg).match(/^[A-Z_]{4,}: (.*)$/s); if (m2) return m2[1];
  if (/row-level security/i.test(msg)) return "Huna ruhusa ya kufanya kitendo hiki";
  if (/duplicate key/i.test(msg)) return "Tayari ipo";
  return msg;
}
function getSess() { try { return JSON.parse(LS.get("fw_session") || "null"); } catch (e) { return null; } }
function setSess(s) { S.session = s; if (s) LS.set("fw_session", JSON.stringify(s)); else LS.del("fw_session"); }
const normSess = (d) => ({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600), user: d.user });
let refreshing = null;
function refreshSession() {
  if (refreshing) return refreshing;
  refreshing = (async () => {
    const s = S.session || getSess(); if (!s || !s.refresh_token) return false;
    try {
      const d = await http("/auth/v1/token?grant_type=refresh_token", { method: "POST", auth: false, body: { refresh_token: s.refresh_token } });
      setSess(normSess(d)); RT.sendToken(); return true;
    } catch (e) { if (e instanceof ApiError) { setSess(null); return false; } return false; }
    finally { refreshing = null; }
  })();
  return refreshing;
}
async function validToken() {
  const s = S.session; if (!s) return null;
  if (s.expires_at - 60 < Date.now() / 1000 && navigator.onLine) await refreshSession();
  return S.session ? S.session.access_token : null;
}
async function http(path, opt = {}) {
  const url = path.startsWith("http") ? path : SB_URL + path;
  let body = opt.body;
  const headers = Object.assign({ apikey: SB_KEY }, opt.headers || {});
  if (body !== undefined && !(body instanceof Blob) && !(body instanceof FormData) && typeof body !== "string") { headers["Content-Type"] = "application/json"; body = JSON.stringify(body); }
  if (opt.prefer) headers.Prefer = opt.prefer;
  if (opt.range) headers.Range = opt.range;
  const send = async () => {
    if (opt.auth !== false) headers.Authorization = "Bearer " + ((await validToken()) || SB_KEY);
    else headers.Authorization = "Bearer " + SB_KEY;
    return fetch(url, { method: opt.method || "GET", headers, body });
  };
  let res = await send();
  if (res.status === 401 && opt.auth !== false) { if (await refreshSession()) res = await send(); else if (!S.session) { onSignedOut(); } }
  const text = await res.text(); let data = null;
  if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }
  if (!res.ok) {
    const msg = (data && (data.message || data.msg || data.error_description || data.error)) || res.statusText;
    throw new ApiError(cleanMsg(msg), res.status, data && data.code, data);
  }
  return data;
}
const rest = (table, qs = "", opt = {}) => http(`/rest/v1/${table}${qs ? "?" + qs : ""}`, opt);
const rpc = (fn, args = {}) => http(`/rest/v1/rpc/${fn}`, { method: "POST", body: args });
const enc = encodeURIComponent;
const inList = (ids) => "(" + ids.map((i) => `"${i}"`).join(",") + ")";

async function cached(key, fn) {
  const k = (S.session ? S.session.user.id : "x") + ":" + key;
  if (!navigator.onLine) { const c = await cacheGet(k); if (c) { S.stale = true; paintBanner(); return c.v; } }
  try { const v = await fn(); cachePut(k, v); if (S.stale) { S.stale = false; paintBanner(); } return v; }
  catch (e) { if (isNetErr(e)) { const c = await cacheGet(k); if (c) { S.stale = true; paintBanner(); return c.v; } } throw e; }
}

/* ---------- storage (files) ---------- */
async function uploadFile(path, blob, type) {
  if (blob.size > MAX_FILE) throw new ApiError("Faili ni kubwa kuliko MB 10");
  await http(`/storage/v1/object/${FILE_BUCKET}/${path.split("/").map(enc).join("/")}`, { method: "POST", body: blob, headers: { "Content-Type": type || blob.type || "application/octet-stream", "x-upsert": "true" } });
}
async function signedUrl(path) {
  const c = S.fileUrls.get(path); if (c && c.exp > Date.now()) return c.url;
  const d = await http(`/storage/v1/object/sign/${FILE_BUCKET}/${path.split("/").map(enc).join("/")}`, { method: "POST", body: { expiresIn: 3600 } });
  const url = SB_URL + "/storage/v1" + d.signedURL;
  S.fileUrls.set(path, { url, exp: Date.now() + 3000 * 1000 }); return url;
}
async function hydrateFiles(root) {
  const els = $$("[data-fpath]", root || document);
  for (const el of els) {
    if (el.dataset.loaded) continue; el.dataset.loaded = "1";
    signedUrl(el.dataset.fpath).then((u) => { el.src = u; }).catch(() => { el.alt = "Picha haipatikani"; });
  }
}
function compressImage(file, max = 1280, q = 0.8) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type) || /gif|svg/.test(file.type)) return res(file);
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      let { width: w, height: h } = img; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob((b) => { URL.revokeObjectURL(u); if (!b) return res(file); const out = new File([b], safeName(file.name).replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }); res(out.size < file.size ? out : file); }, "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(u); res(file); };
    img.src = u;
  });
}
function imageToDataUrl(file, size = 220) {
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = size; c.height = size; const x = c.getContext("2d");
      const s = Math.min(img.width, img.height); x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Picha haisomeki")); };
    img.src = u;
  });
}

/* ---------- Host (Firebase) auto-login bridge ----------
 * Workplace ikiwa ndani ya faili/ukurasa mwingine wenye Firebase login, haina haja ya kuingia upya.
 * Host inatoa Firebase ID token (iframe: postMessage, au inline: window.FireReportHost.getIdToken).
 * Token inatumwa kwenye Edge Function "firebase-bridge" (inaikagua kwenye seva) ambayo inarudisha
 * kibali cha mara moja cha kupata session halisi ya Supabase. Hakuna siri yoyote kwenye frontend. */
const BRIDGE_URL = SB_URL + "/functions/v1/firebase-bridge";
const Host = {
  inline() { return !!(window.FireReportHost && typeof window.FireReportHost.getIdToken === "function"); },
  embedded: window.parent !== window,
  get on() { return Host.inline() || Host.embedded; },
  _wait: null,
  async token(force) {
    if (Host.inline()) { try { return (await window.FireReportHost.getIdToken(!!force)) || null; } catch (e) { return null; } }
    if (!Host.embedded) return null;
    return new Promise((res) => {
      const t = setTimeout(() => { Host._wait = null; res(null); }, 6000);
      Host._wait = (tok) => { clearTimeout(t); Host._wait = null; res(tok); };
      try { window.parent.postMessage({ type: "fw-request-token", force: !!force }, "*"); } catch (e) { clearTimeout(t); Host._wait = null; res(null); }
    });
  },
};
const jwtSub = (t) => { try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).sub || null; } catch (e) { return null; } };
async function bridgeLogin(idToken) {
  const r = await http(BRIDGE_URL, { method: "POST", auth: false, body: { idToken } });
  const d = await http("/auth/v1/verify", { method: "POST", auth: false, body: { type: r.type || "magiclink", token_hash: r.token_hash } });
  setSess(normSess(d)); LS.set("fw_bridge", jwtSub(idToken) || ""); return true;
}
window.addEventListener("message", (e) => {
  if (e.source !== window.parent || !e.data || typeof e.data !== "object") return;
  if (e.data.type === "fw-token") { if (Host._wait) Host._wait(e.data.idToken || null); else if (e.data.idToken) hostTokenPushed(e.data.idToken); }
  else if (e.data.type === "fw-signout") hostSignedOut();
});

/* ---------- outbox (offline queue) ---------- */
const OB = {
  busy: false, counts: { pending: 0, failed: 0 },
  async add(op, payload) {
    const item = { id: uuid(), op, payload, created: Date.now(), tries: 0, status: "pending", error: null };
    await WDB.put("outbox", item); await OB.recount(); await OB.kick(); return item;
  },
  async list() { return ((await WDB.all("outbox")) || []).sort((a, b) => a.created - b.created); },
  async recount() { const l = await OB.list(); OB.counts = { pending: l.filter((i) => i.status === "pending").length, failed: l.filter((i) => i.status === "failed").length }; paintSync(); return l; },
  async exec(it) {
    const p = it.payload, uid = S.session.user.id;
    if (it.op === "message" || it.op === "comment") {
      const row = Object.assign({}, p.row);
      if (p.file) {
        const path = `${uid}/${it.id}-${safeName(p.file.name)}`;
        await uploadFile(path, p.file.blob, p.file.type);
        row.attachment_path = path; row.attachment_name = p.file.name; if (it.op === "message") row.attachment_type = p.file.type;
      }
      row.client_id = it.id;
      await rest(it.op === "message" ? "messages" : "report_comments", "", { method: "POST", body: row, prefer: "return=minimal" });
    } else if (it.op === "task") {
      try { await rest("tasks", "", { method: "POST", body: p.row, prefer: "return=minimal" }); }
      catch (e) { if (!(e instanceof ApiError && e.status === 409)) throw e; }
      for (const f of p.files || []) {
        const path = `${uid}/${f.id}-${safeName(f.name)}`;
        await uploadFile(path, f.blob, f.type);
        try { await rest("task_attachments", "", { method: "POST", body: { id: f.id, task_id: p.row.id, name: f.name, path, mime: f.type }, prefer: "return=minimal" }); }
        catch (e) { if (!(e instanceof ApiError && e.status === 409)) throw e; }
      }
    } else if (it.op === "taskupdate") {
      await rest("tasks", `id=eq.${p.id}`, { method: "PATCH", body: p.patch, prefer: "return=minimal" });
    } else if (it.op === "workspace") {
      await rest("workspaces", "", { method: "POST", body: p.row, prefer: "return=minimal" });
    } else throw new ApiError("Aina ya kazi haijulikani");
  },
  async kick() {
    if (OB.busy || !navigator.onLine || !S.session) return;
    OB.busy = true; let done = 0;
    try {
      const items = await OB.list();
      for (const it of items) {
        if (it.status === "failed") continue;
        try { await OB.exec(it); await WDB.del("outbox", it.id); done++; OB.afterOne(it); }
        catch (e) {
          if (isNetErr(e)) break;
          if (e.status === 409 || e.code === "23505") { await WDB.del("outbox", it.id); done++; continue; }
          it.status = "failed"; it.error = e.message; it.tries++; await WDB.put("outbox", it);
        }
      }
      if (done) { S.lastSync = Date.now(); await kvSet("lastSync", S.lastSync); }
    } finally { OB.busy = false; await OB.recount(); if (done) refreshView(); }
  },
  afterOne(it) {
    const lbl = { message: "Ujumbe umethibitishwa na seva", task: "Jukumu limetumwa", taskupdate: "Mabadiliko ya jukumu yamehifadhiwa", workspace: "Workspace imeundwa", comment: "Maoni yametumwa" }[it.op];
    if (lbl && it.op !== "message") toast(lbl, "ok");
  },
};

/* ---------- realtime (Supabase Realtime kupitia WebSocket, bila maktaba) ---------- */
const RT = {
  ws: null, ref: 0, hb: null, retry: 0, stopped: true,
  topic: "realtime:fw",
  send(o) { if (RT.ws && RT.ws.readyState === 1) RT.ws.send(JSON.stringify(Object.assign({ ref: String(++RT.ref) }, o))); },
  sendToken() { if (RT.ws && RT.ws.readyState === 1 && S.session) RT.send({ topic: RT.topic, event: "access_token", payload: { access_token: S.session.access_token } }); },
  connect() {
    if (!S.session || RT.ws || !navigator.onLine) return; RT.stopped = false;
    let ws; try { ws = new WebSocket(SB_URL.replace(/^http/, "ws") + `/realtime/v1/websocket?apikey=${SB_KEY}&vsn=1.0.0`); } catch (e) { return; }
    RT.ws = ws;
    ws.onopen = () => {
      RT.retry = 0;
      const ch = (table, event = "*") => ({ event, schema: "public", table });
      RT.send({ topic: RT.topic, event: "phx_join", payload: { config: { broadcast: { ack: false, self: false }, presence: { key: "" }, private: false,
        postgres_changes: [ch("messages"), ch("notifications", "INSERT"), ch("conversation_members", "UPDATE"), ch("tasks"), ch("workspace_invitations", "INSERT")] },
        access_token: S.session.access_token } });
      clearInterval(RT.hb); RT.hb = setInterval(() => RT.send({ topic: "phoenix", event: "heartbeat", payload: {} }), 25000);
    };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.event === "phx_reply" && m.topic === RT.topic) { RT.setState(m.payload && m.payload.status === "ok" ? "live" : "off"); }
      else if (m.event === "postgres_changes" && m.payload && m.payload.data) { const d = m.payload.data; try { handleRealtime(d.table, d.type, d.record || {}, d.old_record || {}); } catch (e) { console.error(e); } }
    };
    ws.onclose = () => { clearInterval(RT.hb); RT.ws = null; RT.setState("off"); if (!RT.stopped && S.session) setTimeout(RT.connect, Math.min(30000, 1000 * 2 ** Math.min(RT.retry++, 5))); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  },
  stop() { RT.stopped = true; clearInterval(RT.hb); try { if (RT.ws) RT.ws.close(); } catch (e) {} RT.ws = null; RT.setState("off"); },
  setState(s) { S.rt = s; paintSync(); },
};

    cached("ws:" + id, () => rest("workspaces", `select=*&id=eq.${id}`)),
    cached("wsm:" + id, () => rest("workspace_members", `select=*,p:profiles(id,full_name,rank,station,avatar)&workspace_id=eq.${id}&order=joined_at`)),
  ]);
  const ws = wsRows[0]; if (!ws) return paint(rid, backBtn("workspaces") + empty("🧩", "Workspace haipatikani"));
  rememberProfiles(members.map((m) => m.p).filter(Boolean));
  const mine = members.find((m) => m.user_id === uid);
  if (!mine) { // si mwanachama – labda ana mwaliko
    const inv = (await rest("workspace_invitations", `select=id&workspace_id=eq.${id}&invitee_id=eq.${uid}&status=eq.pending`).catch(() => []))[0];

      ${inv ? `<div class="btn-row"><button class="btn btn-primary" data-act="inv-accept" data-k="ws" data-id="${inv.id}">Kubali mwaliko</button><button class="btn" data-act="inv-reject" data-k="ws" data-id="${inv.id}">Kataa</button></div>` : '<p class="muted">Wewe si mwanachama wa workspace hii.</p>'}</div>`);
  }
  const leader = mine.role === "leader", canInvite = leader || mine.can_invite, open = ws.status === "open";
  let body = "";
  if (tab === "members") {
    let pend = [];
    if (leader) pend = await rest("workspace_invitations", `select=id,expires_at,p:profiles!workspace_invitations_invitee_id_fkey(full_name)&workspace_id=eq.${id}&status=eq.pending`).catch(() => []);
    body = `${canInvite && open ? `<button class="btn btn-primary btn-sm mb" data-act="ws-invite" data-id="${id}">＋ Alika afisa</button>` : ""}
    ${members.map((m) => { const p = m.p || {}; const isCreator = m.user_id === ws.creator_id;
      return `<div class="item" style="cursor:default">${avatarHtml(p)}<div class="grow" data-act="open-officer" data-id="${m.user_id}"><div class="t ellip">${esc(p.full_name || "Afisa")}${m.user_id === uid ? " (wewe)" : ""}</div>
        <div class="s ellip">${esc([p.rank, p.station].filter(Boolean).join(" · "))}</div><div>${badge(isCreator ? "Muanzilishi" : m.role === "leader" ? "Team Leader" : "Mwanachama", m.role === "leader" ? "b-info" : "")}${m.can_invite ? badge("Anaalika", "") : ""}${m.can_assign_tasks ? badge("Anagawa kazi", "") : ""}</div></div>
        ${leader && !isCreator ? `<button class="btn btn-sm btn-ghost" data-act="ws-member-menu" data-ws="${id}" data-uid="${m.user_id}">⋯</button>` : ""}</div>`; }).join("")}
    ${pend.length ? `<div class="card-title mt">Mialiko inayosubiri</div>${pend.map((i) => `<div class="item" style="cursor:default"><div class="grow"><div class="t">${esc((i.p || {}).full_name)}</div><div class="s">inaisha ${fmtDate(i.expires_at)}</div></div>
      <button class="btn btn-sm btn-ghost" data-act="ws-inv-cancel" data-id="${i.id}">Futa</button></div>`).join("")}` : ""}`;
  } else if (tab === "tasks") {
    const tasks = await cached("wstasks:" + id, () => rest("tasks", `select=*&workspace_id=eq.${id}&order=created_at.desc&limit=100`));
    await getProfiles(tasks.flatMap((t) => [t.assigned_by, t.assigned_to]));
    body = `${(leader || mine.can_assign_tasks) && open ? `<button class="btn btn-primary btn-sm mb" data-act="task-new" data-ctx="ws:${id}">＋ Gawa jukumu</button>` : ""}${tasks.map(taskCard).join("") || empty("✅", "Hakuna kazi kwenye workspace hii")}`;

const TASKS = { tab: "mine", offset: 0 };
function isOverdue(t) { return t.deadline && new Date(t.deadline) < new Date() && !["completed", "rejected"].includes(t.status); }
function taskCard(t, pendingUpd) {
  const st = TASK_STATUS[t.status] || ["?", ""]; const od = isOverdue(t);
  S.taskMap = S.taskMap || new Map(); S.taskMap.set(t.id, t);
  const me = S.me.id; const who = t.assigned_to === me ? `Kutoka ${esc(pname(t.assigned_by))}` : `Kwa ${esc(pname(t.assigned_to))}`;
  return `<div class="item" data-act="task-open" data-id="${t.id}"><div class="grow"><div class="row between"><span class="t ellip">${esc(t.title)}</span>${badge(st[0], st[1])}</div>
    <div class="s">${who} · ${PRIORITY[t.priority] || ""}${t.deadline ? ` · <span style="color:${od ? "var(--danger)" : "inherit"}">${od ? "Imechelewa " : "Mwisho "}${fmtDT(t.deadline)}</span>` : ""}</div>
    <div class="bar mt"><i style="width:${t.progress || 0}%"></i></div>${pendingUpd ? '<div class="muted mt">⏳ Mabadiliko yanasubiri kuthibitishwa na seva</div>' : ""}</div></div>`;
}
VIEWS.tasks = async (r, rid) => {
  const uid = S.me.id, tab = TASKS.tab, now = new Date().toISOString();
  const base = "select=*&order=deadline.asc.nullslast,created_at.desc&limit=" + PAGE + "&offset=" + TASKS.offset;
  const q = {
    mine: `assigned_to=eq.${uid}&status=neq.completed`,
    assigned: `assigned_by=eq.${uid}&assigned_to=neq.${uid}&status=neq.completed`,
    done: `status=eq.completed&or=(assigned_to.eq.${uid},assigned_by.eq.${uid})`,
    overdue: `deadline=lt.${now}&status=not.in.(completed,rejected)&or=(assigned_to.eq.${uid},assigned_by.eq.${uid})`,
    team: `assigned_to=neq.${uid}&assigned_by=neq.${uid}&or=(workspace_id.not.is.null,group_id.not.is.null)`,
  }[tab];
  const [tasks, obs] = await Promise.all([cached(`tasks:${tab}:${TASKS.offset}`, () => rest("tasks", `${q}&${base}`)), OB.list()]);
  await getProfiles(tasks.flatMap((t) => [t.assigned_by, t.assigned_to]));
  const pendNew = tab === "mine" ? obs.filter((o) => o.op === "task" && o.payload.row.assigned_to === uid) : tab === "assigned" ? obs.filter((o) => o.op === "task" && o.payload.row.assigned_to !== uid) : [];
  const pendUpd = new Set(obs.filter((o) => o.op === "taskupdate").map((o) => o.payload.id));
  paint(rid, `<div class="chips">${[["mine", "Zangu"], ["assigned", "Nilizogawa"], ["done", "Zilizokamilika"], ["overdue", "Zilizochelewa"], ["team", "Timu"]].map(([k, l]) => `<span class="chip ${tab === k ? "sel" : ""}" data-act="task-tab" data-tab="${k}">${l}</span>`).join("")}</div>
  ${pendNew.map((o) => `<div class="item" style="cursor:default;border-style:dashed"><div class="grow"><div class="t">${esc(o.payload.row.title)}</div><div class="s">${o.status === "failed" ? "Imeshindwa: " + esc(o.error) : "⏳ Inasubiri kutumwa kwa seva"}</div></div>${badge(o.status === "failed" ? "Imeshindwa" : "Rasimu", o.status === "failed" ? "b-bad" : "b-warn")}</div>`).join("")}
  ${tasks.map((t) => taskCard(t, pendUpd.has(t.id))).join("") || (pendNew.length ? "" : empty("✅", "Hakuna kazi hapa"))}
  <div class="row" style="justify-content:center">${TASKS.offset ? `<button class="btn btn-sm" data-act="task-page" data-d="-1">← Zilizotangulia</button>` : ""}${tasks.length === PAGE ? `<button class="btn btn-sm" data-act="task-page" data-d="1">Zinazofuata →</button>` : ""}</div>
  <button class="fab" data-act="task-new" title="Jukumu jipya">＋</button>`);
  if (rid === S.rid && r.q.get("open")) { const id = r.q.get("open"); history.replaceState(null, "", "#/tasks"); A["task-open"]({ dataset: { id } }); }
};
