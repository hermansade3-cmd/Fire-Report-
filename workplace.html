<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>WORLD SATELLITE EXPLORER</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0b1220;--fg:#e8eefc;--mu:#8ea0c0;--card:rgba(15,23,42,.88);--bd:rgba(148,163,184,.22);--ac:#22d3ee;--ac2:#3b82f6;--in:rgba(148,163,184,.12)}
:root.light{--bg:#f1f5f9;--fg:#0f172a;--mu:#52617d;--card:rgba(255,255,255,.92);--bd:rgba(15,23,42,.14);--ac:#0891b2;--ac2:#2563eb;--in:rgba(15,23,42,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fl{position:absolute;z-index:1000;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
button{font:inherit;color:inherit;cursor:pointer}
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--in);font-weight:500}
.b:active{transform:scale(.97)}.b.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04121f;border:0;font-weight:700}
.b.on{border-color:var(--ac);color:var(--ac)}.b.d{color:#f87171}
.ib{width:42px;height:42px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px}
.ib:active{background:var(--in)}
input,select{font:inherit;color:var(--fg);background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--ac)}
#top{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;border-radius:18px;max-width:560px;padding:4px 6px;display:flex;align-items:center;gap:6px}
#top input{border:0;background:transparent;padding:10px 4px}
#sug{position:absolute;left:0;right:0;top:100%;margin-top:6px;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--bd);max-height:40vh;overflow-y:auto;display:none}
#sug div{display:flex;gap:9px;padding:11px 13px;border-top:1px solid var(--bd);cursor:pointer;font-size:13px}#sug div:first-child{border:0}
#av{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04121f;font-weight:800;display:grid;place-items:center;flex:none}
#rc{right:10px;top:calc(env(safe-area-inset-top,0px) + 74px);border-radius:16px;display:flex;flex-direction:column;padding:3px}
#rc hr{border:0;border-top:1px solid var(--bd);margin:2px 8px;width:auto}
#cp{left:10px;top:calc(env(safe-area-inset-top,0px) + 74px);width:48px;height:48px;border-radius:50%;padding:0;display:grid;place-items:center}
#co{left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);padding:7px 11px;border-radius:12px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--mu);max-width:70vw}
#off{position:fixed;z-index:1100;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);background:#f59e0b;color:#1a1200;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:600;display:none;white-space:nowrap}
#nav{left:0;right:0;bottom:0;display:flex;padding:4px 4px calc(env(safe-area-inset-bottom,0px) + 4px);border-radius:20px 20px 0 0}
#nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:7px 0;border-radius:14px;color:var(--mu)}
#nav button.on{color:var(--ac);background:var(--in)}
#pn{left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);max-height:52vh;overflow:auto;border-radius:22px 22px 0 0;padding:6px 14px 16px;display:none}
#pn .h{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card);padding:8px 0;z-index:2}
#pn .h b{flex:1;font-size:16px}#pn .h:before{content:"";position:absolute;top:0;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1 1 auto}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}.chips .b{justify-content:flex-start}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.it>div{flex:1;min-width:0}.it small,small{color:var(--mu)}
.bd{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c,#3b82f6);color:#fff;flex:none}
.card{padding:12px;border-radius:14px;background:var(--in);border:1px solid var(--bd);margin:8px 0}
#toast{position:fixed;z-index:3000;top:calc(env(safe-area-inset-top,0px) + 118px);left:50%;transform:translateX(-50%);background:rgba(2,6,23,.92);color:#fff;padding:9px 16px;border-radius:20px;display:none;max-width:90%;font-size:13px}
.ov{position:fixed;inset:0;z-index:4000;background:rgba(2,6,23,.7);display:grid;place-items:center;padding:16px}
.ov .box{width:min(380px,100%);background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.mk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.45);color:#fff}
.mk .ic{transform:rotate(45deg);width:15px;height:15px;stroke-width:2.2}
.leaflet-bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 62px)}
.leaflet-control-attribution{font-size:9px;border-radius:8px 0 0 0}
.leaflet-control-scale-line{background:var(--card);color:var(--fg);border-color:var(--mu);font-size:10px;border-radius:0 0 6px 6px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px}
.br{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#04121f;flex:none}
.ib.on{color:var(--ac)}
#pn{animation:up .22s ease}@keyframes up{from{transform:translateY(16px);opacity:0}}
#nav button.on{position:relative}#nav button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:3px;background:var(--ac)}
#lc{left:66px;right:66px;max-width:430px;top:calc(env(safe-area-inset-top,0px) + 74px);padding:8px 12px;border-radius:14px;display:none;font-size:13px;line-height:1.35}
#lc small{color:var(--mu);font-size:11px}
.lb{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:11px;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000;cursor:pointer}
.lb .d{width:18px;height:18px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:1.5px solid #fff;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.55);text-shadow:none}
.lb .d .ic{width:10px;height:10px;stroke-width:2.4}
.lb.fire .d,.lb.hosp .d{width:26px;height:26px}.lb.fire .d .ic,.lb.hosp .d .ic{width:14px;height:14px}
.lb.fire b{font-size:12px;color:#fecaca}.lb.hosp b{font-size:12px;color:#a7f3d0}
.lb.place.city b{font-size:16px;letter-spacing:.6px;text-transform:uppercase}.lb.place.town b{font-size:14px}.lb.place.village b{font-size:12.5px}
.lb.place.suburb b,.lb.place.hamlet b{font-size:11px;font-style:italic;opacity:.95}
.lb.road b{font-weight:500;font-style:italic;font-size:10px;opacity:.9}
.lt .lb{color:#0f172a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}.lt .lb.fire b{color:#b91c1c}.lt .lb.hosp b{color:#047857}
.tt{background:rgba(2,6,23,.82);color:#fff;border:0;font-size:11px;font-weight:600;padding:2px 7px;border-radius:8px;box-shadow:none}.tt:before{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--mu)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
@media(min-width:900px){.leaflet-bottom{bottom:0}}
.leaflet-popup-content-wrapper{border-radius:14px}
@media(min-width:900px){
#pn{left:14px;right:auto;width:380px;bottom:84px;max-height:calc(100vh - 190px);border-radius:20px}
#nav{left:50%;right:auto;transform:translateX(-50%);width:min(700px,96vw);bottom:12px;border-radius:22px}
#co{bottom:14px}}
</style>
</head>

<script>
if(typeof L==='undefined'){document.body.insertAdjacentHTML('afterbegin','<div class="ov"><div class="box" style="color:var(--fg)">Leaflet haijapakia. Washa mtandao kisha fungua upya faili hili kwenye Chrome (si ndani ya preview ya Claude).</div></div>');throw new Error('no leaflet')}
const $=s=>document.querySelector(s);
const I=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const toast=(t,ms=3200)=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)};
const j=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error(r.status);return r.json()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== IndexedDB: kv (mipangilio), tiles (ramani offline), marks (alama za mtumiaji) ===== */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('wse',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('tiles');d.createObjectStore('marks',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=(s,m,f)=>DB.then(d=>new Promise((ok,no)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=no}));
const get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v,k)=>tx(s,'readwrite',o=>o.put(v,k)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),all=s=>tx(s,'readonly',o=>o.getAll()),clr=s=>tx(s,'readwrite',o=>o.clear());
let P={theme:'dark',base:'sat',tt:'',ov:{}};const savePrefs=()=>{put('kv',P,'prefs').catch(()=>{});sched()};
const applyTheme=()=>{document.documentElement.classList.toggle('light',P.theme==='light')};

/* ===== Ramani ===== */
L.TileLayer.Cached=L.TileLayer.extend({createTile(c,done){const img=document.createElement('img');img.alt='';const u=this.getTileUrl(c);
const fin=()=>{img.onload=img.onerror=()=>done(null,img)},show=b=>{fin();img.src=URL.createObjectURL(b)};
get('tiles',u).then(b=>b?show(b):fetch(u).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>{put('tiles',b,u).catch(()=>{});show(b)})).catch(()=>{fin();img.src=u});return img}});
const map=L.map('map',{zoomControl:false,center:[0,20],zoom:3,worldCopyJump:true});map.attributionControl.setPrefix(false);
const esri=p=>`https://server.arcgisonline.com/ArcGIS/rest/services/${p}/MapServer/tile/{z}/{y}/{x}`;
const T=(u,o)=>new L.TileLayer.Cached(u,Object.assign({maxZoom:19},o));
const bases={sat:T(esri('World_Imagery'),{maxNativeZoom:17,attribution:'Esri World Imagery (picha hazisasishwi moja kwa moja)'}),
street:T('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}),

const gp=(x,y,n)=>({type:'Feature',properties:{name:n},geometry:{type:'Point',coordinates:[x,y]}});

if(/\.gpx$/i.test(n)){x.querySelectorAll('wpt').forEach(w=>f.push(gp(+w.getAttribute('lon'),+w.getAttribute('lat'),w.querySelector('name')?.textContent)));

for(const e of fe){if(e.geometry?.type==='Point'){const[x,y]=e.geometry.coordinates;await put('marks',{id:nid(),lat:y,lng:x,type:'pin',name:e.properties?.name||'Alama',t:Date.now()})}else rest.push(e)}

const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(g)],{type:'application/geo+json'}));a.download='alama-zangu.geojson';a.click()}

/* ===== Hifadhi ramani offline ===== */
async function dl(){const lay=bases[P.base],b=map.getBounds(),z0=map.getZoom(),mx=lay.options.maxNativeZoom||lay.options.maxZoom,urls=[];
for(let z=z0;z<=Math.min(z0+2,mx);z++){const a=map.project(b.getNorthWest(),z),c=map.project(b.getSouthEast(),z),n=1<<z;
for(let x=Math.floor(a.x/256);x<=Math.floor(c.x/256);x++)for(let y=Math.floor(a.y/256);y<=Math.floor(c.y/256);y++)urls.push(L.Util.template(lay._url,{x:((x%n)+n)%n,y,z}))}
if(urls.length>600)return toast(`Tiles ${urls.length} ni nyingi (kiwango 600). Sogea zaidi kisha jaribu tena.`,5000);
let i=0,ok=0;const w=async()=>{while(i<urls.length){const u=urls[i++];try{if(!await get('tiles',u)){const r=await fetch(u);if(r.ok)await put('tiles',await r.blob(),u)}ok++}catch{}if(i%25===0)toast(`Inapakua ${i}/${urls.length}`)}};
await Promise.all([w(),w(),w(),w()]);toast(`Imehifadhiwa tiles ${ok}/${urls.length}`,4000)}

/* ===== Akaunti: cloud-sync.js (kuingia kiotomatiki kwa akaunti ya app kuu) ===== */
let U=null,stTxt='';const setSt=t=>{stTxt=t;show.cur==='set'&&show('set')};
const loadScript=s=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=s;e.onload=ok;e.onerror=()=>no(new Error('cloud-sync.js haipatikani'));document.head.appendChild(e)});
const cref=()=>firebase.firestore().collection('users').doc(U.uid).collection('meta').doc('worldmap');
function setAv(){const a=$('#av');a.innerHTML=U?esc((U.name||'?')[0].toUpperCase()):I('user')}
async function onUser(u,offline){U={uid:u.uid,name:u.displayName||(u.email||'').split('@')[0]||'Mtumiaji',email:u.email||''};setAv();
const ow=await get('kv','owner').catch(()=>null);if(ow&&ow!==U.uid){await clr('marks');await loadMarks()}put('kv',U.uid,'owner').catch(()=>{});
if(offline){setSt('Nje ya mtandao (akaunti: imetambuliwa)');return}await pull()}
async function pull(){try{setSt('Inasawazisha...');const s=await cref().get();if(s.exists){const d=s.data(),cm=JSON.parse(d.marks||'[]'),m={};(await all('marks')).forEach(x=>m[x.id]=x);
for(const c of cm)if(!m[c.id]||(c.t||0)>(m[c.id].t||0))await put('marks',c);
try{const cp=JSON.parse(d.prefs||'{}');if(cp.theme&&cp.theme!==P.theme){P.theme=cp.theme;applyTheme()}}catch{}}
await loadMarks();await push()}catch(e){setSt('Imeshindwa: '+(e.code||e.message))}}
let ptm;function sched(){if(!U)return;clearTimeout(ptm);ptm=setTimeout(push,2500)}
async function push(){if(!U)return;if(!navigator.onLine)return setSt('Nje ya mtandao: itasawazishwa ukirudi mtandaoni');
try{await cref().set({marks:JSON.stringify(await all('marks')),prefs:JSON.stringify({theme:P.theme,base:P.base}),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});setSt('Imesawazishwa '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))}catch(e){setSt('Imeshindwa: '+(e.code||e.message))}}
function showLogin(){if($('#lg'))return;const d=document.createElement('div');d.id='lg';d.className='ov';d.innerHTML=`<div class="box"><b style="font-size:18px">Ingia kwenye akaunti yako</b><small>Akaunti ni ile ile ya app kuu. Alama zako zitasawazishwa kwenye wingu.</small>
<input id="ln" placeholder="Jina (kwa kujisajili tu)"><input id="le" type="email" placeholder="Barua pepe"><input id="lp" type="password" placeholder="Password"><small id="lm" style="color:#f87171"></small>
<button class="b p" onclick="doAuth(0)">Ingia</button><button class="b" onclick="doAuth(1)">Jisajili</button><button class="b" onclick="$('#lg').remove()">Endelea bila akaunti</button></div>`;document.body.append(d)}
async function doAuth(su){const m=$('#lm');m.textContent='Tafadhali subiri...';try{const u=su?await CloudSync.signUp($('#le').value.trim(),$('#lp').value,$('#ln').value.trim()):await CloudSync.signIn($('#le').value.trim(),$('#lp').value);$('#lg').remove();onUser(u)}catch(x){m.textContent=window.CloudSync?CloudSync.errorMessage(x):x.message}}
async function logout(){try{await CloudSync.signOut()}catch{}U=null;setAv();setSt('');show('set');showLogin()}
async function acct(){try{await loadScript('cloud-sync.js')}catch(e){setSt('Hali ya ndani (cloud-sync.js haipatikani)');return}
try{await CloudSync.init();const u=await CloudSync.currentUser();if(u)onUser(u);else showLogin()}
catch(e){const c=CloudSync.getUser&&CloudSync.getUser();if(c)onUser(c,true);else setSt('Hali ya ndani (hakuna mtandao)')}}

/* ===== Paneli na menyu ===== */
const TABS=[['exp','globe','Explore'],['sat','sat','Satellite'],['nav','route','Navigation'],['loc','pin','Locations'],['mea','ruler','Measure'],['eme','siren','Emergency'],['set','sliders','Settings']];
const TT={exp:'Explore',sat:'Satellite na tabaka',nav:'Navigation',loc:'My Locations',mea:'Measure',eme:'Emergency Map',set:'Settings'};
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" onclick="show('${t[0]}',1)">${I(t[1])}${t[2]}</button>`).join('');
const H={
exp:()=>`<div class="card"><small>Gusa popote kwenye ramani kuona kuratibu, mwinuko na hali ya hewa.</small></div>
<div class="row"><button class="b p" onclick="locate()">${I('locate')}Eneo langu</button><button class="b" onclick="track()">${I(watch!=null?'stop':'play')}${watch!=null?'Acha kufuatilia':'Fuatilia moja kwa moja'}</button></div>
<div class="row"><button class="b" onclick="const c=map.getCenter();share(c.lat,c.lng)">${I('share')}Shiriki katikati</button><button class="b" onclick="addMark(map.getCenter())">${I('pin')}Weka alama katikati</button></div>`,
sat:()=>`<div class="chips">${Object.keys(BN).map(k=>`<button class="b ${P.base===k?'on':''}" onclick="setBase('${k}')">${I(BN[k][0])}${BN[k][1]}</button>`).join('')}</div>
<small>Overlay</small><div class="chips">${Object.keys(OV).map(k=>`<button class="b ${ovL[k]?'on':''}" onclick="toggleOv('${k}')">${I(OV[k][0])}${OV[k][1]}</button>`).join('')}</div>
<small>Zoom ya juu ya picha halisi (Esri haina picha za kina kila mahali; ukiona "Map data not yet available" punguza)</small><div class="row">${[15,16,17,18].map(n=>`<button class="b ${(P.nz||17)===n?'on':''}" onclick="setNz(${n})">${n}</button>`).join('')}</div>
<button class="b ${P.names?'on':''}" style="width:100%" onclick="togNames();show('sat')">${I('tag')}Majina: vituo, vijiji, kata, mitaa, barabara, maduka</button>
<div class="legend">${Object.values(KD).filter((v,i,a)=>a.findIndex(x=>x[2]===v[2])===i).map(v=>`<span><i style="background:${v[1]}"></i>${v[2]}</span>`).join('')}</div>
<p><small>Majina huonekana kuanzia zoom 11; maduka, guest na barabara huonekana ukisogea zaidi. Picha za Esri husasishwa mara kwa mara (si live).</small></p>`,
nav:()=>`<input id="ra" placeholder="Kutoka (jina, 'mahali pangu' au lat,lng)"><div style="height:8px"></div><input id="rb" placeholder="Kwenda...">
<div class="row">${[['car','car','Gari'],['foot','walk','Kutembea'],['bike','bike','Baiskeli']].map(m=>`<button class="b rm ${(window.rmode||'car')===m[0]?'on':''}" data-m="${m[0]}" onclick="setRm('${m[0]}')">${I(m[1])}${m[2]}</button>`).join('')}</div>
<div class="row"><button class="b p" onclick="route()">${I('route')}Hesabu njia</button><button class="b" onclick="rg.clearLayers();$('#rr').innerHTML=''">${I('close')}Futa</button></div><div id="rr"></div>`,
loc:()=>`<div class="row"><button class="b p" onclick="startAdd('pin')">${I('plus')}Gusa ramani</button><button class="b" onclick="addMark(map.getCenter())">${I('pin')}Katikati</button></div>
${marks.length?marks.map(m=>{const y=TY[m.type]||TY.pin;return `<div class="it"><span class="bd" style="--c:${y[2]}">${I(y[0])}</span><div><b>${esc(m.name)}</b><br><small>${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}</small></div><button class="ib" onclick="goM('${m.id}')">${I('locate')}</button><button class="ib" onclick="editM('${m.id}')">${I('edit')}</button><button class="ib" onclick="shM('${m.id}')">${I('share')}</button><button class="ib" onclick="delM('${m.id}')">${I('trash')}</button></div>`}).join(''):'<small>Hakuna alama bado.</small>'}`,
mea:()=>`<div class="row"><button class="b ${mType==='line'?'on':''}" onclick="mSet('line');show('mea')">${I('ruler')}Umbali</button><button class="b ${mType==='area'?'on':''}" onclick="mSet('area');show('mea')">${I('layers')}Eneo</button><button class="b" onclick="mp.pop();mDraw()">${I('undo')}</button><button class="b d" onclick="mSet(mType)">${I('trash')}</button></div>
<small>Gusa ramani kuongeza pointi.</small><div id="mres" class="card"></div>`,
eme:()=>`<div class="row"><button class="b p" onclick="loadEm()">${I('siren')}Pakia vituo vya eneo hili</button><button class="b" onclick="emL.clearLayers()">Ficha</button></div><small>Zimamoto, hospitali, hydrant, maji, mkusanyiko (OpenStreetMap). Weka alama zako:</small>
<div class="chips">${Object.keys(TY).filter(k=>k!=='pin').map(k=>`<button class="b" onclick="startAdd('${k}')"><span class="bd" style="--c:${TY[k][2]};width:26px;height:26px">${I(TY[k][0])}</span>${TY[k][1]}</button>`).join('')}</div>`,
set:()=>`<div class="card" style="display:flex;gap:12px;align-items:center">${U?`<span class="bd" style="--c:#3b82f6;width:44px;height:44px;border-radius:50%;font-weight:800">${esc(U.name[0].toUpperCase())}</span><div style="flex:1;min-width:0"><b>${esc(U.name)}</b><br><small>${esc(U.email)}</small></div><button class="b" onclick="logout()">${I('out')}Toka</button>`:`<span class="bd" style="--c:#64748b;width:44px;height:44px;border-radius:50%">${I('user')}</span><div style="flex:1"><b>Hujaingia</b><br><small>Hali ya ndani tu</small></div><button class="b p" onclick="showLogin()">Ingia</button>`}</div>
<div class="row" style="align-items:center"><small style="flex:1">${I('cloud')} ${esc(stTxt||'Wingu')}</small>${U?`<button class="b" onclick="pull()">${I('up')}Sawazisha</button>`:''}</div>
<div class="row"><button class="b" onclick="P.theme=P.theme==='dark'?'light':'dark';applyTheme();savePrefs();show('set')">${I(P.theme==='dark'?'sun':'sun')}${P.theme==='dark'?'Mwanga (Light)':'Giza (Dark)'}</button></div>
<small>TomTom key ya bure (Trafiki)</small><div class="row"><input id="tk" type="password" value="${esc(P.tt)}" placeholder="API key"><button class="b" style="flex:0" onclick="P.tt=$('#tk').value.trim();savePrefs();toast('Imehifadhiwa')">Hifadhi</button></div>
<div class="row"><button class="b p" onclick="dl()">${I('down')}Hifadhi ramani ya eneo hili offline</button><button class="b d" onclick="clr('tiles').then(()=>toast('Cache imefutwa'))">${I('trash')}Futa cache</button></div>
<div class="row"><button class="b" onclick="imp.click()">${I('up')}Ingiza GeoJSON/KML/GPX</button><button class="b" onclick="exp()">${I('down')}Hamisha GeoJSON</button></div>
<small>Offline: ramani ulizotazama au kupakua tu ndizo zinapatikana. Alama na mipangilio huhifadhiwa kwenye IndexedDB.</small>`};
function show(id,tog){const pn=$('#pn'),nb=document.querySelectorAll('#nav button');
if(tog&&show.cur===id){pn.style.display='none';show.cur=null;nb.forEach(b=>b.classList.remove('on'));if(mode==='measure')mode=null;return}
show.cur=id;pn.innerHTML=`<div class="h"><b>${TT[id]}</b><button class="ib" onclick="show('${id}',1)">${I('close')}</button></div>`+H[id]();pn.style.display='block';nb.forEach(b=>b.classList.toggle('on',b.dataset.t===id));if(id==='mea')mDraw()}

map.on('click',async e=>{if(mode==='add'){mode=null;return addMark(e.latlng,addType)}
if(show.cur==='mea'){mp.push(e.latlng);return mDraw()}
const ll=e.latlng,f=n=>n.toFixed(5);$('#co').innerHTML=`${f(ll.lat)}, ${f(ll.lng)}`;
const p=L.popup().setLatLng(ll).setContent(`${f(ll.lat)}, ${f(ll.lng)}<br><small>Inapakia...</small>`).openOn(map);
try{const[a,w,rv]=await Promise.all([j(`https://api.open-meteo.com/v1/elevation?latitude=${ll.lat}&longitude=${ll.lng}`),j(`https://api.open-meteo.com/v1/forecast?latitude=${ll.lat}&longitude=${ll.lng}&current=temperature_2m,precipitation`),j(revU(ll,18)).catch(()=>null)]);
p.setContent(`<b>${f(ll.lat)}, ${f(ll.lng)}</b><br>${rv?adrParts(rv.address||{}).map(x=>x[0]+': '+esc(x[1])).join('<br>')+(rv.address?.road?'<br>Barabara: '+esc(rv.address.road):'')+'<br>':''}Mwinuko: ${Math.round(a.elevation[0])} m<br>Joto: ${w.current.temperature_2m}&deg;C &bull; Mvua: ${w.current.precipitation} mm<br><a href="#" onclick="share(${ll.lat},${ll.lng});return false">Shiriki</a>`)}catch{p.setContent(`<b>${f(ll.lat)}, ${f(ll.lng)}</b><br><small>Hakuna mtandao: mwinuko na hewa havipatikani</small>`)}});
map.on('mousemove',e=>{if(!lastPos)$('#co').innerHTML=`${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`});
map.on('moveend',()=>{put('kv',{c:map.getCenter(),z:map.getZoom()},'view').catch(()=>{});clearTimeout(mvT1);mvT1=setTimeout(loadNames,600);clearTimeout(mvT2);mvT2=setTimeout(rev,1500)});

/* ===== Anza ===== */
bases.sat.addTo(map);setTimeout(()=>map.invalidateSize(),300);let tileErr=0;
bases.sat.on('tileerror',()=>{if(!tileErr){tileErr=1;toast('Tiles hazipakii: angalia mtandao',5000)}});
const net=()=>$('#off').style.display=navigator.onLine?'none':'block';addEventListener('online',()=>{net();U&&push()});addEventListener('offline',net);net();
(async()=>{let p=null;try{p=await get('kv','prefs');if(p)P=Object.assign(P,p)}catch{}if(!p)P.ov={labels:1};if(P.names===undefined)P.names=true;applyTheme();[bases.sat,bases.topo].forEach(l=>l.options.maxNativeZoom=P.nz||17);setBase(P.base);nbUpd();
for(const k of Object.keys(P.ov||{}))if(P.ov[k]&&navigator.onLine)toggleOv(k);
await loadMarks();try{const v=await get('kv','view');if(v)map.setView(v.c,v.z)}catch{}setTimeout(()=>{loadNames();rev()},500);acct()})();
</script>
