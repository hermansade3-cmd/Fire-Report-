<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akaunti Yangu — Rescue Report</title>
<meta name="theme-color" content="#4a4687">
<style>
:root {
  --bg: #f3f4f8; --card: #ffffff; --text: #1f2333; --muted: #6a7087; --line: #e1e4ee;
  --brand: #4a4687; --accent: #cf4a24; --accent-text: #ffffff;
  --ok: #1f8a4c; --warn: #b7791f; --err: #c53030; --field: #f7f8fc;
  --shadow: 0 6px 20px rgba(40, 44, 80, .08);
}
:root[data-theme="dark"] {
  --bg: #0e1420; --card: #172033; --text: #eef2f8; --muted: #9aa4b2; --line: #26324a;
  --brand: #3a3670; --accent: #e2562e; --accent-text: #ffffff;
  --ok: #46c27a; --warn: #e0a93b; --err: #ff7a6b; --field: #101827;
  --shadow: 0 6px 20px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.45; min-height: 100vh; }
header.top {
  position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 12px; display: flex; align-items: center; gap: 12px;
}
header.top h1 { font-size: 19px; margin: 0; font-weight: 600; flex: 1; }
#back, #chat-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 18px; cursor: pointer; display: grid; place-items: center; position: relative; }
#chat-btn .badge { position: absolute; top: -2px; right: -2px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 5px; min-width: 16px; text-align: center; }
main { max-width: 460px; margin: 0 auto; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 28px); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
.who { display: flex; align-items: center; gap: 14px; }
.avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 700; flex: none; }
.who .info { flex: 1; min-width: 0; }
.who .name { font-size: 18px; font-weight: 700; }
.who .mail { color: var(--muted); font-size: 14px; word-break: break-all; }
.pill { display: inline-block; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--ok); }
.pill.pending { color: var(--warn); } .pill.error { color: var(--err); } .pill.offline { color: var(--muted); }
.section-title { font-size: 15px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 18px 4px 8px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--field); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stat .num { font-size: 26px; font-weight: 700; }
.stat .lbl { font-size: 13px; color: var(--muted); margin-top: 2px; }
.btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font: inherit; font-weight: 700; cursor: pointer; background: var(--field); color: var(--text); border: 1.5px solid var(--line); margin-top: 10px; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.btn.danger { color: var(--err); }
.btn:disabled { opacity: .55; cursor: default; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { margin-top: 0; }
.link { display: block; margin: 14px auto 0; border: 0; background: none; color: var(--brand); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
:root[data-theme="dark"] .link { color: #a9a4f0; }
.rows { margin: 14px 0 4px; border-top: 1px solid var(--line); }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.row span:first-child { color: var(--muted); }
.row span:last-child { font-weight: 600; text-align: right; }
.note { color: var(--muted); font-size: 13px; margin: 4px; }
[hidden] { display: none !important; }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); background: #1f2333; color: #fff; padding: 11px 18px; border-radius: 24px; font-size: 14px; max-width: 90vw; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#toast.show { opacity: 1; }
/* Chat list */
.chat-list { display: flex; flex-direction: column; gap: 8px; }
.chat-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; border: 1px solid var(--line); background: var(--field); }
.chat-item:hover { background: var(--card); }
.chat-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
.chat-avatar.unread { background: var(--accent); }
.chat-meta { flex: 1; min-width: 0; }
.chat-meta .n { font-weight: 600; font-size: 15px; }
.chat-meta .m { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-time { font-size: 12px; color: var(--muted); text-align: right; }
.chat-unread { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 6px; display: inline-block; margin-top: 4px; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <button id="back" type="button" aria-label="Rudi">&#8592;</button>
  <h1>Akaunti Yangu</h1>
  <button id="chat-btn" type="button" aria-label="Mazungumzo">💬<span class="badge" id="chat-badge" hidden>0</span></button>
</header>

<main>
  <div id="view-loading" class="note" style="text-align:center;padding:40px 0;">Inapakia…</div>

  <section id="view-account" hidden>
    <!-- Profile -->
    <div class="card">
      <div class="who">
        <div class="avatar" id="avatar">?</div>
        <div class="info">
          <div class="name" id="acc-name">—</div>
          <div class="mail" id="acc-email"></div>
          <div class="pill" id="acc-status">Imeunganishwa</div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="section-title">Takwimu</div>
    <div class="stats">
      <div class="stat"><div class="num" id="n-local">–</div><div class="lbl">Ripoti kwenye kifaa</div></div>
      <div class="stat"><div class="num" id="n-cloud">–</div><div class="lbl">Ripoti kwenye akaunti</div></div>
      <div class="stat"><div class="num" id="n-chats">–</div><div class="lbl">Mazungumzo</div></div>
      <div class="stat"><div class="num" id="n-photos">–</div><div class="lbl">Picha</div></div>
    </div>

    <!-- Sync info -->
    <div class="section-title">Usawazishaji</div>
    <div class="card">
      <div class="rows" style="margin-top:0;border-top:0;">
        <div class="row"><span>Backup ya mwisho</span><span id="last-sync">–</span></div>
        <div class="row"><span>Auto-backup</span><span style="color:var(--ok)">Imewashwa ✓</span></div>
        <div class="row"><span>Hali</span><span id="sync-state">—</span></div>
      </div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn primary" id="backup-now" type="button">Hifadhi sasa</button>
        <button class="btn" id="restore-btn" type="button">Rejesha</button>
      </div>
    </div>

    <!-- Chats -->
    <div class="section-title">Mazungumzo ya hivi karibuni</div>
    <div class="card" style="padding:14px;">
      <div id="recent-chats" class="chat-list">
        <p class="note" style="text-align:center;">Hakuna mazungumzo bado. Gusa 💬 juu kulia kuanza.</p>
      </div>
      <button class="link" id="view-all-chats" type="button">Tazama mazungumzo yote →</button>
    </div>

    <!-- Actions -->
    <button class="btn primary" id="go-app" type="button" style="margin-top:18px;">Rudi kwenye App</button>
    <button class="btn danger" id="signout" type="button">Toka (Sign out)</button>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="core.js?v=5"></script>
<script src="cloud-sync.js?v=2"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  /* theme */
  (async function applyTheme() {
    var theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    try {
      var s = await RescueDB.getAllSettings();
      if (s && s.theme) theme = s.theme === "light" ? "light" : "dark";
    } catch (e) { }
    document.documentElement.setAttribute("data-theme", theme);
  })();

  var toastTimer;
  function toast(t) {
    var el = $("toast"); el.textContent = t; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }
  function show(view) {
    ["view-loading", "view-account"].forEach(function (id) { $(id).hidden = id !== view; });
  }
  function fmt(d) { return d ? d.toLocaleString() : "Bado"; }

  $("back").addEventListener("click", function () { location.href = "index.html"; });
  $("go-app").addEventListener("click", function () { location.href = "index.html"; });
  $("chat-btn").addEventListener("click", function () { location.href = "chat.html"; });
  $("view-all-chats").addEventListener("click", function () { location.href = "chat.html"; });

  /* status */
  var statusText = {
    ok: ["Imeunganishwa · imehifadhiwa", ""], syncing: ["Inahifadhi…", "pending"], pending: ["Inasubiri kuhifadhi…", "pending"],
    offline: ["Offline · itahifadhi ukirudi online", "offline"], error: ["Hitilafu ya kuhifadhi", "error"], idle: ["Imeunganishwa", ""]
  };
  function paintStatus(s, err) {
    var t = statusText[s] || statusText.idle, el = $("acc-status");
    el.textContent = s === "error" && err ? CloudSync.errorMessage(err) : t[0];
    el.className = "pill " + t[1];
    $("last-sync").textContent = fmt(CloudSync.lastSync());
    $("sync-state").textContent = t[0];
  }

  async function refreshInfo() {
    var local = 0;
    try { local = (await RescueDB.getAllReports()).length; } catch (e) { }
    $("n-local").textContent = local;

    try {
      var info = await CloudSync.cloudInfo();
      $("n-cloud").textContent = info && info.exists ? info.reports : 0;
      $("n-photos").textContent = info && info.photos != null ? info.photos : "–";
    } catch (e) { $("n-cloud").textContent = "–"; }

    try {
      var chats = await CloudSync.getRecentChats(5);
      $("n-chats").textContent = chats.total || 0;
      renderRecentChats(chats.list || []);
    } catch (e) { }
  }

  function renderRecentChats(list) {
    var box = $("recent-chats");
    if (!list || list.length === 0) {
      box.innerHTML = '<p class="note" style="text-align:center;">Hakuna mazungumzo bado. Gusa 💬 juu kulia kuanza.</p>';
      return;
    }
    box.innerHTML = list.map(function (c) {
      var initial = (c.name || "?").charAt(0).toUpperCase();
      var unread = c.unread > 0 ? '<div class="chat-unread">' + c.unread + '</div>' : '';
      return '<div class="chat-item" data-uid="' + c.uid + '">'
        + '<div class="chat-avatar' + (c.unread > 0 ? ' unread' : '') + '">' + initial + '</div>'
        + '<div class="chat-meta"><div class="n">' + escapeHtml(c.name || c.email || "Mtumiaji") + '</div>'
        + '<div class="m">' + escapeHtml(c.lastMessage || "Anza mazungumzo…") + '</div></div>'
        + '<div><div class="chat-time">' + (c.time ? timeAgo(c.time) : '') + '</div>' + unread + '</div>'
        + '</div>';
    }).join("");
    box.querySelectorAll(".chat-item").forEach(function (el) {
      el.addEventListener("click", function () {
        location.href = "chat.html?uid=" + encodeURIComponent(el.getAttribute("data-uid"));
      });
    });
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function timeAgo(ts) {
    var d = new Date(ts), now = new Date(), diff = (now - d) / 1000;
    if (diff < 60) return "sasa";
    if (diff < 3600) return Math.floor(diff / 60) + "m";
    if (diff < 86400) return Math.floor(diff / 3600) + "h";
    return d.toLocaleDateString();
  }

  async function checkUnread() {
    try {
      var n = await CloudSync.getTotalUnread();
      var b = $("chat-badge");
      if (n > 0) { b.textContent = n > 99 ? "99+" : n; b.hidden = false; }
      else b.hidden = true;
    } catch (e) { }
  }

  /* actions */
  $("backup-now").addEventListener("click", async function () {
    var b = $("backup-now"); b.disabled = true; b.textContent = "Inahifadhi…";
    try {
      var r = await CloudSync.backupNow();
      toast(r.uploaded || r.deleted ? "Imehifadhiwa (" + r.uploaded + " mapya)" : "Kila kitu tayari kimehifadhiwa");
      await refreshInfo();
    } catch (err) { toast(CloudSync.errorMessage(err)); }
    b.disabled = false; b.textContent = "Hifadhi sasa";
  });

  $("restore-btn").addEventListener("click", async function () {
    if (!confirm("Rejesha data kutoka akaunti? Data iliyopo haitafutwa.")) return;
    var b = $("restore-btn"); b.disabled = true; b.textContent = "Inarejesha…";
    try {
      var r = await CloudSync.restore("merge");
      toast(r.restored ? "Imerejeshwa: " + r.count + " vitu" : "Hakuna data ya ziada");
      await refreshInfo();
    } catch (err) { toast(CloudSync.errorMessage(err)); }
    b.disabled = false; b.textContent = "Rejesha";
  });

  $("signout").addEventListener("click", async function () {
    if (!confirm("Kutoka kwenye akaunti? Data ya kifaa itabaki.")) return;
    try { await CloudSync.signOut(); } catch (e) { }
    location.href = "login.html";
  });

  /* start */
  (async function start() {
    if (!window.CloudSync || !window.RescueDB) {
      show("view-account");
      toast("Faili za app hazikupatikana");
      return;
    }
    try {
      var user = await CloudSync.currentUser();
      if (!user) { location.href = "login.html"; return; }
      $("acc-name").textContent = user.displayName || user.email || "Mtumiaji";
      $("acc-email").textContent = user.email || "";
      $("avatar").textContent = (user.displayName || user.email || "?").charAt(0).toUpperCase();
      show("view-account");
      CloudSync.onStatus(paintStatus);
      paintStatus("idle");
      await refreshInfo();
      checkUnread();
      // Auto refresh kila sekunde 30
      setInterval(function () { refreshInfo(); checkUnread(); }, 30000);
      // Auto-backup baada ya sekunde 2
      setTimeout(function () { CloudSync.scheduleBackup(2000); }, 1500);
    } catch (err) {
      location.href = "login.html";
    }
  })();
})();
</script>
</body>
</html>
