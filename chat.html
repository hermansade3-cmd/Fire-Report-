<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mazungumzo — Rescue Report</title>
<meta name="theme-color" content="#4a4687">
<style>
:root {
  --bg: #f3f4f8; --card: #ffffff; --text: #1f2333; --muted: #6a7087; --line: #e1e4ee;
  --brand: #4a4687; --accent: #cf4a24; --accent-text: #ffffff;
  --ok: #1f8a4c; --warn: #b7791f; --err: #c53030; --field: #f7f8fc;
  --shadow: 0 6px 20px rgba(40, 44, 80, .08);
  --msg-me: #4a4687; --msg-them: #ffffff;
}
:root[data-theme="dark"] {
  --bg: #0e1420; --card: #172033; --text: #eef2f8; --muted: #9aa4b2; --line: #26324a;
  --brand: #3a3670; --accent: #e2562e; --accent-text: #ffffff;
  --ok: #46c27a; --warn: #e0a93b; --err: #ff7a6b; --field: #101827;
  --shadow: 0 6px 20px rgba(0, 0, 0, .35);
  --msg-me: #3a3670; --msg-them: #172033;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.45; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header.top {
  flex: none; z-index: 5; background: var(--brand); color: #fff;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 12px; display: flex; align-items: center; gap: 10px;
}
header.top h1 { font-size: 17px; margin: 0; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .sub { font-size: 12px; opacity: .8; }
#back { width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 20px; cursor: pointer; flex: none; }
#search-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 18px; cursor: pointer; flex: none; }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.wrap { max-width: 560px; margin: 0 auto; padding: 14px 12px 20px; }
.search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
.search-bar input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--field); color: var(--text); font: inherit; outline: none; }
.search-bar input:focus { border-color: var(--brand); }
.search-bar button { border: 0; border-radius: 12px; padding: 0 16px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
.sec { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 16px 4px 8px; }
.chat-list { display: flex; flex-direction: column; gap: 6px; }
.chat-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer; border: 1px solid var(--line); background: var(--card); }
.chat-item:active { background: var(--field); }
.chat-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 19px; flex: none; }
.chat-avatar.unread { background: var(--accent); }
.chat-meta { flex: 1; min-width: 0; }
.chat-meta .n { font-weight: 600; font-size: 15px; }
.chat-meta .m { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-time { font-size: 12px; color: var(--muted); text-align: right; }
.chat-unread { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 6px; display: inline-block; margin-top: 4px; }
.note { color: var(--muted); font-size: 14px; text-align: center; padding: 30px 10px; }
/* Chat view */
#chat-view { display: flex; flex-direction: column; height: 100%; }
.messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.bubble { max-width: 80%; padding: 10px 13px; border-radius: 16px; font-size: 15px; word-wrap: break-word; position: relative; }
.bubble.me { align-self: flex-end; background: var(--msg-me); color: #fff; border-bottom-right-radius: 4px; }
.bubble.them { align-self: flex-start; background: var(--msg-them); color: var(--text); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bubble .time { font-size: 11px; opacity: .7; margin-top: 3px; text-align: right; }
.bubble .sender { font-size: 12px; font-weight: 700; margin-bottom: 3px; color: var(--brand); }
:root[data-theme="dark"] .bubble.them .sender { color: #a9a4f0; }
.composer { flex: none; display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); background: var(--card); border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { flex: 1; resize: none; border: 1.5px solid var(--line); border-radius: 20px; padding: 10px 14px; font: inherit; background: var(--field); color: var(--text); outline: none; max-height: 120px; min-height: 42px; }
.composer textarea:focus { border-color: var(--brand); }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--field); color: var(--brand); font-size: 20px; cursor: pointer; flex: none; display: grid; place-items: center; }
.icon-btn.send { background: var(--accent); color: #fff; }
.icon-btn.share { background: var(--field); color: var(--accent); }
.icon-btn:disabled { opacity: .5; }
/* Share sheet */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); max-height: 80vh; overflow-y: auto; }
.sheet h3 { margin: 0 0 12px; font-size: 17px; }
.share-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); margin-bottom: 8px; cursor: pointer; text-align: left; width: 100%; font: inherit; color: var(--text); }
.share-item:active { background: var(--card); }
.share-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 20px; flex: none; }
.share-item .t { flex: 1; }
.share-item .t .ttl { font-weight: 600; font-size: 15px; }
.share-item .t .sub { font-size: 13px; color: var(--muted); }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); background: #1f2333; color: #fff; padding: 11px 18px; border-radius: 24px; font-size: 14px; max-width: 90vw; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100; }
#toast.show { opacity: 1; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top" id="top-header">
  <button id="back" type="button" aria-label="Rudi">&#8592;</button>
  <div style="flex:1;min-width:0;">
    <h1 id="top-title">Mazungumzo</h1>
    <div class="sub" id="top-sub"></div>
  </div>
  <button id="search-btn" type="button" aria-label="Tafuta">🔍</button>
</header>

<main id="main-area">
  <!-- LIST VIEW -->
  <div class="wrap" id="list-view">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Tafuta mtumiaji kwa jina au email…">
      <button id="search-go" type="button">Tafuta</button>
    </div>
    <div class="sec">Mazungumzo yako</div>
    <div id="chats-list" class="chat-list"></div>
    <div class="sec" id="search-sec" hidden>Matokeo ya utafutaji</div>
    <div id="search-list" class="chat-list"></div>
  </div>

  <!-- CHAT VIEW -->
  <div id="chat-view" hidden style="height:100%;">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <button class="icon-btn share" id="share-btn" type="button" title="Shiriki">📎</button>
      <textarea id="msg-input" rows="1" placeholder="Andika ujumbe…"></textarea>
      <button class="icon-btn send" id="send-btn" type="button" title="Tuma">➤</button>
    </div>
  </div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script src="core.js?v=5"></script>
<script src="cloud-sync.js?v=2"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var peerUid = params.get("uid");
  var peerUser = null;
  var me = null;
  var unsubMessages = null;

  /* theme */
  (async function applyTheme() {
    var theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    try {
      var s = await RescueDB.getAllSettings();
      if (s && s.theme) theme = s.theme === "light" ? "light" : "dark";
    } catch (e) { }
    document.documentElement.setAttribute("data-theme", theme);
  })();

  var toastTimer;
  function toast(t) {
    var el = $("toast"); el.textContent = t; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmtTime(ts) {
    var d = new Date(ts), now = new Date();
    var same = d.toDateString() === now.toDateString();
    if (same) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    return d.toLocaleDateString([], { day: "2-digit", month: "short" }) + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function timeAgo(ts) {
    var d = new Date(ts), diff = (Date.now() - d) / 1000;
    if (diff < 60) return "sasa";
    if (diff < 3600) return Math.floor(diff / 60) + "m";
    if (diff < 86400) return Math.floor(diff / 3600) + "h";
    return d.toLocaleDateString();
  }

  $("back").addEventListener("click", function () {
    if (peerUid) { location.href = "chat.html"; }
    else { location.href = "account.html"; }
  });

  $("search-btn").addEventListener("click", function () {
    $("search-input").focus();
    $("search-input").scrollIntoView({ behavior: "smooth", block: "center" });
  });

  /* ===== LIST VIEW ===== */
  async function loadChats() {
    try {
      var chats = await CloudSync.getRecentChats(50);
      var box = $("chats-list");
      if (!chats.list || chats.list.length === 0) {
        box.innerHTML = '<p class="note">Hakuna mazungumzo bado.<br>Tafuta mtumiaji juu ili kuanza.</p>';
        return;
      }
      box.innerHTML = chats.list.map(chatItemHtml).join("");
      bindChatItems(box);
    } catch (e) { toast("Hitilafu: " + e.message); }
  }

  function chatItemHtml(c) {
    var initial = (c.name || "?").charAt(0).toUpperCase();
    var unread = c.unread > 0 ? '<div class="chat-unread">' + c.unread + '</div>' : '';
    return '<div class="chat-item" data-uid="' + c.uid + '">'
      + '<div class="chat-avatar' + (c.unread > 0 ? ' unread' : '') + '">' + initial + '</div>'
      + '<div class="chat-meta"><div class="n">' + escapeHtml(c.name || c.email || "Mtumiaji") + '</div>'
      + '<div class="m">' + escapeHtml(c.lastMessage || "Anza mazungumzo…") + '</div></div>'
      + '<div><div class="chat-time">' + (c.time ? timeAgo(c.time) : '') + '</div>' + unread + '</div>'
      + '</div>';
  }
  function bindChatItems(box) {
    box.querySelectorAll(".chat-item").forEach(function (el) {
      el.addEventListener("click", function () {
        location.href = "chat.html?uid=" + encodeURIComponent(el.getAttribute("data-uid"));
      });
    });
  }

  /* search users */
  async function doSearch() {
    var q = $("search-input").value.trim();
    if (q.length < 2) { toast("Andika angalau herufi 2"); return; }
    $("search-sec").hidden = false;
    $("search-list").innerHTML = '<p class="note">Inatafuta…</p>';
    try {
      var users = await CloudSync.searchUsers(q);
      if (!users || users.length === 0) {
        $("search-list").innerHTML = '<p class="note">Hakuna mtumiaji aliyepatikana.</p>';
        return;
      }
      $("search-list").innerHTML = users.map(function (u) {
        var initial = (u.displayName || "?").charAt(0).toUpperCase();
        return '<div class="chat-item" data-uid="' + u.uid + '">'
          + '<div class="chat-avatar">' + initial + '</div>'
          + '<div class="chat-meta"><div class="n">' + escapeHtml(u.displayName || u.email) + '</div>'
          + '<div class="m">' + escapeHtml(u.email || "") + '</div></div>'
          + '<div class="chat-time">Anza →</div>'
          + '</div>';
      }).join("");
      $("search-list").querySelectorAll(".chat-item").forEach(function (el) {
        el.addEventListener("click", function () {
          location.href = "chat.html?uid=" + encodeURIComponent(el.getAttribute("data-uid"));
        });
      });
    } catch (e) { toast("Hitilafu: " + e.message); }
  }
  $("search-go").addEventListener("click", doSearch);
  $("search-input").addEventListener("keydown", function (e) { if (e.key === "Enter") doSearch(); });

  /* ===== CHAT VIEW ===== */
  async function openChat() {
    $("list-view").hidden = true;
    $("chat-view").hidden = false;
    $("main-area").style.overflow = "hidden";
    $("search-btn").hidden = true;

    try {
      peerUser = await CloudSync.getUser(peerUid);
    } catch (e) { toast("Mtumiaji hakupatikana"); location.href = "chat.html"; return; }
    if (!peerUser) { toast("Mtumiaji hakupatikana"); location.href = "chat.html"; return; }

    $("top-title").textContent = peerUser.displayName || peerUser.email || "Mtumiaji";
    $("top-sub").textContent = peerUser.online ? "Mtandaoni" : "Nje ya mtandao";

    document.title = (peerUser.displayName || "Chat") + " — Rescue Report";

    await loadMessages();
    await markRead();
    // Realtime listener
    unsubMessages = CloudSync.watchMessages(peerUid, function (msg) {
      appendMessage(msg, true);
      markRead();
    });

    // composer
    var input = $("msg-input");
    input.addEventListener("input", function () {
      input.style.height = "auto";
      input.style.height = Math.min(120, input.scrollHeight) + "px";
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    $("send-btn").addEventListener("click", sendMessage);
    $("share-btn").addEventListener("click", openShareSheet);
  }

  async function markRead() {
    try { await CloudSync.markChatRead(peerUid); } catch (e) { }
  }

  async function loadMessages() {
    $("messages").innerHTML = '<p class="note">Inapakia…</p>';
    try {
      var msgs = await CloudSync.getMessages(peerUid, 100);
      var box = $("messages");
      if (!msgs || msgs.length === 0) {
        box.innerHTML = '<p class="note">Anza mazungumzo kwa kutuma ujumbe.</p>';
        return;
      }
      box.innerHTML = "";
      msgs.forEach(function (m) { appendMessage(m, false); });
      box.scrollTop = box.scrollHeight;
    } catch (e) { $("messages").innerHTML = '<p class="note">Hitilafu kupakia ujumbe.</p>'; }
  }

  function appendMessage(m, scroll) {
    var box = $("messages");
    var note = box.querySelector(".note"); if (note) note.remove();
    var meUid = me && (me.uid || me.id);
    var isMe = m.from === meUid;
    var div = document.createElement("div");
    div.className = "bubble " + (isMe ? "me" : "them");
    if (m.type === "share") {
      var payload = m.share || {};
      div.innerHTML = '<div style="font-weight:700;margin-bottom:4px;">📋 ' + escapeHtml(payload.title || "Taarifa") + '</div>'
        + (payload.summary ? '<div style="font-size:14px;opacity:.9;">' + escapeHtml(payload.summary) + '</div>' : '')
        + (payload.kind ? '<div style="font-size:12px;opacity:.75;margin-top:4px;">Aina: ' + escapeHtml(payload.kind) + '</div>' : '')
        + '<div class="time">' + fmtTime(m.at) + '</div>';
    } else {
      div.innerHTML = escapeHtml(m.text || "")
        + '<div class="time">' + fmtTime(m.at) + '</div>';
    }
    box.appendChild(div);
    if (scroll) box.scrollTop = box.scrollHeight;
  }

  async function sendMessage() {
    var input = $("msg-input");
    var text = input.value.trim();
    if (!text) return;
    input.value = ""; input.style.height = "auto";
    try {
      await CloudSync.sendMessage(peerUid, { type: "text", text: text });
    } catch (e) { toast("Imeshindikana kutuma: " + e.message); }
  }

  /* ===== SHARE SHEET ===== */
  async function openShareSheet() {
    var reports = [];
    try { reports = await RescueDB.getAllReports(); } catch (e) { }
    var sheet = document.createElement("div");
    sheet.className = "sheet-backdrop";
    sheet.innerHTML = '<div class="sheet"><h3>Shiriki na ' + escapeHtml(peerUser.displayName || peerUser.email) + '</h3>'
      + '<button class="share-item" data-kind="text"><div class="share-icon">💬</div><div class="t"><div class="ttl">Ujumbe wa maandishi</div><div class="sub">Tuma maandishi tu</div></div></button>'
      + '<button class="share-item" data-kind="summary"><div class="share-icon">📊</div><div class="t"><div class="ttl">Muhtasari wa ripoti zangu</div><div class="sub">Ripoti ' + reports.length + ' zilizopo</div></div></button>';

    // Chagua ripoti moja
    if (reports.length > 0) {
      reports.slice(0, 30).forEach(function (r) {
        var title = r.title || r.name || r.type || r.category || ("Ripoti #" + (r.id || "?"));
        sheet.querySelector(".sheet").innerHTML += '<button class="share-item" data-kind="report" data-rid="' + (r.id || "") + '">'
          + '<div class="share-icon">📄</div><div class="t"><div class="ttl">' + escapeHtml(title) + '</div>'
          + '<div class="sub">' + escapeHtml(r.location || r.place || r.address || "Ripoti") + '</div></div></button>';
      });
    }

    sheet.querySelector(".sheet").innerHTML += '<button class="share-item" data-kind="cancel"><div class="share-icon" style="background:var(--muted)">✕</div><div class="t"><div class="ttl">Ghairi</div></div></button>';
    document.body.appendChild(sheet);
    sheet.addEventListener("click", function (e) { if (e.target === sheet) sheet.remove(); });
    sheet.querySelectorAll(".share-item").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        var kind = btn.getAttribute("data-kind");
        sheet.remove();
        if (kind === "cancel") return;
        if (kind === "text") {
          var t = prompt("Andika ujumbe wa kushiriki:");
          if (!t) return;
          try { await CloudSync.sendMessage(peerUid, { type: "text", text: t }); } catch (e) { toast(e.message); }
          return;
        }
        if (kind === "summary") {
          var summary = "Nina ripoti " + reports.length + " kwenye akaunti yangu.";
          try { await CloudSync.sendMessage(peerUid, { type: "share", share: { kind: "summary", title: "Muhtasari wa ripoti", summary: summary } }); } catch (e) { toast(e.message); }
          return;
        }
        if (kind === "report") {
          var rid = btn.getAttribute("data-rid");
          var rep = reports.find(function (x) { return String(x.id) === String(rid); });
          if (!rep) return;
          var title = rep.title || rep.name || rep.type || "Ripoti";
          var summary = (rep.location || rep.place || rep.address || "") + (rep.description ? " — " + rep.description : "");
          try {
            await CloudSync.sendMessage(peerUid, {
              type: "share",
              share: { kind: "report", title: title, summary: summary, reportId: rid }
            });
          } catch (e) { toast(e.message); }
          return;
        }
      });
    });
  }

  /* ===== start ===== */
  (async function start() {
    if (!window.CloudSync || !window.RescueDB) {
      toast("Faili za app hazikupatikana");
      return;
    }
    try {
      me = await CloudSync.currentUser();
      if (!me) { location.href = "login.html"; return; }
    } catch (e) { location.href = "login.html"; return; }

    if (peerUid) {
      await openChat();
    } else {
      // LIST view
      await loadChats();
      // Auto-refresh list
      setInterval(loadChats, 15000);
    }
  })();
})();
</script>
</body>
</html>
