<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafaili</title>
<style>
  /* ---------- Design tokens (theme inatoka kwenye app: ?theme=light|dark) ---------- */
  :root {
    --bg1:#ffffff; --bg2:#eef0f8; --fg:#1b1b2a; --muted:#6c6c82; --line:rgba(30,30,60,.10);
    --card:rgba(255,255,255,.72); --chip:rgba(30,30,60,.06);
    --a1:#e2481e; --a2:#ff8a3d; --glow:rgba(226,72,30,.22); --ok:#22c55e; --bad:#ef4444;
  }
  :root[data-theme="dark"] {
    --bg1:#171724; --bg2:#0f0f19; --fg:#f3f3fa; --muted:#9a9ab3; --line:rgba(255,255,255,.09);
    --card:rgba(255,255,255,.06); --chip:rgba(255,255,255,.08);
    --glow:rgba(255,120,60,.20);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; color:var(--fg); overflow:hidden;
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { background:transparent; }

  #sheet {
    position:relative; height:100%; display:flex; flex-direction:column; overflow:hidden;
    background:
      radial-gradient(120% 70% at 0% 0%, var(--glow), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    border-radius:0 0 22px 0;
  }
  /* Ikifunguliwa peke yake (si ndani ya dashboard): robo ya juu-kushoto + eneo la kulia wazi */
  body.standalone { background:rgba(0,0,0,.38); }
  body.standalone #sheet { position:fixed; left:0; top:0; width:50vw; min-width:210px; height:50vh; min-height:300px;
    box-shadow:8px 10px 36px rgba(0,0,0,.35); }

  /* ---------- Header ---------- */
  header { display:flex; align-items:center; gap:8px; padding:12px 10px 8px 12px; flex:none; }
  .logo { width:26px; height:26px; border-radius:9px; flex:none; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--a1),var(--a2)); color:#fff; font-size:14px; font-weight:800;
    box-shadow:0 4px 12px var(--glow); }
  .ttl { flex:1; min-width:0; }
  .ttl h1 { margin:0; font-size:13px; font-weight:700; letter-spacing:.2px; }
  .ttl small { display:block; font-size:9.5px; color:var(--muted); margin-top:1px; }
  #close { border:0; background:var(--chip); color:var(--fg); width:24px; height:24px; border-radius:50%;
    font-size:11px; cursor:pointer; flex:none; transition:transform .2s, background .2s; }
  #close:active { transform:scale(.88); }

  /* ---------- Search (inaonekana pale mafaili yakiwa mengi) ---------- */
  .find { margin:0 10px 6px; display:none; }
  .find.on { display:block; }
  .find input { width:100%; border:1px solid var(--line); background:var(--chip); color:var(--fg);
    border-radius:10px; padding:6px 9px; font-size:11px; outline:none; transition:border-color .2s, box-shadow .2s; }
  .find input:focus { border-color:var(--a1); box-shadow:0 0 0 3px var(--glow); }

  /* ---------- Orodha ---------- */
  main { flex:1; overflow-y:auto; padding:2px 10px 8px; scrollbar-width:none; }
  main::-webkit-scrollbar { display:none; }
  a.item { position:relative; overflow:hidden; display:flex; align-items:center; gap:9px; padding:8px 9px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    opacity:0; transform:translateY(8px); animation:rise .45s cubic-bezier(.2,.8,.2,1) forwards;
    transition:transform .15s, border-color .2s, box-shadow .2s; }
  a.item:active { transform:scale(.97); border-color:var(--a1); box-shadow:0 0 0 3px var(--glow); }
  .ic { width:28px; height:28px; border-radius:9px; flex:none; display:grid; place-items:center; font-size:15px;
    background:var(--chip); }
  .tx { flex:1; min-width:0; }
  .tx b { display:block; font-size:11.5px; font-weight:650; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx small { display:block; font-size:9.5px; color:var(--muted); line-height:1.3; margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .go { color:var(--muted); font-size:15px; transition:transform .2s; }
  a.item:active .go { transform:translateX(3px); }
  .empty { text-align:center; color:var(--muted); font-size:10.5px; padding:14px 0; display:none; }
  .ripple { position:absolute; border-radius:50%; background:var(--glow); transform:scale(0); pointer-events:none;
    animation:rip .55s ease-out forwards; }
  @keyframes rip { to { transform:scale(3.2); opacity:0; } }
  @keyframes rise { to { opacity:1; transform:none; } }

  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } a.item { opacity:1; transform:none; } }
</style>
</head>
<body>
  <div id="sheet">
    <header>
      <div class="logo">&#x22EE;</div>
      <div class="ttl"></div>
      <button id="close" aria-label="Funga">&#x2715;</button>
    </header>
    <div class="find" id="find"><input id="q" type="search" placeholder="Tafuta faili..." autocomplete="off"></div>
    <main id="list"></main>
    <div class="empty" id="empty">Hakuna faili lililopatikana</div>
  </div>

<script>
"use strict";
/* ===== Orodha ya mafaili =====
 * Ongeza faili jipya hapa tu: { icon, title, desc, href }
 */
var FILES = [
  { icon: "\uD83D\uDD0D", title: "Investigation", desc: "", href: "incident-search.html" },
  { icon: "\uD83D\uDD25", title: "Fire Chat", desc: "", href: "chart.html" }
];

var params = new URLSearchParams(location.search);
var theme = params.get("theme") ||
  (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.setAttribute("data-theme", theme);

var inFrame = window.parent && window.parent !== window;
if (!inFrame) document.body.classList.add("standalone");

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

var listEl = document.getElementById("list");
function renderList(filter) {
  var q = (filter || "").trim().toLowerCase();
  var shown = FILES.filter(function (f) { return !q || (f.title + " " + f.desc).toLowerCase().indexOf(q) > -1; });
  listEl.innerHTML = shown.map(function (f, i) {
    /* target="_top" => ukurasa mzima unahamia kwenye faili, si ndani ya panel tu */
    return '<a class="item" target="_top" style="animation-delay:' + (i * 60) + 'ms" href="' + esc(f.href) + '">' +
      '<span class="ic">' + f.icon + '</span>' +
      '<span class="tx"><b>' + esc(f.title) + '</b>' + (f.desc ? '<small>' + esc(f.desc) + '</small>' : '') + '</span>' +
      '<span class="go">&#x203A;</span></a>';
  }).join("");
  document.getElementById("empty").style.display = shown.length ? "none" : "block";
}
renderList("");
if (FILES.length > 5) document.getElementById("find").classList.add("on");
document.getElementById("q").addEventListener("input", function (e) { renderList(e.target.value); });

/* Ripple kwenye kubonyeza */
listEl.addEventListener("pointerdown", function (e) {
  var item = e.target.closest("a.item"); if (!item) return;
  var r = item.getBoundingClientRect(), size = Math.max(r.width, r.height);
  var s = document.createElement("span"); s.className = "ripple";
  s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + (e.clientX - r.left - size / 2) + "px;top:" + (e.clientY - r.top - size / 2) + "px";
  item.appendChild(s); setTimeout(function () { s.remove(); }, 600);
});

/* Funga: kitufe, Esc, au swipe kuelekea juu/kushoto */
function closeMe() {
  if (inFrame) window.parent.postMessage({ type: "close-files-sheet" }, "*");
  else history.back();
}
document.getElementById("close").addEventListener("click", closeMe);
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMe(); });
document.body.addEventListener("click", function (e) { if (e.target === document.body) closeMe(); });
var tx = null, ty = null;
document.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", function (e) {
  if (tx == null) return;
  var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if ((dx < -70 && Math.abs(dy) < 60) || (dy < -70 && Math.abs(dx) < 60)) closeMe();
  tx = ty = null;
}, { passive: true });
</script>

</body>
</html>
