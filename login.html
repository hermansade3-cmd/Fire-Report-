<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingia — Rescue Report</title>
<meta name="theme-color" content="#4a4687">
<style>
:root {
  --bg: #f3f4f8; --card: #ffffff; --text: #1f2333; --muted: #6a7087; --line: #e1e4ee;
  --brand: #4a4687; --accent: #cf4a24; --accent-text: #ffffff;
  --ok: #1f8a4c; --warn: #b7791f; --err: #c53030; --field: #f7f8fc;
  --shadow: 0 6px 20px rgba(40, 44, 80, .08);
}
:root[data-theme="dark"] {
  --bg: #0e1420; --card: #172033; --text: #eef2f8; --muted: #9aa4b2; --line: #26324a;
  --brand: #3a3670; --accent: #e2562e; --accent-text: #ffffff;
  --ok: #46c27a; --warn: #e0a93b; --err: #ff7a6b; --field: #101827;
  --shadow: 0 6px 20px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.45; min-height: 100vh; }
header.top {
  position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 12px; display: flex; align-items: center; gap: 12px;
}
header.top h1 { font-size: 19px; margin: 0; font-weight: 600; }
#back { width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 20px; cursor: pointer; }
main { max-width: 460px; margin: 0 auto; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 28px); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
.intro { margin: 4px 2px 16px; text-align: center; }
.intro h2 { margin: 0 0 6px; font-size: 22px; }
.intro p { margin: 0; color: var(--muted); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 10px; border-radius: 9px; cursor: pointer; }
.tabs button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 14px; }
input[type=email], input[type=password], input[type=text] {
  display: block; width: 100%; margin-top: 6px; padding: 13px 14px; font: inherit; color: var(--text);
  background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; outline: none;
}
input:focus-visible { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(74,70,135,.25); }
.pw { position: relative; }
.pw input { padding-right: 84px; }
.pw button { position: absolute; right: 6px; top: 12px; height: 36px; border: 0; background: transparent; color: var(--brand); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0 10px; }
:root[data-theme="dark"] .pw button { color: #a9a4f0; }
.btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font: inherit; font-weight: 700; cursor: pointer; background: var(--field); color: var(--text); border: 1.5px solid var(--line); margin-top: 10px; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.btn:disabled { opacity: .55; cursor: default; }
.link { display: block; margin: 14px auto 0; border: 0; background: none; color: var(--brand); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
:root[data-theme="dark"] .link { color: #a9a4f0; }
.msg { min-height: 20px; margin: 2px 0 6px; font-size: 14px; color: var(--err); }
.msg.ok { color: var(--ok); }
.note { color: var(--muted); font-size: 13px; margin: 2px 4px 0; text-align: center; }
.sync-box { background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 12px; font-size: 14px; }
.sync-box .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.sync-box .progress div { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
[hidden] { display: none !important; }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); background: #1f2333; color: #fff; padding: 11px 18px; border-radius: 24px; font-size: 14px; max-width: 90vw; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <button id="back" type="button" aria-label="Rudi">&#8592;</button>
  <h1>Ingia</h1>
</header>

<main>
  <div id="view-loading" class="note" style="text-align:center;padding:40px 0;">Inapakia…</div>

  <!-- ===== Login tu ===== -->
  <section id="view-auth" hidden>
    <div class="intro">
      <h2>Karibu tena</h2>
      <p>Ingia au jisajili ili ripoti zako zihifadhiwe kwenye akaunti</p>
    </div>
    <div class="card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" class="active" aria-selected="true">Ingia</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false">Jisajili</button>
      </div>
      <form id="auth-form" novalidate>
        <label>Barua pepe
          <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="jina@mfano.com">
        </label>
        <label>Password
          <div class="pw">
            <input type="password" id="password" autocomplete="current-password" placeholder="Angalau herufi 6">
            <button type="button" id="toggle-pw">Onyesha</button>
          </div>
        </label>
        <label id="confirm-wrap" hidden>Rudia Password
          <input type="password" id="confirm" autocomplete="new-password" placeholder="Andika password tena">
        </label>
        <label id="name-wrap" hidden>Jina la kuonyesha
          <input type="text" id="display-name" autocomplete="name" placeholder="Jina lako">
        </label>
        <div id="msg" class="msg" role="alert" aria-live="polite"></div>
        <button class="btn primary" id="submit" type="submit">Ingia</button>
        <button class="link" id="forgot" type="button">Umesahau password?</button>
      </form>
    </div>
    <p class="note">Data yako inabaki kwenye kifaa hata ukiwa offline.</p>
  </section>

  <!-- ===== Inasawazisha baada ya login ===== -->
  <section id="view-sync" hidden>
    <div class="card" style="text-align:center;padding:40px 18px;">
      <h2 style="margin:0 0 8px;">Inasawazisha data yako…</h2>
      <p id="sync-status" style="color:var(--muted);margin:0 0 16px;">Inapakia ripoti na picha zako</p>
      <div class="sync-box">
        <div style="display:flex;justify-content:space-between;font-weight:600;">
          <span>Maendeleo</span>
          <span id="sync-pct">0%</span>
        </div>
        <div class="progress"><div id="sync-bar"></div></div>
        <p id="sync-detail" style="margin:12px 0 0;color:var(--muted);font-size:13px;">Inaanza…</p>
      </div>
      <button class="btn" id="skip-sync" type="button" style="margin-top:20px;">Ruka →</button>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="core.js?v=5"></script>
<script src="cloud-sync.js?v=2"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var mode = "login";

  /* ---- theme ---- */
  (async function applyTheme() {
    var theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    try {
      var s = await RescueDB.getAllSettings();
      if (s && s.theme) theme = s.theme === "light" ? "light" : "dark";
    } catch (e) { }
    document.documentElement.setAttribute("data-theme", theme);
  })();

  /* ---- helpers ---- */
  var toastTimer;
  function toast(t) {
    var el = $("toast"); el.textContent = t; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }
  function show(view) {
    ["view-loading", "view-auth", "view-sync"].forEach(function (id) { $(id).hidden = id !== view; });
  }
  function setMsg(text, ok) { var m = $("msg"); m.textContent = text || ""; m.className = "msg" + (ok ? " ok" : ""); }

  $("back").addEventListener("click", function () {
    if (window.CloudSync && CloudSync.currentUser) {
      CloudSync.currentUser().then(function (u) {
        location.href = u ? "account.html" : "index.html";
      });
    } else { location.href = "index.html"; }
  });

  /* ---- tabs ---- */
  function setMode(m) {
    mode = m;
    var signup = m === "signup";
    $("tab-login").classList.toggle("active", !signup); $("tab-login").setAttribute("aria-selected", String(!signup));
    $("tab-signup").classList.toggle("active", signup); $("tab-signup").setAttribute("aria-selected", String(signup));
    $("confirm-wrap").hidden = !signup;
    $("name-wrap").hidden = !signup;
    $("submit").textContent = signup ? "Jisajili" : "Ingia";
    $("password").setAttribute("autocomplete", signup ? "new-password" : "current-password");
    $("forgot").hidden = signup;
    setMsg("");
  }
  $("tab-login").addEventListener("click", function () { setMode("login"); });
  $("tab-signup").addEventListener("click", function () { setMode("signup"); });
  $("toggle-pw").addEventListener("click", function () {
    var p = $("password"), c = $("confirm"), showing = p.type === "text";
    p.type = c.type = showing ? "password" : "text";
    $("toggle-pw").textContent = showing ? "Onyesha" : "Ficha";
  });

  /* ---- auth ---- */
  var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function busy(on, label) {
    $("submit").disabled = on; $("forgot").disabled = on;
    if (label) $("submit").textContent = label;
  }

  $("auth-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = $("email").value.trim(), pw = $("password").value;
    var name = $("display-name").value.trim();
    if (!emailRe.test(email)) return setMsg("Weka barua pepe sahihi.");
    if (pw.length < 6) return setMsg("Password iwe na angalau herufi 6.");
    if (mode === "signup" && !name) return setMsg("Weka jina lako la kuonyesha.");
    if (mode === "signup" && pw !== $("confirm").value) return setMsg("Password hazifanani.");
    setMsg(""); busy(true, mode === "signup" ? "Inatengeneza akaunti…" : "Inaingia…");
    try {
      var user = mode === "signup"
        ? await CloudSync.signUp(email, pw, name)
        : await CloudSync.signIn(email, pw);
      toast(mode === "signup" ? "Akaunti imetengenezwa!" : "Umeingia!");
      // Badilisha kwenda view ya sync
      show("view-sync");
      await runSyncAfterLogin(mode === "signup");
    } catch (err) {
      setMsg(CloudSync.errorMessage(err));
      show("view-auth");
    } finally {
      busy(false, mode === "signup" ? "Jisajili" : "Ingia");
    }
  });

  $("forgot").addEventListener("click", async function () {
    var email = $("email").value.trim();
    if (!emailRe.test(email)) return setMsg("Andika barua pepe yako kwanza.");
    try {
      await CloudSync.resetPassword(email);
      setMsg("Link ya kubadilisha password imetumwa kwa " + email + ".", true);
    } catch (err) { setMsg(CloudSync.errorMessage(err)); }
  });

  /* ---- Auto sync baada ya login ---- */
  async function runSyncAfterLogin(isSignup) {
    var pct = 0, bar = $("sync-bar"), txt = $("sync-pct"), detail = $("sync-detail");
    function setPct(p, msg) {
      pct = Math.max(0, Math.min(100, p));
      bar.style.width = pct + "%"; txt.textContent = Math.round(pct) + "%";
      if (msg) detail.textContent = msg;
    }
    var finished = false;
    $("skip-sync").addEventListener("click", function () { if (!finished) location.href = "account.html"; });

    try {
      // Hatua 1: Pakia ripoti za kifaa
      setPct(10, "Inapakia ripoti za kifaa…");
      var localReports = [];
      try { localReports = await RescueDB.getAllReports(); } catch (e) { }

      // Hatua 2: Backup ripoti za kifaa kwenda account (bila kuuliza)
      if (localReports.length > 0) {
        setPct(30, "Inahifadhi ripoti " + localReports.length + " kwenye akaunti…");
        try { await CloudSync.backupNow(); } catch (e) { }
      } else {
        setPct(30, "Hakuna ripoti za kifaa bado");
      }

      // Hatua 3: Rejesha data kutoka akaunti (kama zipo)
      setPct(55, "Inapakia data kutoka akaunti…");
      try {
        var restored = await CloudSync.restore("merge");
        if (restored && restored.restored) {
          setPct(80, "Imerejeshwa ripoti " + restored.count + " kutoka akaunti");
        } else {
          setPct(80, "Hakuna data ya ziada kwenye akaunti");
        }
      } catch (e) { setPct(80, "Imeshindikana kupakia data ya akaunti"); }

      // Hatua 4: Pakia contacts & chats
      setPct(90, "Inapakia mazungumzo…");
      try { await CloudSync.syncChats(); } catch (e) { }

      setPct(100, "Tayari!");
      finished = true;
      setTimeout(function () { location.href = "account.html"; }, 700);
    } catch (err) {
      setPct(100, "Hitilafu: " + CloudSync.errorMessage(err));
      setTimeout(function () { location.href = "account.html"; }, 1500);
    }
  }

  /* ---- start ---- */
  (async function start() {
    if (!window.CloudSync || !window.RescueDB) {
      show("view-auth");
      setMsg("Faili za app (core.js / cloud-sync.js) hazikupatikana.");
      return;
    }
    setMode("login");
    try {
      var user = await CloudSync.currentUser();
      if (user) {
        location.href = "account.html";
      } else {
        show("view-auth");
      }
    } catch (err) {
      show("view-auth");
      setMsg(CloudSync.errorMessage(err));
    }
  })();
})();
</script>
</body>
</html>
